<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0e70b5">
  <title>Espace magasin</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="assets/entreprises/blaye/leclerc-pastille.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap">
  <link rel="stylesheet" href="styles.css">
  <script>
    // Thème appliqué avant l'affichage (évite un flash)
    try { document.documentElement.dataset.theme = localStorage.getItem('hub_theme') || 'light'; } catch (e) { document.documentElement.dataset.theme = 'light'; }
  </script>
</head>
<body>
  <div class="page">
    <header class="top">
      <div class="brand">
        <img class="brand-mark" id="pastille" alt="">
        <div class="brand-text">
          <strong id="nom">Espace magasin</strong>
          <span id="societe"></span>
        </div>
      </div>
      <div class="top-actions">
        <button type="button" class="profile-chip" id="profile-chip" aria-haspopup="dialog">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg>
          <span id="profile-label">Choisir mon profil</span>
        </button>
        <button type="button" class="toggle" id="theme-toggle" role="switch" aria-label="Changer de thème (clair ou sombre)">
          <svg class="toggle-ico sun" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
          <svg class="toggle-ico moon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
          <span class="toggle-knob"></span>
        </button>
      </div>
    </header>

    <section class="hero" aria-labelledby="hello">
      <div class="bubbles" aria-hidden="true"></div>
      <div class="hero-text">
        <span class="hero-date" id="date"></span>
        <h1 id="hello">Bonjour</h1>
        <p id="accueil"></p>
      </div>
      <img class="hero-logo" id="logo" alt="">
    </section>

    <section aria-labelledby="apps-title">
      <div class="section-head">
        <h2 id="apps-title">Vos applications</h2>
        <span class="section-note" id="apps-note"></span>
      </div>
      <div class="tiles" id="tiles"></div>
    </section>

    <section class="help" id="help">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M9.1 9a3 3 0 0 1 5.8 1c0 2-3 3-3 3M12 17h.01"/></svg>
      <div>
        <strong>Besoin d’aide ?</strong>
        <span id="contact"></span>
      </div>
    </section>

    <footer class="foot">
      <span>Chaque application garde sa propre connexion.</span>
      <span>Elvanys</span>
    </footer>
  </div>

  <dialog class="sheet" id="profiles" aria-labelledby="profiles-title">
    <form method="dialog" class="sheet-inner">
      <h2 id="profiles-title">Qui êtes-vous ?</h2>
      <p>Pour afficher les applications qui vous concernent. Vous pourrez changer à tout moment.</p>
      <div class="profile-list" id="profile-list"></div>
      <button type="submit" class="sheet-close" value="cancel">Plus tard</button>
    </form>
  </dialog>

  <script src="config/entreprises.js"></script>
  <script src="app.js"></script>
</body>
</html>
