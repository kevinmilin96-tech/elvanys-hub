<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>La Guilde des Runes · La Forge des héros</title>
<style>
  :root { --or:#f3c96b; --texte:#f1ecff; --doux:#c9c1ea; --ok:#7dffb0; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { margin:0; color:var(--texte); font:15px/1.45 Georgia, 'Times New Roman', serif; background:radial-gradient(ellipse at 50% -10%, #4a2a1a, #120f18 60%) fixed, #120f18; }
  main { max-width:560px; margin:0 auto; padding:12px 12px 60px; container-type:inline-size; }
  .haut { display:flex; align-items:center; gap:8px; } .haut a, .haut button { color:var(--doux); text-decoration:none; background:#2a1d18; border:1px solid #6a4a3a; border-radius:20px; padding:5px 12px; font:inherit; font-size:.9em; }
  h1 { flex:1; margin:0; text-align:center; color:var(--or); font-size:1.3em; }
  h2 { color:var(--or); font-size:1.1em; margin:18px 0 8px; }
  .sous { color:var(--doux); text-align:center; font-size:.92em; margin:8px 0 14px; }
  .fiche { display:flex; gap:12px; align-items:center; background:#2a1d18ee; border:2px solid var(--c, #6a4a3a); border-radius:16px; padding:10px; margin:8px 0; }
  .fiche img { width:72px; height:72px; border-radius:50%; object-fit:cover; box-shadow:0 0 0 3px var(--c); flex:none; }
  .fiche b { color:var(--or); font-size:1.08em; } .fiche small { display:block; color:var(--doux); }
  .fiche .barre { height:6px; border-radius:4px; background:#000a; margin-top:5px; overflow:hidden; } .fiche .barre i { display:block; height:100%; background:var(--or); }
  .fiche button { margin-left:auto; flex:none; }
  button { font:inherit; color:inherit; cursor:pointer; }
  .go { display:block; width:100%; font:bold 1.05em Georgia, serif; padding:12px; border-radius:14px; border:0; background:var(--or); color:#2b1d0a; margin-top:10px; }
  .sec { background:#2a1d18; border:1px solid #6a4a3a; border-radius:12px; padding:7px 12px; }
  .grille { display:grid; grid-template-columns:repeat(3, 1fr); gap:8px; }
  .grille button { background:#2a1d18; border:2px solid #6a4a3a; border-radius:12px; padding:8px 4px; font-size:.85em; }
  .grille button.on { border-color:var(--or); background:#4a3412; }
  .grille img { width:60px; height:60px; border-radius:50%; object-fit:cover; display:block; margin:0 auto 4px; }
  .grille small { display:block; color:var(--doux); font-size:.8em; }
  input[type=text] { width:100%; font:inherit; font-size:1.1em; padding:10px 12px; border-radius:12px; border:2px solid #6a4a3a; background:#1a1210; color:var(--texte); }
  .ligne { display:flex; gap:8px; align-items:center; }
  .couleurs { display:flex; gap:8px; flex-wrap:wrap; } .couleurs button { width:38px; height:38px; border-radius:50%; border:3px solid transparent; }
  .couleurs button.on { border-color:#fff; }
  .de { display:grid; grid-template-columns:repeat(6, 1fr); gap:6px; margin:8px 0; }
  .de button { aspect-ratio:1; border-radius:10px; background:#1a1210; border:2px solid #6a4a3a; padding:0; position:relative; }
  .de button img { width:100%; height:100%; object-fit:contain; }
  .de button.peut { border-color:var(--ok); box-shadow:0 0 0 2px var(--ok); }
  .de button span { position:absolute; bottom:-2px; right:2px; font-size:.75em; color:var(--doux); }
  .bloc { background:#2a1d18cc; border:1px solid #6a4a3a; border-radius:14px; padding:12px; margin:10px 0; }
</style>
</head>
<body>
<main id="app"></main>
<script src="musique.js?v=20261115-155235"></script>
<script src="aventuriers.js?v=20261115-155235"></script>
<script>
// =============================================================================================== LA FORGE DES HÉROS (15/11) : créer et faire grandir ses héros d'aventure
const $ = id => document.getElementById(id);
const son = k => { try { if (typeof GM !== 'undefined') GM.son(k); } catch (e) {} };
const retour = new URLSearchParams(location.search).get('retour') || 'chroniques.html';
let N = null; // le héros en cours de création
const img = (a, px) => `<img src="${avPortrait(a)}" onerror="this.onerror=null;this.src='${avPortraitSecours(a)}'" alt="" ${px ? `style="width:${px}px;height:${px}px"` : ''}>`;
function liste() {
  const L = avLire();
  $('app').innerHTML = `<div class="haut"><a href="${retour}">‹ Retour</a><h1>⚒ La Forge des héros</h1><a href="menu.html">Menu</a></div>
    <p class="sous">Crée TON héros d’aventure, comme dans un jeu de rôle : une voie, un nom, un portrait, un dé que tu forges en montant de niveau. Il garde tout d’une aventure à l’autre.</p>
    ${L.map(a => { const s = avStats(a), n = s.niveau, prochain = AV_SEUILS[n + 1], aChoisir = [2, 4, 6].filter(v => n >= v && !(a.talents || {})[v]).length;
      return `<div class="fiche" style="--c:${a.couleur}">${img(a)}<div style="flex:1"><b>${a.nom}</b><small>${avTitre(a)} · niveau ${n} · ❤ ${s.pv}${s.desPlus ? ' · 🎲 +1 dé' : ''}${a.points ? ` · <span style="color:var(--ok)">⚒ ${a.points} point${a.points > 1 ? 's' : ''} à forger</span>` : ''}${aChoisir ? ` · <span style="color:var(--ok)">✨ talent à choisir</span>` : ''}</small>
        <div class="barre"><i style="width:${n >= AV_MAX ? 100 : Math.round(100 * (a.xp - AV_SEUILS[n]) / (prochain - AV_SEUILS[n]))}%"></i></div><small>${n >= AV_MAX ? 'niveau maximum' : `${a.xp} / ${prochain} XP`} · ${a.victoires}/${a.parties} aventures réussies</small></div>
        <button class="sec" onclick="fiche('${a.id}')">Ouvrir</button></div>`; }).join('') || '<p class="sous">Pas encore de héros d’aventure.</p>'}
    <button class="go" onclick="nouveau()">＋ Créer un héros d’aventure</button>`;
}
function nouveau() { N = { voie:'maelle', genre:'h', nom:AV_NOMS[Math.floor(Math.random() * AV_NOMS.length)], couleur:AV_COULEURS[0] }; creation(); }
function creation() {
  $('app').innerHTML = `<div class="haut"><a href="#" onclick="liste();return false">‹ Mes héros</a><h1>Nouveau héros</h1><span></span></div>
    <h2>1 · Sa voie</h2><div class="grille">${Object.entries(VOIES).map(([k, v]) => `<button class="${N.voie === k ? 'on' : ''}" onclick="N.voie='${k}';creation()"><img src="portraits/${k}.webp" alt="">${v.n}<small>${v.role}</small></button>`).join('')}</div>
    <h2>2 · Son portrait</h2><div class="grille">${['h', 'f'].map(g => { const a = { voie:N.voie, genre:g }; return `<button class="${N.genre === g ? 'on' : ''}" onclick="N.genre='${g}';creation()">${img(a)}${VOIES[N.voie][g]}</button>`; }).join('')}</div>
    <h2>3 · Son nom</h2><div class="ligne"><input type="text" id="nom" maxlength="20" value="${N.nom.replace(/"/g, '')}" oninput="N.nom=this.value"><button class="sec" onclick="N.nom=AV_NOMS[Math.floor(Math.random()*AV_NOMS.length)];creation()">🎲</button></div>
    <h2>4 · Sa couleur</h2><div class="couleurs">${AV_COULEURS.map(c => `<button class="${N.couleur === c ? 'on' : ''}" style="background:${c}" onclick="N.couleur='${c}';creation()"></button>`).join('')}</div>
    <div class="fiche" style="--c:${N.couleur};margin-top:16px">${img(N)}<div><b>${N.nom || '…'}</b><small>${VOIES[N.voie][N.genre]} · ${VOIES[N.voie].role}</small></div></div>
    <button class="go" onclick="cree()">⚒ Forger ce héros</button>`;
}
function cree() { const nom = ($('nom') ? $('nom').value : N.nom).trim(); if (!nom) return; N.nom = nom; const a = avCreer(N); son('ultime'); fiche(a.id); }
function fiche(id) {
  const a = avTrouve(id); if (!a) return liste(); const s = avStats(a);
  $('app').innerHTML = `<div class="haut"><a href="#" onclick="liste();return false">‹ Mes héros</a><h1>${a.nom}</h1><span></span></div>
    <div class="fiche" style="--c:${a.couleur}">${img(a, 96)}<div><b>${a.nom}</b><small>${avTitre(a)} · niveau ${s.niveau}</small><small>❤ ${s.pv} PV · 🎲 ${({ gorm:4 }[a.voie] || 3) + s.desPlus} dés</small><small>${VOIES[a.voie].role}</small></div></div>
    <div class="bloc"><b style="color:var(--or)">⚒ Son dé personnel</b><p class="sous" style="text-align:left;margin:4px 0">Chaque niveau donne un <b>point de forge</b> : touche une face pour lui ajouter 1 (jusqu’à 6). Un dé avec plus de grosses faces frappe plus fort et ouvre plus de sceaux. Points à dépenser : <b style="color:var(--ok)">${a.points}</b>.</p>
      <div class="de">${a.faces.map((v, k) => `<button class="${a.points && v < 6 ? 'peut' : ''}" onclick="forge('${a.id}',${k})"><img src="faces-${a.voie}/face-${v}.webp" alt="${v}"><span>${k + 1}</span></button>`).join('')}</div></div>
    <div class="bloc"><b style="color:var(--or)">✨ Ses talents</b><p class="sous" style="text-align:left;margin:4px 0">Aux niveaux 2, 4 et 6, choisis un talent sur deux.</p>
      ${[2, 4, 6].map(niv => `<p style="margin:8px 0 4px"><b>Niveau ${niv}</b>${s.niveau < niv ? ' <small style="color:var(--doux)">(pas encore atteint)</small>' : ''}</p><div class="grille" style="grid-template-columns:1fr 1fr">${TALENTS[niv].map(([k, n, d]) => `<button class="${(a.talents || {})[niv] === k ? 'on' : ''}" ${s.niveau < niv ? 'disabled style="opacity:.4"' : ''} onclick="talent('${a.id}',${niv},'${k}')">${n}<small>${d}</small></button>`).join('')}</div>`).join('')}</div>
    <div class="bloc"><b style="color:var(--or)">📈 Les niveaux</b><p class="sous" style="text-align:left;margin:4px 0">Une aventure réussie : 120 XP ; une aventure ratée : 40 XP. Chaque niveau : +2 PV et un point de forge. Au niveau 4 : un dé de plus.</p>
      <p style="margin:0">${[2, 3, 4, 5, 6].map(n => `${s.niveau >= n ? '✅' : '⬜'} niveau ${n} (${AV_SEUILS[n]} XP)`).join('<br>')}</p></div>
    <button class="sec" style="margin-top:14px" onclick="if(confirm('Effacer ${a.nom.replace(/'/g, '')} pour toujours ?')){avSupprime('${a.id}');liste()}">🗑 Effacer ce héros</button>`;
}
function talent(id, niv, k) { if (avChoisitTalent(id, niv, k)) son('magie'); fiche(id); }
function forge(id, k) { if (avForge(id, k)) son('tour-fusion'); fiche(id); }
if (typeof GM !== 'undefined') { try { GM.musique('menu'); GM.bouton(); } catch (e) {} }
liste();
</script>
</body>
</html>
