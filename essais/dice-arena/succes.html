<style>

  :root { --or:#f3c96b; --texte:#f1ecff; --doux:#c9c1ea; --ok:#7ce3a1; }

  .barre { height:10px; border-radius:6px; background:#0d0b18; overflow:hidden; margin-top:6px; } .barre i { display:block; height:100%; background:linear-gradient(90deg, #c8922a, #f3c96b); }

<main>
  <div class="haut"><a href="profil.html">‹ Profil</a><h1>🏆 Mes succès</h1><a href="pantheon.html">Panthéon</a></div>
  <div id="app"></div>
</main>
<script src="cartes.js?v=ee6cc90836"></script>
<script src="musique.js?v=1c69ba47a7"></script>

<script>
const ROMS = ['I', 'II', 'III', 'IV', 'V'];
const ouvertes = new Set();
function bulle(t) { const b = document.createElement('div'); b.className = 'bulle'; b.innerHTML = t; document.body.appendChild(b); setTimeout(() => b.remove(), 2600); }
function recup(id) { const t = recuperePalier(id); if (t) { if (typeof GM !== 'undefined') GM.son('clic'); bulle('🏆 ' + t); } dessine(); }
function coffre() { const t = recupereCoffre(); if (t) { if (typeof GM !== 'undefined') GM.son('clic'); bulle(t); } dessine(); }
function ligne(s) {
  const v = succesValeur(s), a = succesAtteints(s, v), r = succesRecuperes(s), n = s[4].length, prochain = s[4][a], fini = a >= n;
  const pct = fini ? 100 : Math.round(100 * (v - (a ? s[4][a - 1] : 0)) / (prochain - (a ? s[4][a - 1] : 0)));
  return `<div class="s"><div class="l1"><b>${s[2]}</b><span>${fini ? '✅ ' + v : `${v} / ${prochain}`}</span></div><p>${s[3]}</p>
    <div class="barre"><i style="width:${Math.max(0, Math.min(100, pct))}%"></i></div>
    <div class="pal">${s[4].map((p, i) => `<span class="${i < r ? 'ok' : i < a ? 'dispo' : ''}" title="${succesGainTxt(s, i)}">${ROMS[i]} · ${p}</span>`).join('')}</div>
    ${r < a ? `<button class="recup" onclick="recup('${s[0]}')">🎁 Récupérer le palier ${ROMS[r]} : ${succesGainTxt(s, r)}</button>`
      : fini ? `<div class="fin">🏅 Titre gagné : ${s[6][0]} ${s[6][1]}</div>` : `<p style="margin-top:6px">Palier ${ROMS[a]} : ${succesGainTxt(s, a)}${a === n - 1 ? ` (${s[6][0]} ${s[6][1]})` : ''}</p>`}</div>`;
}
function dessine() {
  const pts = succesPoints(), D = lireSucces(), dus = Math.floor(pts / COFFRE_PTS), coffreDispo = dus > (D.coffres | 0);
  const reste = pts % COFFRE_PTS, tot = SUCCES.reduce((t, s) => t + POINTS_SUCCES.slice(0, s[4].length).reduce((a, b) => a + b, 0), 0);
  const prochainT = TITRES_COFFRE.find(([n]) => n > pts);
  const tete = `<div class="tete"><div><span class="pts">${pts}</span> / ${tot} points de succès</div>
    <div class="coffre"><img src="ui/menu/m-route.webp?v=1" alt="" onerror="this.replaceWith(document.createTextNode('🎁'))"><div>Coffre des succès : tous les ${COFFRE_PTS} points (🪙 ${COFFRE_SUCCES.or}, 🔹 ${COFFRE_SUCCES.pou}, 💠 ${COFFRE_SUCCES.eclats}).<br>${coffreDispo ? '' : `Encore ${COFFRE_PTS - reste} points.`}${prochainT ? ` Titre rare à ${prochainT[0]} points : ${prochainT[1]} ${prochainT[2]}.` : ''}
      <div class="barre"><i style="width:${coffreDispo ? 100 : reste}%"></i></div></div>${coffreDispo ? '<button class="recup" onclick="coffre()">🎁 Ouvrir</button>' : ''}</div>
    <p style="margin:8px 0 0;font-size:.85em;color:var(--doux)">Chaque palier rapporte des points et une récompense ; le dernier donne un titre pour ton profil.</p></div>`;
  const fams = FAMILLES_SUCCES.map(([k, e, n]) => {
    const L = SUCCES.filter(s => s[1] === k), dispo = L.reduce((t, s) => t + Math.max(0, succesAtteints(s, succesValeur(s)) - succesRecuperes(s)), 0);
    const faits = L.reduce((t, s) => t + succesRecuperes(s), 0), totP = L.reduce((t, s) => t + s[4].length, 0);
    return `<details class="fam" ${ouvertes.has(k) ? 'open' : ''} ontoggle="this.open ? ouvertes.add('${k}') : ouvertes.delete('${k}')"><summary><span class="e">${e}</span><span class="n">${n}<br><small>${faits} / ${totP} paliers</small></span>${dispo ? `<span class="pt">${dispo}</span>` : ''}<span>›</span></summary>${L.map(ligne).join('')}</details>`;
  }).join('');
  document.getElementById('app').innerHTML = tete + fams;
}
dessine();
</script>
