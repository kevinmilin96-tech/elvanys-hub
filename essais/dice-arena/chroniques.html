<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">

<title>La Guilde des Runes · Les Chroniques</title>
<style>
  :root { --or:#f3c96b; --texte:#f1ecff; --doux:#c9c1ea; --ok:#7dffb0; --rouge:#ff6a5a; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { margin:0; }
  body { color:var(--texte); font:15px/1.4 Georgia, 'Times New Roman', serif; background:radial-gradient(ellipse at 50% 0%, #2a2a4a, #0b0b16 70%) fixed, #0b0b16; user-select:none; }
  #app { max-width:620px; margin:0 auto; container-type:inline-size; padding:0 1.5cqw 4cqw; }
  button { font:inherit; color:inherit; cursor:pointer; }
  .haut { display:flex; align-items:center; gap:2cqw; padding:2cqw 0 1cqw; font-size:3.4cqw; }
  .haut a, .haut button { color:var(--doux); text-decoration:none; background:#1c1c36; border:1px solid #45457a; border-radius:20px; padding:1cqw 2.6cqw; }
  .haut .t { flex:1; text-align:center; color:var(--or); font-weight:bold; }
  .stats { display:flex; justify-content:space-around; font-size:3.2cqw; color:var(--doux); margin-bottom:1.2cqw; } .stats b { color:var(--texte); }
  .but { font-size:2.8cqw; color:var(--doux); background:#1c1c36; border-left:3px solid var(--or); border-radius:0 2cqw 2cqw 0; padding:1.2cqw 2cqw; margin-bottom:1.2cqw; }
  /* ---------------------------------------------------------------- la carte (elle défile ; 🗺 pour la voir en entier) */
  .vue { position:relative; overflow:auto; height:min(100cqw, 58vh); border-radius:2cqw; background:#05050a; border:1px solid #2a2a4a; -webkit-overflow-scrolling:touch; }
  .plateau { display:grid; gap:0; width:max-content; }
  .c { position:relative; width:var(--t); height:var(--t); display:flex; align-items:center; justify-content:center; font-size:calc(var(--t) * .55);
    background:url('decor/tuile-sol-brulees.webp') 0 0 / calc(var(--t) * 4) calc(var(--t) * 4); }
  .c.peint { background:none !important; filter:none !important; } .c.peint .o { font-size:calc(var(--t) * .42); opacity:.9; }
  .c.couloir { filter:brightness(.8) saturate(.8); }
  .c.mur { background:url('decor/tuile-roche-brulees.webp') 0 0 / calc(var(--t) * 4) calc(var(--t) * 4); filter:brightness(.3) saturate(.6); }
  .c:not(.mur):not(.noir) { filter:brightness(1.15); }
  .c.noir { background:#05050a !important; filter:none; } .c.noir > * { display:none; }
  .c.porte { background:#5a3412; box-shadow:inset 0 0 0 .4cqw #2a1808; } .c.porte.bronze { background:#7a5a1a; } .c.porte.ouverte { background:url('decor/tuile-sol-brulees.webp') 0 0 / calc(var(--t) * 4) calc(var(--t) * 4); }
  .c .o { font-size:calc(var(--t) * .62); filter:drop-shadow(0 .4cqw .4cqw #000); }
  .c .o.fait { opacity:.35; filter:grayscale(1); }
  .c .lv { position:absolute; bottom:0; right:.3cqw; font-size:calc(var(--t) * .32); font-weight:bold; color:#fff; text-shadow:0 0 2px #000, 0 0 2px #000; }
  .c.peut::after { content:''; position:absolute; inset:8%; border-radius:1cqw; background:#7dffb044; box-shadow:inset 0 0 0 .5cqw var(--ok); }
  .c.cible::after { content:''; position:absolute; inset:0; box-shadow:inset 0 0 0 .5cqw var(--or); }
  .jeton { position:absolute; inset:6%; border-radius:50%; z-index:1; }
  .jeton img { width:100%; height:100%; border-radius:50%; object-fit:cover; box-shadow:0 0 0 .45cqw var(--c, #8a98b8), 0 .6cqw 1cqw #000a; }
  .jeton.actif img { box-shadow:0 0 0 .7cqw var(--or), 0 0 3cqw var(--or); }
  .jeton.terre img { filter:grayscale(1) brightness(.6); }
  .jeton .pv { position:absolute; bottom:-14%; left:50%; transform:translateX(-50%); font-size:calc(var(--t) * .26); background:#2a0e0e; border:1px solid var(--rouge); border-radius:1cqw; padding:0 .5cqw; white-space:nowrap; font-weight:bold; }
  .jeton .it { position:absolute; top:-16%; right:-20%; font-size:calc(var(--t) * .26); background:#000c; border-radius:1cqw; padding:0 .4cqw; white-space:nowrap; }
  .jeton .sc { position:absolute; top:-16%; left:-18%; font-size:calc(var(--t) * .24); background:#2a2448; border:1px solid #6a5ea0; border-radius:1cqw; padding:0 .4cqw; }
  .jeton.boss { inset:-25%; z-index:2; }
  .flash { animation:flash .5s; } @keyframes flash { 30% { filter:brightness(2) saturate(2); transform:scale(1.15); } }
  .zoom { position:absolute; right:2cqw; bottom:2cqw; }
  /* ---------------------------------------------------------------- le bas */
  .equipe { display:flex; gap:1.5cqw; margin-top:1.5cqw; }
  .equipe button { flex:1; background:#1c1c36; border:2px solid #45457a; border-radius:2.5cqw; padding:1cqw .5cqw; font-size:2.6cqw; }
  .equipe button.on { border-color:var(--or); background:#3a2f12; }
  .equipe img { width:9cqw; height:9cqw; border-radius:50%; object-fit:cover; display:block; margin:0 auto .5cqw; }
  .equipe .terre img { filter:grayscale(1); }
  .des { display:flex; gap:2cqw; justify-content:center; margin:1.5cqw 0 1cqw; min-height:13cqw; align-items:center; flex-wrap:wrap; }
  .de { width:12.5cqw; height:12.5cqw; border:0; padding:0; background:none; transition:transform .15s; }
  .de img { width:100%; height:100%; object-fit:contain; filter:drop-shadow(0 1cqw 1cqw #000a); }
  .de.sel { transform:translateY(-2.5cqw) scale(1.08); } .de.sel img { filter:drop-shadow(0 0 2cqw var(--ok)); }
  .aide { text-align:center; font-size:2.9cqw; color:var(--doux); min-height:8cqw; } .aide b { color:var(--ok); }
  .actions { display:flex; gap:2cqw; margin-top:1cqw; }
  .actions button { flex:1; border-radius:3cqw; padding:2.4cqw; font-size:3.4cqw; font-weight:bold; border:2px solid #45457a; background:#1c1c36; }
  .actions .fin { background:var(--or); color:#2b1d0a; border-color:var(--or); }
  .sac { display:flex; gap:1.5cqw; justify-content:center; flex-wrap:wrap; margin:0 0 1cqw; font-size:2.8cqw; } .sac button { background:#2a2a14; border:1px solid #8a7a3a; border-radius:2cqw; padding:1cqw 2cqw; color:#ffe9a8; }
  .journal { font-size:2.7cqw; color:#9a92c4; margin-top:2cqw; max-height:18cqw; overflow:auto; } .journal div { padding:.3cqw 0; border-bottom:1px solid #22223a; }
  /* ---------------------------------------------------------------- fenêtres */
  .voile-f { position:fixed; inset:0; background:#000c; z-index:50; display:flex; align-items:center; justify-content:center; padding:4vw; }
  .fen { width:min(94vw, 520px); max-height:90vh; overflow:auto; background:#17172c; border:2px solid var(--or); border-radius:18px; padding:16px; font-size:15px; }
  .fen h2 { margin:0 0 8px; color:var(--or); text-align:center; }
  .fen .go { display:block; width:100%; font:bold 1.05em Georgia, serif; padding:12px; border-radius:14px; border:0; background:var(--or); color:#2b1d0a; margin-top:10px; }
  .fen .sec { display:block; width:100%; padding:10px; border-radius:14px; border:1px solid #45457a; background:#1c1c36; color:var(--texte); margin-top:8px; text-align:left; }
  .fen .sec small { display:block; color:var(--doux); }
  .lu { background:#2a2440; border-left:4px solid #c084fc; padding:8px 12px; border-radius:0 10px 10px 0; font-style:italic; margin:8px 0; }
  .moust { display:flex; gap:10px; align-items:flex-start; } .moust img { width:58px; height:58px; border-radius:50%; object-fit:cover; flex:none; border:2px solid var(--or); }
  .sceaux { display:grid; grid-template-columns:repeat(3, 1fr); gap:8px; margin:10px 0; }
  .sx { height:46px; border-radius:10px; border:1.5px solid #6a5ea0; background:#2a2448; display:flex; align-items:center; justify-content:center; font-weight:bold; font-size:17px; }
  .sx small { font-size:12px; font-weight:normal; } .sx.ok { background:#163a2a; border-color:#3a8a5a; color:#7dffb0; } .sx.peut { border-color:var(--ok); box-shadow:0 0 0 3px var(--ok); background:#1f4a35; } .sx.non { opacity:.35; }
  .bulle { position:fixed; left:50%; top:30%; transform:translateX(-50%); z-index:45; pointer-events:none; font-weight:bold; font-size:min(6vw, 30px); color:var(--or); text-shadow:0 0 12px #000, 0 0 3px #000;
    animation:bulle 1.4s forwards; white-space:nowrap; max-width:96vw; overflow:hidden; text-overflow:ellipsis; }
  @keyframes bulle { 0% { opacity:0; transform:translate(-50%, 20px) scale(.7); } 20% { opacity:1; transform:translate(-50%, 0); } 80% { opacity:1; } 100% { opacity:0; transform:translate(-50%, -30px); } }
  .acc h1 { text-align:center; color:var(--or); margin:3cqw 0 1cqw; font-size:6.5cqw; } .acc .sous { text-align:center; color:var(--doux); font-size:3.4cqw; margin:0 3cqw 3cqw; }
  .choixH { display:grid; grid-template-columns:repeat(3, 1fr); gap:2cqw; }
  .choixH button { background:#1c1c36; border:2px solid #45457a; border-radius:3cqw; padding:2cqw 1cqw; font-size:3cqw; }
  .choixH button.on { border-color:var(--or); background:#3a2f12; } .choixH button:disabled { opacity:.35; }
  .choixH img { width:15cqw; height:15cqw; border-radius:50%; object-fit:cover; display:block; margin:0 auto 1cqw; }
  .choixH small { display:block; color:var(--doux); font-size:2.4cqw; }
  .gros { display:block; width:100%; border-radius:3.5cqw; padding:3cqw; font-size:4cqw; border:2px solid var(--or); background:#3a2f12; color:var(--or); font-weight:bold; margin-top:2.5cqw; text-align:left; }
  .gros small { display:block; font-weight:normal; color:var(--doux); font-size:3cqw; } .gros:disabled { opacity:.4; }
</style>
</head>
<body>
<div id="app"></div>
<div id="fen"></div>
<script src="musique.js?v=20261115-154952"></script>
<script src="rang.js?v=20261115-154952"></script>
<script src="heros-etoiles.js?v=20261115-154952"></script>
<script src="progression-modes.js?v=20261115-154952"></script>
<script src="aventuriers.js?v=20261115-154952"></script>
<script src="chroniques-moteur.js?v=20261115-154952"></script>
<script>
// =============================================================================================== LES CHRONIQUES DE LA GUILDE v2 (15/11, écran « façon HeroQuest »)
// Une grande carte qui défile : les salles restent dans le noir jusqu'à ce qu'on ouvre leur porte ; les couloirs se dévoilent en avançant ;
// les meubles se fouillent. Un seul écran que l'on se passe ; jusqu'à 4 héros. La v1 (salles séparées) : chroniques-v1.html.
const K = CHRON, H = K.HEROS_C, $ = id => document.getElementById(id);
const ZEPH_OK = () => localStorage.getItem('guilde-tuto') === 'fait';
const CLE_PARTIE = 'guilde-chroniques2-partie', CLE = 'guilde-chroniques';
const son = k => { try { if (typeof GM !== 'undefined') GM.son(k); } catch (e) {} };
let S = null, actif = 0, sel = null, choisis = ['maelle', 'aldric', 'pip', 'gorm'], occupe = false, petit = false, centrer = true;
const OUVERTURE = '« Vous avez entendu ? Moi non plus. C’est bien ça le problème : la Grande Horloge de la Guilde ne fait plus tic-tac. Le boulanger est figé, la main dans la pâte. Le pigeon du toit est figé, en plein vol. Quelqu’un doit descendre sous la Guilde, retrouver trois rouages perdus et réveiller l’Horloger. Pas moi : j’ai des pattes courtes. »';
const MEUBLE_E = { coffre:'🧰', armoire:'🗄️', tonneaux:'🛢️', tombeau:'🪦', etabli:'🛠️', cheminee:'🔥', lit:'🛏️', tente:'⛺', etagere:'📚', bureau:'🪑', banc:'🪑', autel:'🕯️', fontaine:'⛲', cristaux:'💎' };
// 15/11 : deux scénarios ; « brulees » se joue sur la CARTE PEINTE (decor/carte-brulees.webp), calée par l'utilisateur
let scenChoisi = 'horloger';
const SCX_TXT = {
  horloger:{ titre:'⏳ Le Sommeil de l’Horloger', duree:'45-60 min', ouverture:OUVERTURE, entree:() => K.SALLES.A.lu,
    but:'Explorez : ouvrez les portes (gratuit, à côté), fouillez les meubles (un dé) pour trouver <b>3 rouages ⚙</b>. Les 4 leviers de la Salle des rouages ouvrent la porte de bronze.',
    porter:'Portez les rouages jusqu’à l’axe ✹ du Cœur de l’Horloge (derrière la porte de bronze).',
    gagne:['🏆 L’Horloger est réveillé !', '« L’Horloger s’arrête, cligne des yeux, et… s’excuse. Il dormait depuis cent ans, il a cru que vous étiez des voleurs. Là-haut, le pigeon finit son vol, le boulanger finit sa pâte. Et moi ? J’ai fini ma sieste. Personne ne me remercie, bien sûr. »'] },
  brulees:{ titre:'🔥 Les Terres brûlées', duree:'45-60 min · carte peinte (essai)', ouverture:'« Une île de cendre et de lave. On a accosté en barque, tout en bas. Quelque part dans ces salles dorment trois braises éternelles : ramenez-les au grand brasier, tout en haut… Et préparez-vous : ce qui dort dans le feu n’aime pas qu’on le réveille. Moi, je garde la barque. »',
    entree:() => '« On ne voit que ce qui est devant nous : les murs cachent le reste. Avancez, regardez, fouillez. »',
    but:'Explorez (on ne voit que ce qui est en vue), fouillez les meubles (un dé) pour trouver <b>3 braises éternelles 🔥</b>, puis portez-les au <b>grand brasier</b> tout en haut.',
    porter:'Portez les braises jusqu’au grand brasier 🔥, tout en haut de la carte.',
    gagne:['🏆 Le Titan de feu s’éteint !', '« Le Titan vacille, fume, et s’effondre en un tas de braises tièdes. Les trois braises éternelles brillent au cœur du brasier : l’île est sauvée. Je peux sortir de la barque ? Il fait encore un peu chaud, non ? »'] },
};
SCX_TXT.labyrinthe = { titre:'✦ Le Labyrinthe des Runes', duree:'30-60 min · un donjon NEUF à chaque partie',
  ouverture:'« Un escalier qui descend… et un labyrinthe que personne n’a jamais vu. Il change à chaque fois qu’on y entre, paraît-il. Trois fragments de rune dorment dans les meubles : rapportez-les à l’autel, tout au fond. Moi, je reste près de l’escalier. »',
  entree:() => '« On ne voit que ce qui est en vue. Avancez prudemment : chaque labyrinthe est différent. »',
  but:'Explorez (on ne voit que ce qui est en vue), fouillez les meubles (un dé) pour trouver <b>3 fragments de rune ✦</b>, puis portez-les à <b>l’autel des runes</b>, au fond du labyrinthe.',
  porter:'Portez les fragments jusqu’à l’autel ✦, au fond du labyrinthe.',
  gagne:['🏆 Le Titan des runes s’effondre !', '« Le Titan se fige, puis tombe en poussière de pierre. Les fragments brillent sur l’autel : le labyrinthe se tait. Pour cette fois. Demain, il aura encore changé de forme. On revient ? »'] };
const SCT = () => SCX_TXT[(S && S.scen) || scenChoisi];

// ------------------------------------------------------------------ sauvegarde : tout l'état ; un POINT DE PASSAGE à chaque porte ouverte
function sauve() { try { if (S && !S.fin) localStorage.setItem(CLE_PARTIE, JSON.stringify(S)); else localStorage.removeItem(CLE_PARTIE); } catch (e) {} }
const gardee = () => { try { const p = JSON.parse(localStorage.getItem(CLE_PARTIE) || 'null'); return p && p.heros && p.R && !p.fin ? p : null; } catch (e) { return null; } };
function pointDePassage() { const c = JSON.parse(JSON.stringify(S)); delete c.passage; S.passage = JSON.stringify(c); }

// ------------------------------------------------------------------ À DISTANCE : chacun son téléphone (15/11 ; serveur : routes /api/hub/guilde/partie, labo perso seulement)
// L = null hors ligne ; sinon { code, version, joueurs:[{ id, nom, heros:[indices] }], moi:{ id, nom }, dernier:(JSON envoyé ou reçu) }.
// Chaque coup est envoyé au serveur ; les autres téléphones le reçoivent en demandant l'état toutes les 2 secondes.
// Chacun ne joue que SES héros ; tout le monde peut ouvrir une porte et finir le tour.
let L = null, envoi = false;
const API = '/api/hub/guilde/partie';
const SALLE = 'guilde-salle';
const mesHeros = () => !L ? S.heros.map((z, i) => i) : ((L.joueurs.find(j => j.id === L.moi.id) || {}).heros || []);
const proprio = i => L ? (L.joueurs.find(j => (j.heros || []).includes(i)) || {}).nom : null;
async function api(methode, url, corps) {
  const r = await fetch(url, { method:methode, headers:{ 'Content-Type':'application/json' }, body:corps ? JSON.stringify(corps) : undefined });
  let d = {}; try { d = await r.json(); } catch (e) {}
  return { statut:r.status, d };
}
async function pousse() {
  if (!L || envoi) return; envoi = true;
  try {
    const etat = S, j = JSON.stringify(S); L.dernier = j;
    const { statut, d } = await api('POST', `${API}/${L.code}`, { version:L.version, etat, joueurs:L.joueurs });
    if (statut === 200) L.version = d.version;
    else if (statut === 409) { recoit(d); bulle('Quelqu’un a joué en même temps : partie mise à jour.', true); }
    else bulle(d.message || 'Le serveur ne répond pas.', true);
  } catch (e) { bulle('Pas de réseau : le coup n’est pas parti.', true); }
  envoi = false;
}
function recoit(d) {
  if (!d || !d.etat) return;
  const avant = S && S.journal ? S.journal[0] : null;
  S = d.etat; L.version = d.version; if (d.joueurs) L.joueurs = d.joueurs; L.dernier = JSON.stringify(S);
  if (!mesHeros().includes(actif)) { const m = mesHeros().find(i => !S.heros[i].aTerre); if (m != null) actif = m; }
  sel = null; dessine();
  if (S.journal[0] && S.journal[0] !== avant) bulle(S.journal[0].replace(/^[^ ]+ /, ''));
  if (S.fin) finPartie();
}
setInterval(async () => {
  if (!L || envoi || occupe || document.hidden) return;
  try { const { statut, d } = await api('GET', `${API}/${L.code}?v=${L.version}`); if (statut === 200 && !d.pareil) recoit(d); } catch (e) {}
}, 2000);
async function creerSalle() {
  const nom = (prompt('Ton prénom (ou pseudo) pour tes amis :', localStorage.getItem('guilde-pseudo') || '') || '').trim().slice(0, 24); if (!nom) return;
  localStorage.setItem('guilde-pseudo', nom);
  S = K.nouvelle(equipeChoisie(), 'chron-' + Date.now(), scenChoisi); pointDePassage(); actif = 0; sel = null; centrer = true;
  const moi = { id:'j' + Math.random().toString(36).slice(2, 10), nom };
  const joueurs = [{ id:moi.id, nom, heros:S.heros.map((z, i) => i) }];
  try { const { statut, d } = await api('POST', API, { mode:'chroniques', etat:S, joueurs });
    if (statut !== 200) { bulle(d.message || 'Impossible de créer la salle.', true); S = null; return; }
    L = { code:d.code, version:d.version, joueurs, moi, dernier:JSON.stringify(S) };
    localStorage.setItem(SALLE, JSON.stringify({ code:L.code, moi }));
    dessine();
    fenetre(`<h2>🌐 Ta salle est ouverte</h2><p style="text-align:center">Donne ce code à tes amis :</p><p style="text-align:center;font-size:2.6em;letter-spacing:.2em;color:var(--or);margin:6px 0"><b>${L.code}</b></p>
      <p>Ils vont sur <b>perso.elvanys.fr/guilde</b> → <b>Les Chroniques</b> → <b>🔑 Rejoindre avec un code</b>. Quand ils arrivent, ils prennent leurs héros (tu les leur laisses). Tu peux commencer tout de suite.</p>
      <button class="go" onclick="fenetre('');equipeEnLigne()">Voir qui joue quoi</button>`, false);
  } catch (e) { bulle('Pas de réseau.', true); S = null; }
}
async function rejoindre(code, moi) {
  code = (code || prompt('Le code de la salle (4 lettres) :') || '').toUpperCase().replace(/[^A-Z]/g, ''); if (code.length < 4) return;
  if (!moi) { const nom = (prompt('Ton prénom (ou pseudo) :', localStorage.getItem('guilde-pseudo') || '') || '').trim().slice(0, 24); if (!nom) return; localStorage.setItem('guilde-pseudo', nom); moi = { id:'j' + Math.random().toString(36).slice(2, 10), nom }; }
  try { const { statut, d } = await api('GET', `${API}/${code}`);
    if (statut !== 200) { bulle(d.message || 'Code inconnu.', true); return; }
    L = { code, version:d.version, joueurs:d.joueurs || [], moi, dernier:'' }; S = d.etat; actif = 0; sel = null; centrer = true;
    if (!L.joueurs.some(j => j.id === moi.id)) L.joueurs.push({ id:moi.id, nom:moi.nom, heros:[] });
    localStorage.setItem(SALLE, JSON.stringify({ code, moi }));
    dessine(); await pousse(); equipeEnLigne();
  } catch (e) { bulle('Pas de réseau.', true); }
}
// qui joue quel héros : on touche un héros pour le prendre
function equipeEnLigne() {
  if (!L) return;
  fenetre(`<h2>🌐 Salle ${L.code}</h2><p style="text-align:center;color:var(--doux)">Touche un héros pour le jouer depuis ce téléphone.</p>
    ${S.heros.map((z, i) => `<button class="sec" onclick="prendHeros(${i})"><b>${nomH(z)}</b> · ${(H[z.id] || {}).t || ''}<small>${proprio(i) ? 'joué par ' + proprio(i) + (mesHeros().includes(i) ? ' (toi)' : '') : 'libre'}</small></button>`).join('')}
    <p style="color:var(--doux);font-size:.9em">Joueurs : ${L.joueurs.map(j => j.nom).join(', ')}</p><button class="go" onclick="fenetre('')">C’est bon</button>`);
}

  sauve(); const gagne = S.fin === 'gagne'; let objet = null, niv = [];
  S.heros.forEach(z => { if (z.av && avTrouve(z.av)) { const g = avGagneXP(z.av, gagne ? 120 : 40, gagne); if (g) niv.push(nomH(z)); } });
  if (niv.length) setTimeout(() => bulle(`⬆ Niveau gagné : ${niv.join(', ')} ! (à forger dans la Forge des héros)`), 900);
  if (gagne) { son('victoire'); try { GM.jingle('victoire'); } catch (e) {} S.heros.forEach(z => { if (typeof guildeEvt === 'function') guildeEvt('boss', 1, { heros:z.id }); }); objet = butinArmurerie(S.sablier > 0 ? 3 : 1, S.score);
    try { const D = JSON.parse(localStorage.getItem(CLE) || '{}'); D.horloger = (D.horloger || 0) + 1; if (S.sablier > 0) D.gardiens = true; localStorage.setItem(CLE, JSON.stringify(D)); } catch (e) {} }
  else { try { GM.jingle('defaite'); } catch (e) {} }
  fenetre(gagne ? `<h2>${SCT().gagne[0]}</h2><div class="moust"><img src="ui/moustache.webp" alt=""><div class="lu">${SCT().gagne[1]}</div></div>
      <p style="text-align:center">Score : <b style="color:var(--or)">${S.score}</b> · ${S.tours} tours · ⌛ ${S.sablier} grains${S.sablier > 0 ? '<br>🏅 Titre « <b>Gardiens du temps</b> » : le sablier n’est jamais tombé à zéro !' : ''}</p>
      <p style="text-align:center">✨ Chaque héros gagne des éclats et de l’XP${objet ? ` · 🎒 <b>${objet}</b> rejoint l’armurerie` : ''}.</p><button class="go" onclick="fin()">Retour à la Guilde</button>`
    : `<h2>❄ Figés…</h2><div class="moust"><img src="ui/moustache.webp" alt=""><div class="lu">« Figés. Tous. Comme des statues. Très jolies, d’ailleurs. L’Horloger vous remonte comme des jouets… On réessaie ? »</div></div>
      <button class="go" onclick="recommence()">↺ Repartir de la dernière porte ouverte</button><button class="sec" onclick="fin()">Abandonner</button>`, false);
}
function recommence() { if (!S.passage) { const h = S.heros.map(z => z.id); S = K.nouvelle(h, 'chron-' + Date.now(), S.scen); } else S = JSON.parse(S.passage); actif = 0; sel = null; centrer = true; fenetre(''); dessine(); }
function fin() { try { localStorage.removeItem(CLE_PARTIE); } catch (e) {} if (L) quitterSalle(); S = null; fenetre(''); accueil(); }

// ------------------------------------------------------------------ l'accueil
function accueil() {
  const g = gardee(); let D = {}; try { D = JSON.parse(localStorage.getItem(CLE) || '{}'); } catch (e) {}
  choisis = choisis.filter(k => k !== 'zephine' || ZEPH_OK());
  $('app').innerHTML = `<div class="acc">
    <div class="haut"><a href="menu.html">‹ Menu</a><span class="t"></span><button onclick="regles()">❓ Règles</button></div>
    <h1>📜 Les Chroniques de la Guilde</h1>
    <p class="sous">Jusqu’à 4 héros, un donjon dans le noir, des portes à ouvrir, des meubles à fouiller, une histoire. Un seul téléphone : passez-le à celui dont c’est le tour.</p>
    ${g ? `<button class="gros" style="border-color:var(--ok);color:var(--ok);background:#14322a" onclick="reprend()">▶ Reprendre la partie<small>${g.heros.map(z => nomH(z)).join(', ')} · ⚙ ${g.R.rouagesPoses}/3 · ⌛ ${g.sablier}</small></button>` : ''}
    <h3 style="color:var(--or);margin:4cqw 0 1.5cqw">📖 Le scénario</h3>
    <div class="choixH" style="grid-template-columns:1fr 1fr">${Object.entries(SCX_TXT).map(([k, s]) => `<button class="${scenChoisi === k ? 'on' : ''}" onclick="scenChoisi='${k}';accueil()" style="font-size:3.4cqw">${s.titre}<small>${s.duree}${k === 'horloger' && D.horloger ? ` · ✓ ${D.horloger}` : ''}</small></button>`).join('')}</div>
    <p style="text-align:center;color:var(--doux);font-size:3cqw;margin:0 0 2cqw">Choisis de 1 à 4 héros (un par joueur ; seul, tu peux en jouer plusieurs).</p>
    <h3 style="color:var(--or);margin:3cqw 0 1.5cqw">⚒ Tes héros d’aventure</h3>
    <div class="choixH">${avLire().map(a => { const s = avStats(a); return `<button class="${choisis.includes('av:' + a.id) ? 'on' : ''}" onclick="basculeHeros('av:${a.id}')"><img src="${avPortrait(a)}" onerror="this.onerror=null;this.src='${avPortraitSecours(a)}'" alt="" style="box-shadow:0 0 0 3px ${a.couleur}">${a.nom}<small>${avTitre(a)} · niv. ${s.niveau}</small></button>`; }).join('')}
      <button onclick="location.href='aventuriers.html?retour=chroniques.html'">＋<small>Créer un héros dans la Forge des héros</small></button></div>
    <h3 style="color:var(--or);margin:3cqw 0 1.5cqw">Les héros de la Guilde</h3>
    <div class="choixH">${Object.entries(H).map(([k, h]) => `<button class="${choisis.includes(k) ? 'on' : ''}" ${k === 'zephine' && !ZEPH_OK() ? 'disabled' : ''} onclick="basculeHeros('${k}')"><img src="portraits/${k}.webp" alt="">${h.n}<small>${h.t}</small>${k === 'zephine' && !ZEPH_OK() ? '<small>🔒 tutoriel</small>' : ''}</button>`).join('')}</div>
    <button class="gros" ${choisis.length ? '' : 'disabled'} onclick="commence()">⚔ Commencer avec ${choisis.length} héros<small>${choisis.map(nomChoix).join(', ') || 'choisis au moins un héros'}</small></button>
    <h3 style="color:var(--or);text-align:center;margin:5cqw 0 1cqw">🌐 Chacun chez soi</h3>
    <button class="gros" style="background:#14223a;border-color:#7cd4ff;color:#7cd4ff" ${choisis.length ? '' : 'disabled'} onclick="creerSalle()">🌐 Créer une partie à distance<small>Avec les héros choisis ci-dessus ; un code de 4 lettres à donner à tes amis.</small></button>
    <button class="gros" style="background:#1c1c36;border-color:#45457a;color:var(--texte)" onclick="rejoindre()">🔑 Rejoindre avec un code<small>Un ami t’a donné un code de salle.</small></button>
    ${(() => { try { const s = JSON.parse(localStorage.getItem(SALLE) || 'null'); return s ? `<button class="gros" style="background:#14322a;border-color:var(--ok);color:var(--ok)" onclick='rejoindre(${JSON.stringify(s.code)}, ${JSON.stringify(s.moi)})'>↩ Revenir dans la salle ${s.code}<small>en tant que ${s.moi.nom}</small></button>` : ''; } catch (e) { return ''; } })()}
    <p style="text-align:center;margin-top:4cqw"><a href="chroniques-v1.html" style="color:var(--doux);font-size:3cqw">l’ancienne version (salles séparées)</a></p>
  </div>`;
}
// un choix de l'accueil → ce que le moteur attend (une voie, ou un héros d'aventure avec ses stats)
const nomChoix = k => k.startsWith('av:') ? ((avTrouve(k.slice(3)) || {}).nom || '?') : H[k].n;
function versMoteur(k) {
  if (!k.startsWith('av:')) return k;
  const a = avTrouve(k.slice(3)); if (!a) return null; const s = avStats(a);
  return { voie:a.voie, nom:a.nom, pv:s.pv, faces:s.faces, desPlus:s.desPlus, talents:s.talents, av:a.id, c:a.couleur, portrait:avPortrait(a) };
}
const equipeChoisie = () => choisis.map(versMoteur).filter(Boolean);
function basculeHeros(k) { if (choisis.includes(k)) choisis = choisis.filter(x => x !== k); else if (choisis.length < 4) choisis.push(k); else { bulle('4 héros au plus', true); return; } son('choisir'); accueil(); }
function commence() {
  if (!choisis.length) return; S = K.nouvelle(equipeChoisie(), 'chron-' + Date.now(), scenChoisi); pointDePassage(); actif = 0; sel = null; centrer = true; son('portail'); dessine();
  fenetre(`<h2>${SCT().titre}</h2><div class="moust"><img src="ui/moustache.webp" alt=""><div class="lu">${SCT().ouverture}</div></div><div class="moust"><img src="ui/moustache.webp" alt=""><div class="lu">${SCT().entree()}</div></div><button class="go" onclick="fenetre('')">On y va !</button>`, false);
}
function reprend() { const g = gardee(); if (!g) return; S = g; actif = Math.max(0, S.heros.findIndex(z => !z.aTerre)); sel = null; centrer = true; dessine(); }
if (typeof GM !== 'undefined') { try { GM.musique('exploration'); GM.bouton(); } catch (e) {} }
accueil();
</script>
</body>
</html>
