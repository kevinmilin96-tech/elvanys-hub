// Une grande carte qui défile : les salles restent dans le noir jusqu'à ce qu'on ouvre leur porte ; les couloirs se dévoilent en avançant ;
// les meubles se fouillent. Un seul écran que l'on se passe ; jusqu'à 4 héros. La v1 (salles séparées) : chroniques-v1.html.
const K = CHRON, H = K.HEROS_C, $ = id => document.getElementById(id);
const ZEPH_OK = () => localStorage.getItem('guilde-tuto') === 'fait';
const CLE_PARTIE = 'guilde-chroniques2-partie', CLE = 'guilde-chroniques';
const son = k => { try { if (typeof GM !== 'undefined') GM.son(k); } catch (e) {} };
let S = null, actif = 0, sel = null, choisis = ['maelle', 'aldric', 'pip', 'gorm'], occupe = false, petit = false, centrer = true;
const OUVERTURE = '« Vous avez entendu ? Moi non plus. C’est bien ça le problème : la Grande Horloge de la Guilde ne fait plus tic-tac. Le boulanger est figé, la main dans la pâte. Le pigeon du toit est figé, en plein vol. Quelqu’un doit descendre sous la Guilde, retrouver trois rouages perdus et réveiller l’Horloger. Pas moi : j’ai des pattes courtes. »';
// 15/11 soir : les meubles et objets peints (decor/obj-<nom>.webp, fond détouré) ; sinon l'émoji
// 16/11 soir (l'utilisateur : « les statues ne sont pas sur les socles ») : chaque statue de la Galerie posée sur son socle peint (décalage en % de la case)
// 16/11 soir (l'utilisateur : « reçu l'objet mais aucune animation ») : un objet gagné apparaît en grand, brille, puis file vers le héros
function objetRecu(icone, titre, texte) { const d = document.createElement('div'); d.className = 'recu-objet';
  d.innerHTML = `<div class="ro-halo"></div><div class="ro-ic">${icone}</div><div class="ro-t">${titre}</div>${texte ? `<div class="ro-d">${texte}</div>` : ''}`;
  d.onclick = () => d.remove(); document.body.appendChild(d); setTimeout(() => d.classList.add('part'), 2300); setTimeout(() => d.remove(), 2900); }
let statueBrille = []; // les deux statues qui viennent de tourner, allumées un instant
const SOCLES = { '4,1':[-47, -24], '7,1':[44, -24], '4,3':[-35, 49], '7,3':[33, 49] }; // en % de l'image (88 % de la case)
const OBJ_PEINTS = ['coffre', 'armoire', 'tonneaux', 'tombeau', 'etabli', 'cheminee', 'etagere', 'levier', 'rouage', 'axe', 'porte', 'statue', 'autel', 'grille', 'dalle', 'tasdos'];
// 16/11 : LES SALLES DESSINÉES de l'Horloger (Gemini, vues du dessus) : chaque salle reçoit son image, étalée sur ses cases de sol
const SALLE_IMG = { A:'hall', C:'reserve', G:'crypte', B:'rouages', E:'atelier', F:'bibliotheque', H:'coeur', S:'galerie', P:'cagibi' };
// 16/11 : la porte vue du dessus (poutre en travers du passage) : tournée d'un quart de tour quand le passage est horizontal
function porteDessus(R, x, y, bronze) { const mursCote = R.murs[K.cle(x - 1, y)] && R.murs[K.cle(x + 1, y)];
  return `<img class="oi porte3" src="decor/obj-porte-${bronze ? 'bronze-v4' : 'v3'}.webp?v=1" alt=""${mursCote ? '' : ' style="transform:rotate(90deg)"'}>`; }
// 16/11 (« les murs je les vois pas ») : un liseré de pierre claire sur chaque côté d'un mur qui touche un sol (vu), et une ombre portée
function bordMur(R, x, y) {
  // 16/11 : les murs façon carte de donjon = l'image Gemini « mur-bord » posée sur chaque côté qui touche un sol (tournée),
  // et le « mur-pilier » dans un angle où le sol n'est qu'en diagonale (ramené à la même épaisseur que le bord)
  const sol = (a, b) => a >= 0 && b >= 0 && a < R.w && b < R.h && R.vu[K.cle(a, b)] && R.murs[K.cle(a, b)] !== '#';
  const L = [], bord = r => `url('decor/mur-bord-${r}.webp?v=1') 0 0 / 100% 100% no-repeat`;
  if (sol(x, y - 1)) L.push(bord(0)); if (sol(x + 1, y)) L.push(bord(90)); if (sol(x, y + 1)) L.push(bord(180)); if (sol(x - 1, y)) L.push(bord(270));
  [[-1, -1, 0, 'left top'], [1, -1, 90, 'right top'], [1, 1, 180, 'right bottom'], [-1, 1, 270, 'left bottom']].forEach(([dx, dy, r, pos]) => {
    if (sol(x + dx, y + dy) && !sol(x + dx, y) && !sol(x, y + dy)) L.push(`url('decor/mur-pilier-${r}.webp?v=1') ${pos} / 80% 80% no-repeat`); });
  return L.length ? `background:${L.join(',')}, #0d0c12;` : '';
}
// 16/11 (choix de l'utilisateur : « salles reliées ») : l'Horloger se joue UNE ZONE À LA FOIS : la salle ou le bout de couloir du héros joué
// remplit l'écran (avec ses murs et ses portes), une petite carte en haut montre tout le donjon découvert ; au tour des monstres, la caméra
// visite chaque salle où un monstre agit. Les héros d'une même zone se voient.
const COULOIRS_Z1 = { K1:{ r:[1, 5, 18, 1], n:'Le couloir du haut' }, K2:{ r:[1, 12, 18, 1], n:'Le couloir du bas' }, K3:{ r:[7, 6, 1, 6], n:'Le passage de l’ouest' }, K4:{ r:[13, 6, 1, 6], n:'Le passage de l’est' } };
let vueForcee = null, suivi = null, zoneVue = null, vueGardee = null; // suivi : le héros d'un ami que la caméra regarde pendant qu'il joue (jeu à distance)
// 16/11 : l'Horloge en étages (plan 2) a ses propres couloirs et escaliers ; les parties commencées avant gardent l'ancienne carte
const couloirsZ = () => S && S.R && S.R.plan === 2 ? K.COULOIRS_Z2 : COULOIRS_Z1;
const esc = t => String(t == null ? '' : t).replace(/[&<>"]/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[c]));
const modeZones = () => S && (S.scen || 'horloger') === 'horloger' && !petit;
// 16/11 (l'utilisateur : « brouillard, lumière, sons, comme Foundry / Roll20 ») : chaque héros porte une LANTERNE ; hors de sa lumière,
// la salle reste dans le noir (déjà explorée mais on n'y voit pas les monstres). Le Cœur de l'Horloge luit tout seul.
// 16/11 (l'utilisateur : « une fois dans la pièce, pas besoin de noir, sauf dans une caverne ») : les salles sont ÉCLAIRÉES,
// seules les salles SOMBRES (crypte, caverne… choisies salle par salle) demandent la lanterne
const LANTERNE = 3.5, SALLES_SOMBRES = ['G'];
const lumiereActive = () => modeZones() && S.R.plan === 2;
function eclaire(x, y) {
  if (!lumiereActive()) return true;
  const z = zoneDe(S.R, x, y); if (!SALLES_SOMBRES.includes(z)) return true;
  // 16/11 (l'utilisateur : « un monstre m'a attaqué à travers la porte et je ne peux plus entrer ») : ce qui est JUSTE À CÔTÉ d'un héros se voit toujours
  return S.heros.some(h => (zoneDe(S.R, h.x, h.y) === z && Math.hypot(h.x - x, h.y - y) <= LANTERNE) || Math.hypot(h.x - x, h.y - y) <= 1.5);
}
const SON_ZONE = { B:'rouages', H:'coeur', G:'crypte', F:'biblio', E:'atelier', A:'hall', C:'reserve', S:'galerie', P:'cagibi' };
function zoneDe(R, x, y) {
  const c = K.cle(x, y); if (R.salle[c]) return R.salle[c];
  for (const [id, Z] of Object.entries(couloirsZ())) { const [a, b, w, h] = Z.r; if (x >= a && x < a + w && y >= b && y < b + h) return id; }
  // une porte appartient à la salle qu'elle ouvre (sinon au couloir)
  for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) { const z = R.salle[K.cle(x + dx, y + dy)]; if (z) return z; }
  for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) { for (const [id, Z] of Object.entries(couloirsZ())) { const [a, b, w, h] = Z.r, X = x + dx, Y = y + dy; if (X >= a && X < a + w && Y >= b && Y < b + h) return id; } }
