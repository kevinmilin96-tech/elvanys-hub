<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">

<title>La Guilde des Runes · Les Expéditions</title>
<style>
  :root { --or:#f3c96b; --texte:#f1ecff; --doux:#c9c1ea; --ok:#7dffb0; --mer:#5ff5e6; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { margin:0; background:#101a2b; color:var(--texte); font:15px/1.35 Georgia, 'Times New Roman', serif; user-select:none; }
  #app { max-width:560px; margin:0 auto; min-height:100vh; padding:8px 8px 30px; }
  button { font:inherit; cursor:pointer; }
  h1 { color:var(--mer); font-size:1.25em; margin:.3em 0; text-align:center; }
  h2 { color:var(--or); font-size:1.05em; margin:.7em 0 .3em; }
  p { margin:.4em 0; } .doux { color:var(--doux); font-size:.88em; }
  .heros6 { display:grid; grid-template-columns:repeat(3, 1fr); gap:8px; margin:6px 0; }
  .heros6 button { background:#162238; color:#fff; border:2px solid #2f4a6b; border-radius:12px; padding:6px; font-size:.85em; }
  .heros6 img { width:100%; aspect-ratio:1; border-radius:9px; object-fit:cover; display:block; margin-bottom:4px; }
  .entete { display:flex; gap:8px; align-items:center; background:#162238; border-radius:12px; padding:6px 8px; margin:4px 0; font-size:.86em; }
  .entete img { width:46px; height:46px; border-radius:50%; object-fit:cover; border:2px solid var(--or); }
  .p { display:inline-block; background:#0006; border-radius:10px; padding:1px 7px; margin:1px 2px 1px 0; }
  .route { display:flex; gap:4px; justify-content:space-between; margin:6px 0; }
  .esc { flex:1; text-align:center; font-size:.72em; background:#162238; border-radius:8px; padding:4px 2px; border:2px solid #2f4a6b; }
  .esc.faite { border-color:var(--ok); opacity:.7; } .esc.ici { border-color:var(--or); box-shadow:0 0 10px var(--or); } .esc b { display:block; font-size:1.5em; }
  .champ.lieu-crique { background:linear-gradient(180deg, #06142a 0%, #1a4a7a 55%, #0b2a3a 56%, #06141f 100%); }
  .champ.lieu-falaises { background:linear-gradient(180deg, #1a1f2e 0%, #4a5a6e 50%, #2a2f3a 51%, #15181f 100%); }
  .champ.lieu-port { background:linear-gradient(180deg, #2a1f0a 0%, #b7832a 55%, #3a2a0a 56%, #1a1206 100%); }
  .champ.lieu-foret { background:linear-gradient(180deg, #06160c 0%, #1f5a2a 55%, #0f2a14 56%, #06120a 100%); }
  .champ.lieu-cratere { background:linear-gradient(180deg, #1a0505 0%, #a8341a 55%, #3a0a0a 56%, #1a0505 100%); }
  .champ.lieu-nid { background:radial-gradient(circle at 50% 60%, #f7a23a 0%, #a8341a 30%, #2a0505 75%); }
  .champ { background:radial-gradient(circle at 50% 20%, #1c2f4d, #0b1322 75%); border:2px solid #2f4a6b; border-radius:14px; padding:8px; margin:6px 0; }
  .rang { display:flex; gap:5px; justify-content:center; min-height:96px; align-items:stretch; }
  .u { width:78px; background:#f6efdc; color:#2b2117; border-radius:9px; padding:4px; font-size:.66em; line-height:1.15; text-align:center; border:2px solid #b89a5e; position:relative; transition:transform .15s; }
  .u.ennemi { background:#3a2a2a; color:#ffe9e0; border-color:#b84a3a; } .u.heros { border-color:var(--or); background:#fff6dc; } .u.ennemi.heros { background:#4a2020; }
  .u b { display:block; min-height:2.3em; } .u .av { display:flex; justify-content:space-between; font-weight:bold; font-size:1.25em; }
  .u .av span:first-child { color:#b84a00; } .u .av span:last-child { color:#1f6f2a; } .u.ennemi .av span:first-child { color:#ff9a7a; } .u.ennemi .av span:last-child { color:#8df0a0; }
  .u .tg { color:#7a5a2a; font-size:.9em; min-height:1.1em; } .u.ennemi .tg { color:#e0b0a0; }
  .u.frappe { transform:translateY(-10px) scale(1.08); box-shadow:0 0 12px var(--or); } .u.touche { animation:tremble .35s; } .u.mort { opacity:.25; filter:grayscale(1); }
  .u .de { position:absolute; right:-6px; top:-8px; width:22px; height:22px; border-radius:5px; background:#fff; color:#222; font-weight:bold; border:2px solid #222; display:flex; align-items:center; justify-content:center; font-size:1.1em; }
  .u .dg { position:absolute; left:50%; top:30%; transform:translateX(-50%); color:#ff5a3a; font-weight:bold; font-size:1.8em; text-shadow:0 0 6px #000; animation:monte .8s forwards; }
  @keyframes tremble { 25% { transform:translateX(-5px); } 75% { transform:translateX(5px); } }
  @keyframes monte { to { transform:translate(-50%, -30px); opacity:0; } }
  .milieu { text-align:center; color:var(--mer); margin:6px 0; letter-spacing:.3em; }
  .journal { font-size:.8em; color:var(--doux); max-height:22vh; overflow:auto; background:#0b1322; border-radius:8px; padding:6px 8px; } .journal div { border-bottom:1px solid #ffffff10; padding:2px 0; }
  .choixh { display:flex; gap:8px; justify-content:center; margin:10px 0; flex-wrap:wrap; }
  .choixh button { background:#162238; color:#fff; border:2px solid #2f4a6b; border-radius:14px; padding:8px 10px; min-width:120px; flex:1; } .choixh button.or { border-color:var(--or); color:var(--or); }
  .choixh button:disabled { opacity:.4; }
  .recrue { display:flex; gap:6px; justify-content:center; flex-wrap:wrap; margin:6px 0; }
  .recrue .u { width:100px; cursor:pointer; } .recrue .u .prix { color:#2a7fc1; font-weight:bold; margin-top:3px; }
  .equipage .u { cursor:pointer; } .equipage .u.sel { box-shadow:0 0 0 3px var(--ok); }
  .fenetre { position:fixed; inset:0; background:#000c; z-index:10; display:flex; align-items:center; justify-content:center; padding:12px; }
  .fenetre > div { background:#162238; border-radius:16px; padding:14px 16px; max-width:520px; width:100%; max-height:92vh; overflow:auto; }
  .fenetre h2 { margin-top:.1em; }
  .vitesse { display:flex; gap:6px; justify-content:center; font-size:.85em; } .vitesse button { background:#0b1322; color:#fff; border:1px solid #2f4a6b; border-radius:8px; padding:3px 8px; } .vitesse button.sel { border-color:var(--mer); color:var(--mer); }
  table { width:100%; border-collapse:collapse; font-size:.86em; } td { padding:3px 4px; border-bottom:1px solid #ffffff18; } td:last-child { text-align:right; color:var(--or); }
  /* ---------- v2 (13/11) : deux rangées, la cale, le recruteur, les familles ---------- */
  .fams { display:flex; flex-wrap:wrap; gap:4px; justify-content:center; margin:4px 0; }
  .fams span { font-size:.74em; background:#0b1322; border:1px solid #2f4a6b; border-radius:10px; padding:2px 7px; color:var(--doux); }
  .fams span.p1 { border-color:var(--mer); color:#fff; } .fams span.p2 { border-color:var(--or); color:var(--or); box-shadow:0 0 8px #f3c96b66; }
  .coeurs { color:#ff6b8a; letter-spacing:1px; }
  .rangee { display:grid; grid-template-columns:repeat(3, 1fr); gap:6px; margin:4px 0; }
  .etiq { font-size:.7em; color:var(--doux); text-align:center; margin-top:4px; letter-spacing:.08em; }
  .slot { min-height:104px; border:2px dashed #2f4a6b; border-radius:10px; display:flex; align-items:stretch; justify-content:center; position:relative; }
  .slot.cible-ok { border-color:var(--ok); background:#7dffb014; }
  .slot .u { width:100%; }
  .u .st { color:#d4a017; font-size:1.1em; } .u .fam { font-size:.95em; } .u .role { font-size:.85em; color:#4a6a8a; }
  .u.capitaine { border-color:var(--or); background:#fff6dc; }
  .u img.por { width:34px; height:34px; border-radius:50%; object-fit:cover; display:block; margin:0 auto 2px; }
  .u.sel { box-shadow:0 0 0 3px var(--ok); }
  .cale { display:grid; grid-template-columns:repeat(3, 1fr); gap:6px; background:#0b1322; border-radius:12px; padding:6px; }
  .cale .slot { min-height:90px; }
  .boutique { display:grid; grid-template-columns:repeat(4, 1fr); gap:5px; margin:6px 0; } .boutique.cinq { grid-template-columns:repeat(5, 1fr); }
  .offre { background:#f6efdc; color:#2b2117; border-radius:9px; padding:4px; font-size:.64em; text-align:center; border:2px solid #b89a5e; cursor:pointer; position:relative; }
  .offre.vide { opacity:.25; } .offre .prix { position:absolute; top:-7px; right:-6px; background:#d4a017; color:#2b2117; font-weight:bold; border-radius:50%; width:20px; height:20px; display:grid; place-items:center; }
  .offre.paire { box-shadow:0 0 0 2px var(--ok), 0 0 10px var(--ok); } .offre b { display:block; min-height:2.3em; }
  .actions { display:flex; gap:6px; flex-wrap:wrap; justify-content:center; margin:6px 0; } .actions button { background:#162238; color:#fff; border:2px solid #2f4a6b; border-radius:12px; padding:6px 10px; font-size:.86em; }
  .actions button.on { border-color:var(--mer); color:var(--mer); } .actions button:disabled { opacity:.35; }
  .go { display:block; width:100%; margin:8px 0; padding:12px; border-radius:16px; border:0; font-weight:bold; font-size:1.05em; background:linear-gradient(#f6d77e, #c8902f); color:#2a1a08; }
  .prochain { text-align:center; font-size:.85em; color:var(--doux); }
  .u .sv { position:absolute; left:50%; top:30%; transform:translateX(-50%); color:#5fe08a; font-weight:bold; font-size:1.6em; text-shadow:0 0 6px #000; animation:monte .8s forwards; }
  .u.esq { animation:esq .4s; } @keyframes esq { 50% { transform:translateX(14px) rotate(6deg); opacity:.5; } }
  .bulleinfo { background:#0b1322; border:1px solid #2f4a6b; border-radius:10px; padding:6px 8px; font-size:.8em; color:var(--doux); margin:4px 0; }
  /* ---------- 14/11 : de vraies cartes illustrées, une fiche au toucher, le port sur un seul écran ---------- */
  .u.carte, .offre.carte { background:#2a2140 center 30%/cover no-repeat; color:#fff; border:2px solid #c8a35a; border-radius:10px; padding:0; overflow:hidden; text-align:left;
    box-shadow:0 3px 8px #0009, inset 0 0 0 1px #0008; position:relative; height:100%; min-height:0; }
  .u.carte::before, .offre.carte::before { content:''; position:absolute; inset:0; background:linear-gradient(180deg, #000a 0%, #0000 26%, #0000 48%, #000d 78%, #000e 100%); pointer-events:none; }
  .carte > * { position:relative; }
  .carte .nm { position:absolute; left:3px; right:3px; top:2px; font-weight:bold; font-size:.95em; line-height:1.1; text-shadow:0 1px 2px #000, 0 0 4px #000; text-align:center; }
  .carte .fm { position:absolute; left:2px; bottom:22%; font-size:1.05em; filter:drop-shadow(0 1px 2px #000); }
  .carte .rl { position:absolute; left:3px; right:3px; bottom:22%; text-align:center; font-size:.82em; line-height:1.15; color:#ffe9b0; text-shadow:0 1px 2px #000; padding-left:1.2em; }
  .carte.soutien .rl { color:#b8f0ff; }
  .carte .av { position:absolute; left:0; right:0; bottom:2px; display:flex; justify-content:space-between; padding:0 3px; font-size:1.15em; font-weight:bold; }
  .carte .av span { min-width:2.2em; text-align:center; border-radius:10px; padding:0 4px; color:#fff !important; text-shadow:0 1px 1px #0008; }
  .carte .av span:first-child { background:linear-gradient(#f7a23a, #b8540f); } .carte .av span:last-child { background:linear-gradient(#5fd07a, #1f7a3a); }
  .carte .sansart { position:absolute; left:0; right:0; top:22%; text-align:center; font-size:2.2em; opacity:.85; }
  .u.carte.capitaine { border-color:var(--or); box-shadow:0 0 10px #f3c96b88; } .u.carte.capitaine img.por { display:none; }
  .u.carte.ennemi { border-color:#d0503a; background-color:#3a1515; }
  .u.carte.sel { box-shadow:0 0 0 3px var(--ok), 0 0 14px var(--ok); }
  .offre.carte { height:clamp(70px, 11dvh, 104px); font-size:.62em; } .offre.carte .prix { z-index:2; top:2px; right:2px; }
  .fams span { cursor:pointer; }
  .fiche { display:flex; gap:10px; align-items:center; } .fiche img { width:84px; height:84px; object-fit:cover; border-radius:12px; border:2px solid var(--or); flex:none; } .fiche h2 { margin:0; }
  .feuille { position:fixed; left:50%; transform:translateX(-50%); bottom:0; width:min(100%, 560px); z-index:8; background:#162238f2; border-top:2px solid var(--or); border-radius:16px 16px 0 0; padding:10px 12px 4px; box-shadow:0 -6px 20px #000a; font-size:.88em; max-height:46dvh; overflow:auto; }
  .feuille p { margin:.3em 0; } .feuille .ok { color:var(--ok); text-align:center; }
  .feuille + .actions { position:fixed; left:50%; transform:translateX(-50%); bottom:0; width:min(100%, 560px); z-index:9; background:#162238; margin:0; padding:6px; }
  /* le port tient sur l'écran : les places et les cartes prennent la hauteur qui reste */
  #app { --h:clamp(78px, calc((100dvh - 440px) / 3), 118px); padding-bottom:4px; } #app > .choixh { margin:4px 0; } #app > .choixh button { padding:5px 8px; }
  .slot { min-height:0; height:var(--h); } .cale .slot { height:calc(var(--h) * .72); } .cale .u.carte .rl { display:none; }
  .champ { padding:4px 6px; margin:4px 0; } .rangee { margin:2px 0; gap:5px; } .etiq { margin-top:2px; font-size:.66em; }
  .route { margin:4px 0; } .esc { padding:2px; font-size:.66em; } .esc b { font-size:1.25em; } .prochain { margin:2px 0; font-size:.8em; }
  .entete { margin:2px 0; padding:4px 8px; } .entete img { width:38px; height:38px; }
  .boutique { margin:4px 0; } .go { margin:4px 0; padding:10px; } .actions { margin:4px 0; } .actions button { padding:5px 9px; }
  .u.carte { font-size:.66em; }
  /* 14/11 : le pont du navire volant (Gemini) en fond, assombri pour garder le texte lisible ; cases à moitié transparentes */
  body { background:linear-gradient(#0b1220d0, #0b122040 22%, #0b122030 60%, #0b1220b0 85%), url('decor/fond-expedition.webp?v=1') center top / cover fixed #101a2b; }
  .slot { background:#0b132255; backdrop-filter:blur(1px); border-color:#c9a56a99; }
  .cale { background:#2a160b88; border:2px solid #6b4a2a; }
  .champ { background:#0b132226 !important; border-color:#c9a56a66 !important; }
  .etiq { color:#f3e3c0; text-shadow:0 1px 3px #000; }
</style>
