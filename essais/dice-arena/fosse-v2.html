<!doctype html>
<html lang="fr">

<title>La Guilde des Runes · La Fosse aux Runes</title>
<style>
  :root { --or:#f3c96b; --texte:#f1ecff; --doux:#c9c1ea; --ok:#7dffb0; --rouge:#ff6a5a; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { margin:0; height:100%; overscroll-behavior:none; }
  body { color:var(--texte); font:15px/1.4 Georgia, 'Times New Roman', serif; background:#07090f; overflow:hidden; user-select:none; touch-action:none; }
  #app { max-width:520px; height:100%; margin:0 auto; display:flex; flex-direction:column; container-type:inline-size; }
  .hud { display:flex; align-items:center; gap:2cqw; padding:2cqw 2cqw 1cqw; font-size:3.4cqw; }
  .hud a, .hud button { color:var(--doux); text-decoration:none; background:#1c2436; border:1px solid #3f5070; border-radius:20px; padding:1cqw 2.6cqw; font:inherit; }
  .hud .mid { flex:1; display:flex; justify-content:space-around; }
  .hud b { color:var(--texte); }
  .vie { height:2cqw; margin:0 2cqw 1cqw; border-radius:2cqw; background:#2a0e0e; overflow:hidden; border:1px solid #000; }
  .vie i { display:block; height:100%; background:linear-gradient(90deg, #ff3a1a, #ffb03a); transition:width .3s; }
  .zone { position:relative; flex:1; min-height:0; }
  canvas { position:absolute; inset:0; width:100%; height:100%; display:block; touch-action:none; }
  .bas { padding:1.5cqw 2cqw 3cqw; min-height:16cqw; display:flex; align-items:center; justify-content:center; gap:2cqw; }
  .bas img { width:11cqw; height:11cqw; object-fit:contain; filter:drop-shadow(0 1cqw 1cqw #000a); }
  .bas img.roule { animation:roule .5s; } @keyframes roule { 0% { transform:rotate(0) scale(.6); } 60% { transform:rotate(250deg) scale(1.15); } 100% { transform:rotate(360deg); } }
  .bas .msg { font-size:3.3cqw; color:var(--doux); text-align:center; }
  .bonus { display:flex; gap:1.2cqw; font-size:3.4cqw; }
  .bonus span { background:#1c2436; border:1px solid #3f5070; border-radius:2cqw; padding:.4cqw 1.4cqw; }
  .voile-f { position:fixed; inset:0; background:#000c; z-index:50; display:flex; align-items:center; justify-content:center; padding:4vw; }
  .fen { width:min(94vw, 500px); max-height:90vh; overflow:auto; background:#161d2c; border:2px solid var(--or); border-radius:18px; padding:16px; font-size:15px; }
  .fen h2 { margin:0 0 8px; color:var(--or); text-align:center; }
  .fen .go { display:block; width:100%; font:bold 1.05em Georgia, serif; padding:12px; border-radius:14px; border:0; background:var(--or); color:#2b1d0a; margin-top:10px; }
  .fen .sec { display:block; width:100%; font:1em Georgia, serif; padding:10px; border-radius:14px; border:1px solid #3f5070; background:#1c2436; color:var(--texte); margin-top:8px; }
  .fen ol { padding-left:20px; } .fen li { margin:5px 0; }
  .offre { display:block; width:100%; text-align:left; margin:8px 0; padding:10px 12px; border-radius:14px; border:2px solid #3f5070; background:#1c2436; color:var(--texte); font:inherit; }
  .offre b { color:var(--or); } .offre small { display:block; color:var(--doux); font-size:.85em; margin-top:2px; }
  .moust { display:flex; gap:10px; align-items:flex-start; } .moust img { width:64px; height:64px; border-radius:50%; object-fit:cover; flex:none; border:2px solid var(--or); }
  .acc { overflow:auto; height:100%; padding:0 2cqw 4cqw; touch-action:pan-y; }
  .acc h1 { text-align:center; color:var(--or); margin:3cqw 0 1cqw; font-size:7cqw; }
  .acc .sous { text-align:center; color:var(--doux); font-size:3.6cqw; margin:0 4cqw 3cqw; }
  .heros { display:grid; grid-template-columns:repeat(3, 1fr); gap:2cqw; }
  .heros button { background:#1c2436; border:2px solid #3f5070; border-radius:3cqw; padding:2cqw 1cqw; font:inherit; font-size:3.2cqw; color:var(--texte); }
  .heros button.on { border-color:var(--or); background:#3a2f12; } .heros button:disabled { opacity:.35; }
  .heros img { width:16cqw; height:16cqw; border-radius:50%; object-fit:cover; display:block; margin:0 auto 1cqw; }
  .pv-h { font-size:3cqw; color:var(--doux); margin:3cqw 1cqw; background:#161d2c; border-left:3px solid var(--or); padding:2cqw 3cqw; border-radius:2cqw; }
  .choix { display:grid; gap:2cqw; margin-top:3cqw; }
  .choix button { border-radius:3.5cqw; padding:3cqw; font:inherit; font-size:4cqw; border:2px solid var(--or); background:#3a2f12; color:var(--or); font-weight:bold; text-align:left; }
  .choix button small { display:block; font-weight:normal; color:var(--doux); font-size:3cqw; }
  .choix button.b2 { background:#1c2436; border-color:#3f5070; color:var(--texte); }
  .record { text-align:center; font-size:3.2cqw; color:var(--doux); margin-top:3cqw; }
  .top { display:flex; justify-content:space-between; padding:2cqw 0; }
  .top a, .top button { color:var(--doux); text-decoration:none; background:#1c2436; border:1px solid #3f5070; border-radius:20px; padding:1.2cqw 3cqw; font:inherit; font-size:3.6cqw; }
</style>

<body>
<div id="app"></div>
<div id="fen"></div>
<script src="musique.js?v=d927158b76"></script>
<script src="rang.js?v=01acb4f369"></script>
<script src="heros-etoiles.js?v=80a6cac830"></script>

<script>
// =============================================================================================== LA FOSSE AUX RUNES v2 (15/11) : un VRAI casse-briques
// Retour de l'utilisateur sur la v1 (tour par tour, gardée dans fosse-v1.html) : « je dois cliquer sur chaque dé et chaque colonne et attendre,
// c'est super ennuyant ; je voyais un vrai casse-briques : je lance une balle, elle touche, je la récupère, des bonus tombent des monstres ».
// Donc : temps réel. Une raquette (le bouclier runique du héros) qu'on glisse au doigt ; chaque LANCER DE DÉS donne les balles
// (la valeur du dé = les dégâts de la balle) ; les monstres descendent doucement ; ceux qui touchent le rempart le frappent ;
// les monstres tombés lâchent parfois un BONUS qu'on attrape avec la raquette. 5 vagues, un choix entre deux vagues, un boss à la 5e.
const HER = {
  maelle:{ n:'Maëlle', c:'#ff8a2a', t:'Marteau de forge', d:'Tes balles font +1 dégât.' },
  aldric:{ n:'Sire Aldric', c:'#ffd27a', t:'Grand pavois', d:'Ta raquette est plus large.' },
  pip:{ n:'Pip', c:'#c58bff', t:'Cueillette', d:'Chaque bonus attrapé te rend aussi 1 PV.' },
  oria:{ n:'Oria', c:'#5ff5e6', t:'Œil du cartographe', d:'Au lancer, tu vois la trajectoire de la balle (et tu vises au doigt).' },
  gorm:{ n:'Gorm', c:'#4f8bff', t:'Grand souffle', d:'Tu lances 4 dés au lieu de 3.' },
  zephine:{ n:'Zéphine', c:'#ff4040', t:'Vent de tempête', d:'Tes balles vont plus vite et leurs 1 et 2 comptent comme des 3.' },
};
const W = 360, H = 560, COLS = 6, BW = 56, BH = 34, GAP = 3.6, X0 = (W - COLS * BW - (COLS - 1) * GAP) / 2;
const PV0 = 20, VAGUES = 5;
const PETITS = ['gobelin', 'loup', 'salamandre', 'scarabee', 'harpie', 'lutin', 'larve', 'sangsue', 'rongeur', 'givrelin', 'tisseuse', 'oeil', 'ombre', 'esprit', 'cultiste'];
const ELITES = ['golem', 'chefgobelin', 'drake', 'yeti', 'ours', 'liche', 'chevalier', 'mammouth'];
const BOSS = [['titan', 'Le Titan de feu'], ['vouivre', 'La Vouivre des glaces'], ['roi', 'Le Roi sans visage'], ['hydre', 'L’Hydre'], ['kraken', 'Le Kraken des brumes']];
// les bonus qui tombent des monstres (on les attrape avec la raquette)
const BONUS = {
  multi:  { e:'✦', c:'#c084fc', n:'Multi-balle', d:'chaque balle se divise en trois' },
  feu:    { e:'🔥', c:'#ff6a2a', n:'Balles de feu', d:'elles traversent les monstres (8 s)' },
  large:  { e:'🛡', c:'#7cd4ff', n:'Grand bouclier', d:'raquette plus large (10 s)' },
  soin:   { e:'❤', c:'#ff7a8a', n:'Soin', d:'+3 PV' },
  or:     { e:'🎲', c:'#f3c96b', n:'Dé d’or', d:'une balle de 6 de plus' },
  foudre: { e:'⚡', c:'#ffe14a', n:'Foudre', d:'chaque coup électrise les voisins (8 s)' },
  lent:   { e:'❄', c:'#a8e6ff', n:'Givre', d:'les monstres descendent deux fois moins vite (8 s)' },
};
// les choix entre deux vagues
const AMELIOS = {
  de:     { n:'🎲 Un dé de plus', d:'Tu lances un dé de plus à chaque lancer.' },
  force:  { n:'⚒ Balles forgées', d:'Tes balles font +1 dégât.' },
  raquette:{ n:'🛡 Bouclier élargi', d:'Ta raquette est plus large.' },
  chance: { n:'🍀 Trèfle', d:'Les monstres lâchent des bonus deux fois plus souvent.' },
  min:    { n:'⬆ Dés lestés', d:'Tes dés ne font jamais moins de 3.' },
  soin:   { n:'❤ Rempart réparé', d:'+8 PV (et +4 PV max).' },
};
const $ = id => document.getElementById(id);
const ZEPH_OK = () => localStorage.getItem('guilde-tuto') === 'fait';
const CLE = 'guilde-fosse', CLE_PARTIE = 'guilde-fosse2-partie';
const jour = () => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`; };
const lire = () => { try { return Object.assign({ parties:0, victoires:0, meilleur:0, jours:{}, heros:'maelle' }, JSON.parse(localStorage.getItem(CLE) || '{}')); } catch (e) { return { parties:0, victoires:0, meilleur:0, jours:{}, heros:'maelle' }; } };
const ecrire = d => { try { localStorage.setItem(CLE, JSON.stringify(d)); } catch (e) {} };
let dernierSon = 0;
const son = (k, force) => { const t = performance.now(); if (!force && t - dernierSon < 70) return; dernierSon = t; try { if (typeof GM !== 'undefined') GM.son(k); } catch (e) {} };

// ------------------------------------------------------------------ hasard à graine (la Fosse du jour est la même pour tous)
let rs = 1;
function graine(s) { let h = 2166136261; for (const c of String(s)) { h ^= c.charCodeAt(0); h = Math.imul(h, 16777619); } return h >>> 0; }
function hasard() { rs = (rs + 0x6D2B79F5) >>> 0; let t = rs; t = Math.imul(t ^ t >>> 15, t | 1); t ^= t + Math.imul(t ^ t >>> 7, t | 61); return ((t ^ t >>> 14) >>> 0) / 4294967296; }
const pick = l => l[Math.floor(hasard() * l.length)];

// ------------------------------------------------------------------ les images
const IMG = {};
function img(src) { if (!IMG[src]) { const i = new Image(); i.src = src; IMG[src] = i; } return IMG[src]; }

// ------------------------------------------------------------------ l'état d'une partie
// P = ce qui est sauvegardé entre deux vagues ; J = le jeu en mouvement (pas sauvegardé : on reprend au début de la vague)
let P = null, J = null, duJour = false, choixH = lire().heros, cv, ctx, ech = 1, boucle = 0, dernierT = 0;
function nouvellePartie(h, jourOk) {
  const B = bonusMode(h);
  duJour = jourOk; rs = graine(jourOk ? 'fosse2-' + jour() : 'fosse2-' + Date.now() + Math.random());
  P = { heros:h, vague:1, pv:PV0 + B.pv + B.bouclier, pvmax:PV0 + B.pv + B.bouclier, des:(h === 'gorm' ? 4 : 3) + B.des + B.relance, force:h === 'maelle' ? 1 : 0,
    large:h === 'aldric' ? 1 : 0, chance:1, min:h === 'zephine' ? 3 : 1, score:0, tues:0, rs, duJour, amelios:[] };
}
const sauve = () => { try { if (P && !P.fin) localStorage.setItem(CLE_PARTIE, JSON.stringify(P)); else localStorage.removeItem(CLE_PARTIE); } catch (e) {} };
const partieGardee = () => { try { const p = JSON.parse(localStorage.getItem(CLE_PARTIE) || 'null'); return p && p.heros && !p.fin ? p : null; } catch (e) { return null; } };

// ------------------------------------------------------------------ une vague
function vague() {
  rs = P.rs;
  const v = P.vague, M = [];
  if (v < VAGUES) {
    const rangs = 2 + v, pvB = 2 + v * 1.5;
    for (let r = 0; r < rangs; r++) for (let c = 0; c < COLS; c++) {
      if (hasard() < .28) continue;
      const elite = hasard() < .07 + v * .02;
      const pv = Math.round((pvB + hasard() * 3) * (elite ? 3 : 1));
      M.push({ x:X0 + c * (BW + GAP), y:14 + r * (BH + GAP), w:BW, h:BH, pv, pvmax:pv, m:elite ? pick(ELITES) : pick(PETITS), elite, att:elite ? 3 : 1, flash:0 });
    }
  } else {
    const [m, nom] = pick(BOSS);
    M.push({ x:X0 + 1.5 * (BW + GAP), y:60, w:BW * 3 + GAP * 2, h:BH * 2 + GAP, pv:110, pvmax:110, m, nom, boss:true, att:99, flash:0, tir:2.5 });
    for (let c = 0; c < COLS; c++) { const pv = 10; M.push({ x:X0 + c * (BW + GAP), y:14, w:BW, h:BH, pv, pvmax:pv, m:pick(PETITS), att:1, flash:0 }); }
  }
  P.rs = rs;
  J = { M, balles:[], capsules:[], feux:[], effets:{}, raq:{ x:W / 2, w:66 + P.large * 22 }, etat:'lancer', desLances:[], vitesse:2.4 + v * .6, textes:[], tremble:0, tuesVague:0 };
}
// les dés deviennent des balles posées sur la raquette
function lancer() {
  const n = P.des; J.desLances = [];
  for (let i = 0; i < n; i++) J.desLances.push(Math.max(P.min, 1 + Math.floor(Math.random() * 6)));
  J.etat = 'pret'; son('relance', true);
  dessineBas(true);
}
function tirer(angleDoigt) {
  if (J.etat !== 'pret') return;
  J.etat = 'jeu';
  const vit = P.heros === 'zephine' ? 330 : 290;
  // toutes les balles sont créées tout de suite, mais partent l'une après l'autre (attente) : elles restent posées sur le bouclier d'ici là
  J.desLances.forEach((v, i) => {
    const a = angleDoigt != null ? angleDoigt : -Math.PI / 2 + (i - (J.desLances.length - 1) / 2) * .22;
    J.balles.push({ x:J.raq.x, y:H - 40, vx:Math.cos(a) * vit, vy:Math.sin(a) * vit, r:7, v, vit, attente:i * .14 });
  });
  son('tir', true);
  J.desLances = []; dessineBas();
}

// ------------------------------------------------------------------ la physique
function pas(dt) {
  if (!J || J.etat === 'pause' || J.etat === 'choix' || J.etat === 'fin') return;
  const E = J.effets; for (const k in E) { E[k] -= dt; if (E[k] <= 0) delete E[k]; }
  const lw = J.raq.w + (E.large ? 40 : 0);
  // les monstres descendent
  const vd = J.vitesse * (E.lent ? .5 : 1) * (J.etat === 'jeu' ? 1 : .35);
  for (const m of J.M) {
    m.y += vd * dt * (m.boss ? .55 : 1); if (m.flash > 0) m.flash -= dt;
    if (m.boss) { m.tir -= dt; if (m.tir <= 0 && m.y > 0) { m.tir = 3; J.feux.push({ x:m.x + m.w / 2 + (Math.random() - .5) * m.w * .6, y:m.y + m.h, vy:150 }); son('magie'); } }
    if (m.y + m.h >= H - 44) { // le rempart
      if (m.boss) { P.pv = 0; } else { P.pv -= m.att; texte(m.x + m.w / 2, H - 60, `−${m.att} PV`, '#ff8a7a'); J.tremble = .3; son('coup', true); }
      m.mort = true;
    }
  }
  J.M = J.M.filter(m => !m.mort);
  // les boules de feu du boss
  for (const f of J.feux) { f.y += f.vy * dt; if (f.y > H - 40 && f.y < H - 22 && Math.abs(f.x - J.raq.x) < lw / 2) { f.fin = true; P.pv -= 2; texte(f.x, H - 60, '−2 PV', '#ff8a7a'); J.tremble = .25; son('coup', true); } if (f.y > H) f.fin = true; }
  J.feux = J.feux.filter(f => !f.fin);
  // les balles (petits pas pour ne pas traverser les briques)
  const sub = 3;
  for (let s = 0; s < sub; s++) for (const b of J.balles) bouge(b, dt / sub, lw);
  J.balles = J.balles.filter(b => !b.perdue);
  // les capsules de bonus
  for (const c of J.capsules) { c.y += 120 * dt; if (c.y > H - 40 && c.y < H - 20 && Math.abs(c.x - J.raq.x) < lw / 2 + 8) { c.fin = true; prendBonus(c); } if (c.y > H) c.fin = true; }
  J.capsules = J.capsules.filter(c => !c.fin);
  J.textes.forEach(t => { t.y -= 30 * dt; t.v -= dt; }); J.textes = J.textes.filter(t => t.v > 0);
  if (J.tremble > 0) J.tremble -= dt;
  // fin de vague, plus de balles, défaite
  if (P.pv <= 0) return finPartie(false);
  if (!J.M.length) return finVague();
  if (J.etat === 'jeu' && !J.balles.length) { J.etat = 'lancer'; P.pv -= 1; texte(W / 2, H - 70, 'Balles perdues : −1 PV', '#ff8a7a'); son('erreur', true); dessineBas(); if (P.pv <= 0) return finPartie(false); }
}
function bouge(b, dt, lw) {
  if (b.attente > 0) { b.attente -= dt; b.x = J.raq.x; b.y = H - 40; if (b.attente <= 0) son('tir', true); return; }
  b.x += b.vx * dt; b.y += b.vy * dt;
  if (b.x < b.r) { b.x = b.r; b.vx = Math.abs(b.vx); } if (b.x > W - b.r) { b.x = W - b.r; b.vx = -Math.abs(b.vx); }
  if (b.y < b.r) { b.y = b.r; b.vy = Math.abs(b.vy); }
  // la raquette : l'angle dépend de l'endroit touché
  const ry = H - 30;
  if (b.vy > 0 && b.y + b.r >= ry && b.y + b.r <= ry + 14 && Math.abs(b.x - J.raq.x) <= lw / 2 + b.r) {
    const k = (b.x - J.raq.x) / (lw / 2), a = -Math.PI / 2 + k * 1.05;
    b.vx = Math.cos(a) * b.vit; b.vy = Math.sin(a) * b.vit; b.y = ry - b.r; son('choisir');
  }
  if (b.y > H + 20) { b.perdue = true; return; }
  // les monstres
  for (const m of J.M) {
    if (m.mort) continue;
    const cx = Math.max(m.x, Math.min(b.x, m.x + m.w)), cy = Math.max(m.y, Math.min(b.y, m.y + m.h));
    const dx = b.x - cx, dy = b.y - cy;
    if (dx * dx + dy * dy > b.r * b.r) continue;
    touche(m, b);
    if (!J.effets.feu || m.boss) { // rebond, sauf balles de feu qui traversent
      const ox = Math.min(Math.abs(b.x - m.x), Math.abs(b.x - m.x - m.w)), oy = Math.min(Math.abs(b.y - m.y), Math.abs(b.y - m.y - m.h));
      if (ox < oy) { b.vx = -b.vx; b.x += Math.sign(b.vx) * 2; } else { b.vy = -b.vy; b.y += Math.sign(b.vy) * 2; }
    } else m.feu = .2;
    break;
  }
  J.M = J.M.filter(m => !m.mort);
}
function touche(m, b) {
  if (m.feu > 0) return;
  const dmg = b.v + P.force;
  blesse(m, dmg);
  if (J.effets.foudre) J.M.forEach(o => { if (o !== m && !o.mort && Math.abs(o.y - m.y) < 4 && Math.abs(o.x - m.x) < BW + GAP + 2) blesse(o, Math.ceil(dmg / 2), true); });
}
function blesse(m, dmg, foudre) {
  m.pv -= dmg; m.flash = .12; P.score += dmg;
  texte(m.x + m.w / 2, m.y + m.h / 2, `−${dmg}`, foudre ? '#ffe14a' : '#fff');
  if (m.pv <= 0 && !m.mort) {
    m.mort = true; P.tues++; J.tuesVague++; P.score += m.elite ? 30 : m.boss ? 500 : 10; son('tombe', true);
    if (P.tues % 5 === 0 && typeof guildeEvt === 'function') guildeEvt('salle', 1, { heros:P.heros });
    const chance = (m.elite ? .9 : .16) * P.chance;
    if (Math.random() < chance) { const k = pick(Object.keys(BONUS)); J.capsules.push({ x:m.x + m.w / 2, y:m.y + m.h / 2, k }); }
  } else son('coup');
}
function prendBonus(c) {
  const B = BONUS[c.k]; son('soin', true); texte(c.x, H - 70, `${B.e} ${B.n}`, B.c);
  if (P.heros === 'pip') P.pv = Math.min(P.pvmax, P.pv + 1);
  if (c.k === 'multi') { const nv = []; J.balles.slice(0, 12).forEach(b => [-.35, .35].forEach(d => { const a = Math.atan2(b.vy, b.vx) + d; nv.push({ ...b, vx:Math.cos(a) * b.vit, vy:Math.sin(a) * b.vit }); })); J.balles.push(...nv); }
  else if (c.k === 'soin') P.pv = Math.min(P.pvmax, P.pv + 3);
  else if (c.k === 'or') { const vit = P.heros === 'zephine' ? 330 : 290; if (J.etat === 'jeu') J.balles.push({ x:J.raq.x, y:H - 40, vx:0, vy:-vit, r:8, v:6, vit }); }
  else J.effets[c.k] = c.k === 'large' ? 10 : 8;
}
function texte(x, y, t, c) { J.textes.push({ x, y, t, c, v:.9 }); }

// ------------------------------------------------------------------ le dessin
function rrect(x, y, w, h, r) { ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }
const COUL_DE = ['', '#9fb4d8', '#7cd4ff', '#7dffb0', '#ffe14a', '#ff9f2a', '#ff5a5a'];
function dessine() {
  if (!J || !ctx) return;
  ctx.setTransform(ech, 0, 0, ech, 0, 0);
  const tr = J.tremble > 0 ? (Math.random() - .5) * 6 : 0; ctx.translate(tr, 0);
  const g = ctx.createLinearGradient(0, 0, 0, H); g.addColorStop(0, '#0d1220'); g.addColorStop(.7, '#18202e'); g.addColorStop(1, '#2a2016'); ctx.fillStyle = g; ctx.fillRect(-10, 0, W + 20, H);
  // le rempart
  ctx.fillStyle = '#4a3c2c'; ctx.fillRect(0, H - 44, W, 3); ctx.fillStyle = '#ff6a5a33'; ctx.fillRect(0, H - 47, W, 3);
  // monstres
  for (const m of J.M) {
    ctx.save(); rrect(m.x, m.y, m.w, m.h, 7); ctx.fillStyle = m.flash > 0 ? '#fff' : m.boss ? '#5a1a0a' : m.elite ? '#3a2f12' : '#1f2a40'; ctx.fill();
    ctx.lineWidth = m.boss ? 3 : 1.6; ctx.strokeStyle = m.boss ? '#ff7a4a' : m.elite ? '#f3c96b' : '#5a6a90'; ctx.stroke();
    const i = img(`portraits/m-${m.m}.webp`), d = m.boss ? m.h - 10 : m.h - 6;
    if (i.complete && i.naturalWidth) { ctx.save(); ctx.beginPath(); ctx.arc(m.x + 4 + d / 2, m.y + m.h / 2, d / 2, 0, 7); ctx.clip(); ctx.drawImage(i, m.x + 4, m.y + m.h / 2 - d / 2, d, d); ctx.restore(); }
    ctx.fillStyle = '#fff'; ctx.font = `bold ${m.boss ? 18 : 13}px Georgia`; ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
    ctx.fillText(m.pv, m.x + m.w - 5, m.y + m.h / 2 - (m.boss ? 8 : 0));
    if (m.boss) { ctx.font = '11px Georgia'; ctx.fillText(m.nom, m.x + m.w - 5, m.y + m.h / 2 + 12); }
    const k = m.pv / m.pvmax; ctx.fillStyle = '#000a'; ctx.fillRect(m.x + 3, m.y + m.h - 4, m.w - 6, 2.5); ctx.fillStyle = k > .5 ? '#7dffb0' : k > .25 ? '#ffe14a' : '#ff5a5a'; ctx.fillRect(m.x + 3, m.y + m.h - 4, (m.w - 6) * k, 2.5);
    ctx.restore();
  }
  // boules de feu du boss
  for (const f of J.feux) { ctx.beginPath(); ctx.arc(f.x, f.y, 7, 0, 7); ctx.fillStyle = '#ff7a2a'; ctx.shadowColor = '#ff5a1a'; ctx.shadowBlur = 14; ctx.fill(); ctx.shadowBlur = 0; }
  // capsules
  for (const c of J.capsules) { const B = BONUS[c.k]; ctx.save(); rrect(c.x - 15, c.y - 10, 30, 20, 9); ctx.fillStyle = B.c; ctx.shadowColor = B.c; ctx.shadowBlur = 12; ctx.fill(); ctx.shadowBlur = 0; ctx.font = '13px serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillStyle = '#000'; ctx.fillText(B.e, c.x, c.y + 1); ctx.restore(); }
  // la raquette (le bouclier runique du héros)
  const lw = J.raq.w + (J.effets.large ? 40 : 0), coul = HER[P.heros].c;
  ctx.save(); rrect(J.raq.x - lw / 2, H - 30, lw, 12, 6); const gr = ctx.createLinearGradient(0, H - 30, 0, H - 18); gr.addColorStop(0, '#fff'); gr.addColorStop(1, coul); ctx.fillStyle = gr; ctx.shadowColor = coul; ctx.shadowBlur = 16; ctx.fill(); ctx.restore();
  // la visée (Oria) et les balles posées sur la raquette
  if (J.etat === 'pret') {
    J.desLances.forEach((v, i) => balle(J.raq.x + (i - (J.desLances.length - 1) / 2) * 16, H - 40, 7, v));
    if (P.heros === 'oria' && J.vise != null) { ctx.save(); ctx.setLineDash([4, 6]); ctx.strokeStyle = '#5ff5e6'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(J.raq.x, H - 40); ctx.lineTo(J.raq.x + Math.cos(J.vise) * 260, H - 40 + Math.sin(J.vise) * 260); ctx.stroke(); ctx.restore(); }
    ctx.fillStyle = '#ffffffcc'; ctx.font = '15px Georgia'; ctx.textAlign = 'center'; ctx.fillText(P.heros === 'oria' ? 'Touche l’endroit où tirer' : 'Touche l’écran pour tirer', W / 2, H - 100);
  }
  for (const b of J.balles) balle(b.x, b.y, b.r, b.v);
  // textes
  ctx.textAlign = 'center'; ctx.font = 'bold 14px Georgia';
  for (const t of J.textes) { ctx.globalAlpha = Math.min(1, t.v * 2); ctx.fillStyle = '#000'; ctx.fillText(t.t, t.x + 1, t.y + 1); ctx.fillStyle = t.c; ctx.fillText(t.t, t.x, t.y); }
  ctx.globalAlpha = 1;
}
function balle(x, y, r, v) {
  const c = J.effets.feu ? '#ff6a2a' : COUL_DE[v] || '#fff';
  ctx.beginPath(); ctx.arc(x, y, r, 0, 7); const g = ctx.createRadialGradient(x - 2, y - 2, 1, x, y, r); g.addColorStop(0, '#fff'); g.addColorStop(1, c);
  ctx.fillStyle = g; ctx.shadowColor = c; ctx.shadowBlur = 12; ctx.fill(); ctx.shadowBlur = 0;
  ctx.fillStyle = '#000'; ctx.font = 'bold 9px Georgia'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(v + P.force, x, y + .5);
}
function tour(t) {
  const dt = Math.min(.05, (t - (dernierT || t)) / 1000); dernierT = t;
  pas(dt); dessine(); hud();
  boucle = requestAnimationFrame(tour);
}

// ------------------------------------------------------------------ l'écran autour du jeu
function ecranJeu() {
  $('app').innerHTML = `
    <div class="hud"><a href="#" onclick="pause();return false">⏸</a><div class="mid"><span>Vague <b id="hV"></b>/${VAGUES}</span><span>❤ <b id="hPV"></b></span><span>⭐ <b id="hS"></b></span></div><button onclick="regles(true)">❓</button></div>
    <div class="vie"><i id="hBar"></i></div>
    <div class="zone" id="zone"><canvas id="cv"></canvas></div>
    <div class="bas" id="bas"></div>`;
  cv = $('cv'); ctx = cv.getContext('2d'); taille(); window.onresize = taille;
  const pos = e => { const r = cv.getBoundingClientRect(); return [(e.clientX - r.left) * W / r.width, (e.clientY - r.top) * H / r.height]; };
  cv.onpointerdown = e => { cv.setPointerCapture(e.pointerId); const [x, y] = pos(e);
    if (J.etat === 'lancer') { lancer(); return; }
    if (J.etat === 'pret') { if (P.heros === 'oria') { J.vise = Math.atan2(Math.min(y, H - 60) - (H - 40), x - J.raq.x); J.oriaTouche = true; } else tirer(); return; }
    J.raq.x = Math.max(20, Math.min(W - 20, x)); };
  cv.onpointermove = e => { const [x, y] = pos(e); if (J.etat === 'pret' && P.heros === 'oria' && J.oriaTouche) { J.vise = Math.atan2(Math.min(y, H - 60) - (H - 40), x - J.raq.x); return; } if (J.etat !== 'pret') J.raq.x = Math.max(20, Math.min(W - 20, x)); };
  cv.onpointerup = () => { if (J.etat === 'pret' && P.heros === 'oria' && J.oriaTouche) { J.oriaTouche = false; tirer(Math.min(-.25, Math.max(-Math.PI + .25, J.vise))); } };
  dessineBas(); cancelAnimationFrame(boucle); dernierT = 0; boucle = requestAnimationFrame(tour);
}
function taille() { const z = $('zone'); if (!z) return; const r = z.getBoundingClientRect(); const k = Math.min(r.width / W, r.height / H); cv.style.width = W * k + 'px'; cv.style.height = H * k + 'px'; cv.style.left = (r.width - W * k) / 2 + 'px'; ech = k * (window.devicePixelRatio || 1); cv.width = W * ech; cv.height = H * ech; }
function hud() {
  if (!$('hPV')) return;
  $('hV').textContent = P.vague; $('hPV').textContent = Math.max(0, P.pv); $('hS').textContent = P.score; $('hBar').style.width = Math.max(0, 100 * P.pv / P.pvmax) + '%';
  const e = Object.keys(J.effets).map(k => `<span>${BONUS[k].e} ${Math.ceil(J.effets[k])}</span>`).join('');
  const b = $('bonusZone'); if (b && b.dataset.e !== e) { b.innerHTML = e; b.dataset.e = e; }
}
function dessineBas(roule) {
  const b = $('bas'); if (!b || !J) return;
  if (J.etat === 'lancer') b.innerHTML = `<div class="msg">🎲 <b>Touche la Fosse</b> pour lancer tes ${P.des} dés : chaque dé devient une balle, sa valeur = ses dégâts.</div>`;
  else if (J.etat === 'pret') b.innerHTML = J.desLances.map(v => `<img class="${roule ? 'roule' : ''}" src="faces-${P.heros}/face-${Math.min(6, v)}.webp" alt="${v}">`).join('');
  else b.innerHTML = `<div class="bonus" id="bonusZone"></div><div class="msg" style="font-size:2.8cqw">Glisse le doigt pour bouger ton bouclier · 💀 ${P.tues}</div>`;
}
function pause() { if (!J || J.etat === 'fin') return; const avant = J.etat; J.etat = 'pause'; fenetre(`<h2>⏸ Pause</h2><button class="go" onclick="fenetre('');J.etat='${avant === 'pause' ? 'jeu' : avant}'">Reprendre</button><button class="sec" onclick="quitte()">Quitter (la partie est gardée au début de la vague ${P.vague})</button>`, false); }
function quitte() { fenetre(''); cancelAnimationFrame(boucle); J = null; sauve(); accueil(); }

// ------------------------------------------------------------------ entre deux vagues
function finVague() {
  J.etat = 'choix'; son('victoire', true);
  if (P.vague >= VAGUES) return finPartie(true);
  if (typeof guildeEvt === 'function') guildeEvt('defense_vague', 1, { heros:P.heros });
  rs = P.rs; const cles = Object.keys(AMELIOS).filter(k => !(k === 'min' && P.min >= 3)); const offres = [];
  while (offres.length < 3) { const k = cles.splice(Math.floor(hasard() * cles.length), 1)[0]; offres.push(k); }
  P.rs = rs; P.offres = offres; P.vague++; sauve();
  choix();
}
function choix() {
  fenetre(`<h2>🏆 Vague ${P.vague - 1} repoussée !</h2><p style="text-align:center;color:var(--doux)">Choisis un renfort pour la vague ${P.vague}${P.vague === VAGUES ? ' : <b style="color:#ff7a4a">le boss sort de la Fosse</b>' : ''}.</p>
    ${P.offres.map(k => `<button class="offre" onclick="prend('${k}')"><b>${AMELIOS[k].n}</b><small>${AMELIOS[k].d}</small></button>`).join('')}`, false);
}
function prend(k) {
  if (k === 'de') P.des++; else if (k === 'force') P.force++; else if (k === 'raquette') P.large++; else if (k === 'chance') P.chance *= 2; else if (k === 'min') P.min = 3; else if (k === 'soin') { P.pvmax += 4; P.pv = Math.min(P.pvmax, P.pv + 8); }
  P.amelios.push(k); delete P.offres; sauve(); fenetre(''); son('magie', true);
  vague(); dessineBas();
}

// ------------------------------------------------------------------ fin d'une partie
function finPartie(gagne) {
  if (!J || J.etat === 'fin') return; J.etat = 'fin'; P.fin = gagne ? 'gagne' : 'perdu';
  const et = gagne ? 1 + (P.pv >= 8 ? 1 : 0) + (P.pv >= 15 ? 1 : 0) : 0;
  const D = lire(); D.parties++; if (gagne) D.victoires++; D.meilleur = Math.max(D.meilleur, P.score);
  if (duJour) { const j = D.jours[jour()]; if (!j || P.score > j.score) D.jours[jour()] = { score:P.score, etoiles:et, heros:P.heros }; }
  ecrire(D); try { localStorage.removeItem(CLE_PARTIE); } catch (e) {}
  let objet = null;
  if (gagne) { son('victoire', true); if (typeof guildeEvt === 'function') guildeEvt('boss', 1, { heros:P.heros }); try { GM.jingle('victoire'); } catch (e) {} objet = butinArmurerie(et, P.score); }
  else { try { GM.jingle('defaite'); } catch (e) {} if (typeof gagneXP === 'function') gagneXP(10, 'Fosse défendue'); }
  fenetre(`<h2>${gagne ? '🏆 La Fosse est refermée !' : '☠ Le rempart est tombé…'}</h2>
    <p style="text-align:center;font-size:2em;margin:6px 0">${gagne ? '★'.repeat(et) + '☆'.repeat(3 - et) : ''}</p>
    <p style="text-align:center">Score : <b style="color:var(--or)">${P.score}</b> · ${P.tues} monstres · vague ${Math.min(P.vague, VAGUES)}/${VAGUES}${gagne ? ` · ❤ ${P.pv}` : ''}</p>
    ${gagne ? `<p style="text-align:center">✨ +5 éclats de ${HER[P.heros].n}${objet ? ` · 🎒 <b>${objet}</b> rejoint ton armurerie` : ''}</p><p style="color:var(--doux);font-size:.9em;text-align:center">★★ : finir avec 8 PV · ★★★ : 15 PV.</p>` : '<p style="color:var(--doux);text-align:center">Astuce : attrape les bonus qui tombent, et ne laisse pas les monstres approcher du rempart.</p>'}
    <p style="text-align:center;color:var(--doux);font-size:.9em">Meilleur score : ${D.meilleur} · ${D.victoires} victoire${D.victoires > 1 ? 's' : ''} sur ${D.parties}</p>
    <button class="go" onclick="fenetre('');cancelAnimationFrame(boucle);J=null;P=null;accueil()">Retour au bord de la Fosse</button>`, false);
}

// ------------------------------------------------------------------ fenêtres, règles, accueil
function fenetre(h, ferme = true) { $('fen').innerHTML = h ? `<div class="voile-f" ${ferme ? `onclick="if(event.target===this)fenetre('')"` : ''}><div class="fen">${h}</div></div>` : ''; }
function regles(enJeu) {
  let avant = null; if (enJeu && J && J.etat !== 'fin') { avant = J.etat; J.etat = 'pause'; }
  fenetre(`<h2>🕳️ La Fosse aux Runes</h2>
    <div class="moust"><img src="ui/moustache.webp" alt=""><p>« Un bouclier, des dés qui rebondissent, des monstres qui tombent. Et des bonus partout. Miaou ! »</p></div>
    <ol>
      <li><b>Touche la Fosse</b> : tu lances tes dés. Chaque dé devient une <b>balle</b>, et sa <b>valeur = ses dégâts</b>.</li>
      <li><b>Touche encore</b> pour tirer. Puis <b>glisse le doigt</b> pour bouger ton bouclier et renvoyer les balles. L’endroit où la balle touche le bouclier choisit son angle.</li>
      <li>Les monstres <b>descendent</b> doucement. S’ils touchent le <b>rempart</b>, tu perds des PV.</li>
      <li>Les monstres tombés lâchent parfois un <b>bonus</b> : attrape-le avec ton bouclier ! ${Object.values(BONUS).map(b => `${b.e} ${b.n} (${b.d})`).join(' · ')}.</li>
      <li>Si toutes tes balles tombent, tu perds <b>1 PV</b> et tu relances tes dés.</li>
      <li>${VAGUES} vagues ; entre deux vagues, un <b>renfort</b> au choix. À la dernière, le <b>boss</b> crache du feu : évite ses boules avec ton bouclier.</li>
    </ol>
    <p style="color:var(--doux)">Talent de ${HER[P ? P.heros : choixH].n} : <b>${HER[P ? P.heros : choixH].t}</b> · ${HER[P ? P.heros : choixH].d}</p>
    <button class="go" onclick="fenetre('');${avant ? `J.etat='${avant}'` : ''}">C’est parti !</button>`, false);
}
function accueil() {
  const D = lire(), j = D.jours[jour()], g = partieGardee();
  if (choixH === 'zephine' && !ZEPH_OK()) choixH = 'maelle';
  window.onresize = null;
  $('app').innerHTML = `<div class="acc">
    <div class="top"><a href="menu.html">‹ Menu</a><button onclick="regles()">❓ Règles</button></div>
    <h1>🕳️ La Fosse aux Runes</h1>
    <p class="sous">Un casse-briques de dés : lance, fais rebondir, attrape les bonus, repousse les monstres jusqu’au boss.</p>
    <div class="heros">${Object.entries(HER).map(([k, h]) => `<button class="${choixH === k ? 'on' : ''}" ${k === 'zephine' && !ZEPH_OK() ? 'disabled' : ''} onclick="choixH='${k}';accueil()"><img src="portraits/${k}.webp" alt="">${h.n}${k === 'zephine' && !ZEPH_OK() ? '<br>🔒 tutoriel' : ''}</button>`).join('')}</div>
    <div class="pv-h">✦ <b>${HER[choixH].t}</b> : ${HER[choixH].d}<br>❤ ${PV0} PV de rempart · ${VAGUES} vagues.<br>✨ ${texteBonus(choixH)}</div>
    <div class="choix">
      ${g ? `<button onclick="reprend()" style="border-color:var(--ok);color:var(--ok);background:#14322a">▶ Reprendre ta Fosse<small>${HER[g.heros].n} · vague ${g.vague}/${VAGUES} · ❤ ${g.pv}</small></button>` : ''}
      <button onclick="commence(true)">📅 La Fosse du jour<small>Les mêmes vagues pour tout le monde aujourd’hui. ${j ? `Ton record du jour : ${j.score} ${'★'.repeat(j.etoiles)}` : 'Pas encore tentée.'}</small></button>
      <button class="b2" onclick="commence(false)">🎲 Une Fosse au hasard<small>De nouvelles vagues à chaque fois.</small></button>
    </div>
    <p class="record">Meilleur score : ${D.meilleur} · ${D.victoires} victoire${D.victoires > 1 ? 's' : ''} sur ${D.parties} · <a href="fosse-v1.html" style="color:var(--doux)">la version tour par tour</a></p>
  </div>`;
}
function commence(jourOk) {
  const D = lire(); D.heros = choixH; ecrire(D);
  nouvellePartie(choixH, jourOk); sauve(); vague(); ecranJeu(); son('portail', true);
  if (!localStorage.getItem('guilde-fosse2-guide')) { localStorage.setItem('guilde-fosse2-guide', '1'); regles(true); }
}
function reprend() { const g = partieGardee(); if (!g) return; P = g; duJour = !!g.duJour; if (P.offres) { vague(); ecranJeu(); J.etat = 'choix'; choix(); } else { vague(); ecranJeu(); } }
if (typeof GM !== 'undefined') { try { GM.musique('combat2'); GM.bouton(); } catch (e) {} }
document.addEventListener('visibilitychange', () => { if (document.hidden && J && (J.etat === 'jeu' || J.etat === 'pret')) pause(); });
accueil();
</script>
</body>
