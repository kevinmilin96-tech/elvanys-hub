<title>La Guilde des Runes · La Fosse aux Runes</title>
<style>
  :root { --or:#f3c96b; --texte:#f1ecff; --doux:#c9c1ea; --ok:#7dffb0; --rouge:#ff6a5a; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { margin:0; height:100%; }
  body { color:var(--texte); font:15px/1.4 Georgia, 'Times New Roman', serif; background:radial-gradient(ellipse at 50% 0%, #1d2a3a, #0a0d14 70%) fixed, #0a0d14; overflow-x:hidden; user-select:none; }
  #jeu { position:relative; max-width:520px; margin:0 auto; container-type:inline-size; padding:0 2cqw 4cqw; }
  button { font:inherit; color:inherit; cursor:pointer; }
  .haut { display:flex; align-items:center; gap:2cqw; padding:2cqw 0; font-size:3.6cqw; }
  .haut a, .haut button { color:var(--doux); text-decoration:none; background:#1c2436; border:1px solid #3f5070; border-radius:20px; padding:1.2cqw 3cqw; }
  .haut .titre { flex:1; text-align:center; color:var(--or); font-weight:bold; }
  .stats { display:flex; justify-content:space-between; font-size:3.4cqw; color:var(--doux); padding:0 1cqw 1.5cqw; }
  .stats b { color:var(--texte); }
  /* ---------------------------------------------------------------- la grille */
  .prochaine { display:grid; grid-template-columns:repeat(5, 1fr); gap:1cqw; padding:0 2cqw; margin-bottom:1cqw; opacity:.55; }
  .prochaine div { height:6cqw; border-radius:1.5cqw; border:1px dashed #3f5070; display:flex; align-items:center; justify-content:center; font-size:2.6cqw; }
  .prochaine img { width:5cqw; height:5cqw; border-radius:50%; object-fit:cover; }
  .fosse { position:relative; display:grid; grid-template-columns:repeat(5, 1fr); grid-template-rows:repeat(7, 11.6cqw); gap:1cqw; padding:2cqw;
    border-radius:4cqw 4cqw 0 0; background:linear-gradient(180deg, #0d1220 0%, #1a2232 60%, #2a2016 100%); border:1px solid #33405c; box-shadow:inset 0 0 8cqw #000c; }
  .case { position:relative; border-radius:2cqw; display:flex; align-items:center; justify-content:center; }
  .case.col-sel { background:#7dffb014; }
  .case.col-bonus { background:#f3c96b1f; }
  .mon { position:relative; width:10.6cqw; height:10.6cqw; }
  .mon img { width:100%; height:100%; border-radius:50%; object-fit:cover; border:2px solid #8a98b8; box-shadow:0 0 2cqw #000; }
  .mon.elite img { border-color:var(--or); box-shadow:0 0 3cqw #f3c96b88; }
  .mon .pv { position:absolute; bottom:-1.2cqw; left:50%; transform:translateX(-50%); background:#2a0e0e; border:1px solid var(--rouge); border-radius:2cqw; padding:0 1.2cqw; font-size:2.9cqw; font-weight:bold; }
  .mon .att { position:absolute; top:-1cqw; right:-1.4cqw; background:#000c; border-radius:2cqw; padding:0 .8cqw; font-size:2.3cqw; color:#ffb0a8; }
  .mon .etat { position:absolute; top:-1cqw; left:-1.2cqw; font-size:3cqw; }
  .mon.gele img { filter:hue-rotate(160deg) saturate(.6) brightness(1.2); }
  .boss { position:absolute; left:2cqw; right:2cqw; height:11.6cqw; display:flex; align-items:center; gap:2cqw; padding:0 2cqw; border-radius:3cqw;
    background:linear-gradient(90deg, #4a120a, #8a2a12, #4a120a); border:2px solid #ff7a4a; box-shadow:0 0 5cqw #ff5a2a88; transition:top .5s; z-index:2; }
  .boss img { width:10cqw; height:10cqw; border-radius:50%; object-fit:cover; border:2px solid var(--or); }
  .boss .barre { flex:1; height:3.4cqw; border-radius:2cqw; background:#2a0e0e; overflow:hidden; border:1px solid #000; }
  .boss .barre i { display:block; height:100%; background:linear-gradient(90deg, #ff3a1a, #ffb03a); }
  .boss b { font-size:3.2cqw; white-space:nowrap; }
  .rempart { display:grid; grid-template-columns:repeat(5, 1fr); gap:1cqw; padding:1.4cqw 2cqw; border-radius:0 0 4cqw 4cqw;
    background:repeating-linear-gradient(90deg, #5a4a36 0 9cqw, #4a3c2c 9cqw 9.6cqw), #5a4a36; border:1px solid #33405c; border-top:3px solid #8a7458; }
  .tir { border:0; border-radius:2cqw; background:#00000055; color:#e8dcc4; font-size:3.4cqw; padding:1.2cqw 0; }
  .tir.on { background:var(--ok); color:#0a2a18; font-weight:bold; animation:pulse 1s infinite; }
  .tir.bonus { background:var(--or); color:#2b1d0a; }
  @keyframes pulse { 50% { filter:brightness(1.25); } }
  /* ---------------------------------------------------------------- dés, sac */
  .sac { display:flex; gap:1.6cqw; justify-content:center; margin:2cqw 0 0; flex-wrap:wrap; min-height:6cqw; }
  .sac button { border:1.5px solid var(--c); background:#141a28; border-radius:3cqw; padding:.6cqw 2cqw; font-size:2.8cqw; }
  .plateau { display:flex; justify-content:center; gap:2.2cqw; margin:2.5cqw 0 1cqw; min-height:15cqw; flex-wrap:wrap; }
  .de { position:relative; width:13.5cqw; height:13.5cqw; border:0; padding:0; background:none; transition:transform .15s; border-radius:2.6cqw; }
  .de img { width:100%; height:100%; object-fit:contain; filter:drop-shadow(0 1cqw 1cqw #000a); }
  .de.special { box-shadow:0 0 0 .7cqw var(--c), 0 0 3cqw var(--c); }
  .de .e { position:absolute; top:-1.6cqw; right:-1.6cqw; font-size:3.6cqw; }
  .de.sel { transform:translateY(-3cqw) scale(1.08); } .de.sel img { filter:drop-shadow(0 0 2.4cqw var(--ok)) drop-shadow(0 1cqw 1cqw #000); }
  .de.roule { animation:roule .45s; }
  @keyframes roule { 0% { transform:rotate(0) scale(.7); } 50% { transform:rotate(200deg) scale(1.15); } 100% { transform:rotate(360deg) scale(1); } }
  .consigne { text-align:center; font-size:3.2cqw; color:var(--doux); min-height:8cqw; margin:1cqw 0; }
  .consigne b { color:var(--ok); }
  .actions { display:flex; gap:2.5cqw; }
  .actions button { flex:1; border-radius:3cqw; padding:2.6cqw; font-size:3.8cqw; font-weight:bold; border:2px solid #3f5070; background:#1c2436; }
  .actions .fin { background:var(--or); color:#2b1d0a; border-color:var(--or); }
  .actions button:disabled { opacity:.35; }
  .journal { font-size:2.8cqw; color:#8a9ac4; text-align:center; min-height:4cqw; margin-top:1.5cqw; }
  /* ---------------------------------------------------------------- effets */
  .balle { position:absolute; width:5cqw; height:5cqw; margin:-2.5cqw 0 0 -2.5cqw; border-radius:50%; z-index:5; pointer-events:none;
    background:radial-gradient(circle at 35% 35%, #fff, var(--c) 55%, transparent 72%); box-shadow:0 0 4cqw var(--c), 0 0 1.5cqw #fff; transition:left .09s linear, top .09s linear; }
  .pop { position:absolute; z-index:6; pointer-events:none; font-weight:bold; font-size:4.2cqw; color:#fff; text-shadow:0 0 1.2cqw #000, 0 0 .4cqw #000; animation:pop .8s forwards; transform:translate(-50%, -50%); }
  .pop.mort { color:var(--or); } .pop.feu { color:#ff9a4a; }
  @keyframes pop { 0% { opacity:0; margin-top:1cqw; } 20% { opacity:1; } 100% { opacity:0; margin-top:-7cqw; } }
  .boum { position:absolute; z-index:6; width:34cqw; height:24cqw; transform:translate(-50%, -50%); border-radius:50%; pointer-events:none; background:radial-gradient(circle, #fff6 0, #ff9f2a99 35%, transparent 70%); animation:boum .4s forwards; }
  @keyframes boum { from { transform:translate(-50%, -50%) scale(.3); } to { transform:translate(-50%, -50%) scale(1.2); opacity:0; } }
  .flash { position:fixed; inset:0; pointer-events:none; background:#ff2a1a; opacity:0; z-index:40; }
  .flash.go { animation:flash .5s; } @keyframes flash { 20% { opacity:.35; } 100% { opacity:0; } }
  .tremble { animation:tremble .35s; } @keyframes tremble { 25% { transform:translateX(-1.5cqw); } 50% { transform:translateX(1.5cqw); } 75% { transform:translateX(-1cqw); } }
  .bulle { position:fixed; left:50%; top:36%; transform:translateX(-50%); z-index:45; pointer-events:none; font-weight:bold; font-size:min(8.5vw, 44px); color:var(--or);
    text-shadow:0 0 12px #000, 0 0 3px #000; animation:bulle 1.3s forwards; white-space:nowrap; }
  @keyframes bulle { 0% { opacity:0; transform:translate(-50%, 20px) scale(.6); } 20% { opacity:1; transform:translate(-50%, 0) scale(1.1); } 80% { opacity:1; } 100% { opacity:0; transform:translate(-50%, -40px); } }
  /* ---------------------------------------------------------------- fenêtres, accueil */
  .voile-f { position:fixed; inset:0; background:#000c; z-index:50; display:flex; align-items:center; justify-content:center; padding:4vw; }
  .fen { width:min(94vw, 500px); max-height:90vh; overflow:auto; background:#161d2c; border:2px solid var(--or); border-radius:18px; padding:16px; font-size:15px; }
  .fen h2 { margin:0 0 8px; color:var(--or); text-align:center; }
  .fen .go { display:block; width:100%; font:bold 1.05em Georgia, serif; padding:12px; border-radius:14px; border:0; background:var(--or); color:#2b1d0a; margin-top:10px; }
  .fen ol { padding-left:20px; } .fen li { margin:5px 0; }
  .offre { display:block; width:100%; text-align:left; margin:8px 0; padding:10px 12px; border-radius:14px; border:2px solid var(--c, #3f5070); background:#1c2436; }
  .offre b { color:var(--or); } .offre small { display:block; color:var(--doux); font-size:.85em; margin-top:2px; }
  .moust { display:flex; gap:10px; align-items:flex-start; } .moust img { width:64px; height:64px; border-radius:50%; object-fit:cover; flex:none; border:2px solid var(--or); }
  .acc h1 { text-align:center; color:var(--or); margin:3cqw 0 1cqw; font-size:7cqw; }
  .acc .sous { text-align:center; color:var(--doux); font-size:3.6cqw; margin:0 4cqw 3cqw; }
  .heros { display:grid; grid-template-columns:repeat(3, 1fr); gap:2cqw; }
  .heros button { background:#1c2436; border:2px solid #3f5070; border-radius:3cqw; padding:2cqw 1cqw; font-size:3.2cqw; }
  .heros button.on { border-color:var(--or); background:#3a2f12; } .heros button:disabled { opacity:.35; }
  .heros img { width:16cqw; height:16cqw; border-radius:50%; object-fit:cover; display:block; margin:0 auto 1cqw; }
  .pv-h { font-size:3cqw; color:var(--doux); margin:3cqw 1cqw; background:#161d2c; border-left:3px solid var(--or); padding:2cqw 3cqw; border-radius:2cqw; }
  .choix { display:grid; gap:2cqw; margin-top:3cqw; }
  .choix button { border-radius:3.5cqw; padding:3cqw; font-size:4cqw; border:2px solid var(--or); background:#3a2f12; color:var(--or); font-weight:bold; text-align:left; }
  .choix button small { display:block; font-weight:normal; color:var(--doux); font-size:3cqw; }
  .choix button.b2 { background:#1c2436; border-color:#3f5070; color:var(--texte); }
  .record { text-align:center; font-size:3.2cqw; color:var(--doux); margin-top:3cqw; }
</style>

<div id="jeu"></div>
<div class="flash" id="flash"></div>
<div id="fen"></div>
<script src="musique.js?v=fb0b9da49e"></script>
<script src="rang.js?v=4a53584921"></script>

<script>
// =============================================================================================== LA FOSSE AUX RUNES (15/11, écran)
// Le moteur (règles, hasard, monstres, balles) est dans fosse-moteur.js ; ici seulement le dessin, l'animation et les gestes.
const HER = {
  maelle:{ n:'Maëlle', c:'#ff8a2a' }, aldric:{ n:'Sire Aldric', c:'#ffd27a' }, pip:{ n:'Pip', c:'#c58bff' },
  oria:{ n:'Oria', c:'#5ff5e6' }, gorm:{ n:'Gorm', c:'#4f8bff' }, zephine:{ n:'Zéphine', c:'#ff4040' },
};
const F = FOSSE, $ = id => document.getElementById(id);
const ZEPH_OK = () => localStorage.getItem('guilde-tuto') === 'fait';
const CLE = 'guilde-fosse', jour = () => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`; };
const lire = () => { try { return Object.assign({ parties:0, victoires:0, meilleur:0, jours:{}, heros:'maelle' }, JSON.parse(localStorage.getItem(CLE) || '{}')); } catch (e) { return { parties:0, victoires:0, meilleur:0, jours:{}, heros:'maelle' }; } };
const ecrire = d => { try { localStorage.setItem(CLE, JSON.stringify(d)); } catch (e) {} };
const son = k => { try { if (typeof GM !== 'undefined') GM.son(k); } catch (e) {} };
let S = null, sel = null, occupe = false, duJour = false, choixH = lire().heros, xpTues = 0;

// ------------------------------------------------------------------ sauvegarde de la partie en cours (15/11) : l'état du moteur est un JSON simple
const CLE_PARTIE = 'guilde-fosse-partie';
function sauve() { try { if (S && !S.fin) localStorage.setItem(CLE_PARTIE, JSON.stringify({ S, duJour, xpTues })); else localStorage.removeItem(CLE_PARTIE); } catch (e) {} }
function partieGardee() { try { const p = JSON.parse(localStorage.getItem(CLE_PARTIE) || 'null'); return p && p.S && !p.S.fin && p.S.grille ? p : null; } catch (e) { return null; } }
function reprend() { const p = partieGardee(); if (!p) return; S = p.S; duJour = p.duJour; xpTues = p.xpTues || 0; sel = null; son('portail'); dessine(); if (S.butin) butin(); }

// ------------------------------------------------------------------ dessin
function dessine() {
  if (!S) return accueil();
  const d = sel && S.des.find(x => x.id === sel);
  const cases = [];
  for (let r = 0; r < F.RANGS; r++) for (let c = 0; c < F.COL; c++) {
    const m = S.grille[r][c];
    const cl = d ? (d.v === c + 1 ? 'col-bonus' : 'col-sel') : '';
    cases.push(`<div class="case ${cl}" id="g-${r}-${c}" onclick="tire(${c})">${m ? `<div class="mon ${m.elite ? 'elite' : ''} ${m.gele ? 'gele' : ''}"><img src="portraits/m-${m.m}.webp" alt=""><span class="att">⚔${m.att}</span>${m.brule || m.gele ? `<span class="etat">${m.gele ? '❄️' : ''}${m.brule ? '🔥' : ''}</span>` : ''}<span class="pv">${m.pv}</span></div>` : ''}</div>`);
  }
  const B = S.boss;
  const boss = B ? `<div class="boss" style="top:calc(2cqw + ${B.r} * 12.6cqw)" onclick="if(sel)tire(2)"><img src="portraits/m-${B.m}.webp" alt=""><div style="flex:1"><b>${B.nom} · ${B.pv} PV</b><div class="barre"><i style="width:${100 * B.pv / B.pvmax}%"></i></div></div></div>` : '';
  const proch = S.heros === 'oria' && !S.boss ? `<div class="prochaine">${S.prochaine.map(m => `<div>${m ? `<img src="portraits/m-${m.m}.webp" alt="">${m.pv}` : ''}</div>`).join('')}</div>` : '';
  const tirs = [0, 1, 2, 3, 4].map(c => `<button class="tir ${d ? (d.v === c + 1 ? 'bonus' : 'on') : ''}" onclick="tire(${c})">${d ? `↑ ${F.forceDe(S, d, c)}` : c + 1}</button>`).join('');
  $('jeu').innerHTML = `
    <div class="haut"><a href="menu.html">‹ Menu</a><span class="titre">🕳️ La Fosse aux Runes</span><button onclick="regles()">❓</button></div>
    <div class="stats"><span>${S.boss ? '🔥 <b>Boss</b>' : `Tour <b>${S.tour}</b>/${F.TOURS_AVANT_BOSS + 1}`}</span><span>❤ <b>${S.pv}</b>${S.bouclier ? ` 🛡${S.bouclier}` : ''}</span><span>⭐ <b>${S.score}</b></span><span>💀 <b>${S.tues}</b></span><span>${duJour ? '📅' : '🎲'}</span></div>
    ${proch}
    <div class="fosse" id="fosse">${cases.join('')}${boss}</div>
    <div class="rempart">${tirs}</div>
    <div class="sac">${S.sac.map((b, k) => `<button style="--c:${F.couleurBalle(b)}" onclick="infoBalle(${k})">${F.emojiBalle(b)} ${F.nomBalle(b)}</button>`).join('') || '<small style="color:#6a7a9a;font-size:2.8cqw">Ton sac de balles est vide : le butin arrive tous les 3 tours.</small>'}</div>
    <div class="plateau">${S.des.map(x => { const b = x.b != null ? S.sac[x.b] : null; return `<button class="de ${b ? 'special' : ''} ${sel === x.id ? 'sel' : ''} ${x.neuf ? 'roule' : ''}" ${b ? `style="--c:${F.couleurBalle(b)}"` : ''} onclick="choisit('${x.id}')"><img src="faces-${S.heros}/face-${x.v}.webp" alt="${x.v}">${b ? `<span class="e">${F.emojiBalle(b)}</span>` : ''}</button>`; }).join('')}</div>
    <div class="consigne">${sel ? 'Touche une <b>colonne</b> pour tirer. En <b style="color:var(--or)">doré</b> : la colonne de son chiffre, deux fois plus fort.' : S.des.length ? 'Touche un dé : c’est ta balle. Sa valeur = sa force.' : 'Toutes tes balles sont parties : touche <b>Fin du tour</b>.'}</div>
    <div class="actions"><button onclick="relance()" ${S.relances && S.des.length ? '' : 'disabled'}>🎲 Relancer (${S.relances})</button><button class="fin" onclick="finTour()">Fin du tour ▶</button></div>
    <div class="journal">${S.journal[0] || ''}</div>`;
  S.des.forEach(x => delete x.neuf);
  sauve();
}

// ------------------------------------------------------------------ gestes
function choisit(id) { if (occupe) return; sel = sel === id ? null : id; son('choisir'); dessine(); }
function relance() { if (occupe || !F.relancer(S)) return; sel = null; son('relance'); S.des.forEach(x => x.neuf = true); dessine(); }
function centre(r, c) { const e = $(`g-${r}-${c}`), f = $('jeu').getBoundingClientRect(), b = e.getBoundingClientRect(); return [b.left - f.left + b.width / 2, b.top - f.top + b.height / 2]; }
const attends = ms => new Promise(r => setTimeout(r, ms));
async function tire(c) {
  if (occupe || !sel || !S || S.fin) return;
  const d = S.des.find(x => x.id === sel), b = d && d.b != null ? S.sac[d.b] : null;
  const avant = S.tues; occupe = true;
  const T = F.tirer(S, sel, c); sel = null;
  if (!T) { occupe = false; return; }
  son('tir');
  const J = $('jeu'), balle = document.createElement('div'); balle.className = 'balle'; balle.style.setProperty('--c', b ? F.couleurBalle(b) : '#9fd8ff');
  let [x, y] = centre(F.RANGS - 1, c); y += 16; balle.style.left = x + 'px'; balle.style.top = y + 'px'; J.appendChild(balle);
  // le trajet : on monte case par case jusqu'au monstre touché, on ricoche en haut
  let col = c, rang = F.RANGS - 1, monte = true;
  for (const e of T) {
    if (e.depart) continue;
    if (e.rebond) { [x, y] = centre(0, col); balle.style.left = x + 'px'; balle.style.top = (y - 20) + 'px'; await attends(90); col = e.c; rang = 0; monte = false; [x, y] = centre(0, col); balle.style.left = x + 'px'; balle.style.top = y + 'px'; await attends(90); continue; }
    if (e.boum) { const [bx, by] = centre(e.r, e.c); const o = document.createElement('div'); o.className = 'boum'; o.style.left = bx + 'px'; o.style.top = by + 'px'; J.appendChild(o); setTimeout(() => o.remove(), 450); son('gros'); continue; }
    if (e.c === col && !e.boss) { // on avance jusqu'à la case touchée
      while (rang !== e.r) { rang += monte ? -1 : 1; if (rang < 0 || rang >= F.RANGS) break; [x, y] = centre(rang, col); balle.style.left = x + 'px'; balle.style.top = y + 'px'; await attends(45); }
    }
    if (e.boss) { [x, y] = centre(e.r, 2); balle.style.left = x + 'px'; balle.style.top = y + 'px'; await attends(120); }
    pop(e.r, e.boss ? 2 : e.c, `−${e.dmg}`, e.mort ? 'mort' : '');
    son(e.mort ? 'tombe' : 'coup'); await attends(e.mort ? 110 : 70);
  }
  // la balle file jusqu'au bout si elle a encore de la force
  balle.style.opacity = '0'; setTimeout(() => balle.remove(), 200);
  const tues = S.tues - avant;
  if (tues >= 3) bulle(`${tues} d’un coup !`);
  compteXP(); occupe = false;
  if (S.fin) return finPartie();
  dessine();
}
function pop(r, c, t, cl) { const [x, y] = centre(r, c); const p = document.createElement('div'); p.className = 'pop ' + (cl || ''); p.textContent = t; p.style.left = x + 'px'; p.style.top = y + 'px'; $('jeu').appendChild(p); setTimeout(() => p.remove(), 850); }
function compteXP() { while (S.tues - xpTues >= 5) { xpTues += 5; if (typeof guildeEvt === 'function') guildeEvt('salle', 1, { heros:S.heros }); } }
async function finTour() {
  if (occupe || !S || S.fin || S.butin) return;
  if (S.des.length && !confirm(`Il te reste ${S.des.length} balle${S.des.length > 1 ? 's' : ''} pas tirée${S.des.length > 1 ? 's' : ''}. Finir le tour quand même ?`)) return;
  occupe = true; sel = null; const pvAvant = S.pv;
  const ev = F.finTour(S);
  for (const e of ev) { if (e.dmg && $(`g-${e.r}-${e.c}`)) pop(e.r, e.c, `−${e.dmg}`, e.feu ? 'feu' : e.mort ? 'mort' : ''); if (e.boss) { son('vague'); bulle(`🔥 ${S.boss ? S.boss.nom : 'Le boss'} !`); } }
  if (ev.some(e => e.feu || e.ronce)) await attends(350);
  const perdu = pvAvant - S.pv;
  if (perdu > 0) { son('coup'); $('flash').classList.remove('go'); void $('flash').offsetWidth; $('flash').classList.add('go'); $('jeu').classList.remove('tremble'); void $('jeu').offsetWidth; $('jeu').classList.add('tremble'); bulle(`−${perdu} PV`, true); }
  else if (ev.some(e => e.bloque)) bulle('🛡 Repoussé !');
  compteXP(); occupe = false;
  if (S.fin) return setTimeout(finPartie, 600);
  S.des.forEach(x => x.neuf = true); son('relance');
  dessine();
  if (S.butin) butin();
}

// ------------------------------------------------------------------ butin, infos, règles
function fenetre(h, ferme = true) { $('fen').innerHTML = h ? `<div class="voile-f" ${ferme ? `onclick="if(event.target===this)fenetre('')"` : ''}><div class="fen">${h}</div></div>` : ''; }
function butin() {
  son('ouvrir');
  const ligne = (o, k) => {
    const BA = F.BALLES;
    if (o.t === 'balle') return `<button class="offre" style="--c:${BA[o.cle].c}" onclick="prend(${k})"><b>${BA[o.cle].e} ${BA[o.cle].n}</b> · nouvelle balle (un dé de plus)<small>${BA[o.cle].d(1)}</small></button>`;
    if (o.t === 'niveau') { const b = S.sac.find(x => x.cle === o.cle); return `<button class="offre" style="--c:${BA[o.cle].c}" onclick="prend(${k})"><b>${BA[o.cle].e} ${BA[o.cle].n} → niveau ${b.niv + 1}</b><small>${BA[o.cle].d(b.niv + 1)}${b.niv + 1 === 3 ? ' · Au niveau 3, elle peut FUSIONNER avec une autre balle de niveau 3.' : ''}</small></button>`; }
    if (o.t === 'fusion') { const A = S.sac[o.a], B = S.sac[o.b]; return `<button class="offre" style="--c:#e6a8ff" onclick="prend(${k})"><b>✨ FUSION : ${F.nomBalle(A)} + ${F.nomBalle(B)}</b><small>Une seule balle qui garde les deux pouvoirs, et une place libre dans ton sac.</small></button>`; }
    return `<button class="offre" onclick="prend(${k})"><b>❤ Soigner le rempart</b><small>+8 PV.</small></button>`;
  };
  fenetre(`<h2>🎁 Le butin</h2><p style="text-align:center;color:var(--doux)">Choisis une récompense. Chaque balle de ton sac te donne un dé de plus à chaque tour (sac de ${F.SAC} places).</p>${S.butin.map(ligne).join('')}`, false);
}
function prend(k) { F.choisirButin(S, k); son('magie'); fenetre(''); S.des.forEach(x => x.neuf = true); dessine(); }
function infoBalle(k) { const b = S.sac[k]; fenetre(`<h2>${F.emojiBalle(b)} ${F.nomBalle(b)}</h2><p>${F.texteBalle(b)}</p><p style="color:var(--doux);font-size:.9em">Elle te donne un dé de sa couleur à chaque tour.</p><button class="go" onclick="fenetre('')">Compris</button>`); }
function regles() {
  fenetre(`<h2>🕳️ La Fosse aux Runes</h2>
    <div class="moust"><img src="ui/moustache.webp" alt=""><p>« Ils descendent, on tire. Vise bien, et fais ricocher. Moi je surveille d’en haut, hein. Miaou. »</p></div>
    <ol>
      <li><b>Chaque dé est une balle</b> : touche un dé, puis une <b>colonne</b>. Sa <b>valeur est sa force</b>.</li>
      <li>La balle monte et frappe le premier monstre. Si elle le <b>tue</b>, elle continue avec la force qui reste. En haut, elle <b>ricoche</b> dans la colonne voisine et redescend.</li>
      <li><b>Bonus</b> : un dé tiré dans la colonne de <b>son chiffre</b> (1 à 5, en doré) frappe <b>deux fois plus fort</b>. Un <b>6</b> frappe fort partout (9).</li>
      <li><b>Fin du tour</b> : les monstres descendent d’un rang. Ceux qui touchent le <b>rempart</b> te frappent (⚔) et disparaissent. Une nouvelle rangée arrive.</li>
      <li><b>Le butin</b>, tous les 3 tours : une balle spéciale (feu, foudre, glace, perçante, bombe, lumière), un niveau de plus, ou un soin. Chaque balle du sac = un dé de plus. Deux balles au <b>niveau 3</b> peuvent <b>fusionner</b>.</li>
      <li>Au tour ${F.TOURS_AVANT_BOSS + 2}, le <b>boss</b> sort de la Fosse : il descend un rang tous les 2 tours. Abats-le avant qu’il touche le rempart.</li>
    </ol>
    <p style="color:var(--doux)">Ton talent : <b>${F.TALENTS[S ? S.heros : choixH].n}</b> · ${F.TALENTS[S ? S.heros : choixH].d}</p>
    <button class="go" onclick="fenetre('')">Feu à volonté !</button>`);
}
function bulle(t, rouge) { const b = document.createElement('div'); b.className = 'bulle'; b.textContent = t; if (rouge) b.style.color = '#ff8a7a'; document.body.appendChild(b); setTimeout(() => b.remove(), 1400); }

// ------------------------------------------------------------------ fin et accueil
function finPartie() {
  const D = lire(), gagne = S.fin === 'gagne', et = F.etoiles(S);
  D.parties++; if (gagne) D.victoires++; D.meilleur = Math.max(D.meilleur, S.score);
  if (duJour) { const j = D.jours[jour()]; if (!j || S.score > j.score) D.jours[jour()] = { score:S.score, etoiles:et, heros:S.heros }; }
  ecrire(D);
  let objet = null;
  if (gagne) { son('victoire'); if (typeof guildeEvt === 'function') guildeEvt('boss', 1, { heros:S.heros }); try { GM.jingle('victoire'); } catch (e) {} objet = butinArmurerie(et, S.score + S.tour); }
  else { try { GM.jingle('defaite'); } catch (e) {} if (typeof gagneXP === 'function') gagneXP(10, 'Fosse défendue'); }
  try { localStorage.removeItem(CLE_PARTIE); } catch (e) {}
  dessine();
  fenetre(`<h2>${gagne ? '🏆 La Fosse est refermée !' : '☠ Le rempart est tombé…'}</h2>
    <p style="text-align:center;font-size:2em;margin:6px 0">${gagne ? '★'.repeat(et) + '☆'.repeat(3 - et) : ''}</p>
    <p style="text-align:center">Score : <b style="color:var(--or)">${S.score}</b> · ${S.tues} monstres · ${S.tour} tours${gagne ? ` · ❤ ${S.pv}` : ''}</p>
    ${gagne ? '<p style="color:var(--doux);font-size:.9em;text-align:center">★★ : finir avec 10 PV ou plus · ★★★ : 20 PV ou plus.</p>' : '<p style="color:var(--doux);text-align:center">Astuce : vise la colonne de ton chiffre (dorée), et nettoie d’abord les monstres proches du rempart.</p>'}
    ${gagne ? `<p style="text-align:center">✨ +5 éclats de ${HER[S.heros].n}${objet ? ` · 🎒 <b>${objet}</b> rejoint ton armurerie` : ''}</p>` : ''}
    <p style="text-align:center;color:var(--doux);font-size:.9em">Meilleur score : ${D.meilleur} · ${D.victoires} victoire${D.victoires > 1 ? 's' : ''} sur ${D.parties}</p>
    <button class="go" onclick="fenetre('');S=null;accueil()">Retour au bord de la Fosse</button>`, false);
}
function accueil() {
  const D = lire(), j = D.jours[jour()];
  if (choixH === 'zephine' && !ZEPH_OK()) choixH = 'maelle';
  $('jeu').innerHTML = `<div class="acc">
    <div class="haut"><a href="menu.html">‹ Menu</a><span class="titre"></span><button onclick="regles()">❓ Règles</button></div>
    <h1>🕳️ La Fosse aux Runes</h1>
    <p class="sous">Les monstres remontent de la Fosse. Chaque dé est une balle : vise, transperce, fais ricocher.</p>
    <div class="heros">${Object.entries(HER).map(([k, h]) => `<button class="${choixH === k ? 'on' : ''}" ${k === 'zephine' && !ZEPH_OK() ? 'disabled' : ''} onclick="choixH='${k}';accueil()"><img src="portraits/${k}.webp" alt="">${h.n}${k === 'zephine' && !ZEPH_OK() ? '<br>🔒 tutoriel' : ''}</button>`).join('')}</div>
    <div class="pv-h">✦ <b>${F.TALENTS[choixH].n}</b> : ${F.TALENTS[choixH].d}<br>❤ ${F.PV_HEROS} PV de rempart.<br>✨ ${texteBonus(choixH)}</div>
    <div class="choix">
      ${partieGardee() ? `<button onclick="reprend()" style="border-color:var(--ok);color:var(--ok);background:#14322a">▶ Reprendre ta Fosse<small>${HER[partieGardee().S.heros].n} · tour ${partieGardee().S.tour} · ❤ ${partieGardee().S.pv}</small></button>` : ''}
      <button onclick="lance(true)">📅 La Fosse du jour<small>La même pour tout le monde aujourd’hui. ${j ? `Ton record du jour : ${j.score} ${'★'.repeat(j.etoiles)}` : 'Pas encore tentée.'}</small></button>
      <button class="b2" onclick="lance(false)">🎲 Une Fosse au hasard<small>Une nouvelle à chaque fois.</small></button>
    </div>
    <p class="record">Meilleur score : ${D.meilleur} · ${D.victoires} victoire${D.victoires > 1 ? 's' : ''} sur ${D.parties}</p>
  </div>`;
}
function lance(j) {
  duJour = j; const D = lire(); D.heros = choixH; ecrire(D); xpTues = 0;
  S = F.nouvelle(choixH, j ? 'fosse-' + jour() : 'fosse-' + Date.now() + Math.random(), bonusMode(choixH));
  S.des.forEach(x => x.neuf = true); sel = null; son('portail'); dessine();
  if (!localStorage.getItem('guilde-fosse-guide')) { localStorage.setItem('guilde-fosse-guide', '1'); regles(); }
}
if (typeof GM !== 'undefined') { try { GM.musique('combat2'); GM.bouton(); } catch (e) {} }
accueil();
</script>
