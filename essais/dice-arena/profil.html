  .parc { display:flex; align-items:center; gap:10px; width:100%; margin:5px 0; padding:10px 12px; border-radius:12px; border:1px solid #45457a; background:#1c1838; color:#f1ecff; font:inherit; text-align:left; cursor:pointer; }

<script>
const log = () => {};
// 15/11 (l'utilisateur : « changer de portrait en touchant ne sert à rien, sauf avec un crayon Modifier qui ouvre la modification du profil »)
// La page montre la CARTE DE PROFIL ; le crayon ✏️ ouvre L'ATELIER DU PROFIL, en onglets.
const parties = JL('guilde-parties', []);
const dernier = (parties.length && parties[parties.length - 1].moi) || 'gorm';
let onglet = null; // null = la page ; sinon l'onglet de l'atelier
const ONGLETS = [['portrait', '🖼', 'Portrait'], ['cadre', '🔲', 'Cadre'], ['titre', '🎖', 'Titre'], ['embleme', '🦁', 'Emblème'], ['couleur', '🎨', 'Nom'],
  ['fond', '🌌', 'Fond'], ['devise', '💬', 'Devise'], ['vitrine', '🏅', 'Vitrine'], ['des', '🎲', 'Dés']];
function choisir(quoi, k) { const p = lireProfil(); p[quoi] = k; ecrireProfil(p); if (typeof GM !== 'undefined') GM.son('clic'); const y = scrollY; dessine(); scrollTo(0, y); }
// 17/11 (l'utilisateur : « mes parties, mets-les dans le profil, un endroit où on retrouve l'historique de chaque mode, un récap global comme
// dans beaucoup de jeux ») : MON PARCOURS = le récap des parties du carnet (les 60 dernières), mode par mode, et le journal de chacune
function parcoursHTML() {
  if (typeof Carnet === 'undefined') return '';
  const L = Carnet.lit(), gagne = r => /gagn|victoire|win/i.test(String(r || '')), perd = r => /perd|defaite|défaite|mort/i.test(String(r || ''));
  const FAM = [['duel', '⚔️', 'Duels', ['duel', 'duel-ami', 'duel-deux', 'duel-semaine', 'enigme', 'tutoriel']], ['odyssee', '🗺️', 'Odyssée', ['odyssee', 'odyssee-combat', 'odyssee-route', 'odyssee-sansfin', 'grande-aventure', 'epreuve']],
    ['crypte', '🕯️', 'Crypte et Descente', ['crypte', 'descente-combat', 'descente']], ['defense', '🏰', 'Défense', ['defense', 'defense-sansfin']], ['fosse', '🕳️', 'Fosse', ['fosse']],
    ['chroniques', '📖', 'Chroniques', ['chroniques', 'chroniques-aventure']], ['autres', '⛵', 'Expéditions et Invasion', ['expedition', 'invasion']]];
  const v = L.filter(x => gagne(x.resultat)).length, p = L.filter(x => perd(x.resultat)).length;
  const quand = iso => { try { return new Date(iso).toLocaleDateString('fr-FR', { day:'numeric', month:'short' }); } catch (e) { return ''; } };
  const lignes = FAM.map(([k, e, n, modes]) => { const l = L.filter(x => modes.includes(x.mode)); if (!l.length) return '';
    const g = l.filter(x => gagne(x.resultat)).length;
    return `<button class="parc" onclick="Carnet.ouvrir('${k}')"><span class="e">${e}</span><span class="n"><b>${n}</b><small>${l.length} partie${l.length > 1 ? 's' : ''} · ${g} victoire${g > 1 ? 's' : ''} · dernière le ${quand(l[0].quand)}</small></span><span class="f">📜 ›</span></button>`; }).join('');
  if (location.hash === '#parcours') setTimeout(() => { const h = document.getElementById('parcours'); if (h) h.scrollIntoView({ behavior:'smooth' }); }, 200);
  return `<h2 id="parcours">📊 Mon parcours</h2>
    ${(j => j ? `<p class="aide" style="text-align:center">🗓️ Jours joués : <b>${j}</b>${+localStorage.getItem('guilde-jours-prochain') ? ` · prochain cadeau de fidélité à <b>${localStorage.getItem('guilde-jours-prochain')}</b> jours` : ''}</p>` : '')(+localStorage.getItem('guilde-jours-joues') || 0)}
    <div class="parc-total"><div><b>${L.length}</b><small>parties</small></div><div><b>${v}</b><small>victoires</small></div><div><b>${p}</b><small>défaites</small></div><div><b>${v + p ? Math.round(100 * v / (v + p)) : 0} %</b><small>réussite</small></div></div>
    ${lignes || '<p class="aide">Pas encore de partie finie : elles arrivent ici, mode par mode.</p>'}
    <p class="aide">Touche un mode pour relire le journal de chaque partie (et le copier pour Claude). Le carnet garde les 60 dernières parties.</p>`;
}
function nom(v) { const p = lireProfil(); p.nom = v; ecrireProfil(p); const e = document.getElementById('nomv'); if (e) e.textContent = v.trim() || 'Toi'; pseudoEnLigne(v); }
// 17/11 (l'utilisateur : « le changement de pseudo dans le profil, pas dans mes amis ») : le nom du profil EST le pseudo vu par les amis
let pseudoMinuteur = null;
function pseudoEnLigne(v) { clearTimeout(pseudoMinuteur); const net = String(v || '').trim().slice(0, 18); if (!net) return;
  pseudoMinuteur = setTimeout(async () => { let c = null; try { c = JSON.parse(localStorage.getItem('guilde-carte') || 'null'); } catch (e) {} if (!c || !c.cle || c.pseudo === net) return;
    try { const r = await fetch('/api/hub/guilde/joueur/moi', { method:'POST', headers:{ 'Content-Type':'application/json' }, body:JSON.stringify({ cle:c.cle, action:'pseudo', pseudo:net }) }); const d = await r.json();
      if (r.ok && d.pseudo) { c.pseudo = d.pseudo; localStorage.setItem('guilde-carte', JSON.stringify(c)); localStorage.setItem('guilde-pseudo', d.pseudo); } } catch (e) {} }, 1200); }
function devise(v) { const p = lireProfil(); p.devise = v; ecrireProfil(p); const e = document.getElementById('devv'); if (e) e.textContent = v ? `« ${v} »` : ''; }
function vitrine(k) { const p = lireProfil(); const v = p.vitrine || []; p.vitrine = v.includes(k) ? v.filter(x => x !== k) : v.length >= 3 ? v : v.concat(k); if (!v.includes(k) && v.length >= 3) { alert('3 titres au plus dans la vitrine : retire-en un d’abord.'); return; } ecrireProfil(p); if (typeof GM !== 'undefined') GM.son('clic'); const y = scrollY; dessine(); scrollTo(0, y); }
function carteProfil(p, edit) {
  const c = p.cadre !== 'aucun' && titreDe(p.cadre), t = p.titre && titreDe(p.titre), [src, sec] = portraitProfil(p), img = src || IMG(dernier), sc = sec || IMG(dernier);
  const em = (EMBLEMES.find(x => x[0] === p.embleme) || [])[1], f = (FONDS[p.fond] || FONDS.nuit)[1], r = rangGuilde();
  return `<div class="carte" style="background:${f};border-color:${c ? c[5] : '#4b4580'}">
    ${edit ? '' : `<button class="crayon" onclick="ouvre('portrait')" aria-label="Modifier mon profil">✏️ Modifier</button>`}
    <div class="port${c && CADRES_PEINTS.includes(p.cadre) ? ' cp' : ''}" ${edit ? '' : `onclick="ouvre('portrait')"`}><img src="${img}" onerror="this.onerror=null;this.src='${sc}'" alt="" style="${c && !CADRES_PEINTS.includes(p.cadre) ? `box-shadow:0 0 0 4px ${c[5]}, 0 0 22px ${c[5]}` : ''}">${c && CADRES_PEINTS.includes(p.cadre) ? `<img class="cadrep" src="cadres/profil-${p.cadre}.webp?v=1" alt="">` : ''}${em && em !== '—' ? `<span class="em">${emIco(p.embleme, em, 36)}</span>` : c ? `<span class="em">${c[1]}</span>` : ''}${typeof emblemeRang === 'function' ? emblemeRang(r, 38, 'rg-e') : `<span class="rg" title="Rang de la Guilde">RG ${r}</span>`}</div>
    <div class="nom" id="nomv" style="${nomStyle(p)}">${p.nom || 'Toi'}</div><div class="tit">${t ? `${t[1]} ${t[2]}` : ''}</div>
    <div class="dev" id="devv">${p.devise ? `« ${p.devise.replace(/</g, '&lt;')} »` : ''}</div>
    ${(p.vitrine || []).length ? `<div class="vit">${p.vitrine.map(k => { const x = titreDe(k); return x ? `<span style="border-color:${x[5]}">${x[1]} ${x[2]}</span>` : ''; }).join('')}</div>` : ''}
  </div>`;
}
function ouvre(o) { onglet = o; if (typeof GM !== 'undefined') GM.son('clic'); dessine(); window.scrollTo(0, 0); }
function dessine() {
  const p = lireProfil(), T = titresGuilde();
  if (onglet) { document.getElementById('app').innerHTML = atelier(p, T); return; }
  document.getElementById('app').innerHTML = `${carteProfil(p)}
  <p class="aide" style="text-align:center;margin-top:6px">C’est ta carte : ton nom, ton titre et ton cadre te suivent en combat. Touche ✏️ pour la personnaliser.</p>
  ${typeof succesPoints === 'function' ? (n => `<a class="lien" href="succes.html" style="display:flex;align-items:center;gap:10px;font-size:1.05em;border:1px solid #f3c96b88;border-radius:14px;padding:10px 12px;margin:12px 0;background:#1d1838e8;text-decoration:none;text-align:left;color:var(--texte)"><span style="font-size:1.6em">🏆</span><span style="flex:1"><b>Mes succès</b><br><small style="color:var(--doux)">${succesPoints()} points de succès · ${SUCCES.length} succès à paliers</small></span>${n ? `<span style="background:#ff5a5a;color:#fff;border-radius:10px;padding:1px 8px;font-weight:bold">🎁 ${n}</span>` : ''}<span>›</span></a>`)(succesARecuperer()) : ''}
  ${parcoursHTML()}
  ${typeof lireRang === 'function' ? rangHTML() : ''}
  <h2>🏆 Mes trophées</h2>
  ${tropheesHTML()}
  <a class="lien" href="mes-heros.html">🏰 Mes héros : niveaux, rangs et équipement ›</a>
  <a class="lien" href="pouvoirs.html?retour=profil.html">🃏 Les pouvoirs des héros ›</a>
  <a class="lien" href="pantheon.html">🏛 Le Panthéon : Tableau d’honneur et récompenses ›</a>`;
}
// ------------------------------------------------------------------ l'atelier du profil
const verrou = c => condOk(c) ? '' : `🔒 ${condTxt(c)}`;
function atelier(p, T) {
  const tabs = `<div class="onglets">${ONGLETS.map(([k, e, n]) => `<button class="${onglet === k ? 'on' : ''}" onclick="ouvre('${k}')">${e}<small>${n}</small></button>`).join('')}</div>`;
  let corps = '';
  if (onglet === 'portrait') {
    const av = typeof avLire === 'function' ? avLire() : [];
    corps = `<p class="aide">Le visage de ta carte de profil (tu joues toujours le héros que tu veux).</p><div class="grille">
      <button class="cad ${!p.portrait ? 'choisi' : ''}" onclick="choisir('portrait',null)"><img class="rond" src="${IMG(dernier)}" alt="">Mon dernier héros</button>
      ${ORDRE.filter(id => id !== 'zephine' || localStorage.getItem('guilde-tuto') === 'fait').map(id => `<button class="cad ${p.portrait === id ? 'choisi' : ''}" onclick="choisir('portrait','${id}')"><img class="rond" src="portraits/${id}.webp" alt="">${HEROS[id].nom}</button>`).join('')}
      ${(typeof AVATARS_PROFIL !== 'undefined' ? AVATARS_PROFIL : []).map(([n, nom]) => `<button class="cad ${p.portrait === 'avatar-' + n ? 'choisi' : ''}" onclick="choisir('portrait','avatar-${n}')"><img class="rond" src="portraits/avatar-${n}.webp?v=1" alt="">${nom}</button>`).join('')}
      ${av.map(a => `<button class="cad ${p.portrait === 'av:' + a.id ? 'choisi' : ''}" onclick="choisir('portrait','av:${a.id}')"><img class="rond" src="${avPortrait(a)}" onerror="this.onerror=null;this.src='${avPortraitSecours(a)}'" alt="">${a.nom}</button>`).join('')}</div>
      <h3>✏️ Mon nom</h3><p class="aide">C’est aussi ton pseudo en ligne, celui que voient tes amis.</p><input maxlength="18" placeholder="Ton nom d’aventurier (sinon : « Toi »)" value="${(p.nom || '').replace(/"/g, '&quot;')}" oninput="nom(this.value)">`;
  } else if (onglet === 'cadre') {
    corps = `<p class="aide">Il entoure ton portrait, ici et en combat. Chaque titre gagné débloque son cadre.</p><div class="grille">
      <button class="cad ${p.cadre === 'aucun' ? 'choisi' : ''}" onclick="choisir('cadre','aucun')"><span class="rond" style="box-shadow:0 0 0 2px #4b4580">—</span>Aucun</button>
      ${T.map(x => `<button class="cad ${p.cadre === x[0] ? 'choisi' : ''}" ${x[4] ? '' : 'disabled'} onclick="choisir('cadre','${x[0]}')"><span class="rond" style="box-shadow:0 0 0 3px ${x[5]}, 0 0 10px ${x[5]}">${x[4] ? x[1] : '🔒'}</span>${x[2]}</button>`).join('')}</div>`;
  } else if (onglet === 'titre') {
    corps = `<p class="aide">Il s’affiche sous ton nom. ${T.filter(x => x[4]).length} sur ${T.length} gagnés ; les verrouillés disent comment les gagner.</p>
      <button class="ligne ${!p.titre ? 'choisi' : ''}" onclick="choisir('titre',null)"><div class="e">—</div><div><b>Pas de titre</b></div></button>
      ${T.map(x => `<button class="ligne ${p.titre === x[0] ? 'choisi' : ''}" ${x[4] ? '' : 'disabled'} onclick="choisir('titre','${x[0]}')"><div class="e">${x[4] ? x[1] : '🔒'}</div><div><b>${x[2]}</b><small>${x[3]}</small></div></button>`).join('')}`;
  } else if (onglet === 'embleme') {
    corps = `<p class="aide">Un petit emblème sur ton portrait et devant ton nom en combat.</p><div class="grille">
      ${EMBLEMES.map(([k, e, c]) => `<button class="cad ${p.embleme === k ? 'choisi' : ''}" ${condOk(c) ? '' : 'disabled'} onclick="choisir('embleme','${k}')"><span class="rond">${condOk(c) ? emIco(k, e, 30) : '🔒'}</span>${condOk(c) ? '' : verrou(c)}</button>`).join('')}</div>`;
  } else if (onglet === 'couleur') {
    corps = `<p class="aide">La couleur de ton nom, sur ta carte et en combat.</p><div class="grille">
      ${COULEURS_NOM.map(([k, c, cd]) => `<button class="cad ${p.couleur === k ? 'choisi' : ''}" ${condOk(cd) ? '' : 'disabled'} onclick="choisir('couleur','${k}')"><span class="rond" style="background:${c}">${condOk(cd) ? '' : '🔒'}</span>${condOk(cd) ? (k === 'arcenciel' ? 'Arc-en-ciel' : k[0].toUpperCase() + k.slice(1)) : verrou(cd)}</button>`).join('')}</div>`;
  } else if (onglet === 'fond') {
    corps = `<p class="aide">Le décor de ta carte de profil. Les plus beaux se gagnent avec le rang et les titres.</p><div class="grille fonds">
      ${Object.entries(FONDS).map(([k, [n, f, c]]) => `<button class="cad ${p.fond === k ? 'choisi' : ''}" ${condOk(c) ? '' : 'disabled'} onclick="choisir('fond','${k}')"><span class="rect" style="background:${f}">${condOk(c) ? '' : '🔒'}</span>${n}${condOk(c) ? '' : `<small>${condTxt(c)}</small>`}</button>`).join('')}</div>`;
  } else if (onglet === 'devise') {
    corps = `<p class="aide">Une phrase sous ton nom. Écris la tienne ou choisis-en une.</p>
      <input maxlength="60" placeholder="Ta devise" value="${(p.devise || '').replace(/"/g, '&quot;')}" oninput="devise(this.value)">
      <div class="devises">${DEVISES.map(d => `<button onclick="choisir('devise', ${JSON.stringify(d).replace(/"/g, '&quot;')})">« ${d} »</button>`).join('')}<button onclick="choisir('devise','')">Pas de devise</button></div>`;
  } else if (onglet === 'vitrine') {
    corps = `<p class="aide">Choisis jusqu’à 3 titres gagnés à exposer sur ta carte (${(p.vitrine || []).length}/3).</p>
      ${T.filter(x => x[4]).map(x => `<button class="ligne ${(p.vitrine || []).includes(x[0]) ? 'choisi' : ''}" onclick="vitrine('${x[0]}')"><div class="e">${x[1]}</div><div><b>${x[2]}</b><small>${(p.vitrine || []).includes(x[0]) ? '✅ dans la vitrine' : 'toucher pour exposer'}</small></div></button>`).join('') || '<p class="aide">Pas encore de titre gagné : finis le tutoriel, une île, une Descente…</p>'}`;
  } else if (onglet === 'des') {
    const d = lireRang();
    corps = `<p class="aide">L’apparence de tes dés, dans tous les modes. Pour le plaisir des yeux : aucun avantage.</p><div class="grille">
      ${Object.entries(PEAUX_DES).map(([k, x]) => { const ok = rgPeauOk(k); return `<button class="cad ${d.peau === k ? 'choisi' : ''}" ${ok ? '' : 'disabled'} onclick="choisirPeau('${k}');dessine()"><span class="rond" style="background:none"><img src="faces-${dernier}/face-6.webp" alt="" style="width:40px;height:40px;border-radius:8px;filter:${x[1] || 'none'}"></span>${x[0]}${ok ? '' : '<small>🔒 route des rangs</small>'}</button>`; }).join('')}</div>`;
  }
  return `<div class="haut2"><button onclick="onglet=null;dessine()">‹ Ma carte</button><b>✏️ L’atelier du profil</b></div>
    <div class="colle">${carteProfil(p, true)}</div>${tabs}<div class="corps">${corps}</div>
    <button class="fini" onclick="onglet=null;dessine()">✅ C’est bon</button>`;
}
// 14/11 nuit : le Rang de la Guilde, les quêtes, la route des récompenses, l'apparence des dés
const GENRE = { titre:'Titre', des:'Dés', depart:'Odyssée', carte:'Carte', equip:'Équipement' };
function rangHTML() {
  const d = lireRang(), i = d.info, Q = lireQuetes();
  const ligneQ = (q, jour, idx) => { const def = defQuete(q, jour); return `<div class="quete ${q.fait ? 'faite' : ''}"><div><b>${q.fait ? '✅' : '📜'} ${texteQuete(q, jour)}</b><span class="barre-rang"><i style="width:${Math.round(q.prog / def[3] * 100)}%"></i></span><small>${q.prog} / ${def[3]} · +${jour ? 40 : 150} XP</small></div>${jour && !Q.change && !q.fait ? `<button class="chg" onclick="if (changeQuete(${idx})) dessine()">🔄</button>` : ''}</div>`; };
  return `<h2 id="rang">🏆 Rang de la Guilde · ${i.rang}${i.rang >= RANG_MAX ? ' (le plus haut)' : ''}</h2>
  <div class="rangbloc"><span class="barre-rang gros"><i style="width:${i.besoin ? Math.round(i.dans / i.besoin * 100) : 100}%"></i></span><small>${i.besoin ? `${i.dans} / ${i.besoin} XP pour le rang ${i.rang + 1}` : 'Tu as atteint le plus haut rang.'} · ${d.xp} XP en tout</small>
  <p class="aide">Chaque partie rapporte de l’expérience, même perdue : duel gagné 30 (perdu 10), salle vidée 5, élite 20, boss 60, escale 15, Titan 60, acte de l’Invasion 50, vague tenue 10, énigme 20, quête du jour 40, quête de la semaine 150.</p>
  ${d.journal.length ? `<details><summary>Mes derniers gains</summary>${d.journal.slice(0, 12).map(j => `<div class="jr">+${j.xp} · ${j.raison} <small>${new Date(j.q).toLocaleString('fr-FR', { day:'2-digit', month:'2-digit', hour:'2-digit', minute:'2-digit' })}</small></div>`).join('')}</details>` : ''}</div>`; // 18/11 soir (l'utilisateur) : liens vers la route et les quêtes retirés du profil (déjà dans le menu)
}
dessine();
if (location.hash === '#rang') setTimeout(() => { const e = document.getElementById('rang'); if (e) e.scrollIntoView(); }, 50);
GM.musique('menu'); GM.bouton();
</script>
</body>
</html>
