<script>
// =============================================================================================== LA FOSSE AUX RUNES v3 (15/11) : SURVIE NERVEUSE façon Vampire Survivors
// Retour de l'utilisateur sur la v2 (casse-briques, gardée dans fosse-v2.html) : « un casse-briques ordinaire, rien ne me met en difficulté,
// les monstres ne m'attaquent jamais ; plus d'actions, comme Vampire Survivors : quand je récupère quelque chose, une pause et je choisis
// parmi 3 objets ; les monstres doivent descendre plus vite, attaquer ; un truc ultra dynamique ».
// Donc : les DÉS PARTENT TOUT SEULS du bouclier (cadence réglable) ; les monstres descendent en continu et ATTAQUENT (crachats de feu, plongeons,
// essaims) ; chaque monstre abattu lâche une GEMME ; assez de gemmes = UN NIVEAU : pause et 1 amélioration parmi 3 ; tenir 5 minutes, le Titan à 4:00.
const HER = {
  maelle:{ n:'Maëlle', c:'#ff8a2a', t:'Marteau de forge', d:'Tes balles font +1 dégât.' },
  aldric:{ n:'Sire Aldric', c:'#ffd27a', t:'Grand pavois', d:'Ton bouclier est plus large et encaisse le premier coup de chaque minute.' },
  pip:{ n:'Pip', c:'#c58bff', t:'Sève', d:'Tu regagnes 1 PV toutes les 15 secondes.' },
  oria:{ n:'Oria', c:'#5ff5e6', t:'Œil du cartographe', d:'Les gemmes viennent à toi de plus loin (aimant).' },
  gorm:{ n:'Gorm', c:'#4f8bff', t:'Grand souffle', d:'Une balle de plus en même temps.' },
  zephine:{ n:'Zéphine', c:'#ff4040', t:'Vent de tempête', d:'Tes balles vont plus vite et partent plus souvent.' },
};
const W = 360, H = 600, DUREE = 300, BOSS_A = 240, PV0 = 25;
const $ = id => document.getElementById(id);
const ZEPH_OK = () => localStorage.getItem('guilde-tuto') === 'fait';
const CLE = 'guilde-fosse3';
const lire = () => { try { return Object.assign({ parties:0, victoires:0, meilleur:0, meilleurTemps:0, heros:'maelle' }, JSON.parse(localStorage.getItem(CLE) || '{}')); } catch (e) { return { parties:0, victoires:0, meilleur:0, meilleurTemps:0, heros:'maelle' }; } };
const ecrire = d => { try { localStorage.setItem(CLE, JSON.stringify(d)); } catch (e) {} };
let dernierSon = 0;
const son = (k, force) => { const t = performance.now(); if (!force && t - dernierSon < 60) return; dernierSon = t; try { if (typeof GM !== 'undefined') GM.son(k); } catch (e) {} };
const IMG = {}; function img(src) { if (!IMG[src]) { const i = new Image(); i.src = src; IMG[src] = i; } return IMG[src]; }
const rnd = (a, b) => a + Math.random() * (b - a), pick = l => l[Math.floor(Math.random() * l.length)];

// ------------------------------------------------------------------ les monstres (chacun sa façon d'attaquer)
const MONSTRES = {
  gobelin:   { img:'gobelin', r:15, pv:3, v:22, att:1, gem:1 },
  scarabee:  { img:'scarabee', r:11, pv:2, v:55, att:1, gem:1, essaim:true },
  loup:      { img:'loup', r:15, pv:6, v:22, att:2, gem:2, plonge:true },
  salamandre:{ img:'salamandre', r:15, pv:6, v:30, att:1, gem:2, tire:true },
  golem:     { img:'golem', r:24, pv:30, v:12, att:4, gem:6, elite:true },
  titan:     { img:'titan', r:44, pv:340, v:6, att:8, gem:30, boss:true },
  // 15/11 soir : deux MINI-BOSS, blindés, qui se reblindent à 66 % et 33 % de leur vie (il faut les bonnes balles, encore et encore)
  chef:      { img:'chefgobelin', r:26, pv:70, v:9, att:5, gem:14, elite:true, mini:'Le Chef gobelin' },
  drake:     { img:'drake', r:28, pv:110, v:8, att:6, gem:20, elite:true, mini:'Le Drake', tire:true },
};
// ------------------------------------------------------------------ les améliorations (5 niveaux chacune, sauf le soin)
const AMELIO = {
  multi:  { e:'🎲', n:'Un dé de plus', d:n => `${n + 4} dés en jeu : plus de dégâts, plus de combos.` },
  force:  { e:'⚒️', n:'Balles forgées', d:n => `Tes balles font +${n + 1} dégât${n ? 's' : ''}.` },
  cadence:{ e:'⏱️', n:'Retour rapide', d:() => 'Un dé perdu repart plus vite de ton bouclier.' },
  vitesse:{ e:'💨', n:'Balles rapides', d:() => 'Tes balles vont plus vite.' },
  perce:  { e:'🗡️', n:'Balles perçantes', d:n => `Elles traversent ${n + 1} monstre${n ? 's' : ''} avant de rebondir.` },
  feu:    { e:'🔥', n:'Balles de feu', d:n => `Chaque touche brûle (${n + 1} dégât${n ? 's' : ''} par seconde, 3 s).` },
  eclat:  { e:'✨', n:'Éclats', d:n => `Chaque touche lance ${n + 1} petit${n ? 's' : ''} éclat${n ? 's' : ''}.` },
  large:  { e:'🛡️', n:'Bouclier élargi', d:() => 'Ton bouclier est plus large.' },
  aimant: { e:'🧲', n:'Aimant', d:() => 'Les gemmes viennent à toi de plus loin.' },
  orbe:   { e:'🔮', n:'Orbe gardienne', d:n => `${n + 1} orbe${n ? 's' : ''} tourne${n ? 'nt' : ''} autour du bouclier : détruit les crachats, blesse les monstres.` },
  foudre: { e:'⚡', n:'Foudre', d:n => `Toutes les ${Math.max(1.5, 4 - n * .5)} s, un éclair frappe le monstre le plus bas.` },
  soin:   { e:'❤️', n:'Rempart réparé', d:() => '+8 PV et +3 PV max.', unique:true },
  forge:  { e:'⚒️', n:'Forger une face', d:() => 'Ta plus petite face de dé gagne +2 (jusqu’à 6). Plus de gros dés, plus de dégâts.', faces:true },
  six:    { e:'💥', n:'Six explosifs', d:n => `Quand un 6 touche, il explose autour de lui (${2 + (n + 1) * 2} dégâts).` },
  combo:  { e:'🎰', n:'Maître des combinaisons', d:() => 'Tous les combos +50 % (ondes, éclats, foudre) ; les dés dorés de la paire durent 2 s de plus.' },
  pipe:   { e:'🎯', n:'Dé pipé', d:() => 'Une de tes faces devient la copie de ta plus forte : plus de paires et de brelans.', faces:true },
};
// ------------------------------------------------------------------ LES DÉS AU CŒUR (15/11, l'utilisateur : « les dés doivent rester le cœur du gameplay, quelque chose qui pop
// et qui change les améliorations ») : chaque lancer se voit (la face du dé du héros jaillit au-dessus du bouclier) ; le dé a 6 FACES qu'on forge ;
// les 3 derniers dés forment des COMBINAISONS : PAIRE (deux pareils de suite) = une balle en double ; BRELAN = onde de choc sur tous les monstres ;
// SUITE (3 qui se suivent) = pluie d'éclats.
// 15/11 soir, DÉCISION de l'utilisateur (2e essai) : « REBOND = RELANCE ». La main de dés (choisir puis lancer) demandait trop de gestes
// et la balle ne repartait pas toute seule. Maintenant : tes balles sont des DÉS qui rebondissent sur le bouclier comme dans un casse-briques ;
// à CHAQUE REBOND sur le bouclier, le dé change de face. Quand les dés en jeu forment un combo, le bouton « COMBO ! » s'allume :
// un clic (ou Espace) le déclenche, au moment que TU choisis (attendre un meilleur combo ? il peut disparaître au prochain rebond).
const COMBOS = {
  paire:  { e:'🎲🎲', n:'PAIRE', d:'ces 2 dés deviennent dorés 5 s : dégâts × 2, ils traversent' },
  suite3: { e:'🌠', n:'PETITE SUITE', d:'pluie de 8 éclats' },
  brelan: { e:'💥', n:'BRELAN', d:'onde de choc sur tous les monstres (4 + valeur)' },
  suite4: { e:'🌠', n:'SUITE', d:'pluie de 16 éclats' },
  carre:  { e:'❄️', n:'CARRÉ', d:'onde de choc (6 + valeur) et tout gèle 4 s' },
  suite5: { e:'⚡', n:'GRANDE SUITE', d:'la foudre frappe tous les monstres (10)' },
};
// la meilleure combinaison contenue dans des faces (+ les faces qui la forment)
function combo(vals) {
  const n = {}; vals.forEach(v => n[v] = (n[v] || 0) + 1);
  const uniq = [...new Set(vals)].sort((a, b) => a - b);
  let suite = [];
  for (let i = 0; i < uniq.length; i++) { const s = [uniq[i]]; while (uniq.includes(s[s.length - 1] + 1)) s.push(s[s.length - 1] + 1); if (s.length > suite.length) suite = s; }
  const max = Math.max(0, ...Object.values(n)), vMax = +Object.keys(n).filter(v => n[v] === max).sort((a, b) => b - a)[0];
  if (suite.length >= 5) return { k:'suite5', des:suite.slice(0, 5) };
  if (max >= 4) return { k:'carre', des:[vMax, vMax, vMax, vMax], v:vMax };
  if (suite.length === 4) return { k:'suite4', des:suite };
  if (max === 3) return { k:'brelan', des:[vMax, vMax, vMax], v:vMax };
  if (suite.length === 3) return { k:'suite3', des:suite };
  if (max === 2) return { k:'paire', des:[vMax, vMax], v:vMax };
  return null;
}
const tirage = () => J.faces[Math.floor(Math.random() * 6)];
const nbDes = () => 4 + L('multi');
const delaiPerdu = () => Math.max(1.5, 4 * Math.pow(.85, L('cadence')));
function nouvelleBalle(v, a) {
  const s = vitBalle(), raqY = H - 32;
  J.balles.push({ x:J.raq.x, y:raqY - 10, vx:Math.cos(a) * s, vy:Math.sin(a) * s, r:9, v, perce:L('perce'), de:true });
}
// les balles-dés en jeu et le combo qu'elles forment (avec les balles qui le forment)
function comboEnJeu() {
  const B = J.balles.filter(b => b.de && !(b.dore > 0)), c = combo(B.map(b => b.v)); if (!c) return null; // un dé doré (paire déjà jouée) ne compte plus
  const pris = [], reste = c.des.slice();
  for (const b of B) { const k = reste.indexOf(b.v); if (k >= 0) { reste.splice(k, 1); pris.push(b); } }
  return Object.assign(c, { balles:pris });
}
// déclencher le combo du moment (clic, toucher, Espace)
function lancer() {
  if (!J || J.etat !== 'jeu' || J.comboCD > 0) return;
  const c = comboEnJeu();
  if (!c) { texte(W / 2, H - 90, 'Pas de combo pour l’instant : attends que tes dés en fassent un', '#9fb3cf', 1); return; }
  const raqY = H - 32, fort = 1 + L('combo') * .5;
  J.flashC = { k:c.k, t:1.4, des:c.des }; J.comboCD = 1.2; J.combos = (J.combos || 0) + 1; J.lances = (J.lances || 0) + 1;
  texte(W / 2, H * .45, `${COMBOS[c.k].e} ${COMBOS[c.k].n} !`, '#f3c96b', 1.4); son('ultime', true);
  const onde = n => { J.onde = .5; J.monstres.forEach(m => blesse(m, Math.round(n * fort), '#f3c96b', true)); J.tremble = .4; };
  const pluie = (n, x, y) => { for (let i = 0; i < Math.round(n * fort); i++) { const a3 = rnd(0, Math.PI * 2); J.eclats.push({ x, y, vx:Math.cos(a3) * 280, vy:Math.sin(a3) * 280, v:1.4, casse:true }); } };
  if (c.k === 'paire') c.balles.forEach(b => { b.dore = 5 + L('combo') * 2; });
  if (c.k === 'suite3') c.balles.forEach(b => pluie(8 / 3, b.x, b.y));
  if (c.k === 'suite4') c.balles.forEach(b => pluie(16 / 4, b.x, b.y));
  if (c.k === 'brelan') onde(4 + c.v);
  if (c.k === 'carre') { onde(6 + c.v); J.effets.gel = 4; }
  if (c.k === 'suite5') { J.monstres.forEach(m => { blesse(m, Math.round(10 * fort), '#ffe14a', true); J.eclats.push({ foudre:true, x:m.x, y:m.y, v:.25 }); }); J.tremble = .5; }
  // les dés du combo sont « usés » : ils changent de face (sauf la paire, qui reste dorée)
  if (c.k !== 'paire') c.balles.forEach(b => { b.v = tirage(); b.usé = .6; });
}

// ------------------------------------------------------------------ l'état d'une partie
let J = null, cv, ctx, ech = 1, boucle = 0, dernierT = 0, choixH = haValide(lire().heros, ZEPH_OK());
// 15/11 soir : les HÉROS D'AVENTURE (heros-aventure.js) : choixH peut valoir 'av:<id>'. La Fosse joue sa VOIE (J.heros),
// sa progression vient de SON id (J.av), son nom et son portrait sont les siens.
const vJ = () => haVoie(choixH), pJ = () => haProg(choixH);
const nomJ = () => J && J.av && haInfo('av:' + J.av) ? haEsc(haInfo('av:' + J.av).nom) : HER[J ? J.heros : vJ()].n;
function nouvelle(h) {
  const avF = haInfo(h); h = haVoie(h); // un héros d'aventure → sa voie ; avF garde qui il est
  const B = typeof bonusMode === 'function' ? bonusMode(avF ? avF.id : h) : { pv:0, bouclier:0, relance:0, des:0 };
  const pvmax = PV0 + B.pv + B.bouclier;
  J = { fs:Math.round((1 + .3 * ((B.fs || 1) - 1)) * 100) / 100 /* 15/11 soir : les monstres suivent la force du héros à 30 % (mesuré au joueur automatique : survie débutant 189 s, niveau 250 sans suivi 288 s, avec 269 s) */, heros:h, pv:pvmax, pvmax, t:0, etat:'jeu', score:0, tues:0, xp:0, niv:1, besoin:5, lv:{}, balles:[], monstres:[], tirs:[], gemmes:[], capsules:[], eclats:[], textes:[],
    raq:{ x:W / 2, w:70 + (h === 'aldric' ? 18 : 0) }, faces:[1, 2, 3, 4, 5, 6], perdus:[], pops:[], onde:0, prochainSpawn:1, foudreT:3, regenT:15, gardeT:0, boss:false, bossMort:false, tremble:0, effets:{}, fini:false };
  J.av = avF ? avF.id : null; // 15/11 soir : le héros d'aventure de la partie
  if (h === 'maelle') J.lv.force = 1; if (h === 'gorm') J.lv.multi = 1; if (h === 'oria') J.lv.aimant = 2; if (h === 'zephine') { J.lv.vitesse = 1; J.lv.cadence = 1; }
  J.lv.multi = (J.lv.multi || 0) + (B.des || 0) + (B.relance || 0);
  for (let i = 0; i < nbDes(); i++) J.perdus.push({ t:.4 + i * .35 });
}
const L = k => J.lv[k] || 0;
const vitBalle = () => 340 * (1 + .12 * L('vitesse'));
const largeur = () => J.raq.w + 16 * L('large') + (J.effets.large ? 40 : 0);
