<script>
// =============================================================================================== LA FOSSE AUX RUNES v3 (15/11) : SURVIE NERVEUSE façon Vampire Survivors
// Retour de l'utilisateur sur la v2 (casse-briques, gardée dans fosse-v2.html) : « un casse-briques ordinaire, rien ne me met en difficulté,
// les monstres ne m'attaquent jamais ; plus d'actions, comme Vampire Survivors : quand je récupère quelque chose, une pause et je choisis
// parmi 3 objets ; les monstres doivent descendre plus vite, attaquer ; un truc ultra dynamique ».
// Donc : les DÉS PARTENT TOUT SEULS du bouclier (cadence réglable) ; les monstres descendent en continu et ATTAQUENT (crachats de feu, plongeons,
// essaims) ; chaque monstre abattu lâche une GEMME ; assez de gemmes = UN NIVEAU : pause et 1 amélioration parmi 3 ; tenir 5 minutes, le Titan à 4:00.
const HER = {
  maelle:{ n:'Maëlle', c:'#ff8a2a', t:'Marteau de forge', d:'Tes balles font +1 dégât.' },
  aldric:{ n:'Sire Aldric', c:'#ffd27a', t:'Grand pavois', d:'Ton bouclier est plus large et encaisse le premier coup de chaque minute.' },
  pip:{ n:'Pip', c:'#c58bff', t:'Sève', d:'Tu regagnes 1 PV toutes les 15 secondes.' },
  oria:{ n:'Oria', c:'#5ff5e6', t:'Œil du cartographe', d:'Les gemmes viennent à toi de plus loin (aimant).' },
  gorm:{ n:'Gorm', c:'#4f8bff', t:'Grand souffle', d:'Une balle de plus en même temps.' },
  zephine:{ n:'Zéphine', c:'#ff4040', t:'Vent de tempête', d:'Tes balles vont plus vite et partent plus souvent.' },
};
const W = 360, H = 600, DUREE = 300, BOSS_A = 240, PV0 = 20;
const $ = id => document.getElementById(id);
const ZEPH_OK = () => localStorage.getItem('guilde-tuto') === 'fait';
const CLE = 'guilde-fosse3';
const lire = () => { try { return Object.assign({ parties:0, victoires:0, meilleur:0, meilleurTemps:0, heros:'maelle' }, JSON.parse(localStorage.getItem(CLE) || '{}')); } catch (e) { return { parties:0, victoires:0, meilleur:0, meilleurTemps:0, heros:'maelle' }; } };
const ecrire = d => { try { localStorage.setItem(CLE, JSON.stringify(d)); } catch (e) {} };
let dernierSon = 0;
const son = (k, force) => { const t = performance.now(); if (!force && t - dernierSon < 60) return; dernierSon = t; try { if (typeof GM !== 'undefined') GM.son(k); } catch (e) {} };
const IMG = {}; function img(src) { if (!IMG[src]) { const i = new Image(); i.src = src; IMG[src] = i; } return IMG[src]; }
const rnd = (a, b) => a + Math.random() * (b - a), pick = l => l[Math.floor(Math.random() * l.length)];

// ------------------------------------------------------------------ les monstres (chacun sa façon d'attaquer)
const MONSTRES = {
  gobelin:   { img:'gobelin', r:15, pv:3, v:22, att:1, gem:1 },
  scarabee:  { img:'scarabee', r:11, pv:2, v:55, att:1, gem:1, essaim:true },
  loup:      { img:'loup', r:15, pv:6, v:22, att:2, gem:2, plonge:true },
  salamandre:{ img:'salamandre', r:15, pv:6, v:30, att:1, gem:2, tire:true },
  golem:     { img:'golem', r:24, pv:30, v:12, att:4, gem:6, elite:true },
  titan:     { img:'titan', r:44, pv:420, v:6, att:8, gem:30, boss:true },
};
// ------------------------------------------------------------------ les améliorations (5 niveaux chacune, sauf le soin)
const AMELIO = {
  multi:  { e:'🎲', n:'Un dé de plus', d:n => `Chaque lancer lance ${n + 2} dés.` },
  force:  { e:'⚒️', n:'Balles forgées', d:n => `Tes balles font +${n + 1} dégât${n ? 's' : ''}.` },
  cadence:{ e:'⏱️', n:'Recharge rapide', d:() => 'Tes dés en main se rechargent plus vite.' },
  vitesse:{ e:'💨', n:'Balles rapides', d:() => 'Tes balles vont plus vite.' },
  perce:  { e:'🗡️', n:'Balles perçantes', d:n => `Elles traversent ${n + 1} monstre${n ? 's' : ''} avant de rebondir.` },
  feu:    { e:'🔥', n:'Balles de feu', d:n => `Chaque touche brûle (${n + 1} dégât${n ? 's' : ''} par seconde, 3 s).` },
  eclat:  { e:'✨', n:'Éclats', d:n => `Chaque touche lance ${n + 1} petit${n ? 's' : ''} éclat${n ? 's' : ''}.` },
  large:  { e:'🛡️', n:'Bouclier élargi', d:() => 'Ton bouclier est plus large.' },
  aimant: { e:'🧲', n:'Aimant', d:() => 'Les gemmes viennent à toi de plus loin.' },
  orbe:   { e:'🔮', n:'Orbe gardienne', d:n => `${n + 1} orbe${n ? 's' : ''} tourne${n ? 'nt' : ''} autour du bouclier : détruit les crachats, blesse les monstres.` },
  foudre: { e:'⚡', n:'Foudre', d:n => `Toutes les ${Math.max(1.5, 4 - n * .5)} s, un éclair frappe le monstre le plus bas.` },
  soin:   { e:'❤️', n:'Rempart réparé', d:() => '+8 PV et +3 PV max.', unique:true },
  forge:  { e:'⚒️', n:'Forger une face', d:() => 'Ta plus petite face de dé gagne +2 (jusqu’à 6). Plus de gros dés, plus de dégâts.', faces:true },
  six:    { e:'💥', n:'Six explosifs', d:n => `Quand un 6 touche, il explose autour de lui (${2 + (n + 1) * 2} dégâts).` },
  combo:  { e:'🎰', n:'Maître des combinaisons', d:n => n === 0 ? 'Paires, brelans et suites plus forts.' : 'Encore plus forts (une paire donne 2 balles en plus).' },
  pipe:   { e:'🎯', n:'Dé pipé', d:() => 'Une de tes faces devient la copie de ta plus forte : plus de paires et de brelans.', faces:true },
};
// ------------------------------------------------------------------ LES DÉS AU CŒUR (15/11, l'utilisateur : « les dés doivent rester le cœur du gameplay, quelque chose qui pop
// et qui change les améliorations ») : chaque lancer se voit (la face du dé du héros jaillit au-dessus du bouclier) ; le dé a 6 FACES qu'on forge ;
// les 3 derniers dés forment des COMBINAISONS : PAIRE (deux pareils de suite) = une balle en double ; BRELAN = onde de choc sur tous les monstres ;
// SUITE (3 qui se suivent) = pluie d'éclats.
const COMBOS = { paire:{ e:'🎲🎲', n:'PAIRE !' }, brelan:{ e:'💥', n:'BRELAN !' }, suite:{ e:'🌠', n:'SUITE !' } };
function combo(dern) {
  const [a, b, c] = dern.slice(-3);
  if (c != null && a === b && b === c) return 'brelan';
  if (c != null) { const s = [a, b, c].slice().sort((x, y) => x - y); if (s[1] === s[0] + 1 && s[2] === s[1] + 1) return 'suite'; }
  if (b != null && dern[dern.length - 1] === dern[dern.length - 2]) return 'paire';
  return null;
}
const tirage = () => J.faces[Math.floor(Math.random() * 6)];
function lancerDe(raqY) {
  // 15/11 soir : le prochain dé est TIRÉ D'AVANCE et se voit sur le bouclier (on sait ce qu'on lance et le combo qu'il va faire)
  const v = J.prochain != null ? J.prochain : tirage(); J.prochain = tirage();
  const a = -Math.PI / 2 + rnd(-.35, .35), s = vitBalle();
  J.balles.push({ x:J.raq.x, y:raqY - 10, vx:Math.cos(a) * s, vy:Math.sin(a) * s, r:6 + v * .4, v, perce:L('perce'), vie:5 });
  J.pops.push({ x:J.raq.x, y:raqY - 30, v, t:0 }); J.derniers.push(v); if (J.derniers.length > 3) J.derniers.shift();
  son('relance');
  const k = combo(J.derniers); if (!k) return;
  J.flashC = { k, t:1.2, des:J.derniers.slice(-(k === 'paire' ? 2 : 3)) }; const fort = 1 + L('combo') * .5; texte(W / 2, H * .45, `${COMBOS[k].e} ${COMBOS[k].n}`, '#f3c96b', 1.3); son('ultime', true);
  if (k === 'paire') { const n = 1 + (L('combo') >= 2 ? 1 : 0); for (let i = 0; i < n; i++) { const a2 = -Math.PI / 2 + rnd(-.5, .5); J.balles.push({ x:J.raq.x, y:raqY - 10, vx:Math.cos(a2) * s, vy:Math.sin(a2) * s, r:6 + v * .4, v, perce:L('perce') }); } }
  if (k === 'brelan') { J.onde = .5; J.monstres.forEach(m => blesse(m, Math.round((4 + v) * fort), '#f3c96b')); J.tremble = .4; J.derniers = []; }
  if (k === 'suite') { for (let i = 0; i < Math.round(8 * fort); i++) { const a3 = -Math.PI + rnd(0, Math.PI); J.eclats.push({ x:J.raq.x, y:raqY - 20, vx:Math.cos(a3) * 280, vy:Math.sin(a3) * 280, v:1.4 }); } J.derniers = []; }
}

// ------------------------------------------------------------------ l'état d'une partie
let J = null, cv, ctx, ech = 1, boucle = 0, dernierT = 0, choixH = lire().heros;
function nouvelle(h) {
  const B = typeof bonusMode === 'function' ? bonusMode(h) : { pv:0, bouclier:0, relance:0, des:0 };
  const pvmax = PV0 + B.pv + B.bouclier;
  J = { heros:h, pv:pvmax, pvmax, t:0, etat:'jeu', score:0, tues:0, xp:0, niv:1, besoin:5, lv:{}, balles:[], monstres:[], tirs:[], gemmes:[], capsules:[], eclats:[], textes:[],
    raq:{ x:W / 2, w:70 + (h === 'aldric' ? 18 : 0) }, faces:[1, 2, 3, 4, 5, 6], derniers:[], pops:[], onde:0, prochainLancer:.5, reserve:3, prochainSpawn:1, foudreT:3, regenT:15, gardeT:0, boss:false, bossMort:false, tremble:0, effets:{}, fini:false };
  if (h === 'maelle') J.lv.force = 1; if (h === 'gorm') J.lv.multi = 1; if (h === 'oria') J.lv.aimant = 2; if (h === 'zephine') { J.lv.vitesse = 1; J.lv.cadence = 1; }
  J.lv.multi = (J.lv.multi || 0) + (B.des || 0) + (B.relance || 0);
}
const L = k => J.lv[k] || 0;
const maxBalles = () => 2 + L('multi');
const maxReserve = () => 3 + L('multi');
function lancer() { if (!J || J.etat !== 'jeu' || J.reserve < 1) return; J.reserve--; J.lances = (J.lances || 0) + 1; J.aLancer = (J.aLancer || 0) + 1 + L('multi'); }
const cadence = () => Math.max(.35, 1.6 * Math.pow(.85, L('cadence')));
const vitBalle = () => 300 * (1 + .12 * L('vitesse'));
const largeur = () => J.raq.w + 16 * L('large') + (J.effets.large ? 40 : 0);

// ------------------------------------------------------------------ apparitions : de plus en plus de monstres, de plus en plus vite
function spawn() {
  const t = J.t, m = Math.min(1, t / 200);
  const tab = t < 30 ? ['gobelin', 'gobelin', 'scarabee'] : t < 90 ? ['gobelin', 'scarabee', 'loup', 'salamandre'] : ['gobelin', 'scarabee', 'loup', 'salamandre', 'salamandre', 'loup'];
  const k = pick(tab);
  if (MONSTRES[k].essaim) { const x = rnd(40, W - 40); for (let i = 0; i < 4; i++) ajoute(k, x + rnd(-30, 30), -10 - i * 18); }
  else ajoute(k, rnd(24, W - 24), -20);
  if (t > 60 && Math.random() < .06 + m * .06) ajoute('golem', rnd(40, W - 40), -30);
  J.prochainSpawn = Math.max(.45, 2.2 - m * 1.6) * rnd(.7, 1.3);
}
function ajoute(k, x, y) {
  const M = MONSTRES[k], f = 1 + J.t / 160;
  J.monstres.push({ k, x, y, r:M.r, pv:Math.round(M.pv * f), pvmax:Math.round(M.pv * f), v:M.v * (1 + J.t / 500), att:M.att, flash:0, brule:0, tirT:rnd(1.5, 3), etat:'descend', dx:0 });
}
// ------------------------------------------------------------------ une image (60 par seconde)
function pas(dt) {
  if (!J || J.etat !== 'jeu') return;
  J.t += dt; const E = J.effets; for (const k in E) { E[k] -= dt; if (E[k] <= 0) delete E[k]; }
  const raqY = H - 32, lw = largeur();
  // 15/11 soir (retour de l'utilisateur) : c'est le JOUEUR qui lance (clic, toucher, Espace) ; les dés en main se rechargent tout seuls
  if (J.reserve < maxReserve()) { J.prochainLancer -= dt; if (J.prochainLancer <= 0) { J.reserve++; J.prochainLancer = cadence(); } }
  if (J.gauche) J.raq.x = Math.max(25, J.raq.x - 330 * dt); if (J.droite) J.raq.x = Math.min(W - 25, J.raq.x + 330 * dt);
  if (J.aLancer > 0) { J.fileT = (J.fileT || 0) - dt; if (J.fileT <= 0) { lancerDe(raqY); J.aLancer--; J.fileT = .11; } }
  J.balles.forEach(b => { if (b.vie != null) b.vie -= dt; });
  // apparitions et boss
  J.prochainSpawn -= dt; if (J.prochainSpawn <= 0 && J.t < DUREE + 60) spawn();
  if (!J.boss && J.t >= BOSS_A) { J.boss = true; ajoute('titan', W / 2, -50); son('vague', true); texte(W / 2, H / 3, '🔥 LE TITAN DE FEU !', '#ff7a4a', 2.5); }
  // talents qui tournent
  if (J.heros === 'pip') { J.regenT -= dt; if (J.regenT <= 0) { J.regenT = 15; soigne(1); } }
  if (J.heros === 'aldric') J.gardeT = Math.max(0, J.gardeT - dt);
  if (L('foudre')) { J.foudreT -= dt; if (J.foudreT <= 0) { J.foudreT = Math.max(1.5, 4 - L('foudre') * .5); const m = J.monstres.slice().sort((a, b) => b.y - a.y)[0]; if (m) { blesse(m, 4 + L('foudre') * 2, '#ffe14a'); J.eclats.push({ foudre:true, x:m.x, y:m.y, v:.25 }); son('magie'); } } }
  // les monstres
  const lent = E.gel ? .4 : 1;
  for (const m of J.monstres) {
    const M = MONSTRES[m.k]; if (m.flash > 0) m.flash -= dt;
    if (m.brule > 0) { m.brule -= dt; m.bruleT = (m.bruleT || 0) - dt; if (m.bruleT <= 0) { m.bruleT = 1; blesse(m, L('feu'), '#ff9a4a'); } }
    if (M.plonge && m.etat === 'descend' && m.y > 170) { m.etat = 'plonge'; const dx = J.raq.x - m.x; m.dx = Math.sign(dx) * Math.min(90, Math.abs(dx)); texte(m.x, m.y - 20, '!', '#ff7a7a', .6); }
    if (M.tire && m.y > 90 && m.y < 230) { m.tirT -= dt; if (m.tirT <= 0) { m.tirT = rnd(2.2, 3.4) / (1 + J.t / 300); const dx = J.raq.x - m.x, dy = raqY - m.y, d = Math.hypot(dx, dy); J.tirs.push({ x:m.x, y:m.y + 10, vx:dx / d * 150, vy:dy / d * 150, r:6 }); son('magie'); } }
    const vy = (m.etat === 'plonge' ? 190 : M.tire && m.y > 150 && m.y < 230 ? 4 : m.v) * lent * (M.boss && m.y > 120 ? .25 : 1);
    m.y += vy * dt; m.x += m.dx * dt;
    if (M.boss && m.y > 120) { m.tirT -= dt; if (m.tirT <= 0) { m.tirT = 2; for (let i = -2; i <= 2; i++) { const a = Math.PI / 2 + i * .28; J.tirs.push({ x:m.x, y:m.y + 30, vx:Math.cos(a) * 140, vy:Math.sin(a) * 140, r:8 }); } son('gros'); } }
    if (m.y + m.r >= raqY - 4) { coupRempart(m.att, m.x); m.mort = true; m.sansGemme = true; }
  }
  // les crachats de feu : il faut les ÉVITER avec le bouclier… ou les détruire avec une orbe
  for (const f of J.tirs) { f.x += f.vx * dt; f.y += f.vy * dt;
    if (f.y > raqY - 8 && f.y < raqY + 12 && Math.abs(f.x - J.raq.x) < lw / 2 + f.r) { f.fin = true; coupRempart(1, f.x, true); }
    if (f.y > H + 10 || f.x < -10 || f.x > W + 10) f.fin = true; }

// ------------------------------------------------------------------ l'écran
function ecranJeu() {
  $('app').innerHTML = `<div class="hud"><a href="#" onclick="pause();return false">⏸</a><div class="mid"><span>⏳ <b id="hT"></b></span><span>❤ <b id="hPV"></b></span><span>⬆ <b id="hN"></b></span><span>⭐ <b id="hS"></b></span></div><button onclick="regles(true)">❓</button></div>

    <div class="zone" id="zone"><canvas id="cv"></canvas></div><div class="bas" id="bas"></div>`;

    <ol><li><b>D’où viennent tes dés ?</b> Tu as 3 dés en main (« TES DÉS », en bas à gauche) ; le prochain est posé sur ton bouclier. <b>Clique, touche l’écran ou appuie sur Espace</b> pour le lancer : il tire une de tes 6 faces au hasard (montrées dans la barre du bas) et part vers le haut. Chaque dé lancé revient tout seul dans ta main au bout de quelques secondes (le cercle bleu). <b>Combos</b> : le <b>prochain dé</b> est déjà posé sur ton bouclier : tu vois sa face avant de le lancer. Le plateau « COMBO » (en bas à droite) montre <b>tes 2 derniers dés + ce prochain dé</b> (en pointillés) : si l’étiquette dorée dit « ce dé → SUITE ! », lance-le, le combo part. Chaque dé est une balle, sa valeur = ses dégâts. <b>Combinaisons</b> des derniers dés : 🎲🎲 paire (tes 2 derniers dés pareils) = une balle en double, 💥 brelan (les 3 pareils) = onde de choc sur tous les monstres, 🌠 suite (3 qui se suivent, dans n’importe quel ordre : 4-5-3) = pluie d’éclats. Forge tes faces aux niveaux ! <b>Bouge la souris</b> (ou glisse le doigt, ou les flèches) pour bouger le bouclier et renvoyer les balles.</li>
