<script>

const VERSION = '20261110-125502';
function verifieVersion() {
  fetch('version.txt?t=' + Date.now(), { cache:'no-store' }).then(r => r.ok ? r.text() : '').then(v => {
    v = (v || '').trim(); if (!v || v === VERSION || document.getElementById('majbar')) return;
    const b = document.createElement('div'); b.id = 'majbar';
    b.innerHTML = '<span><b>Nouvelle version du jeu</b><br>Ton Odyssée en cours est gardée.</span><button>Mettre à jour</button>';
    b.querySelector('button').onclick = () => { const q = new URLSearchParams(location.search); q.set('v', v); location.replace('odyssee.html?' + q); };
    document.body.appendChild(b);
  }).catch(() => {});
}
setInterval(verifieVersion, 120000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) verifieVersion(); });
</script>

<script>
// le moteur du Duel n'est pas chargé ici : les cartes de l'Odyssée appellent degats/soin seulement en combat (dans duel.html)
const log = () => {}, degats = () => {}, soin = () => {}, altere = () => {}, invoque = () => {}, adv = () => ({}), fin = () => {};
document.head.insertAdjacentHTML('beforeend', '<style>' + (typeof CSS_CARTE !== 'undefined' ? CSS_CARTE : '') + '</style>');
let R = null; // la partie en cours
const sauve = () => ecrireOdyssee(R);
const fenetre = html => { document.getElementById('fen').innerHTML = `<div class="fenetre"><div>${html}</div></div>`; };
const fermer = () => { document.getElementById('fen').innerHTML = ''; };
const NIV = ['', 'I', 'II', 'III'];

// ----------------------------------------------------------------------------------------------- accueil
// 12/11 nuit : plusieurs îles (actes). odyssee.html?ile=givre ; l'île du Givre s'ouvre après la victoire contre le Titan (?essai=1 pour l'essayer avant, prototype)
const Q = new URLSearchParams(location.search), ACTE_URL = ILES[Q.get('ile')] ? Q.get('ile') : 'brulees';
const acteDe = () => (R && R.acte) || ACTE_URL;
let ASC_CHOIX = 0;
const CH = () => ({ givre:CHRON_GIVRE, abime:CHRON_ABIME }[acteDe()] || CHRON_ODY);
const CORBIN_ABIME = {
  depart:['Je… je n’aime pas ici. Je le dis tout de suite, comme ça c’est dit.', 'Pas un bruit. Pas une souris. Rien. C’est pire que le froid.', 'Un roi sans visage. Comment on sait s’il est content ?'],
  porte_fermee:['Deux serrures dans une porte qui n’existe pas. Logique.', 'Les élites ont les fragments. L’une d’elles a ta tête, je te préviens.'],
  boss_vaincu:['On… on a gagné ? Contre le RIEN ? Je vais le raconter pendant cent ans.', 'La lumière revient ! Miaou ! MIAOU !'],
  vivres_bas:['La lanterne baisse. Ici, c’est vraiment la seule lumière. Vraiment.', 'Si elle s’éteint, je te griffe. Gentiment. Pour qu’on sache qu’on existe encore.'],
};
const CORBIN_GIVRE = {
  depart:['Brrr. Je retire tout ce que j’ai dit sur les Terres brûlées. Il faisait bon, là-bas.', 'De la neige jusqu’aux genoux. Enfin, jusqu’à MES genoux. Et j’ai des petites pattes.', 'Une Vouivre. Évidemment. Pourquoi pas une gentille souris, pour une fois ?'],
  porte_fermee:['Deux serrures gelées. Les élites ont les fragments. Le Yéti a l’air… très grand.', 'On ne force pas une porte de glace. Elle te force, elle.'],
  boss_vaincu:['Elle fond ! Elle FOND ! Je savais que la chaleur de mon amitié suffirait.', 'L’île dégèle. Mes coussinets aussi. Miaou.'],
  vivres_bas:['La lanterne baisse, et ici le noir est glacé. Je déteste deux fois plus.', 'Plus d’huile, plus de chaleur. On se dépêche ?'],
};
function accueil() {
  const r = lireOdyssee(), rec = lireRecords(), col = lireCollection();
  if (r) { R = r; dejaDessine = new Set(); R.ile.flat().forEach(c => { if (c.vu) dejaDessine.add(c.x + ',' + c.y); }); if (R.combat && !R.combat.resultat) { location.href = 'duel.html?odyssee=1'; return; } if (R.combat && R.combat.resultat) { dessine(); apresCombat(); return; } dessine(); return; }
  document.body.classList.toggle('givre', ACTE_URL === 'givre'); document.body.classList.toggle('abime', ACTE_URL === 'abime');
  if (ACTE_URL === 'abime' && !actesFaits().givre && !Q.get('essai')) {
    document.getElementById('app').innerHTML = `<h1>🌀 L’Odyssée · l’Abîme du Vide</h1><p style="text-align:center">🔒 L’acte III s’ouvre quand tu as vaincu <b>la Vouivre des glaces</b> (acte II, l’île du Givre).</p>
    <div class="choixh"><button onclick="location.href='odyssee.html?ile=givre'">❄️ Aller à l’île du Givre</button><button onclick="location.href='odyssee.html?ile=abime&essai=1'">🧪 L’essayer quand même (prototype)</button></div><div class="choixh"><button onclick="location.href='menu.html#odyssee'">⌂ Menu</button></div>`; return; }
  if (ACTE_URL === 'givre' && !actesFaits().brulees && !Q.get('essai')) {
    document.getElementById('app').innerHTML = `<h1>❄️ L’Odyssée · l’île du Givre</h1><p style="text-align:center">🔒 L’acte II s’ouvre quand tu as vaincu <b>le Titan de feu</b> (acte I, les Terres brûlées), avec n’importe quel héros.</p>
    <div class="choixh"><button onclick="location.href='odyssee.html'">🌋 Aller aux Terres brûlées</button><button onclick="location.href='odyssee.html?ile=givre&essai=1'">🧪 L’essayer quand même (prototype)</button></div><div class="choixh"><button onclick="location.href='menu.html#odyssee'">⌂ Menu</button></div>`; return; }
  document.getElementById('app').innerHTML = `<h1>${{ givre:'❄️ L’Odyssée · l’île du Givre', abime:'🌀 L’Odyssée · l’Abîme du Vide' }[ACTE_URL] || '🏰 L’Odyssée · les Terres brûlées'}</h1>
  <p style="text-align:center;color:var(--doux);font-size:.9em">Une île tirée au sort, à explorer case par case. Le combat, c’est le Duel. Tes PV ne remontent pas tout seuls : sources, potions et marchand. Une lanterne de 20 doses d’huile pour fouiller. Deux fragments de rune ouvrent la porte ${{ givre:"de la Vouivre des glaces. Ici, le Givre ❄ s’accumule sur toi : à trois, tu es gelé", abime:"du Roi sans visage. Ici, la Corruption 🟣 s’accumule : à trois, le Vide te dévore (Silence) et nourrit l’ennemi" }[ACTE_URL] || "du Titan de feu"}.</p>
  ${ascMax(ACTE_URL) ? `<p style="text-align:center;font-size:.9em">⛰ <b style="color:var(--or)">Ascension</b> : ${Array.from({ length:ascMax(ACTE_URL) + 1 }, (_, n) => `<button class="asc ${ASC_CHOIX === n ? 'on' : ''}" onclick="ASC_CHOIX=${n};accueil()">${n || 'normal'}</button>`).join(' ')}${ASC_CHOIX ? `<br><small style="color:var(--doux)">${Array.from({ length:ASC_CHOIX }, (_, i) => ASCENSION[i + 1].n).join(' · ')}</small>` : ''}</p>` : ''}
  <p style="text-align:center"><b style="color:var(--or)">Choisis ton héros</b></p>
  <div class="heros6">${ORDRE.map(id => id === 'zephine' && !ZOK() ? `<button onclick="location.href='duel.html?tuto=1'" style="opacity:.55"><img src="${IMG(id)}" alt="" style="filter:grayscale(1)">🔒 ${HEROS[id].nom}<br><small style="color:var(--doux)">Fais le tutoriel</small></button>` : `<button onclick="commence('${id}')"><img src="${IMG(id)}" alt="">${HEROS[id].nom}<br><small style="color:var(--doux)">${Math.round(HEROS[id].pv * (ODY_PV[id] || 1.8))} PV en Odyssée</small></button>`).join('')}</div>
  <p style="text-align:center;font-size:.86em"><label><input type="checkbox" id="jour"> 🗓 L’île du jour (la même île pour tout le monde aujourd’hui)</label></p>
  <div class="choixh"><button onclick="records()">🏆 Mes Odyssées (${rec.length})</button><button onclick="collection()">📚 Ma collection (${col.length})</button></div>
  <div class="choixh"><button onclick="location.href='odyssee-regles.html'">📖 Les règles complètes</button><button onclick="location.href='menu.html'">⌂ Menu</button></div>`;
}
function commence(id) {
  const jour = document.getElementById('jour') && document.getElementById('jour').checked;
  R = nouvelleOdyssee(id, jour ? graineDuJour() + (ACTE_URL !== 'brulees' ? '-' + ACTE_URL : '') : null, ACTE_URL, ASC_CHOIX); if (!R) { alert('Impossible de tirer une île : réessaie.'); return; }
  dejaDessine = new Set(); bulles = []; sauve(); dessine();
  chronique([CH().arrivee(HEROS[id].nom)], () => { dialogue('depart'); fenetre(`<h2>⛵ Débarquement</h2><p>${HEROS[id].nom} pose le pied sur ${ILE(R).nom}. ${{ givre:'La glace craque, le vent mord, l’aurore danse au-dessus du château de glace.', abime:'Le silence est total. Sous tes pieds, le gouffre ; au-dessus, un trône.' }[R.acte] || 'Le ciel est rouge, la roche fume.'}</p>
  <p>Touche une salle <b style="color:var(--ok)">verte</b> : le héros y marche et l’île se dessine devant lui. Tu vois le <b>type</b> des salles voisines, jamais ce qu’elles cachent. Touche-la une première fois pour voir le trajet et son coût, une seconde fois pour y aller. Chaque case nouvelle brûle <b>1 dose d’huile 🪔</b> (la lumière autour du héros rétrécit quand la lanterne se vide) ; revenir est gratuit.</p>
  <p>Le chemin direct fait ${R.direct} cases. La porte 🚪 ${{ givre:'de la Vouivre', abime:'du Roi' }[R.acte] || 'du Titan'} 👑 est tout en haut : il te faut <b>2 fragments de rune</b>, gardés par les 3 élites 💀 de l’île.</p>
  <div class="choixh"><button class="or" onclick="fermer()">En route !</button></div>`); });

// ----------------------------------------------------------------------------------------------- l'île
function dessine() {
  const r = R, h = HEROS[r.heros];
  document.body.classList.toggle('givre', r.acte === 'givre'); document.body.classList.toggle('abime', r.acte === 'abime'); SALLES_ODY.boss.n = ILE(r).bossNom;
  const ok = (x, y) => peutAller(r, x, y);
  const cases = r.ile.map(l => l.map(c => {
    const cls = ['k', c.t, c.vu ? 'vu' : 'inconnue', c.visite ? 'visite' : '', c.fait ? 'fait' : '', ok(c.x, c.y) ? 'ok' : '', r.pos.x === c.x && r.pos.y === c.y ? 'ici' : ''].join(' ');
    if (r.pos.x === c.x && r.pos.y === c.y) return `<div class="${cls}"><img src="${IMG(r.heros)}" alt=""></div>`;
    if (!c.vu) return `<div class="${cls}">?</div>`;
    const ic = c.t === 'mur' && c.fait ? '💎' : c.nemesis && !c.fait ? '😈' : SALLES_ODY[c.t].e;
    return `<div class="${cls}" onclick="va(${c.x},${c.y})" title="${SALLES_ODY[c.t].n}">${c.t === 'roche' ? '' : ic}${c.t === 'monstre' && !c.fait ? `<span class="niv">${NIV[c.niv]}</span>` : ''}</div>`;
  }).join('')).join('');
  document.getElementById('app').innerHTML = `
  <div id="entete">${enteteHTML()}</div>

function sacocheIle(i) { const k = R.sacoche[i]; if (k === 'soin') { fenetre(`<h2>🧪 Potion de soin</h2><p>La boire maintenant : +10 PV (❤ ${R.pv} → ${Math.min(R.pvMax, R.pv + 10)}).</p><div class="choixh"><button class="or" onclick="R.sacoche.splice(${i},1);R.pv=Math.min(R.pvMax,R.pv+10);R.journal.push('🧪 Potion bue sur la carte : +10 PV.');sauve();fermer();dessine()">Boire</button><button onclick="fermer()">Garder</button></div>`); } else info(SACOCHE[k].e + ' ' + SACOCHE[k].n, SACOCHE[k].d); }
function monDeck() { const n = {}; R.deck.forEach(k => n[k] = (n[k] || 0) + 1); fenetre(`<h2>🂠 Mon deck (${R.deck.length} cartes)</h2><div class="cartes3">${Object.keys(n).map(k => carteHTML(k, '', n[k] > 1 ? '× ' + n[k] : '')).join('')}</div><div class="choixh"><button onclick="fermer()">Fermer</button></div>`); }
function journal() { fenetre(`<h2>📜 Journal de l’île</h2><div class="journal">${[...R.journal].reverse().map(t => `<div>${t}</div>`).join('')}</div><div class="choixh"><button onclick="fermer()">Fermer</button></div>`); }
function reglesCourtes() { fenetre(`<h2>❓ L’Odyssée en bref</h2><ul style="padding-left:1.1em;font-size:.9em">
  <li>Touche une case verte : le trajet s’affiche avec son coût ; touche-la encore pour y aller. Chaque case <b>nouvelle</b> brûle 1 dose d’huile 🪔 ; lanterne vide = on avance dans le noir, 3 PV par case.</li>
  <li>Tes PV ne remontent pas entre les combats. Sources 💧 (+20), potions, marchand 🏪.</li>
  <li>Chaque victoire : de l’or et <b>une carte parmi trois</b> pour ton deck. Les élites 💀 donnent un fragment 🔮 et une clé 🗝 (coffres).</li>
  <li>2 fragments ouvrent la porte 🚪 du Titan 👑. Il ne se combat qu’une fois.</li>
  <li>Les murs fissurés 🧱 s’ouvrent avec une bombe ou 3 doses d’huile : une relique derrière.</li>
  <li>Si tu tombes, la partie s’arrête ; tu gardes les cartes rencontrées dans ta collection (éditeur de deck de la Tour des héros).</li></ul>
  <div class="choixh"><button onclick="location.href='odyssee-regles.html'">📖 Règles complètes</button><button onclick="fermer()">Fermer</button></div>`); }
function abandon() { fenetre('<h2>⏏ Quitter</h2><p>Ton Odyssée est gardée sur ce téléphone : tu la reprendras là où tu es. Ou tu peux l’abandonner (comptée comme perdue).</p><div class="choixh"><button onclick="location.href=\'menu.html\'">⌂ Menu, je reprendrai</button><button onclick="finPartie(false, \'Abandon.\')">💀 Abandonner</button></div>'); }
function finPartie(gagne, texte) {
  const nom = HEROS[R.heros].nom, C = CH(), f = finOdysseeRun(R, gagne); R = null;
  chronique([gagne ? C.victoire(nom) : C.defaite(nom), f.premiereFin ? CHRON_FIN(nom) : null], () => fenetre(`<h2>${gagne ? '🏆 L’île est libre !' : '💀 Fin de l’Odyssée'}</h2><p>${texte}</p>${f.premiereFin ? '<p style="text-align:center;font-size:1.1em">🌟 Tu reçois le titre <b style="color:var(--or)">Héros de l’Odyssée</b> !</p>' : ''}${f.ascNouveau ? `<p style="text-align:center">⛰ <b>Ascension ${f.ascNouveau}</b> débloquée sur cette île : ${ASCENSION[f.ascNouveau].n}.</p>` : ''}${f.inscrit === 'nouveau' ? `<p style="text-align:center">🏛 <b>${nom}</b> est inscrit au <b>Panthéon des Légendes</b> : titre « Briseur de Néant » et +5 PV pour ses prochaines Odyssées. Le Roi sans visage t’attend maintenant dans l’Arène.</p>` : ''}${f.briseMiroir ? `<p style="text-align:center">🪞 <b>Défi Brise-Miroir réussi !</b> Choisis une récompense pour toujours :</p><div class="choixv">${recompensesRestantes().map(k => `<button onclick="choisirRecompense('${k}');this.parentNode.innerHTML='✅ ${RECOMPENSES[k].n} : ${RECOMPENSES[k].d.replace(/'/g, '’')}'">${RECOMPENSES[k].e} <b>${RECOMPENSES[k].n}</b><small>${RECOMPENSES[k].d}</small></button>`).join('')}</div>` : ''}<div class="score">${f.score} points</div>
  <table><tr><td>Cases explorées</td><td>${f.cases}</td></tr><tr><td>Combats gagnés</td><td>${f.victoires} / ${f.combats}</td></tr><tr><td>Tours joués</td><td>${f.tours}</td></tr><tr><td>Défis réussis</td><td>${f.defis}</td></tr><tr><td>Or restant</td><td>${f.or}</td></tr><tr><td>Durée</td><td>${f.duree} min</td></tr></table>
  <p>${f.ajoutees ? `📚 <b>${f.ajoutees}</b> carte${f.ajoutees > 1 ? 's' : ''} rejoi${f.ajoutees > 1 ? 'gnent' : 'nt'} ta collection : ${f.nouvelles.map(k => CARTES[k].n).join(', ')}.` : 'Aucune carte nouvelle pour la collection cette fois.'}</p>
  <div class="choixh"><button class="or" onclick="fermer();accueil()">Nouvelle Odyssée</button><button onclick="location.href='menu.html'">⌂ Menu</button></div>`));
}
function records() { const l = lireRecords(); fenetre(`<h2>🏆 Mes Odyssées (${l.length})</h2>${l.length ? `<table>${l.map(r => `<tr><td>${r.gagne ? '🏆' : '💀'} ${new Date(r.quand).toLocaleDateString('fr-FR')} · ${HEROS[r.heros].nom} · ${r.cases} cases, ${r.victoires} victoires, ${r.duree} min</td><td>${r.score}</td></tr>`).join('')}</table>` : '<p>Aucune Odyssée finie.</p>'}<div class="choixh"><button onclick="fermer()">Fermer</button></div>`); }
function collection() { const l = lireCollection(); fenetre(`<h2>📚 Ma collection (${l.length})</h2><p style="font-size:.86em;color:var(--doux)">Les cartes rencontrées en Odyssée. Elles s’ajoutent à l’éditeur de deck de la Tour des héros.</p><div class="cartes3">${l.map(k => carteHTML(k)).join('') || '<i>Rien encore : pars en Odyssée !</i>'}</div><div class="choixh"><button onclick="fermer()">Fermer</button></div>`); }
accueil();
// 13/11 soir : musique de la carte (Terres brûlées : folk médiéval ; Givre et Abîme : la vallée des vents) ; le marchand a la sienne jusqu'à la fermeture de sa fenêtre
{ const ile = new URLSearchParams(location.search).get('ile'); GM.musique(ile === 'givre' || ile === 'abime' ? 'vent' : 'carte'); GM.bouton();
  const fen = document.getElementById('fen'); if (fen) new MutationObserver(() => { if (!fen.textContent.trim()) GM.retour(); }).observe(fen, { childList:true }); }
</script>
</body>
</html>
