  if (n) { joueFx(); if (sel && sel.t === 'de' && !S.des[sel.k]) sel = null; rafraichit(); }
}
addEventListener('resize', () => { if (S && document.getElementById('plateau')) { geometrie(); dessinePlateau(); } });
// ---------------------------------------------------------------- la fin du niveau
function fin() {
  if (!S || finMontree === true) return; finMontree = true;
  const g = S.fini === 'gagne', e = P.etoiles(S), n = S.niveau, d = lire(), avant = d.et[n] || 0, nouvHeros = [];
  let xp = g ? 10 + 5 * e : 5, or = g ? 10 + 5 * e : 0;
  if (g && !avant) { xp += 30 + 10 * n; or += 20 + 10 * n; }
  if (g) { d.et[n] = Math.max(avant, e); if (n < P.NIVEAUX.length && d.max < n + 1) d.max = n + 1;
    const h = ORDRE_HEROS[n]; if (h && !d.heros.includes(h)) { d.heros.push(h); nouvHeros.push(h); } }
  ecrire(d);
  try { if (typeof gagneXP === 'function') gagneXP(xp, g ? `Rempart des runes · niveau ${n}` : 'Rempart des runes'); } catch (x) {}
  try { if (or && typeof donneRessources === 'function') donneRessources(or, 0); } catch (x) {}
  try { if (g && typeof guildeEvt === 'function') guildeEvt('rempart', 1, { heros:S.av || S.heros, voie:S.heros }); } catch (x) {}
  try { if (typeof guildeJournal === 'function') guildeJournal('rempart', { heros:S.av || S.heros, resultat:S.fini, journal:[...S.log].reverse(), resume:{ niveau:n, etoiles:e, rempart:Math.ceil(S.rempart), rempartMax:S.rempartMax, abattus:S.kills, duree:Math.round(S.t) } }); } catch (x) {}
  try { GM.jingle(g ? 'victoire' : 'defaite'); } catch (x) {}
  const suiv = g && n < P.NIVEAUX.length;
  fen.innerHTML = '';
  fenetre(`<h2>${g ? '🏆 Le rempart a tenu !' : '💥 Le rempart est tombé…'}</h2>
    ${g ? `<div class="etoiles">${[1, 2, 3].map(k => `<span class="${k <= e ? 'on' : ''}">★</span>`).join('')}</div>` : ''}
    <p>Niveau ${n} · ${S.L.n} · rempart ${Math.ceil(S.rempart)}/${S.rempartMax} PV · monstres abattus : ${S.kills}.</p>
    <p>✨ +${xp} XP de la Guilde${or ? ` · 🪙 +${or} d’or` : ''}${g && !avant ? ' (première victoire !)' : ''}</p>
    ${g ? '<p class="doux">★ la victoire · ★★ le rempart à 45 % ou plus · ★★★ à 75 % ou plus.</p>' : '<p class="doux">Astuce : touche un monstre pour savoir ce qui le contre.</p>'}
    ${nouvHeros.map(h => `<p>🎉 <b>${HEROS[h].nom}</b> te rejoint au Rempart${h === 'zephine' && !zOk() ? ' (après le tutoriel du Duel)' : ''} !</p>`).join('')}
    ${g && n === P.NIVEAUX.length ? '<p>👑 Le premier monde est sauvé ! Le mode sans fin arrive bientôt.</p>' : ''}
    <div class="bts"><button onclick="rejouer()">↺ Rejouer</button>${suiv ? `<button class="go" onclick="suivant()">Niveau ${n + 1} ›</button>` : ''}<button onclick="fen.innerHTML='';accueil()">Retour</button></div>`);
}
function rejouer() { const n = S.niveau; fen.innerHTML = ''; demarre(n, cleH); }
function suivant() { const n = S.niveau + 1; fen.innerHTML = ''; demarre(n, herosOk(cleH) ? cleH : 'maelle'); }
// ---------------------------------------------------------------- l'accueil : le configurateur
let choixH = localStorage.getItem('guilde-config-rempart-heros') || 'maelle';
function choisitH(k) { if (!herosOk(k)) return; choixH = k; try { localStorage.setItem('guilde-config-rempart-heros', k); } catch (e) {} CFG.dessine(); }
function defRempart() {
  const d = lire(), etT = Object.values(d.et).reduce((a, x) => a + x, 0);
  return { jeu:'rempart', racine:'app', titre:'🏰 Le Rempart des runes', retour:'menu.html', regles:'regles()',
    heros:() => ORDRE_HEROS.map(h => herosOk(h) ? `<button class="${choixH === h ? 'on' : ''}" onclick="choisitH('${h}')"><img src="portraits/${h}.webp" alt="">${HEROS[h].nom}</button>`
        : `<button disabled><img src="portraits/${h}.webp" alt="" style="filter:grayscale(1)">🔒 ${HEROS[h].nom}<small>${d.heros.includes(h) ? 'après le tutoriel' : `niveau ${ORDRE_HEROS.indexOf(h)} gagné`}</small></button>`).join('')
      + haListe().map(a => haInfo('av:' + a.id)).filter(i => i && herosOk(i.cle)).map(i => `<button class="${choixH === i.cle ? 'on' : ''}" onclick="choisitH('${i.cle}')">${haImg(i, `box-shadow:0 0 0 2px ${i.couleur}`)}${haEsc(i.nom)}<small>voie de ${HEROS[i.voie].nom}</small></button>`).join(''),
    fiche:() => { const v = haVoie(choixH), H = P.HEROS_R[v]; return `🛡 <b>${haInfo(choixH) ? haEsc(haInfo(choixH).nom) : HEROS[v].nom}</b><br>${nbsp(H.passif)}<br>⚡ <b>Ultime : ${H.ultime}</b> · ${nbsp(H.ud)}<br><span class="doux">Les autres héros te rejoignent au fil des niveaux gagnés.</span>`; },
    modes:[
      { k:'monde', e:'🌿', n:'Le premier monde', img:'menu-recu/rempart-monde.webp', desc:() => nbsp('Les monstres descendent cinq chemins vers le rempart, sans s’arrêter. Bâtis tes tours avec ton énergie ◆, fais-les monter avec les dés qui roulent, et tiens jusqu’à la dernière vague. Cinq niveaux, le Titan de feu au bout.'),
        pas:() => [`🏰 Niveau ${Math.min(d.max, P.NIVEAUX.length)} sur ${P.NIVEAUX.length}`, `★ ${etT} étoile${etT > 1 ? 's' : ''} sur ${P.NIVEAUX.length * 3}`] },
      { k:'sansfin', e:'♾', n:'Sans fin', img:'menu-recu/rempart-sansfin.webp', desc:() => 'Les vagues ne s’arrêtent jamais. Bientôt !', verrou:() => 'Bientôt' } ],
    options:m => [{ k:'niveau', titre:'🏰 Le niveau', aide:'Chaque niveau gagné ouvre le suivant et débloque quelque chose.',
      choix:P.NIVEAUX.map((L, i) => ({ v:i + 1, n:`${i + 1}${d.et[i + 1] ? ' ' + '★'.repeat(d.et[i + 1]) : ''}`, d:nbsp(`${L.n} · ${L.debloque}`), dis:i + 1 > d.max })), def:Math.min(d.max, P.NIVEAUX.length) }],
    resume:(m, o) => `🏰 Niveau ${o.niveau} · ${P.NIVEAUX[o.niveau - 1].n} · <b>${haInfo(choixH) ? haEsc(haInfo(choixH).nom) : HEROS[haVoie(choixH)].nom}</b>`,
    lancer:(m, o) => { if (!herosOk(choixH)) { choixH = 'maelle'; } demarre(o.niveau || 1, choixH); } };
}
function accueil() { cancelAnimationFrame(boucle); S = null; sel = null; app.classList.remove('jeu'); if (!herosOk(choixH)) choixH = 'maelle'; CFG.ouvre(defRempart()); try { GM.musique('menu'); GM.retour && GM.retour(null); } catch (e) {} }
accueil();
</script>
