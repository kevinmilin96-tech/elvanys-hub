<script>
// =============================================================================================== LA CRYPTE AUX SCEAUX (15/11, écran)
// Le moteur (règles, hasard, monstres) est dans crypte-moteur.js ; ici seulement le dessin et les gestes.
const HER = {
  maelle:{ n:'Maëlle', c:'#ff8a2a' }, aldric:{ n:'Sire Aldric', c:'#ffd27a' }, pip:{ n:'Pip', c:'#c58bff' },
  oria:{ n:'Oria', c:'#5ff5e6' }, gorm:{ n:'Gorm', c:'#4f8bff' }, zephine:{ n:'Zéphine', c:'#ff4040' },
};
const ZEPH_OK = () => localStorage.getItem('guilde-tuto') === 'fait';
const CLE = 'guilde-crypte', jour = () => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`; };
const lire = () => { try { return Object.assign({ parties:0, victoires:0, meilleur:0, jours:{}, heros:'maelle' }, JSON.parse(localStorage.getItem(CLE) || '{}')); } catch (e) { return { parties:0, victoires:0, meilleur:0, jours:{}, heros:'maelle' }; } };
const ecrire = d => { try { localStorage.setItem(CLE, JSON.stringify(d)); } catch (e) {} };
const son = k => { try { if (typeof GM !== 'undefined') GM.son(k); } catch (e) {} };
const $ = id => document.getElementById(id);
const C = CRYPTE;
let S = null, sel = null, mode = null, duJour = false, choixH = haValide(lire().heros, ZEPH_OK());
// 15/11 soir : les HÉROS D'AVENTURE (heros-aventure.js). choixH peut valoir 'av:<id>' : le moteur joue sa VOIE (vJ),
// la progression va à SON id (pJ), l'écran montre SON portrait et SON nom (herosS).
const vJ = () => haVoie(choixH), pJ = () => haProg(choixH);
// le héros affiché d'une partie : S.av (ou DR.av dans la Descente) s'il existe encore, sinon le héros de base de la voie
function herosS(s) {
  const av = (s && s.av) || (typeof DR !== 'undefined' && DR && DR.av) || null, i = av ? haInfo('av:' + av) : null;
  return i ? { nom:i.nom, img:haImg(i), prog:i.id, voie:s.heros, c:i.couleur, av:i.id } : { nom:HER[s.heros].n, img:`<img src="portraits/${s.heros}.webp" alt="">`, prog:s.heros, voie:s.heros, c:HER[s.heros].c, av:null };
}
// les boutons du choix du héros : les 6 de base, puis les héros d'aventure
