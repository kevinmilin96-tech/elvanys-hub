<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="robots" content="noindex">
<title>Essai — les dés runiques</title>
<style>
  :root { --or: #e3b65a; --bleu: #7fd4ff; --encre: #f5ecd8; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #1a1410; color: var(--encre); font-family: Georgia, 'Times New Roman', serif; touch-action: none; }
  #scene { position: fixed; inset: 0; background: radial-gradient(ellipse at 50% 45%, #5a4330 0%, #36271b 55%, #1a1410 100%); }
  canvas { display: block; width: 100%; height: 100%; }
  .haut { position: fixed; top: 0; left: 0; right: 0; padding: 14px 16px 0; text-align: center; pointer-events: none; }
  .haut h1 { margin: 0; font-size: 20px; letter-spacing: .04em; color: var(--or); text-shadow: 0 2px 6px #000; }
  .haut p { margin: 4px 0 0; font-size: 13px; opacity: .8; }
  .valeurs { position: fixed; left: 0; right: 0; top: 64px; text-align: center; font-size: 30px; font-weight: bold; color: var(--bleu); text-shadow: 0 0 12px #2a8cff, 0 2px 4px #000; min-height: 40px; pointer-events: none; }
  .bas { position: fixed; left: 0; right: 0; bottom: 0; padding: 10px 12px 16px; background: linear-gradient(transparent, rgba(0,0,0,.75) 30%); }
  .sacs { display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; margin-bottom: 10px; }
  .sac { display: flex; flex-direction: column; align-items: center; gap: 3px; }
  .sac small { font-size: 10px; opacity: .7; }
  .sac .faces { display: flex; gap: 2px; }
  .sac i { font-style: normal; width: 16px; height: 18px; border-radius: 4px; display: grid; place-items: center; font-size: 11px; font-family: system-ui, sans-serif; background: #2e4a66; color: #cfeeff; border: 1px solid #4f7ea6; }
  .sac i.sorti { background: #2a2420; color: #6b5d4f; border-color: #3a322b; text-decoration: line-through; }
  .sac i.dernier { background: #4fb3ff; color: #08263f; border-color: #bfe7ff; }
  .ligne { display: flex; gap: 8px; justify-content: center; align-items: center; }
  button { font-family: inherit; border: 0; border-radius: 12px; padding: 12px 18px; font-size: 16px; cursor: pointer; }
  .lancer { background: linear-gradient(#f0c96e, #c8902f); color: #2a1a08; font-weight: bold; min-width: 140px; box-shadow: 0 3px 0 #7a5418, 0 6px 14px rgba(0,0,0,.5); }
  .lancer:disabled { opacity: .5; }
  .petit { background: #3b2e24; color: var(--encre); padding: 10px 12px; font-size: 14px; }
  .nb { display: flex; gap: 4px; }
  .nb button { padding: 8px 11px; background: #3b2e24; color: var(--encre); }
  .nb button.on { background: var(--or); color: #2a1a08; }
  .aide { text-align: center; font-size: 12px; opacity: .65; margin-top: 8px; }
</style>
</head>
<body>
<div id="scene"></div>
<div class="haut"><h1>Les dés runiques</h1><p>Essai du lancer · La Guilde des Runes</p></div>
<div class="valeurs" id="valeurs"></div>
<div class="bas">
  <div class="sacs" id="sacs"></div>
  <div class="ligne">
    <div class="nb" id="nb"></div>
    <button class="lancer" id="lancer">Lancer</button>
    <button class="petit" id="raz" title="Remettre les sacs à zéro">↺ Sacs</button>
  </div>
  <div class="ligne" style="margin-top:8px">
    <button class="petit" id="jeu">🎲 Dés de la Guilde</button>
  </div>
  <div class="aide">Glissez le doigt vers le haut pour lancer · touchez un dé pour le garder (il ne sera pas relancé)</div>
</div>
<script type="importmap">{ "imports": { "three": "./three.module.min.js" } }</script>
<script type="module">
import * as THREE from 'three';
import { RoundedBoxGeometry } from './RoundedBoxGeometry.js';

// ---- Scène
const hote = document.getElementById('scene');
const rendu = new THREE.WebGLRenderer({ antialias: true, alpha: true });
rendu.setPixelRatio(Math.min(2, window.devicePixelRatio || 1));
rendu.shadowMap.enabled = true;
rendu.shadowMap.type = THREE.PCFSoftShadowMap;
rendu.outputColorSpace = THREE.SRGBColorSpace;
hote.appendChild(rendu.domElement);
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(38, 1, 0.1, 100);
camera.position.set(0, 15, 6);
camera.lookAt(0, 0, 0.3);

scene.add(new THREE.AmbientLight(0xfff1dc, 0.55));
const soleil = new THREE.DirectionalLight(0xffd6a0, 2.2); // lumière chaude de la forge
soleil.position.set(-4, 9, 4); soleil.castShadow = true;
soleil.shadow.mapSize.set(1024, 1024);
Object.assign(soleil.shadow.camera, { left: -6, right: 6, top: 6, bottom: -6 });
scene.add(soleil);
const reflet = new THREE.DirectionalLight(0x7fc8ff, 0.9); // reflet bleu magique
reflet.position.set(5, 4, -3); scene.add(reflet);
const sol = new THREE.Mesh(new THREE.PlaneGeometry(40, 40), new THREE.ShadowMaterial({ opacity: 0.45 }));
sol.rotation.x = -Math.PI / 2; sol.receiveShadow = true; scene.add(sol);

function taille() {
  const w = window.innerWidth, h = window.innerHeight;
  rendu.setSize(w, h); camera.aspect = w / h;
  camera.fov = w < h ? 41 : 26; camera.updateProjectionMatrix();
}
window.addEventListener('resize', taille); taille();

// ---- Le dé : faces 1 à 6 (BoxGeometry : +x, -x, +y, -y, +z, -z) ; faces opposées = 7
const VALEUR_DE_FACE = [3, 4, 1, 6, 2, 5];
const NORMALE = { 1: [0, 1, 0], 6: [0, -1, 0], 2: [0, 0, 1], 5: [0, 0, -1], 3: [1, 0, 0], 4: [-1, 0, 0] };
const chargeur = new THREE.TextureLoader();
const tex = (f) => { const t = chargeur.load(f); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 4; return t; };
// Jeux de dés : les dés communs de la Guilde, et les dés de chaque héros (pierre + rune + couleur à lui)
const JEUX = {
  commun: { nom: 'Dés de la Guilde', dossier: 'faces', lueur: 0x9fdcff, force: 1.1 },
  pip: { nom: 'Dés de Pip', dossier: 'faces-pip', lueur: 0xd29bff, force: 0.8 },
  aldric: { nom: "Dés d'Aldric", dossier: 'faces-aldric', lueur: 0xffd27a, force: 0.7 },
  oria: { nom: "Dés d'Oria", dossier: 'faces-oria', lueur: 0x5ff5e6, force: 0.75 },
};
const cacheMat = {};
function matieres(cle) {
  if (cacheMat[cle]) return cacheMat[cle];
  const j = JEUX[cle];
  cacheMat[cle] = VALEUR_DE_FACE.map((v) => new THREE.MeshStandardMaterial({
    map: tex(`${j.dossier}/face-${v}.webp?v=2`), emissiveMap: tex(`${j.dossier}/lueur-${v}.webp?v=2`), emissive: new THREE.Color(j.lueur), emissiveIntensity: j.force,
    roughness: 0.55, metalness: 0.05,
  }));
  return cacheMat[cle];
}
let jeu = 'commun';
const MATIERES = matieres('commun');
const geo = new RoundedBoxGeometry(1, 1, 1, 4, 0.09);
const anneauGeo = new THREE.TorusGeometry(0.78, 0.05, 8, 48);
const anneauMat = new THREE.MeshBasicMaterial({ color: 0xffd36b });

const des = [];
function creerDe() {
  const m = new THREE.Mesh(geo, matieres(jeu)); m.castShadow = true;
  const anneau = new THREE.Mesh(anneauGeo, anneauMat); anneau.rotation.x = Math.PI / 2; anneau.position.y = 0.02; anneau.visible = false;
  scene.add(m); scene.add(anneau);
  return { m, anneau, garde: false, valeur: 0, sac: [1, 2, 3, 4, 5, 6], sortis: [], anim: null };
}

// ---- Le sac de faces (visible) : une face sortie ne revient qu'une fois les 6 sorties
function tirer(d) {
  if (!d.sac.length) { d.sac = [1, 2, 3, 4, 5, 6]; d.sortis = []; }
  const i = Math.floor(Math.random() * d.sac.length);
  const v = d.sac.splice(i, 1)[0]; d.sortis.push(v); return v;
}

// ---- Placement et lancer
let nombre = 3;
// Disposition : 3 dés au plus par rangée (4 ou 5 dés = deux rangées), pour tenir sur un téléphone en hauteur
function place(i, n) {
  const rangs = n > 3 ? [3, n - 3] : [n];
  const r = i < rangs[0] ? 0 : 1; const k = r ? i - rangs[0] : i; const nr = rangs[r];
  const z = rangs.length > 1 ? (r ? 1.2 : -0.6) : 0.25;
  return new THREE.Vector3((k - (nr - 1) / 2) * 1.6, 0.5, z);
}
function orientationFinale(v) {
  const q = new THREE.Quaternion().setFromUnitVectors(new THREE.Vector3(...NORMALE[v]), new THREE.Vector3(0, 1, 0));
  const lacet = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0, 1, 0), (Math.random() - 0.5) * 0.7);
  return lacet.multiply(q);
}
function regler(n) {
  nombre = n;
  while (des.length < n) des.push(creerDe());
  des.forEach((d, i) => {
    const visible = i < n; d.m.visible = visible; d.anneau.visible = visible && d.garde;
    if (visible && !d.valeur) { d.valeur = tirer(d); d.m.quaternion.copy(orientationFinale(d.valeur)); }
    if (visible) { d.m.position.copy(place(i, n)); d.anneau.position.set(d.m.position.x, 0.02, d.m.position.z); }
  });
  dessinerNb(); dessinerSacs(); afficherValeurs();
}

let enCours = 0;
function lancer() {
  if (enCours) return;
  const actifs = des.slice(0, nombre).filter((d) => !d.garde);
  if (!actifs.length) return;
  document.getElementById('lancer').disabled = true;
  document.getElementById('valeurs').textContent = '';
  actifs.forEach((d, k) => {
    const i = des.indexOf(d);
    d.valeur = tirer(d);
    const fin = place(i, nombre);
    const depart = new THREE.Vector3(fin.x * 0.4 + (Math.random() - 0.5) * 2, 2.2, 6.5 + Math.random());
    const axe = new THREE.Vector3(Math.random() - 0.5, Math.random() - 0.5, Math.random() - 0.5).normalize();
    d.anim = { t0: performance.now() + k * 70, duree: 1150 + Math.random() * 350, depart, fin, axe, tours: Math.PI * (5 + Math.random() * 3), qFin: orientationFinale(d.valeur), rebonds: 2 + Math.floor(Math.random() * 2) };
    enCours += 1;
  });
  vibrer(25);
}
const easeOut = (t) => 1 - Math.pow(1 - t, 3);
function animer(now) {
  for (const d of des) {
    const a = d.anim; if (!a) continue;
    const t = Math.min(1, Math.max(0, (now - a.t0) / a.duree));
    const e = easeOut(t);
    d.m.position.lerpVectors(a.depart, a.fin, e);
    d.m.position.y = 0.5 + Math.abs(Math.sin(Math.PI * a.rebonds * e)) * 1.6 * Math.pow(1 - e, 1.6) + (1 - e) * (a.depart.y - 0.5) * 0.3;
    const reste = new THREE.Quaternion().setFromAxisAngle(a.axe, a.tours * (1 - e));
    d.m.quaternion.copy(a.qFin).multiply(reste);
    if (t >= 1) { d.anim = null; d.m.position.copy(a.fin); d.m.quaternion.copy(a.qFin); enCours -= 1; if (!enCours) fini(); }
  }
}
function fini() {
  document.getElementById('lancer').disabled = false;
  dessinerSacs(); afficherValeurs(); vibrer([15, 40, 15]);
}
function afficherValeurs() {
  const v = des.slice(0, nombre).map((d) => d.valeur);
  document.getElementById('valeurs').textContent = v.join('  ·  ');
}
function vibrer(p) { try { navigator.vibrate && navigator.vibrate(p); } catch { /* rien */ } }

// ---- Interface
function dessinerNb() {
  const nb = document.getElementById('nb'); nb.innerHTML = '';
  for (let n = 1; n <= 5; n++) {
    const b = document.createElement('button'); b.textContent = n; b.className = n === nombre ? 'on' : '';
    b.title = `${n} dé${n > 1 ? 's' : ''}`; b.onclick = () => { if (!enCours) regler(n); }; nb.appendChild(b);
  }
}
function dessinerSacs() {
  const el = document.getElementById('sacs'); el.innerHTML = '';
  des.slice(0, nombre).forEach((d, i) => {
    const bloc = document.createElement('div'); bloc.className = 'sac';
    const faces = [1, 2, 3, 4, 5, 6].map((v) => {
      const sorti = d.sortis.includes(v); const dernier = sorti && d.sortis[d.sortis.length - 1] === v;
      return `<i class="${dernier ? 'dernier' : sorti ? 'sorti' : ''}">${v}</i>`;
    }).join('');
    bloc.innerHTML = `<small>Dé ${i + 1}${d.garde ? ' · gardé' : ''}</small><div class="faces">${faces}</div>`;
    el.appendChild(bloc);
  });
}
document.getElementById('lancer').onclick = lancer;
document.getElementById('jeu').onclick = () => {
  const ordre = Object.keys(JEUX); jeu = ordre[(ordre.indexOf(jeu) + 1) % ordre.length];
  const m = matieres(jeu); des.forEach((d) => { d.m.material = m; });
  document.getElementById('jeu').textContent = ({ commun: '🎲 ', pip: '🌿 ', aldric: '🔥 ', oria: '✨ ' }[jeu] || '') + JEUX[jeu].nom;
  anneauMat.color.set({ pip: 0xc58bff, aldric: 0xffd27a, oria: 0x5ff5e6 }[jeu] || 0xffd36b);
};
document.getElementById('raz').onclick = () => { if (enCours) return; des.forEach((d) => { d.sac = [1, 2, 3, 4, 5, 6]; d.sortis = []; d.valeur = 0; d.garde = false; }); regler(nombre); };

// Toucher un dé = le garder ; glisser vers le haut = lancer
const viseur = new THREE.Raycaster(); const pt = new THREE.Vector2();
let debut = null;
rendu.domElement.addEventListener('pointerdown', (e) => { debut = { x: e.clientX, y: e.clientY, t: performance.now() }; });
rendu.domElement.addEventListener('pointerup', (e) => {
  if (!debut) return; const dy = e.clientY - debut.y, dx = e.clientX - debut.x; const d0 = debut; debut = null;
  if (dy < -40 && Math.abs(dy) > Math.abs(dx)) { lancer(); return; }
  if (Math.hypot(dx, dy) > 12 || enCours) return;
  pt.set((e.clientX / window.innerWidth) * 2 - 1, -(e.clientY / window.innerHeight) * 2 + 1);
  viseur.setFromCamera(pt, camera);
  const touche = viseur.intersectObjects(des.slice(0, nombre).map((d) => d.m))[0];
  if (!touche) return;
  const d = des.find((x) => x.m === touche.object); d.garde = !d.garde; d.anneau.visible = d.garde; dessinerSacs(); vibrer(10);
  void d0;
});

regler(3);
rendu.setAnimationLoop((now) => { animer(now); rendu.render(scene, camera); });
</script>
</body>
</html>
