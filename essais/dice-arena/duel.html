<script>
// =============================================================================================== moteur
let S = null;
const adv = J => J === S.J ? S.O : S.J;
const log = t => { S.log.unshift(t); };
function joueur(id, ordi) {
  const h = HEROS[id];
  return { id, ordi, nom:h.nom, c:h.c, pv:h.pv, pvMax:h.pv, pc:1, deck:melange([...h.deck, ...GUILDE]), main:[], des:[], front:[], tours:0,
    sacs:[0, 1, 2, 3, 4].map(() => []), jauge:0, degSubis:0, bouclier:0, gardeB:0, gardeE:0, purete:0, handicap:0, saigne:0, poison:0, meute:0, braise:0, relance:1 };
}
function melange(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function pioche(J, n) { for (let i = 0; i < n; i++) { if (!J.deck.length) break; if (J.main.length >= 7) { J.deck.pop(); continue; } J.main.push(J.deck.pop()); } }
// Dés « équitables » : chaque dé a un sac de 6 faces mélangé ; il sort ses faces dans l'ordre et se remplit quand il est vide.
function lance(J, d) {
  if (!d.sac.length) d.sac.push(...melange([1, 2, 3, 4, 5, 6]));
  d.v = d.sac.shift(); d.mod = false;
  if (J.id === 'pip' && d.v === 6) ajouteMeute(J, 1);
}
function modifie(J, d, v) { d.v = v; d.mod = true; if (J.catalyseur && !S.fini) degats({ J:adv(J) }, 1); }
function ajouteMeute(J, n) {
  if (J.id !== 'pip' || J.front.some(u => u.louve)) return;
  J.meute = Math.min(3, J.meute + n); log(`Meute : ${J.meute} sur 3.`);
  if (J.meute >= 3 && J.front.length < 5) { J.meute = 0; invoque(J, { n:'La Louve', a:4, v:7, louve:true }); log('🐺 La Louve arrive sur la ligne de front !'); }
}
function invoque(J, base, key) {
  if (J.front.length >= 5) { log('Ligne de front pleine.'); return; }
  const u = { ...base, key, id:Math.random().toString(36).slice(2), pret:!!base.charge };
  if (S.salle.id === 'caserne') u.v += 1;
  u.vmax = u.v; J.front.push(u);
}
function renvoie(k) { k.J.front = k.J.front.filter(x => x !== k.u); if (k.u.key && k.J.main.length < 7) k.J.main.push(k.u.key); log(`${k.u.n} retourne dans la main.`); }
function altere(J, quoi, n) {
  if (J.purete > 0) { J.purete--; log(`${J.nom} utilise un jeton de Pureté : ${quoi} annulé.`); return; }
  if (quoi === 'handicap') { J.handicap = 1; log(`${J.nom} reçoit Handicap.`); }
  if (quoi === 'saigne') { J.saigne = Math.min(3, J.saigne + 1); log(`${J.nom} saigne.`); }
  if (quoi === 'poison') { J.poison += n; log(`${J.nom} reçoit Poison ${n}.`); }
}
const atk = (J, u) => Math.max(0, u.a + (J.banniere && u.barriere ? 2 : 0) + (u.tmp || 0) + J.front.filter(x => x.tambour && x !== u).length);
function soin(J, n) { const a = J.pv; J.pv = Math.min(J.pvMax, J.pv + n); if (J.pv > a) log(`${J.nom} se soigne de ${J.pv - a}.`); }
function soinCible(k, n) { if (k.u) { k.u.v = Math.min(k.u.vmax, k.u.v + n); log(`${k.u.n} se soigne.`); } else soin(k.J, n); }
// k = { J, u? } : la cible. ignore = passe Bouclier et Barrière (Instinct de la Louve)
function degats(k, n, ignore) {
  if (S.fini || n <= 0) return;
  if (k.u) {
    if (!k.J.front.includes(k.u)) return;
    let r = n;
    if (!ignore && k.u.bouclier) { const b = Math.min(k.u.bouclier, r); k.u.bouclier -= b; r -= b; }
    k.u.v -= r; if (r) log(`${k.u.n} subit ${r} dégât(s).`);
    if (k.u.v <= 0) {
      if (k.J.cor) { k.J.cor = false; k.u.v = 1; log(`Cor de ralliement : ${k.u.n} reste debout à 1 vie.`); }
      else { k.J.front = k.J.front.filter(x => x !== k.u); log(`${k.u.n} tombe.`); }
    }
  } else {
    const J = k.J; let r = n;
    if (!ignore) {
      if (J.esquive) { J.esquive = false; r = Math.floor(r / 2); log(`${J.nom} esquive : dégâts divisés par 2.`); }
      const g = Math.min(J.gardeB, r); J.gardeB -= g; r -= g;
      const b = Math.min(J.bouclier, r); J.bouclier -= b; r -= b;
      if (g + b) log(`Les boucliers de ${J.nom} absorbent ${g + b}.`);
    }
    J.pv -= r; if (r) log(`${J.nom} perd ${r} PV.`);
    if (r > 0) { J.degSubis = (J.degSubis || 0) + r; while (J.degSubis >= JAUGE.parDegats) { J.degSubis -= JAUGE.parDegats; remplit(J, 1); } }
    if (r > 1 && J.fournaise) { J.fournaise = false; const D = adv(J); log('Fournaise : l’adversaire subit la moitié des dégâts.'); D.pv -= Math.floor(r / 2); }
  }
  fin();
}
function remplit(J, n) { if (J.ultimeFait || J.jauge >= JAUGE.max) return; J.jauge = Math.min(JAUGE.max, (J.jauge || 0) + n); if (J.jauge >= JAUGE.max) { J.jaugeTour = J.tours; log(`⚡ La jauge d’Ultime de ${J.nom} est pleine !`); } }
function fin() { if (S.fini) return; if (S.J.pv <= 0 || S.O.pv <= 0) S.fini = S.J.pv > 0 ? 'gagne' : 'perdu'; }

function debutTour(J) {
  J.tours++; J.gardeB = 0; J.gardeE = 0; J.contre = J.piege = J.cor = J.fournaise = J.paillasse = J.esquive = false;
  J.relance = 1 + (J.boussole ? 1 : 0); J.cartesJouees = 0; J.six = 0; J.pureteTour = false; J.transmu = false; J.dernierSort = null; J.gardeFaite = false;
  if (J.tours > 1) { J.pc = Math.min(6, J.pc + 1); pioche(J, 1); }
  if (J.saigne) { log(`${J.nom} saigne : −${J.saigne * 2} PV.`); J.pv -= J.saigne * 2; fin(); }
  if (J.poison) { log(`${J.nom} : Poison, −${J.poison} PV.`); J.pv -= J.poison; J.poison--; fin(); }
  let n = Math.min(5, J.tours + 2);
  if (J.handicap) { n--; J.handicap = 0; log(`Handicap : ${J.nom} lance un dé de moins.`); }
  J.des = J.sacs.slice(0, n).map((sac, i) => ({ sac, v:0, pose:false, mod:false, i }));
  if (J.oeuvre) { J.des.forEach(d => { d.v = J.oeuvre; }); log(`Grand œuvre : tous les dés de ${J.nom} montrent ${J.oeuvre}.`); J.oeuvre = 0; }
  else if (!J.ordi && !S.auto) J.aLancer = true;
  else J.des.forEach(d => lance(J, d));
  J.front.forEach(u => { u.pret = !u.entrave; u.entrave = false; });
  log(J.aLancer ? `— Tour ${J.tours} de ${J.nom}` : `— Tour ${J.tours} de ${J.nom} : ${J.des.map(d => d.v).join(' · ')}`);
}
function coutCarte(J, k) {
  const c = CARTES[k]; let n = c.c;
  if (S.salle.id === 'echos' && J.cartesJouees === 0) n = Math.max(0, n - 1);
  if (c.t === 'e' && J.forgeGratuite) n = 0;
  return n;
}
function defDe(J, quoi) { const h = HEROS[J.id]; return quoi === 'frappe' ? FRAPPE : quoi === 'pouvoir' ? h.pouvoir : quoi === 'ultime' ? h.ultime : quoi === 'garde' ? h.garde : CARTES[quoi]; }
function ciblesPossibles(J, type) {
  const D = adv(J), vis = D.front.filter(u => !u.cachee);
  if (type === 'ennemi') return [{ J:D }, ...vis.map(u => ({ J:D, u }))];
  if (type === 'uniteE') return vis.map(u => ({ J:D, u }));
  if (type === 'allie') return [{ J }, ...J.front.map(u => ({ J, u }))];
  if (type === 'uniteA') return J.front.map(u => ({ J, u }));
  if (type === 'barriereA') return J.front.filter(u => u.barriere).map(u => ({ J, u }));
  return [];
}
function cibleValide(J, k, type) { if (k && (!k.u || k.J.front.includes(k.u))) return k; return cibleAuto(J, type); }
// Zéphine, l'alchimiste : son +1 / −1 ne coûte qu'1 PC (sa spécialité reste plus forte que celle des autres)
const coutAjuste = J => J.id === 'zephine' ? 1 : 2;
function permis(J, quoi, vs, ds) {
  if (quoi === 'pcSoins') return J.pc >= 2 && !!(J.poison || J.saigne || J.handicap);
  if (!vs.length) return false;
  const h = HEROS[J.id];
  if (quoi === 'vendre') return true;
  if (quoi === 'transmu') return J.id === 'zephine' && !J.transmu && vs.length === 1;
  if (quoi === 'pcRelance') return vs.length === 1 && J.pc >= 1;
  if (quoi === 'pcAjuste') return vs.length === 1 && J.pc >= coutAjuste(J);
  if (quoi === 'garde') return !J.gardeFaite && h.garde.cond(vs, ds);
  if (quoi === 'pouvoir') return h.pouvoir.cond(vs, ds);
  if (quoi === 'frappe') return FRAPPE.cond(vs);
  if (quoi === 'ultime') return !J.ultimeFait && J.jauge >= JAUGE.max && J.pc >= 3 && h.ultime.cond(vs, ds);
  const c = CARTES[quoi];
  if (c.t === 's' && J.silence) return false;
  if (c.t === 'u' && J.front.length >= 5) return false;
  if (c.cible && c.cible !== 'de' && !ciblesPossibles(J, c.cible).length) return false;
  if (c.cible === 'de' && !J.des.some(d => !d.pose && !(ds || []).includes(d))) return false;
  return J.pc >= coutCarte(J, quoi) && c.cond(vs, ds);
}
function pose(J, quoi, ds, k, indexMain) {
  const vs = vals(ds);
  if (quoi === 'pcRelance') { J.pc -= 1; const a = ds[0].v; lance(J, ds[0]); log(`${J.nom} paie 1 PC et relance un ${a} : ${ds[0].v}.`); return; }
  if (quoi === 'pcAjuste') { const c = coutAjuste(J); J.pc -= c; const a = ds[0].v, v = Math.max(1, Math.min(6, a + (k && k.sens || 1))); modifie(J, ds[0], v); log(`${J.nom} paie ${c} PC : ${a} devient ${v}.`); return; }
  if (quoi === 'pcSoins') { J.pc -= 2; J.poison = 0; J.saigne = 0; J.handicap = 0; log(`${J.nom} paie 2 PC : Premiers soins, plus aucune altération.`); return; }
  if (quoi === 'transmu') { J.transmu = true; const d = ds[0]; const a = d.v; modifie(J, d, opp(a)); log(`${J.nom} transmute un ${a} en ${d.v}.`); return; }
  ds.forEach(d => { d.pose = true; });
  const h = HEROS[J.id];
  if (quoi === 'vendre') { let g = 0; vs.forEach(v => g += (S.salle.id === 'autel' && v === 6) ? 2 : 1); J.pc = Math.min(6, J.pc + g); log(`${J.nom} vend ${vs.length} dé(s) : +${g} PC.`); return; }
  const six = vs.filter(v => v === 6).length; J.six += six;
  if (quoi !== 'ultime') remplit(J, vs.length * JAUGE.parDe);
  if (J.id === 'aldric' && J.six >= 2 && !J.pureteTour && J.purete < 2) { J.purete++; J.pureteTour = true; log('✦ Deux 6 posés : Aldric gagne un jeton de Pureté.'); }

    return `<div class="u ${cls}" onclick="touche({J:S.${cote},u:S.${cote}.front[${i}]})"><b>${u.n}</b><div class="tg">${tags}</div><div class="av"><span>⚔ ${atk(P, u)}</span><span>❤ ${u.v}</span></div></div>`;
  }).join('')}</div>`;
}
function actSoins() { const ok = permis(S.J, 'pcSoins', []); return `<button class="act ${ok ? 'ok' : 'non'}" onclick="vise('pcSoins')"><b>Premiers soins</b>2 PC · retire tes altérations</button>`; }
function act(quoi, titre, cout, txt) {
  const ok = sel.length && permis(S.J, quoi, vals(sel), sel);
  return `<button class="act ${ok ? 'ok' : sel.length ? 'non' : ''}" onclick="vise('${quoi}')"><b>${titre}</b>${cout} · ${txt}</button>`;
}
function sacTxt(J, d) {
  if (!d.sac || d.extra) return '';
  if (J.id === 'oria') return `ensuite : ${d.sac.length ? d.sac.slice(0, 2).join(', ') : 'sac neuf'}`;
  return `sac : ${d.sac.length ? [...d.sac].sort().join(' ') : 'neuf au prochain'}`;
}
function rendu() {
  if (!S || S.auto) return;
  const J = S.J, O = S.O, h = HEROS[J.id];
  let bandeau = '';
  if (J.aLancer) bandeau = 'Ton tour commence : lance tes dés !';
  else if (ciblage && ciblage.type === 'de') bandeau = '🎲 Touche le dé à retourner.';
  else if (ciblage) bandeau = '🎯 Touche la cible (en vert).';
  else if (attaquant) bandeau = `⚔ ${attaquant.n} attaque : touche une cible en vert.`;
  else if (sel.length) bandeau = `Dés choisis : ${vals(sel).join(', ')}. Touche où les poser (en vert).`;
  else if (J.des.some(d => !d.pose)) bandeau = '1. Touche un ou plusieurs dés. 2. Touche où les poser.';
  else bandeau = 'Tous tes dés sont posés. Attaque avec tes unités, puis « Fin du tour ».';
  document.getElementById('app').innerHTML = `
  <div class="salle"><b>${S.salle.n}</b> · ${S.salle.d}</div>
  <div class="plateau">${barre(O, true)}${front(O, true)}<div class="milieu">— ligne de front —</div>${front(J, false)}${barre(J, false)}
    <div class="des" ontouchstart="glisseDebut(event)" ontouchend="glisseFin(event)">${J.des.map((d, i) => `<div class="d ${sel.includes(d) ? 'sel' : ''} ${d.pose ? 'pose' : ''} ${d.mod ? 'mod' : ''} ${J.aLancer ? 'cache' : ''}" onclick="choisirDe(${i})"><img src="${FACE(J.id, d.v || 1)}" alt="${d.v || '?'}"><div class="sac">${sacTxt(J, d)}</div></div>`).join('')}</div>
  </div>
  ${J.aLancer ? '<button class="lancer" onclick="lancerMesDes()">🎲 Lancer les dés <span style="font-weight:normal;font-size:.75em">(ou glisse le doigt vers le haut)</span></button>' : ''}
  <div class="bandeau" ${J.aLancer ? 'style="display:none"' : ''}>${bandeau}${sel.length || ciblage || attaquant ? ' <a href="#" onclick="annuler();return false" style="color:#f3c96b">Annuler</a>' : ''}</div>
  <div class="actions">
    ${act('frappe', 'Frappe', '0 PC', 'dés identiques')}
    ${act('garde', 'Garde', '0 PC', h.garde.txt)}
    ${act('pouvoir', 'Pouvoir', '0 PC', h.pouvoir.txt)}
    ${act('ultime', 'Ultime', '3 PC', J.ultimeFait ? 'déjà joué' : J.jauge < JAUGE.max ? `jauge ${J.jauge}/${JAUGE.max}` : h.ultime.txt)}
    ${h.action ? act('transmu', h.action.n, '0 PC', J.transmu ? 'déjà fait' : h.action.txt) : ''}
    ${act('vendre', 'Vendre', '+1 PC', 'par dé')}
  </div>
  <div class="actions pc">
    ${act('pcRelance', 'Relancer', '1 PC', '1 dé')}
    ${act('pcAjuste', '+1 / −1', `${coutAjuste(J)} PC`, '1 dé')}
    ${actSoins()}
  </div>
  <div class="main" onclick="if(event.target===this){carteVue=null;rendu();}">${mainEnEventail(J)}</div>
  <div class="journal">${S.log.slice(0, 40).map(t => `<div>${t}</div>`).join('')}</div>
  <div class="bas">
    <button class="b0" onclick="regles()">❓ Règles</button>
    <button class="b1" onclick="relancer()" ${J.relance && sel.length ? '' : 'disabled style="opacity:.4"'}>🎲 Relancer (${J.relance})</button>
    <button class="b2" onclick="finDeMonTour()">Fin du tour ▶</button>
  </div>`;
  if (S.fini) montrerFin();
}
function aide(quoi) {
  const J = S.J, h = HEROS[J.id];
  let t = '';
  if (quoi === 'garde') t = `<b>${h.garde.n}</b> (0 PC, ${h.garde.txt}) : ${h.garde.d}${J.gardeFaite ? '<br><i>Déjà posée ce tour.</i>' : ''}`;
  else if (quoi === 'pouvoir') t = `<b>${h.pouvoir.n}</b> (0 PC, ${h.pouvoir.txt}) : ${h.pouvoir.d}`;
  else if (quoi === 'ultime') t = `<b>${h.ultime.n}</b> (jauge pleine + 3 PC + ${h.ultime.txt}, une fois par combat) : ${h.ultime.d}<br><i>Jauge : ${J.jauge} / ${JAUGE.max}. Elle gagne 1 point par dé posé (pas vendu) et 1 point tous les 5 dégâts que tu subis.</i>`;
  else if (quoi === 'frappe') t = `<b>Frappe</b> (0 PC, ${FRAPPE.txt}) : ${FRAPPE.d}`;
  else if (quoi === 'pcRelance') t = '<b>Relancer un dé</b> (1 PC) : choisis un dé, il est relancé. Tu peux le faire plusieurs fois, 1 PC à chaque fois.';
  else if (quoi === 'pcAjuste') t = '<b>+1 ou −1</b> (2 PC) : choisis un dé, puis ajoute ou retire 1 (un 5 devient 6 ou 4).';
  else if (quoi === 'pcSoins') t = '<b>Premiers soins</b> (2 PC) : retire Poison, Saignement et Handicap. Utile seulement si tu en as.';
  else if (quoi === 'transmu') t = `<b>${h.action.n}</b> (${h.action.txt}) : ${h.action.d}`;
  else if (quoi === 'vendre') t = 'Choisis d’abord un ou plusieurs dés, puis touche « Vendre » : chaque dé rapporte 1 PC.';
  else { const c = CARTES[quoi]; t = `<b>${c.n}</b> : coûte <b>${coutCarte(J, quoi)} PC</b> et demande <b>${c.txt}</b>. ${c.d}${c.t === 's' && J.silence ? '<br><i>Tu es réduit au Silence ce tour : pas de Sort.</i>' : ''}`; }
  fenetre(`<h2>Pas encore possible</h2><p>${t}</p><p style="color:#f3c96b"><b>${raison(quoi)}</b></p><div class="choixh"><button onclick="fermer()">Compris</button></div>`);
}
// pourquoi une action est refusée, en une phrase
function raison(quoi) {
  const J = S.J, vs = vals(sel), h = HEROS[J.id];
  const des = vs.length ? `Tu as choisi ${vs.length > 1 ? 'les dés' : 'le dé'} ${vs.join(', ')}` : 'Tu n’as choisi aucun dé';
  const c = CARTES[quoi];
  if (c) {
    const manque = coutCarte(J, quoi) - J.pc;
    if (c.t === 's' && J.silence) return 'Tu es réduit au Silence ce tour : pas de Sort.';
    if (c.t === 'u' && J.front.length >= 5) return 'Ta ligne de front est pleine (5 unités).';
    if (manque > 0) return `Il te manque ${manque} PC (tu en as ${J.pc}).`;
    if (!vs.length) return `Choisis d’abord ${/^(1 )?dé( |$)/.test(c.txt) ? 'un dé' : 'les dés'} : ${c.txt}.`;
    if (!c.cond(vs, sel)) return `${des} : il faut ${c.txt}.`;
    if (c.cible) return 'Il n’y a pas de cible possible pour cette carte.';
    return '';
  }
  if (quoi === 'ultime') { if (J.ultimeFait) return 'Tu as déjà joué ton Ultime dans ce combat.'; if (J.jauge < JAUGE.max) return `Ta jauge d’Ultime n’est pas pleine (${J.jauge} / ${JAUGE.max}).`; if (J.pc < 3) return `Il te manque ${3 - J.pc} PC.`; return `${des} : il faut ${h.ultime.txt}.`; }
  if (quoi === 'garde' && J.gardeFaite) return 'Ta Garde est déjà posée ce tour.';
  if (quoi === 'pcRelance' || quoi === 'pcAjuste') { const n = quoi === 'pcRelance' ? 1 : coutAjuste(J); if (J.pc < n) return `Il te manque ${n - J.pc} PC.`; return 'Choisis un seul dé.'; }
  if (quoi === 'pcSoins') return J.pc < 2 ? `Il te manque ${2 - J.pc} PC.` : 'Tu n’as aucune altération à retirer.';
  if (quoi === 'transmu') return J.transmu ? 'Tu as déjà transmuté un dé ce tour.' : 'Choisis un seul dé.';
  const def = defDe(J, quoi); return def ? `${des} : il faut ${def.txt}.` : '';
}
function fenetre(html) { document.getElementById('fen').innerHTML = `<div class="fenetre" onclick="if(event.target===this)fermer()"><div>${html}</div></div>`; }
function fermer() { document.getElementById('fen').innerHTML = ''; }
function choix(titre, options, cb) {
  window._cb = cb;
  fenetre(`<h2>${titre}</h2><div class="grille6">${options.map((o, i) => `<button onclick="fermer();_cb(${i})">${o}</button>`).join('')}</div>`);
}
function regles() {
  const h = HEROS[S.J.id];
  fenetre(`<h2>Comment on joue</h2><ul>
  <li><b>Les dés ne coûtent rien.</b> Ce sont les <b>cartes</b> qui coûtent des PC (le chiffre bleu). Pour jouer une carte, il faut <b>les deux</b> : assez de PC, et un dé qui remplit sa condition.</li>
  <li>La <b>Frappe</b>, commune à tous : 2, 3, 4 ou 5 dés identiques font 3, 6, 9 ou 14 dégâts. Gratuite.</li>
  <li>La <b>Garde</b> et le <b>Pouvoir</b> de ton héros sont gratuits : il suffit des bons dés.</li>
  <li>L’<b>Ultime</b> : sa <b>jauge ⚡</b> gagne 1 point par dé posé (pas vendu) et 1 point tous les 5 dégâts que tu subis. Pleine, l’Ultime se joue avec ses 3 dés et 3 PC, une fois par combat.</li>
  <li><b>Acheter avec ses PC</b> (comme dans le jeu papier) : 1 PC = relancer un dé ; 2 PC = +1 ou −1 sur un dé ; 2 PC = Premiers soins (retire tes altérations).</li>
  <li>Un dé qui ne sert à rien se <b>vend</b> : +1 PC. Les dés pas posés à la fin du tour sont vendus tout seuls.</li>
  <li>Tu gagnes +1 PC au début de chaque tour (6 au plus). Tu lances 3 dés au tour 1, 4 au tour 2, puis 5. Une relance par tour.</li>
  <li>Sous chaque dé, le <b>sac</b> montre les faces qui peuvent encore sortir : une face sortie ne revient qu’une fois les six sorties.</li>
  <li>Tes <b>unités</b> attaquent à partir du tour suivant leur arrivée : touche ton unité (contour jaune), puis sa cible. Les unités <b>Barrière</b> doivent être attaquées d’abord par les unités. Les unités <b>Cachées</b> ne peuvent pas être visées tant qu’elles n’ont pas attaqué.</li>
  <li>La <b>Garde</b> te protège pendant le tour de l’adversaire, puis disparaît.</li></ul>
  <h2>${h.nom}, ${h.titre} (${h.pv} PV)</h2><p><b>Passif</b> : ${h.passif}</p><p><b>Garde · ${h.garde.n}</b> (${h.garde.txt}) : ${h.garde.d}</p><p><b>Pouvoir · ${h.pouvoir.n}</b> (${h.pouvoir.txt}) : ${h.pouvoir.d}</p><p><b>Ultime · ${h.ultime.n}</b> (jauge pleine, ${h.ultime.txt}, 3 PC) : ${h.ultime.d}</p>
  <div class="choixh"><button onclick="fermer()">Jouer</button><button onclick="fermer();accueil()">Changer de héros</button></div>`);
}
function montrerFin() {
  fenetre(`<h2>${S.fini === 'gagne' ? '🏆 Victoire !' : '💀 Défaite…'}</h2><p>${S.J.nom} contre ${S.O.nom} : ${S.fini === 'gagne' ? 'gagné' : 'perdu'} en ${S.J.tours} tours.</p><div class="choixh"><button onclick="fermer();nouvellePartie(S.J.id, S.O.id)">Rejouer</button><button onclick="fermer();accueil()">Changer de héros</button></div>`);
}
let monHeros = null;
function accueil() {
  fenetre(`<h2>Duel · prototype</h2><p>1. Choisis ton héros.</p>
  <div class="heros6">${ORDRE.map(id => `<button onclick="monHeros='${id}';adversaire()"><img src="${IMG(id)}" alt="">${HEROS[id].nom}</button>`).join('')}</div>
  <p style="color:#c9c1ea;font-size:.85em">Prototype pour essayer les règles : dessins provisoires, chiffres à équilibrer.</p>`);
}
function adversaire() {
  fenetre(`<h2>Duel · prototype</h2><p>2. Contre qui ? (l’ordinateur)</p>
  <div class="heros6">${ORDRE.filter(id => id !== monHeros).map(id => `<button onclick="fermer();nouvellePartie(monHeros,'${id}');regles()"><img src="${IMG(id)}" alt="">${HEROS[id].nom}</button>`).join('')}
  <button onclick="fermer();nouvellePartie(monHeros);regles()" style="display:flex;align-items:center;justify-content:center;font-size:2em;min-height:110px">🎲<br><span style="font-size:.4em">au hasard</span></button></div>`);
}
if (typeof document !== 'undefined' && document.getElementById('app')) accueil();

</script>
