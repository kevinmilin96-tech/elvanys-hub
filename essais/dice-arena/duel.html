// Version de la page : à chaque mise en ligne, outils/publier.sh change VERSION et version.txt.
// Si le téléphone a gardé une ancienne page en mémoire, elle se recharge toute seule sur la nouvelle.
const VERSION = '20261109-213048';
fetch('version.txt?t=' + Date.now(), { cache:'no-store' }).then(r => r.ok ? r.text() : '').then(v => {
  v = (v || '').trim();
  if (v && v !== VERSION && !sessionStorage.getItem('recharge-' + v)) { sessionStorage.setItem('recharge-' + v, '1'); location.replace('duel.html?v=' + v); }
}).catch(() => {});
// Pendant qu'on joue : vérifie toutes les 2 minutes (et au retour sur l'appli) ; une nouvelle version = un bandeau « Mettre à jour »,
// jamais de rechargement surprise au milieu d'une partie.
function verifieVersion() {
  fetch('version.txt?t=' + Date.now(), { cache:'no-store' }).then(r => r.ok ? r.text() : '').then(v => {
    v = (v || '').trim(); if (!v || v === VERSION || document.getElementById('majbar')) return;
    const b = document.createElement('div'); b.id = 'majbar';
    b.innerHTML = '<span><b>Nouvelle version du jeu</b><br>La partie en cours sera perdue, l’historique est gardé.</span><button>Mettre à jour</button>';
    b.querySelector('button').onclick = () => location.replace('duel.html?v=' + v);
    document.body.appendChild(b);
  }).catch(() => {});
}
setInterval(verifieVersion, 120000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) verifieVersion(); });

<script>
// =============================================================================================== moteur
let S = null;
const adv = J => J === S.J ? S.O : S.J;
const log = t => { S.log.unshift(t); };
// Animations : le moteur note ce qui se passe (FX), l'écran le rejoue ensuite pas à pas. Rien pendant les simulations.
let FX = [], fxOn = false, fxApres = [], fxVite = 1;
const fx = e => { if (S && !S.auto) FX.push(e); };
// bilan du tour de l'ordinateur (montré à la fin de son tour)
const bilan = (J, cle, txt) => { if (!S || S.auto || !S.bilan || J !== S.O) return; S.bilan[cle].push(txt); };
const ref = k => ({ s:k.J === S.J ? 'J' : 'O', uid:k.u ? k.u.id : null });
function joueur(id, ordi, auto) {
  const h = HEROS[id];
  return { id, ordi, nom:h.nom, c:h.c, pv:h.pv, pvMax:h.pv, pc:1, deck:melange(ordi || auto ? deckBase(id) : deckDe(id)), main:[], des:[], front:[], tours:0,
    sacs:[0, 1, 2, 3, 4].map(() => []), jauge:0, degSubis:0, bouclier:0, gardeB:0, gardeE:0, purete:0, handicap:0, saigne:0, poison:0, meute:0, braise:0, relance:1 };
}
function melange(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function pioche(J, n) { for (let i = 0; i < n; i++) { if (!J.deck.length) break; if (J.main.length >= 7) { J.deck.pop(); continue; } J.main.push(J.deck.pop()); } }
// Dés « équitables » : chaque dé a un sac de 6 faces mélangé ; il sort ses faces dans l'ordre et se remplit quand il est vide.
function lance(J, d) {
  if (!d.sac.length) d.sac.push(...melange([1, 2, 3, 4, 5, 6]));
  d.v = d.sac.shift(); d.mod = false;
  if (J.id === 'pip' && d.v === 6) ajouteMeute(J, 1);
}
function modifie(J, d, v) { d.v = v; d.mod = true; if (J.catalyseur && !S.fini) degats({ J:adv(J) }, 1); }
function ajouteMeute(J, n) {
  if (J.id !== 'pip' || J.front.some(u => u.louve)) return;
  J.meute = Math.min(3, J.meute + n); log(`Meute : ${J.meute} sur 3.`);
  if (J.meute >= 3 && J.front.length < 5) { J.meute = 0; invoque(J, { n:'La Louve', a:4, v:7, louve:true }); log('🐺 La Louve arrive sur la ligne de front !'); }
}
function invoque(J, base, key) {
  if (J.front.length >= 5) { log('Ligne de front pleine.'); return; }
  const u = { ...base, key, id:Math.random().toString(36).slice(2), pret:!!base.charge };
  if (S.salle.id === 'caserne') u.v += 1;
  u.vmax = u.v; J.front.push(u);
  if (base.louve) fx({ t:'invoque', s:J === S.J ? 'J' : 'O', nom:base.n });
}
function renvoie(k) { k.J.front = k.J.front.filter(x => x !== k.u); if (k.u.key && k.J.main.length < 7) k.J.main.push(k.u.key); log(`${k.u.n} retourne dans la main.`); }
function altere(J, quoi, n) {
  if (J.purete > 0) { J.purete--; log(`${J.nom} utilise un jeton de Pureté : ${quoi} annulé.`); return; }
  if (quoi === 'handicap') { J.handicap = 1; log(`${J.nom} reçoit Handicap.`); }
  if (quoi === 'saigne') { J.saigne = Math.min(3, J.saigne + 1); log(`${J.nom} saigne.`); }
  if (quoi === 'poison') { J.poison += n; log(`${J.nom} reçoit Poison ${n}.`); }
}
const atk = (J, u) => Math.max(0, u.a + (J.banniere && u.barriere ? 2 : 0) + (u.tmp || 0) + J.front.filter(x => x.tambour && x !== u).length);
function soin(J, n) { const a = J.pv; J.pv = Math.min(J.pvMax, J.pv + n); if (J.pv > a) { log(`${J.nom} se soigne de ${J.pv - a}.`); fx({ t:'soin', c:ref({ J }), n:J.pv - a, pv:J.pv }); } }
function soinCible(k, n) { if (k.u) { const a = k.u.v; k.u.v = Math.min(k.u.vmax, k.u.v + n); log(`${k.u.n} se soigne.`); if (k.u.v > a) fx({ t:'soin', c:ref(k), n:k.u.v - a, v:k.u.v }); } else soin(k.J, n); }
// k = { J, u? } : la cible. ignore = passe Bouclier et Barrière (Instinct de la Louve)
function degats(k, n, ignore) {
  if (S.fini || n <= 0) return;
  if (k.u) {
    if (!k.J.front.includes(k.u)) return;
