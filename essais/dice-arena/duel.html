<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">

<title>La Guilde des Runes · Duel (prototype)</title>
<style>
  :root { --fond:#1d1b3a; --or:#f3c96b; --texte:#f1ecff; --doux:#c9c1ea; --ok:#7dffb0; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { margin:0; background:#15132b; color:var(--texte); font:15px/1.35 Georgia, 'Times New Roman', serif; user-select:none; }
  #app { max-width:560px; margin:0 auto; min-height:100vh; padding:6px 6px 90px; }
  button { font:inherit; cursor:pointer; }
  .barre { display:flex; align-items:center; gap:8px; background:#0006; border-radius:12px; padding:5px 7px; border:2px solid transparent; }
  .barre.cible { border-color:var(--ok); box-shadow:0 0 10px var(--ok); }
  .barre img { width:44px; height:44px; border-radius:9px; object-fit:cover; border:2px solid var(--c); flex:none; }
  .barre .nom { font-weight:bold; font-size:.92em; }
  .pastilles { display:flex; flex-wrap:wrap; gap:3px; margin-top:2px; }
  .p { background:#0008; border-radius:10px; padding:0 7px; font-size:.76em; white-space:nowrap; }
  .p.pv { background:#7a1f2a; } .p.pc { background:#2a7fc1; } .p.g { background:#5d6b7a; } .p.m { background:#6a3d9a; } .p.pu { background:#b8932d; } .p.al { background:#7a3d1f; }
  .plateau { background:radial-gradient(circle at 50% 50%, #4a3a22, #2a2014 80%); border:3px solid #6b5232; border-radius:16px; padding:6px; margin-top:4px; }
  .front { display:flex; gap:4px; justify-content:center; min-height:70px; align-items:center; padding:4px 0; }
  .front.vide::after { content:'ligne de front vide'; color:#ffffff55; font-size:.78em; font-style:italic; }
  .u { width:72px; background:#f6efdc; color:#2b2117; border-radius:9px; padding:3px 4px; font-size:.66em; line-height:1.15; text-align:center; border:2px solid #b89a5e; }
  .u b { display:block; font-size:1.05em; min-height:2.3em; }
  .u .av { display:flex; justify-content:space-between; font-weight:bold; font-size:1.25em; margin-top:2px; }
  .u .av span:first-child { color:#b84a00; } .u .av span:last-child { color:#1f6f2a; }
  .u .tg { color:#7a5a2a; font-size:.92em; min-height:1.1em; }
  .u.pret { box-shadow:0 0 0 2px #ffd27a; }
  .u.choisi { box-shadow:0 0 0 3px #fff, 0 0 12px #fff; }
  .u.cible { box-shadow:0 0 0 3px var(--ok), 0 0 12px var(--ok); }
  .u.dort { opacity:.75; }
  .milieu { text-align:center; font-size:.75em; color:#f3c96bcc; font-style:italic; padding:2px 0; }
  .salle { background:#2a2650; border-radius:10px; padding:5px 9px; margin:5px 0; font-size:.82em; }
  .salle b { color:var(--or); }
  .des { display:flex; gap:6px; justify-content:center; flex-wrap:wrap; margin:6px 0 2px; }
  .d { text-align:center; width:58px; }
  .d img { width:52px; height:52px; border-radius:9px; display:block; margin:0 auto; border:3px solid transparent; }
  .d.sel img { border-color:#fff; box-shadow:0 0 10px #fff; }
  .d.pose img { opacity:.25; }
  .d .sac { font-size:.62em; color:var(--doux); letter-spacing:.02em; margin-top:1px; }
  .actions { display:grid; grid-template-columns:repeat(5, 1fr); gap:5px; margin:6px 0; }
  .act { background:#2a2650; color:var(--texte); border:2px solid #4b4580; border-radius:10px; padding:5px 3px; font-size:.74em; line-height:1.2; min-height:58px; }
  .act b { display:block; color:var(--or); font-size:1.1em; }
  .act.ok { border-color:var(--ok); box-shadow:0 0 8px #7dffb066; }
  .act.non { opacity:.45; }
  .main { display:flex; gap:6px; overflow-x:auto; padding:4px 2px 8px; }
  .c { flex:none; width:128px; background:#f6efdc; color:#2b2117; border-radius:10px; padding:6px 7px; font-size:.74em; line-height:1.25; border:2px solid #b89a5e; position:relative; }
  .c.u2 { background:#e9f0dc; } .c.e2 { background:#e3e8f5; } .c.r2 { background:#f1e1e1; }
  .c .n { font-weight:bold; font-size:1.05em; padding-right:24px; }
  .c .cout { position:absolute; top:4px; right:4px; width:24px; height:24px; border-radius:50%; background:#2a7fc1; color:#fff; font-weight:bold; display:flex; align-items:center; justify-content:center; }
  .c .cd { display:inline-block; background:#2b2117; color:#f6efdc; border-radius:6px; padding:0 5px; margin:2px 0; }
  .c.ok { box-shadow:0 0 0 3px var(--ok), 0 0 10px var(--ok); }
  .c.non { opacity:.55; }
  .bas { position:fixed; left:0; right:0; bottom:0; background:#0d0c20ee; padding:7px; display:flex; gap:6px; justify-content:center; z-index:5; }
  .bas button { border:none; border-radius:12px; padding:10px 12px; font-weight:bold; }
  .b1 { background:#3a3570; color:#fff; } .b2 { background:var(--or); color:#2b2117; } .b0 { background:#2a2650; color:var(--doux); }
  .bandeau { background:#3a2f12; border:1px solid var(--or); border-radius:10px; padding:6px 10px; margin:6px 0; font-size:.86em; text-align:center; }
  .journal { background:#0006; border-radius:10px; padding:6px 9px; font-size:.78em; color:var(--doux); max-height:130px; overflow:auto; margin-top:6px; }
  .journal div { margin:2px 0; }
  .fenetre { position:fixed; inset:0; background:#000c; z-index:10; display:flex; align-items:center; justify-content:center; padding:14px; }
  .fenetre > div { background:#2a2650; border-radius:16px; padding:14px 16px; max-width:520px; max-height:90vh; overflow:auto; }
  .fenetre h2 { color:var(--or); margin:.1em 0 .4em; font-size:1.2em; }
  .fenetre li { margin:.35em 0; }
  .choixh { display:flex; gap:10px; justify-content:center; margin:12px 0; }
  .choixh button { background:#1d1b3a; color:#fff; border:2px solid #4b4580; border-radius:14px; padding:8px; width:150px; }
  .choixh img { width:110px; height:110px; border-radius:12px; object-fit:cover; display:block; margin:0 auto 6px; }
</style>
</head>
<body>
<div id="app"></div>
<div id="fen"></div>
<script>
// =============================================================== données
const IMG = id => `portraits/${id}.webp`;
const FACE = (id, v) => `faces-${id}/face-${v}.webp`;
const vals = ds => ds.map(d => d.v);
const egaux = vs => vs.length > 1 && vs.every(v => v === vs[0]);
const suite = (vs, n) => { if (vs.length !== n) return false; const s = [...vs].sort((a, b) => a - b); return s.every((v, i) => i === 0 || v === s[i - 1] + 1); };
const compte = vs => { const m = {}; vs.forEach(v => m[v] = (m[v] || 0) + 1); return Object.values(m).sort((a, b) => b - a); };

// Cartes. cond(vs) : les dés choisis conviennent-ils ? cible : 'ennemi' (héros ou unité adverse), 'uniteE', 'allie', 'uniteA', 'barriereA'
const CARTES = {
  ecuyer:   { n:'Écuyer au pavois', t:'u', c:2, txt:'dé pair', d:'Unité 2 / 5, Barrière.', cond:vs => vs.length === 1 && vs[0] % 2 === 0, u:{ n:'Écuyer', a:2, v:5, barriere:true } },
  lanterne: { n:'Lanterne runique', t:'s', c:1, txt:'1 dé', d:'Soigne ton héros de 2 (de la valeur si le dé est pair).', cond:vs => vs.length === 1, f:(J, vs) => soin(J, vs[0] % 2 === 0 ? vs[0] : 2) },
  serment:  { n:'Serment', t:'s', c:1, txt:'2 dés identiques', d:'Soigne ton héros de leur somme.', cond:vs => vs.length === 2 && egaux(vs), f:(J, vs) => soin(J, vs[0] + vs[1]) },
  estocade: { n:'Estocade royale', t:'s', c:2, txt:'3 dés qui se suivent', d:'10 dégâts à une cible.', cond:vs => suite(vs, 3), cible:'ennemi', f:(J, vs, k) => degats(k, 10) },
  gardien:  { n:'Gardien de la porte', t:'u', c:3, txt:'2 dés identiques', d:'Unité 3 / 7, Barrière. +1 PC quand il est attaqué.', cond:vs => vs.length === 2 && egaux(vs), u:{ n:'Gardien', a:3, v:7, barriere:true, gardien:true } },
  banniere: { n:'Bannière de l’aube', t:'e', c:2, txt:'dé pair', d:'Tes unités Barrière ont +2 attaque.', cond:vs => vs.length === 1 && vs[0] % 2 === 0, f:J => { J.banniere = true; log(`${J.nom} lève la Bannière de l’aube.`); } },
  contre:   { n:'Contre-attaque', t:'r', c:1, txt:'dé = 6', d:'Garde : la 1re unité qui t’attaque subit d’abord 6 dégâts.', cond:vs => vs.length === 1 && vs[0] === 6, f:J => { J.contre = true; log(`${J.nom} prépare une Contre-attaque.`); } },
  releve:   { n:'Relève de la garde', t:'s', c:0, txt:'dé ≤ 2', d:'Rends toute sa vie à une de tes unités Barrière.', cond:vs => vs.length === 1 && vs[0] <= 2, cible:'barriereA', f:(J, vs, k) => { k.u.v = k.u.vmax; log(`${k.u.n} retrouve toute sa vie.`); } },
  ronces:   { n:'Pousse de ronces', t:'u', c:1, txt:'dé ≤ 2', d:'Unité 0 / 4, Barrière, Épines 1.', cond:vs => vs.length === 1 && vs[0] <= 2, u:{ n:'Ronces', a:0, v:4, barriere:true, epines:1 } },
  seve:     { n:'Sève guérisseuse', t:'s', c:1, txt:'dé ≤ 3', d:'Soigne 2 fois la valeur (héros ou unité).', cond:vs => vs.length === 1 && vs[0] <= 3, cible:'allie', f:(J, vs, k) => soinCible(k, vs[0] * 2) },
  racines:  { n:'Racines entravantes', t:'s', c:2, txt:'3 dés qui se suivent', d:'7 dégâts. Une unité touchée est Entravée.', cond:vs => suite(vs, 3), cible:'ennemi', f:(J, vs, k) => { if (k.u) k.u.entrave = true; degats(k, 7); } },
  purif:    { n:'Purification', t:'s', c:0, txt:'1 dé', d:'Retire Saignement et Handicap de ton héros.', cond:vs => vs.length === 1, f:J => { J.saigne = 0; J.handicap = 0; log(`${J.nom} se purifie.`); } },
  hurlement:{ n:'Hurlement', t:'s', c:1, txt:'dé = 1', d:'+1 marqueur de Meute.', cond:vs => vs.length === 1 && vs[0] === 1, f:J => ajouteMeute(J, 1) },
  faon:     { n:'Faon des clairières', t:'u', c:2, txt:'dé ≤ 3', d:'Unité 2 / 3. À son arrivée, soigne ton héros de 3.', cond:vs => vs.length === 1 && vs[0] <= 3, u:{ n:'Faon', a:2, v:3 }, f:J => soin(J, 3) },
  lien:     { n:'Lien de la meute', t:'e', c:1, txt:'dé ≤ 2', d:'La Louve a +2 attaque. Sans Louve : +1 marqueur.', cond:vs => vs.length === 1 && vs[0] <= 2, f:J => { const l = J.front.find(u => u.louve); if (l) { l.a += 2; log('La Louve gagne +2 attaque.'); } else ajouteMeute(J, 1); } },
  rosee:    { n:'Rosée', t:'s', c:0, txt:'dé = 1', d:'Pioche 1 carte.', cond:vs => vs.length === 1 && vs[0] === 1, f:J => pioche(J, 1) },
  potion:   { n:'Potion de soin', t:'s', c:1, txt:'1 dé', d:'Soigne ton héros de la valeur + 2.', cond:vs => vs.length === 1, f:(J, vs) => soin(J, vs[0] + 2), g:1 },
  milicien: { n:'Milicien', t:'u', c:1, txt:'dé ≤ 3', d:'Unité 2 / 2.', cond:vs => vs.length === 1 && vs[0] <= 3, u:{ n:'Milicien', a:2, v:2 }, g:1 },
  chien:    { n:'Chien de garde', t:'u', c:2, txt:'1 dé', d:'Unité 2 / 3, Barrière.', cond:vs => vs.length === 1, u:{ n:'Chien', a:2, v:3, barriere:true }, g:1 },
  pierre:   { n:'Pierre à aiguiser', t:'e', c:1, txt:'1 dé', d:'Une de tes unités : +2 attaque.', cond:vs => vs.length === 1, cible:'uniteA', f:(J, vs, k) => { k.u.a += 2; log(`${k.u.n} : +2 attaque.`); }, g:1 },
  rond:     { n:'Bouclier rond', t:'s', c:0, txt:'dé pair', d:'Bouclier égal à la valeur du dé.', cond:vs => vs.length === 1 && vs[0] % 2 === 0, f:(J, vs) => { J.bouclier += vs[0]; log(`${J.nom} : Bouclier ${vs[0]}.`); }, g:1 },
  torche:   { n:'Torche', t:'s', c:1, txt:'dé ≥ 4', d:'4 dégâts à une unité adverse.', cond:vs => vs.length === 1 && vs[0] >= 4, cible:'uniteE', f:(J, vs, k) => degats(k, 4), g:1 },
  chance:   { n:'Coup de chance', t:'s', c:0, txt:'dé = 1', d:'Relance tes 2 dés libres les plus faibles.', cond:vs => vs.length === 1 && vs[0] === 1, f:J => { const l = J.des.filter(d => !d.pose).sort((a, b) => a.v - b.v).slice(0, 2); l.forEach(d => lance(J, d)); log(`${J.nom} relance ${l.length} dé(s).`); }, g:1 },
  parchemin:{ n:'Parchemin d’étude', t:'s', c:1, txt:'dé impair', d:'Pioche 1 carte et gagne 1 PC.', cond:vs => vs.length === 1 && vs[0] % 2 === 1, f:J => { pioche(J, 1); J.pc = Math.min(6, J.pc + 1); }, g:1 },
};
const GUILDE = ['potion', 'milicien', 'chien', 'pierre', 'rond', 'torche', 'chance', 'parchemin'];
const HEROS = {
  aldric: { nom:'Sire Aldric', c:'#ffd27a', pv:45,
    deck:['ecuyer', 'ecuyer', 'lanterne', 'serment', 'serment', 'estocade', 'estocade', 'gardien', 'gardien', 'banniere', 'contre', 'releve'],
    passif:'Pureté : poser deux 6 dans le même tour donne un jeton qui annule la prochaine altération.',
    garde:{ n:'Parade de fer', txt:'1 ou 2 dés', d:'Une paire : Bouclier = valeur × 2. Sinon : Bouclier = le plus haut dé.', cond:vs => vs.length === 1 || vs.length === 2,
      f:(J, vs) => { const b = vs.length === 2 && vs[0] === vs[1] ? vs[0] * 2 : Math.max(...vs); J.gardeB += b; log(`${J.nom} se met en garde : Bouclier ${b}.`); } },
    pouvoir:{ n:'Mur de lumière', txt:'deux paires (4 dés)', d:'Dégâts égaux à la somme de ta plus haute paire ; tes unités gagnent Barrière, un Bouclier égal à cette paire, et peuvent attaquer tout de suite.', cond:vs => vs.length === 4 && compte(vs)[0] === 2 && compte(vs)[1] === 2, cible:'ennemi',
      f:(J, vs, k) => { degats(k, Math.max(...vs) * 2); const h = Math.max(...vs); J.front.forEach(u => { u.barriere = true; u.bouclier = (u.bouclier || 0) + h; u.pret = true; }); log(`Mur de lumière : tes unités ont Barrière et Bouclier ${h}.`); } },
    ultime:{ n:'La Lame de l’Aube', txt:'brelan + paire (5 dés)', d:'18 dégâts à une cible et Handicap.', cond:vs => vs.length === 5 && compte(vs)[0] === 3 && compte(vs)[1] === 2, cible:'ennemi',
      f:(J, vs, k) => { degats(k, 18); altere(adv(J), 'handicap'); } } },
  pip: { nom:'Pip et sa louve', c:'#c58bff', pv:38,
    deck:['ronces', 'ronces', 'seve', 'seve', 'racines', 'racines', 'purif', 'hurlement', 'faon', 'faon', 'lien', 'rosee'],
    passif:'L’Appel de l’Alpha : chaque 6 lancé pose un marqueur de Meute. À 3, la Louve (4 / 7) arrive et attaque seule à la fin de chacun de tes tours.',
    garde:{ n:'Écorce bénie', txt:'1 dé', d:'Un 1 ou un 2 : Épines 3. Sinon : Bouclier = la valeur.', cond:vs => vs.length === 1,
      f:(J, vs) => { if (vs[0] <= 2) { J.gardeE += 3; log(`${J.nom} : Écorce bénie, Épines 3.`); } else { J.gardeB += vs[0]; log(`${J.nom} : Écorce bénie, Bouclier ${vs[0]}.`); } } },
    pouvoir:{ n:'Appel de la Louve', txt:'4 dés de 4 ou 5', d:'8 dégâts à une cible, Bouclier 3 et +1 marqueur de Meute.', cond:vs => vs.length === 4 && vs.every(v => v === 4 || v === 5), cible:'ennemi',
      f:(J, vs, k) => { degats(k, 8); J.bouclier += 3; ajouteMeute(J, 1); } },
    ultime:{ n:'L’Éveil du Grand Arbre', txt:'5 dés de 3 ou moins', d:'Ton héros se soigne de 15 et tes unités retrouvent toute leur vie.', cond:vs => vs.length === 5 && vs.every(v => v <= 3),
      f:J => { soin(J, 15); J.front.forEach(u => u.v = u.vmax); log('L’Éveil du Grand Arbre.'); } } },
};
// Frappe (attaque de base du jeu papier, pour tous) : 2, 3, 4 ou 5 dés identiques
const FRAPPE = { n:'Frappe', txt:'2 à 5 dés identiques', d:'3 / 6 / 9 / 14 dégâts à une cible (2, 3, 4 ou 5 dés identiques).', cond:vs => vs.length >= 2 && egaux(vs), cible:'ennemi',
  f:(J, vs, k) => degats(k, [0, 0, 3, 6, 9, 14][vs.length]) };
const SALLES = [
  { n:'La Cour de la caserne', d:'Les unités arrivent avec +1 vie.', id:'caserne' },
  { n:'La Salle des échos', d:'La première carte de chaque tour coûte 1 PC de moins.', id:'echos' },
  { n:'L’Autel du six', d:'Vendre un 6 rapporte 2 PC au lieu de 1.', id:'autel' },
];

// =============================================================== état
let S = null;
const adv = J => J === S.J ? S.O : S.J;
const log = t => { S.log.unshift(t); };
function joueur(id, ordi) {
  const h = HEROS[id];
  const deck = melange([...h.deck, ...GUILDE]);
  return { id, ordi, nom:h.nom, c:h.c, pv:h.pv, pvMax:h.pv, pc:1, deck, main:[], des:[], front:[], tours:0,
    bouclier:0, gardeB:0, gardeE:0, contre:false, banniere:false, purete:0, handicap:0, saigne:0, meute:0, ultimeFait:false, six:0, relance:1, cartesJouees:0 };
}
function melange(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function pioche(J, n) { for (let i = 0; i < n; i++) { if (!J.deck.length) break; if (J.main.length >= 7) { J.deck.pop(); continue; } J.main.push(J.deck.pop()); } }

// Dés « équitables » : chaque dé tire sa face dans un sac de 6 ; le sac se remplit quand il est vide
function lance(J, d) {
  if (!d.sac.length) d.sac.push(1, 2, 3, 4, 5, 6);
  const i = Math.floor(Math.random() * d.sac.length);
  d.v = d.sac.splice(i, 1)[0];
  if (J.id === 'pip' && d.v === 6) ajouteMeute(J, 1);
}
function ajouteMeute(J, n) {
  if (J.id !== 'pip' || J.front.some(u => u.louve)) return;
  J.meute = Math.min(3, J.meute + n);
  log(`Meute : ${J.meute} sur 3.`);
  if (J.meute >= 3 && J.front.length < 5) {
    J.meute = 0;
    invoque(J, { n:'La Louve', a:4, v:7, louve:true });
    log('🐺 La Louve arrive sur la ligne de front !');
  }
}
function invoque(J, base) {
  if (J.front.length >= 5) { log('Ligne de front pleine.'); return; }
  const u = { ...base, id:Math.random().toString(36).slice(2), pret:false };
  if (S.salle.id === 'caserne') u.v += 1;
  u.vmax = u.v;
  J.front.push(u);
}
function altere(J, quoi) {
  if (J.purete > 0) { J.purete--; log(`${J.nom} utilise un jeton de Pureté : ${quoi} annulé.`); return; }
  if (quoi === 'handicap') { J.handicap = 1; log(`${J.nom} reçoit Handicap.`); }
  if (quoi === 'saigne') { J.saigne = Math.min(3, J.saigne + 1); log(`${J.nom} saigne.`); }
}
const atk = (J, u) => u.a + (J.banniere && u.barriere ? 2 : 0);
function soin(J, n) { const a = J.pv; J.pv = Math.min(J.pvMax, J.pv + n); log(`${J.nom} se soigne de ${J.pv - a}.`); }
function soinCible(k, n) { if (k.u) { k.u.v = Math.min(k.u.vmax, k.u.v + n); log(`${k.u.n} se soigne.`); } else soin(k.J, n); }
// k = { J, u? } : la cible. ignore = dégâts qui passent Bouclier et Barrière
function degats(k, n, ignore) {
  if (k.u) {
    let r = n;
    if (!ignore && k.u.bouclier) { const b = Math.min(k.u.bouclier, r); k.u.bouclier -= b; r -= b; }
    k.u.v -= r; log(`${k.u.n} subit ${r} dégât(s).`);
    if (k.u.v <= 0) { k.J.front = k.J.front.filter(x => x !== k.u); log(`${k.u.n} tombe.`); }
  } else {
    const J = k.J; let r = n;
    if (!ignore) {
      const g = Math.min(J.gardeB, r); J.gardeB -= g; r -= g;
      const b = Math.min(J.bouclier, r); J.bouclier -= b; r -= b;
      if (g + b) log(`Les boucliers de ${J.nom} absorbent ${g + b}.`);
    }
    J.pv -= r; if (r) log(`${J.nom} perd ${r} PV.`);
  }
  fin();
}
function fin() { if (S.fini) return; if (S.J.pv <= 0 || S.O.pv <= 0) { S.fini = S.J.pv > 0 ? 'gagne' : 'perdu'; } }

// =============================================================== tours
function debutTour(J) {
  J.tours++; J.gardeB = 0; J.gardeE = 0; J.contre = false; J.six = 0; J.relance = 1; J.cartesJouees = 0; J.pureteTour = false;
  J.pc = Math.min(6, J.pc + (J.tours === 1 ? 0 : 1));
  if (J.tours > 1) pioche(J, 1);
  if (J.saigne) { log(`${J.nom} saigne : −${J.saigne * 2} PV.`); J.pv -= J.saigne * 2; fin(); }
  let n = Math.min(5, J.tours + 2);
