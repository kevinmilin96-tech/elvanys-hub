<script>
// =============================================================================================== LES CHRONIQUES DE LA GUILDE v2 (15/11, écran « façon HeroQuest »)
// Une grande carte qui défile : les salles restent dans le noir jusqu'à ce qu'on ouvre leur porte ; les couloirs se dévoilent en avançant ;
// les meubles se fouillent. Un seul écran que l'on se passe ; jusqu'à 4 héros. La v1 (salles séparées) : chroniques-v1.html.
const K = CHRON, H = K.HEROS_C, $ = id => document.getElementById(id);
const ZEPH_OK = () => localStorage.getItem('guilde-tuto') === 'fait';
const CLE_PARTIE = 'guilde-chroniques2-partie', CLE = 'guilde-chroniques';
const son = k => { try { if (typeof GM !== 'undefined') GM.son(k); } catch (e) {} };
let S = null, actif = 0, sel = null, choisis = ['maelle', 'aldric', 'pip', 'gorm'], occupe = false, petit = false, centrer = true;
const OUVERTURE = '« Vous avez entendu ? Moi non plus. C’est bien ça le problème : la Grande Horloge de la Guilde ne fait plus tic-tac. Le boulanger est figé, la main dans la pâte. Le pigeon du toit est figé, en plein vol. Quelqu’un doit descendre sous la Guilde, retrouver trois rouages perdus et réveiller l’Horloger. Pas moi : j’ai des pattes courtes. »';
// 15/11 soir : les meubles et objets peints (decor/obj-<nom>.webp, fond détouré) ; sinon l'émoji
const OBJ_PEINTS = ['coffre', 'armoire', 'tonneaux', 'tombeau', 'etabli', 'cheminee', 'etagere', 'levier', 'rouage', 'axe', 'porte'];
const objImg = (n, cl) => OBJ_PEINTS.includes(n) ? `<img class="oi ${cl || ''}" src="decor/obj-${n}.webp?v=1" alt="">` : null;
const MEUBLE_E = { coffre:'🧰', armoire:'🗄️', tonneaux:'🛢️', tombeau:'🪦', etabli:'🛠️', cheminee:'🔥', lit:'🛏️', tente:'⛺', etagere:'📚', bureau:'🪑', banc:'🪑', autel:'🕯️', fontaine:'⛲', cristaux:'💎' };
// 15/11 : deux scénarios ; « brulees » se joue sur la CARTE PEINTE (decor/carte-brulees.webp), calée par l'utilisateur
let scenChoisi = 'horloger';
const SCX_TXT = {
  horloger:{ titre:'⏳ Le Sommeil de l’Horloger', duree:'45-60 min', ouverture:OUVERTURE, entree:() => K.SALLES.A.lu,
    but:'Explorez : ouvrez les portes (gratuit, à côté), fouillez les meubles (un dé) pour trouver <b>3 rouages ⚙</b>. Les 4 leviers de la Salle des rouages ouvrent la porte de bronze.',
    porter:'Portez les rouages jusqu’à l’axe ✹ du Cœur de l’Horloge (derrière la porte de bronze).',
    gagne:['🏆 L’Horloger est réveillé !', '« L’Horloger s’arrête, cligne des yeux, et… s’excuse. Il dormait depuis cent ans, il a cru que vous étiez des voleurs. Là-haut, le pigeon finit son vol, le boulanger finit sa pâte. Et moi ? J’ai fini ma sieste. Personne ne me remercie, bien sûr. »'] },
  brulees:{ titre:'🔥 Les Terres brûlées', duree:'45-60 min · carte peinte (essai)', ouverture:'« Une île de cendre et de lave. On a accosté en barque, tout en bas. Quelque part dans ces salles dorment trois braises éternelles : ramenez-les au grand brasier, tout en haut… Et préparez-vous : ce qui dort dans le feu n’aime pas qu’on le réveille. Moi, je garde la barque. »',
    entree:() => '« On ne voit que ce qui est devant nous : les murs cachent le reste. Avancez, regardez, fouillez. »',
    but:'Explorez (on ne voit que ce qui est en vue), fouillez les meubles (un dé) pour trouver <b>3 braises éternelles 🔥</b>, puis portez-les au <b>grand brasier</b> tout en haut.',
    porter:'Portez les braises jusqu’au grand brasier 🔥, tout en haut de la carte.',
    gagne:['🏆 Le Titan de feu s’éteint !', '« Le Titan vacille, fume, et s’effondre en un tas de braises tièdes. Les trois braises éternelles brillent au cœur du brasier : l’île est sauvée. Je peux sortir de la barque ? Il fait encore un peu chaud, non ? »'] },
};
SCX_TXT.labyrinthe = { titre:'✦ Le Labyrinthe des Runes', duree:'30-60 min · un donjon NEUF à chaque partie',
  ouverture:'« Un escalier qui descend… et un labyrinthe que personne n’a jamais vu. Il change à chaque fois qu’on y entre, paraît-il. Trois fragments de rune dorment dans les meubles : rapportez-les à l’autel, tout au fond. Moi, je reste près de l’escalier. »',
  entree:() => '« On ne voit que ce qui est en vue. Avancez prudemment : chaque labyrinthe est différent. »',
  but:'Explorez (on ne voit que ce qui est en vue), fouillez les meubles (un dé) pour trouver <b>3 fragments de rune ✦</b>, puis portez-les à <b>l’autel des runes</b>, au fond du labyrinthe.',
  porter:'Portez les fragments jusqu’à l’autel ✦, au fond du labyrinthe.',
  gagne:['🏆 Le Titan des runes s’effondre !', '« Le Titan se fige, puis tombe en poussière de pierre. Les fragments brillent sur l’autel : le labyrinthe se tait. Pour cette fois. Demain, il aura encore changé de forme. On revient ? »'] };
const SCT = () => (S && S.textes) || SCX_TXT[(S && S.scen) || scenChoisi]; // 15/11 soir : une aventure donne ses propres textes

// ------------------------------------------------------------------ sauvegarde : tout l'état ; un POINT DE PASSAGE à chaque porte ouverte
function sauve() { try { if (S && !S.fin) localStorage.setItem(CLE_PARTIE, JSON.stringify(S)); else localStorage.removeItem(CLE_PARTIE); } catch (e) {} }
const gardee = () => { try { const p = JSON.parse(localStorage.getItem(CLE_PARTIE) || 'null'); return p && p.heros && p.R && !p.fin ? p : null; } catch (e) { return null; } };
function pointDePassage() { const c = JSON.parse(JSON.stringify(S)); delete c.passage; S.passage = JSON.stringify(c); }

// ------------------------------------------------------------------ À DISTANCE : chacun son téléphone (15/11 ; serveur : routes /api/hub/guilde/partie, labo perso seulement)
// L = null hors ligne ; sinon { code, version, joueurs:[{ id, nom, heros:[indices] }], moi:{ id, nom }, dernier:(JSON envoyé ou reçu) }.
// Chaque coup est envoyé au serveur ; les autres téléphones le reçoivent en demandant l'état toutes les 2 secondes.
// Chacun ne joue que SES héros ; tout le monde peut ouvrir une porte et finir le tour.
let L = null, envoi = false;
const API = '/api/hub/guilde/partie';
const SALLE = 'guilde-salle';
const mesHeros = () => !L ? S.heros.map((z, i) => i) : ((L.joueurs.find(j => j.id === L.moi.id) || {}).heros || []);
const proprio = i => L ? (L.joueurs.find(j => (j.heros || []).includes(i)) || {}).nom : null;
async function api(methode, url, corps) {
  const r = await fetch(url, { method:methode, headers:{ 'Content-Type':'application/json' }, body:corps ? JSON.stringify(corps) : undefined });
  let d = {}; try { d = await r.json(); } catch (e) {}
  return { statut:r.status, d };
}
// 15/11 17 h (l'utilisateur, 2 téléphones : « on ne voit pas les héros choisis par les amis, et je peux jouer leurs héros ») :
// (1) un envoi demandé pendant qu'un autre partait était PERDU → on le refait juste après ;
// (2) en cas de conflit, le héros qu'on vient de prendre était perdu → on le reprend et on renvoie ;
// (3) la fenêtre « Salle » se met à jour quand un ami prend un héros ; le nom du joueur s'affiche sous chaque héros.
let encore = false;
function appliquePrises() { if (!L || !L.prises) return; L.prises.forEach(i => { L.joueurs.forEach(j => j.heros = (j.heros || []).filter(x => x !== i)); let m = L.joueurs.find(j => j.id === L.moi.id); if (!m) { m = { id:L.moi.id, nom:L.moi.nom, heros:[] }; L.joueurs.push(m); } if (!m.heros.includes(i)) m.heros.push(i); }); }
async function pousse() {
  if (!L) return; if (envoi) { encore = true; return; } envoi = true;
  try {

    ${g ? `<button class="gros" style="border-color:var(--ok);color:var(--ok);background:#14322a" onclick="reprend()">▶ Reprendre la partie<small>${g.heros.map(z => nomH(z)).join(', ')} · ⚙ ${g.R.rouagesPoses}/3 · ⌛ ${g.sablier}</small></button><button onclick="if(confirm('Abandonner cette partie ? Elle sera effacée.')){try{localStorage.removeItem('guilde-chroniques2-partie')}catch(e){};accueil()}" style="display:block;margin:0 auto;background:none;border:0;color:var(--doux);font-size:3cqw;text-decoration:underline;padding:1cqw;text-align:center">✕ abandonner cette partie</button>` : ''}

    <div class="choixH">${avLire().map(a => { const s = avStats(a); return `<button class="${choisis.includes('av:' + a.id) ? 'on' : ''}" onclick="basculeHeros('av:${a.id}')"><img src="${avPortrait(a)}" onerror="this.onerror=null;this.src='${avPortraitSecours(a)}'" alt="" style="box-shadow:0 0 0 3px ${a.couleur}">${a.nom}<small>${avTitre(a)} · niv. ${s.niveau}</small></button>`; }).join('')}
      <button onclick="location.href='aventuriers.html?retour=chroniques.html'">＋<small>Créer un héros dans la Forge des héros</small></button></div>
    <h3 style="color:var(--or);margin:3cqw 0 1.5cqw">Les héros de la Guilde</h3>
    <div class="choixH">${Object.entries(H).map(([k, h]) => `<button class="${choisis.includes(k) ? 'on' : ''}" ${k === 'zephine' && !ZEPH_OK() ? 'disabled' : ''} onclick="basculeHeros('${k}')"><img src="portraits/${k}.webp" alt="">${h.n}<small>${h.t}</small>${k === 'zephine' && !ZEPH_OK() ? '<small>🔒 tutoriel</small>' : ''}</button>`).join('')}</div>
    ${typeof aventuresHTML === 'function' ? aventuresHTML() : ''}
    ${campagneHTML()}
    <h3 style="color:var(--or);margin:3cqw 0 1cqw">⚔ Une partie seule</h3>

    <button class="gros" style="background:#14223a;border-color:#7cd4ff;color:#7cd4ff" onclick="amisFenetre()">👥 Mes amis<small>Vois qui est en ligne, rejoins sa salle ou invite-le dans la tienne.</small></button>
    <button class="gros" style="background:#1c1c36;border-color:#45457a;color:var(--texte)" onclick="rejoindre()">🔑 Rejoindre avec un code<small>Un ami t’a donné un code de salle.</small></button>
    ${(() => { try { const s = JSON.parse(localStorage.getItem(SALLE) || 'null'); return s ? `<button class="gros" style="background:#14322a;border-color:var(--ok);color:var(--ok)" onclick='rejoindre(${JSON.stringify(s.code)}, ${JSON.stringify(s.moi)})'>↩ Revenir dans la salle ${s.code}<small>en tant que ${s.moi.nom}</small></button>` : ''; } catch (e) { return ''; } })()}
    <p style="text-align:center;margin-top:4cqw"><a href="chroniques-v1.html" style="color:var(--doux);font-size:3cqw">l’ancienne version (salles séparées)</a></p>
  </div>`;
}
// un choix de l'accueil → ce que le moteur attend (une voie, ou un héros d'aventure avec ses stats)
const nomChoix = k => k.startsWith('av:') ? ((avTrouve(k.slice(3)) || {}).nom || '?') : H[k].n;
function versMoteur(k) {
  if (!k.startsWith('av:')) return k;
  const a = avTrouve(k.slice(3)); if (!a) return null; const s = avStats(a);
  return { voie:a.voie, nom:a.nom, pv:s.pv, faces:s.faces, desPlus:s.desPlus, talents:s.talents, av:a.id, c:a.couleur, portrait:avPortrait(a), att:s.att || 0, def:s.def || 0, agi:s.agi || 0 };
}
const equipeChoisie = () => choisis.map(versMoteur).filter(Boolean);
function basculeHeros(k) { if (choisis.includes(k)) choisis = choisis.filter(x => x !== k); else if (choisis.length < 4) choisis.push(k); else { bulle('4 héros au plus', true); return; } son('choisir'); accueil(); }
// 15/11 soir (l'utilisateur : « un petit bouton Suivant pour faire apparaître le deuxième message au lieu de tout d'un coup ») : Moustache parle message par message
let DLG = null;
function dialogue(titre, lignes, k = 0) {
  DLG = { titre, lignes }; const der = k >= lignes.length - 1;
  // 15/11 soir : la page peinte de l'ouverture du Sommeil de l'Horloger
  const page = k === 0 && typeof S !== 'undefined' && S && (S.scen || 'horloger') === 'horloger' && S.campagne == null ? '<img src="decor/chron-horloger-debut.webp?v=1" alt="" style="width:100%;border-radius:12px;margin:2px 0 8px;display:block">' : '';
  fenetre(`<h2>${titre}</h2>${page}${lignes.slice(0, k + 1).map((l, i) => `<div class="moust" style="${i < k ? 'opacity:.55' : 'animation:apparait .35s'}"><img src="ui/moustache.webp" alt=""><div class="lu">${l}</div></div>`).join('')}
    <button class="go" onclick="${der ? `fenetre('')` : `son('choisir');dialogue(DLG.titre, DLG.lignes, ${k + 1})`}">${der ? 'On y va !' : 'Suivant ▶'}</button>`, false);
}
// ------------------------------------------------------------------ LA SALLE D'ATTENTE (15/11 ~17 h 20, demande de l'utilisateur)
// « Seul le joueur 1, l'hôte, doit pouvoir lancer et sélectionner le scénario ou la campagne, comme un vrai jeu avec un hub de sélection,
// et tous partir en même temps. » Tant que la partie n'est pas lancée, le serveur garde { lobby:LOB } au lieu de la partie :
// LOB = { scen, camp (null, 'nouvelle' ou n° de chapitre), equipe:[{ id, owner, nom, img, sec, c, m (ce que le moteur attend) }], hote }.
// Chacun ajoute SES héros depuis SON téléphone (avec sa progression : niveau, rang, équipement) ; l'hôte choisit le scénario et lance.
let LOB = null;
const estHote = () => !!L && !!(LOB ? LOB.hote === L.moi.id : S && S.hote === L.moi.id);
function assureMoi() { if (L && !L.joueurs.some(j => j.id === L.moi.id)) L.joueurs.push({ id:L.moi.id, nom:L.moi.nom, heros:[] }); }
async function lobbyPousse(f) {
  if (!L || !LOB) return; if (envoi) { setTimeout(() => lobbyPousse(f), 300); return; } envoi = true;
  try {
    for (let k = 0; k < 4; k++) {
      if (f) f(LOB); assureMoi();
      const { statut, d } = await api('POST', `${API}/${L.code}`, { version:L.version, etat:{ lobby:LOB }, joueurs:L.joueurs });
      if (statut === 200) { L.version = d.version; break; }
      if (statut === 409 && d.etat && d.etat.lobby) { LOB = d.etat.lobby; if (d.joueurs) L.joueurs = d.joueurs; L.version = d.version; continue; }
      if (statut === 409) { envoi = false; recoit(d); return; }
      bulle(d.message || 'Le serveur ne répond pas.', true); break;
    }
  } catch (e) { bulle('Pas de réseau.', true); }
  envoi = false; if (LOB && !S) salleAttente();
}
// une entrée d'équipe à partir d'un choix de l'accueil ('maelle' ou 'av:<id>')
function entreeLobby(k) {
  const id = 'e' + Math.random().toString(36).slice(2, 8);
  if (k.startsWith('av:')) { const a = avTrouve(k.slice(3)); if (!a) return null; return { id, cle:k, owner:L.moi.id, nom:a.nom, img:avPortrait(a), sec:avPortraitSecours(a), c:a.couleur, m:versMoteur(k) }; }
  return { id, cle:k, owner:L.moi.id, nom:H[k].n, img:`portraits/${k}.webp`, sec:`portraits/${k}.webp`, c:(H[k] || {}).c, m:{ g:k, B:typeof bonusHerosPvE === 'function' ? bonusHerosPvE(k) : { pv:0 } } };
}
const nomJoueur = id => (L.joueurs.find(j => j.id === id) || {}).nom || '?';
function ajouteLobby(k) {
  if (LOB.equipe.length >= 4) { bulle('4 héros au plus', true); return; }
  const e = entreeLobby(k); if (!e) return; son('choisir');
  lobbyPousse(X => { if (X.equipe.some(x => x.id === e.id)) return; if (X.equipe.some(x => x.owner === e.owner && x.cle === e.cle)) return; if (X.equipe.length < 4) X.equipe.push(e); });
}
function retireLobby(eid) { son('choisir'); lobbyPousse(X => { X.equipe = X.equipe.filter(x => x.id !== eid); }); }
function choixScenLobby(scen, camp) { if (!estHote()) return; son('choisir'); lobbyPousse(X => { X.scen = scen; X.camp = camp == null ? null : camp; }); }
function salleAttente() {
  if (!L || !LOB) return;
  const hote = estHote(), c = hote ? lireCamp() : null, titreScen = LOB.camp != null ? (LOB.camp === 'nouvelle' ? CHAPITRES[0].titre : (CHAPITRES[LOB.camp] || {}).titre) : SCX_TXT[LOB.scen].titre;
  const pris = new Set(LOB.equipe.filter(e => e.owner === L.moi.id).map(e => e.cle));
  const dispo = Object.keys(H).filter(k => !(k === 'zephine' && !ZEPH_OK())).map(k => [k, H[k].n, `portraits/${k}.webp`, `portraits/${k}.webp`]).concat(avLire().map(a => ['av:' + a.id, a.nom, avPortrait(a), avPortraitSecours(a)]));
  const img = (s, sec, c) => `<img src="${s}" onerror="this.onerror=null;this.src='${sec}'" alt="" style="width:13cqw;height:13cqw;border-radius:50%;object-fit:cover;box-shadow:0 0 0 2px ${c || '#7cd4ff'}">`;
  $('app').innerHTML = `<div class="acc">
    <div class="haut"><button onclick="if(confirm('Quitter la salle ?')){quitterSalle();LOB=null;accueil()}">‹ Quitter</button><span class="t"></span><span></span></div>
    <h1>🌐 Salle d’attente</h1>
    <p class="sous">Code à donner à tes amis : <b style="color:var(--or);font-size:1.6em;letter-spacing:.15em">${L.code}</b><br>(perso.elvanys.fr/guilde → Les Chroniques → 🔑 Rejoindre avec un code)</p>
    <h3 style="color:var(--or);margin:3cqw 0 1.5cqw">👥 Les joueurs</h3>
    <p style="margin:0 0 2cqw">${L.joueurs.map(j => `${j.id === LOB.hote ? '👑 ' : '🙂 '}<b>${j.nom}</b>${j.id === L.moi.id ? ' (toi)' : ''}`).join(' · ')}</p>
    ${(() => { const E = typeof AMIS !== 'undefined' && AMIS.etat, enL = E ? E.amis.filter(x => x.enLigne && x.salle !== L.code) : [];
      return `<button class="gros" style="background:#14223a;border-color:#7cd4ff;color:#7cd4ff;margin-top:2cqw" onclick="amisFenetre()">👥 Inviter des amis<small>${!E ? 'Crée ta carte de joueur pour voir tes amis en ligne.' : enL.length ? `${enL.length} ami${enL.length > 1 ? 's' : ''} en ligne : ${enL.map(x => amisEsc(x.pseudo)).join(', ')}` : 'Aucun ami en ligne pour l’instant (le code de la salle marche aussi).'}</small></button>`; })()}
    <h3 style="color:var(--or);margin:3cqw 0 1.5cqw">📖 Le scénario${hote ? '' : ' <small style="color:var(--doux);font-weight:normal">(choisi par l’hôte)</small>'}</h3>
    ${hote ? `<div class="choixH" style="grid-template-columns:1fr 1fr">${Object.entries(SCX_TXT).map(([k, s]) => `<button class="${LOB.camp == null && LOB.scen === k ? 'on' : ''}" onclick="choixScenLobby('${k}')" style="font-size:3.4cqw">${s.titre}<small>${s.duree}</small></button>`).join('')}
      ${c ? `<button class="${LOB.camp === c.chap ? 'on' : ''}" onclick="choixScenLobby('${CHAPITRES[c.chap].scen}', ${c.chap})" style="font-size:3.4cqw">📜 Campagne · ${CHAPITRES[c.chap].titre}<small>la suite de ta campagne</small></button>`
        : `<button class="${LOB.camp === 'nouvelle' ? 'on' : ''}" onclick="choixScenLobby('horloger', 'nouvelle')" style="font-size:3.4cqw">📜 Commencer la campagne<small>3 chapitres à la suite</small></button>`}</div>`
      : `<p class="gros" style="text-align:center;padding:3cqw;border:1px solid #45457a;border-radius:3cqw">${titreScen}</p>`}
    <h3 style="color:var(--or);margin:3cqw 0 1.5cqw">⚔ L’équipe (${LOB.equipe.length}/4)</h3>
    ${LOB.equipe.length ? LOB.equipe.map(e => `<div style="display:flex;align-items:center;gap:3cqw;background:#1c1c36;border:1px solid ${e.owner === L.moi.id ? 'var(--ok)' : '#45457a'};border-radius:3cqw;padding:2cqw;margin:1.5cqw 0">${img(e.img, e.sec, e.c)}<div style="flex:1"><b>${e.nom}</b><br><small style="color:var(--doux)">${e.owner === L.moi.id ? '✅ joué par toi' : '👤 joué par ' + nomJoueur(e.owner)}</small></div>${e.owner === L.moi.id || hote ? `<button class="sec" style="flex:none;width:auto;margin:0" onclick="retireLobby('${e.id}')">Retirer</button>` : ''}</div>`).join('')
      : '<p class="sous">Personne encore : chacun ajoute son héros ci-dessous.</p>'}
    ${LOB.equipe.length < 4 ? `<h3 style="color:var(--or);margin:3cqw 0 1.5cqw">＋ Ajoute ton héros</h3>
      <div class="choixH">${dispo.filter(([k]) => !pris.has(k)).map(([k, n, s, sec]) => `<button onclick="ajouteLobby('${k}')"><img src="${s}" onerror="this.onerror=null;this.src='${sec}'" alt="">${n}<small>${k.startsWith('av:') ? 'ton héros d’aventure' : 'héros de la Guilde'}</small></button>`).join('')}</div>` : ''}
    ${hote ? `<button class="gros" style="margin-top:4cqw" ${LOB.equipe.length ? '' : 'disabled'} onclick="lanceSalle()">▶ Lancer la partie pour tout le monde<small>${LOB.equipe.length ? `${LOB.equipe.length} héros · ${titreScen}` : 'il faut au moins un héros'}</small></button>`
      : `<p class="sous" style="margin-top:4cqw;font-size:1.05em">⏳ En attente du lancement par <b>${nomJoueur(LOB.hote)}</b>… La partie démarrera toute seule sur ton téléphone.</p>`}
  </div>`;
}
// l'hôte lance : la partie est créée sur son téléphone et envoyée à tous
async function lanceSalle() {
  if (!estHote() || !LOB.equipe.length) return;
  let chap = null;
  if (LOB.camp === 'nouvelle') { ecrireCamp({ chap:0, equipe:[], sacs:{}, debut:Date.now() }); chap = 0; }
  else if (LOB.camp != null) chap = LOB.camp;
  const scen = chap != null ? CHAPITRES[chap].scen : LOB.scen, c = chap != null ? lireCamp() : null;
  S = K.nouvelle(LOB.equipe.map(e => e.m), 'chron-' + Date.now(), scen);
  S.hote = LOB.hote; S.equipeLob = LOB.equipe;
  if (chap != null) { S.campagne = chap; S.heros.forEach((h, i) => { h.pvmax += 2 * chap; h.pv += 2 * chap; if (c && c.sacs[i]) h.sac = c.sacs[i].slice(); }); }
  L.joueurs.forEach(j => { j.heros = LOB.equipe.map((e, i) => e.owner === j.id ? i : -1).filter(i => i >= 0); });
  L.prises = []; LOB = null; pointDePassage(); actif = Math.max(0, mesHeros()[0] || 0); sel = null; centrer = true;
  son('portail'); dessine(); await pousse();
  dialogue(chap != null ? CHAPITRES[chap].titre : SCT().titre, [chap != null ? CHAPITRES[chap].avant : SCT().ouverture, SCT().entree()]);
}
// après une partie à distance, l'hôte ramène tout le monde dans la salle d'attente (même équipe, scénario à choisir)
function retourSalle() {
  if (!estHote() || !S) return; const c = lireCamp();
  LOB = { scen:S.scen, camp:c ? c.chap : null, equipe:S.equipeLob || [], hote:S.hote }; S = null; fenetre(''); lobbyPousse();
}

function commence() {
  if (!choisis.length) return; S = K.nouvelle(equipeChoisie(), 'chron-' + Date.now(), scenChoisi); pointDePassage(); actif = 0; sel = null; centrer = true; son('portail'); dessine();
  dialogue(SCT().titre, [SCT().ouverture, SCT().entree()]);
}
function reprend() { const g = gardee(); if (!g) return; S = g; actif = Math.max(0, S.heros.findIndex(z => !z.aTerre)); sel = null; centrer = true; dessine(); }
if (typeof GM !== 'undefined') { try { GM.musique('exploration'); GM.bouton(); } catch (e) {} }
accueil();
// 15/11 : arrivée par une invitation d'un ami (« Rejoindre » dans la fenêtre des amis ou le bandeau d'invitation)
{ const q = new URLSearchParams(location.search); if (q.get('ligne')) { history.replaceState(null, '', location.pathname); creerSalle(); } else if (q.get('code')) { history.replaceState(null, '', location.pathname); rejoindreForm(); } }
{ const s = new URLSearchParams(location.search).get('salle'); if (s) { history.replaceState(null, '', location.pathname); const c = (typeof AMIS !== 'undefined' && AMIS.carte) || null, nom = (c && c.pseudo) || localStorage.getItem('guilde-pseudo');
    if (nom) rejoindre(s, { id:'j' + Math.random().toString(36).slice(2, 10), nom }); else { rejoindreForm(); setTimeout(() => { const i = $('fCode'); if (i) i.value = s; }, 150); } } }
