<script>
// Même mécanisme que le Duel : une nouvelle version = rechargement tout seul à l'ouverture (publier.sh change VERSION).
const VERSION = '20261114-144638';
fetch('version.txt?t=' + Date.now(), { cache:'no-store' }).then(r => r.ok ? r.text() : '').then(v => {
  v = (v || '').trim();
  if (v && v !== VERSION && !sessionStorage.getItem('recharge-menu-' + v)) { sessionStorage.setItem('recharge-menu-' + v, '1'); location.replace('menu.html?v=' + v); }
}).catch(() => {});

<style>

<script>
// ciel étoilé + runes du portail (symboles, pas des lettres), aux couleurs des héros
const ciel = document.getElementById('ciel');
for (let i = 0; i < 60; i++) { const s = document.createElement('i'); s.style.left = Math.random() * 100 + '%'; s.style.top = Math.random() * 100 + '%'; s.style.animationDelay = Math.random() * 3 + 's'; ciel.appendChild(s); }
const RUNES = ['✦', '◆', '☽', '✧', '❖', '✶', '⟡', '◈', '✺', '⬖'], COUL = ['#f7862a', '#f3c96b', '#c084fc', '#5ff5e6', '#7cc8ff', '#ff6b8a'];
function anneau(id, n) {
  const a = document.getElementById(id), r = a.offsetWidth / 2;
  for (let i = 0; i < n; i++) { const s = document.createElement('span'), ang = i / n * 360; s.textContent = RUNES[i % RUNES.length]; s.style.color = COUL[i % COUL.length];
    s.style.transform = `translate(-50%,-50%) rotate(${ang}deg) translateY(-${r}px) rotate(${-ang}deg)`; a.appendChild(s); }
}
anneau('a1', 14); anneau('a2', 20);
// les six héros du monde
document.getElementById('heros').innerHTML = (typeof ORDRE !== 'undefined' ? ORDRE : []).map((id, i) => `<img src="portraits/${id}.webp" alt="${HEROS[id].nom}" style="--c:${HEROS[id].c};animation-delay:${i * .25}s">`).join('');
const c2 = document.getElementById('ciel2');
for (let i = 0; i < 50; i++) { const s = document.createElement('i'); s.style.left = Math.random() * 100 + '%'; s.style.top = Math.random() * 70 + '%'; s.style.animationDelay = Math.random() * 3 + 's'; c2.appendChild(s); }

// ------------------------------------------------------------------ le menu en portails (12/11 nuit)
// une porte : nom (sur la plaque), desc (sous le carrousel), img (peinture reçue) OU pro (dessin provisoire), puis
//   vers = un étage, href = une page, ferme = verrouillée (texte), avenir = portail mystère « À venir »
const PRO = { // dessins provisoires : [émoji, fond, lueur]
  arene:['⚔️', 'linear-gradient(180deg, #f59e0b 0%, #b45309 35%, #7c2d12 62%, #e7c48a 63%, #c99a5b 100%)', '#ffd27a'],
  odyssee:['⛵', 'linear-gradient(180deg, #2b1d4a 0%, #a8432c 45%, #1c2b4a 58%, #0f1a33 100%)', '#ff9f5a'],
  expeditions:['🪽', 'linear-gradient(180deg, #ffd89b 0%, #f7a76c 40%, #7cc8ff 100%)', '#fff3c4'],
  campement:['🔥', 'linear-gradient(180deg, #0d1f17 0%, #1f3b2b 55%, #3a2a14 100%)', '#ffb347'],
  tour:['📚', 'linear-gradient(180deg, #0f0c29 0%, #302b63 60%, #24243e 100%)', '#c084fc'],
  ordinateur:['🗿', 'linear-gradient(180deg, #3b82f6 0%, #1e3a8a 50%, #c99a5b 51%, #8a6538 100%)', '#7cc8ff'],
  tuto:['🐱', 'linear-gradient(180deg, #ffe7a8 0%, #f4c27a 45%, #7aa36b 46%, #4d7a43 100%)', '#fff3c4'],

const car = document.getElementById('car');
let courant = '';
function particules(sorte, n) { let h = ''; for (let i = 0; i < n; i++) h += `<i style="left:${(i * 37 + 11) % 100}%;--dx:${(i % 2 ? 1 : -1) * (4 + i % 5 * 3)}cqw;animation-duration:${3 + (i * 7) % 5}s;animation-delay:${-(i * 1.3) % 6}s"></i>`; return `<div class="particules ${sorte}">${h}</div>`; }
function dessin(p) {
  if (p.avenir) return '<img src="menu-recu/mystere.webp" alt=""><div class="lueur"></div>';
  if (p.img) return `<img src="${p.img}" alt="">${p.fx === 'lave' ? '<img class="fx lave" src="menu-recu/fx-lave.webp?v=1" alt="">' + particules('etincelles', 10) : p.fx === 'aurore' ? '<img class="fx aurore" src="menu-recu/fx-aurore.webp?v=1" alt="">' + particules('neige', 14) : ''}`;
  if (PRO_IMG[p.pro] && !p.sansImg) return `<img src="menu-recu/${PRO_IMG[p.pro]}.webp?v=1" alt="">`;
  const [e, fond, g] = PRO[p.pro]; let et = '';
  for (let i = 0; i < 9; i++) et += `<i class="et" style="left:${(i * 37) % 100}%;top:${(i * 23) % 60}%;animation-delay:${i * .3}s"></i>`;
  return `<div class="pro" style="--fond:${fond};--g:${g}">${et}<b>${e}</b></div>`;
}
function montre(id) {
  const E = ETAGES[id] || ETAGES['']; courant = ETAGES[id] ? id : '';
  document.getElementById('eTitre').textContent = E.titre; document.getElementById('eSous').textContent = E.sous;
  if (!courant && localStorage.getItem('guilde-odyssee-finie')) document.getElementById('eSous').innerHTML = '🌟 <b style="color:var(--or)">Héros de l’Odyssée</b> · ' + E.sous;
  document.getElementById('retour').classList.toggle('vu', !!courant);
  document.getElementById('heros').style.display = courant ? 'none' : '';
  car.innerHTML = E.portes.map((p, i) => `<div class="porte ${p.ferme ? 'ferme' : ''}" data-i="${i}">
    <div class="halo"></div><div class="dedans ${p.avenir ? 'tourne' : ''}">${dessin(p)}${p.ferme ? '<div class="verrou"><img src="menu-recu/cadenas.webp?v=2" alt="Verrouillé"></div>' : ''}</div>
    <img class="arche" src="menu-recu/arche-vide.webp?v=1" alt=""><img class="runes" src="menu-recu/fx-runes.webp?v=1" alt=""><div class="reflet"></div>
    ${p.ferme ? `<span class="bandeau">${p.ferme}</span>` : p.avenir ? '<span class="bandeau">À venir</span>' : ''}
    <div class="plaque ${p.nom.length > 13 ? 'long' : ''}">${p.nom}</div></div>`).join('');
  document.getElementById('points').innerHTML = E.portes.map(() => '<i></i>').join('');
  car.querySelectorAll('.porte').forEach(el => el.onclick = () => touche(+el.dataset.i));
  const garde = +(sessionStorage.getItem('guilde-porte-' + courant) || 0);
  car.classList.add('cache');
  requestAnimationFrame(() => { centre(garde, false); echelle(); car.classList.remove('cache'); });
}
function centre(i, doux) { const el = car.children[i]; if (el) car.scrollTo({ left:el.offsetLeft + el.offsetWidth / 2 - car.clientWidth / 2, behavior:doux ? 'smooth' : 'instant' }); }
function auCentre() { const m = car.scrollLeft + car.clientWidth / 2; let best = 0, d = 1e9; [...car.children].forEach((el, i) => { const x = Math.abs(el.offsetLeft + el.offsetWidth / 2 - m); if (x < d) { d = x; best = i; } }); return best; }
function echelle() {
  const m = car.scrollLeft + car.clientWidth / 2, c = auCentre(), E = ETAGES[courant];
  [...car.children].forEach((el, i) => { const d = Math.min(1, Math.abs(el.offsetLeft + el.offsetWidth / 2 - m) / el.offsetWidth); el.style.transform = `scale(${1 - .2 * d})`; el.style.filter = `brightness(${1 - .35 * d})`; el.classList.toggle('centre', i === c); });
  document.querySelectorAll('#points i').forEach((p, i) => p.classList.toggle('on', i === c));
  document.getElementById('desc').textContent = E.portes[c] ? E.portes[c].desc : '';
  sessionStorage.setItem('guilde-porte-' + courant, c);
}
car.addEventListener('scroll', () => requestAnimationFrame(echelle), { passive:true });
function touche(i) {
  let p = ETAGES[courant].portes[i];

  if (p.ferme && p.essai) p = { ...p, href:p.essai };
  else if (p.ferme || p.avenir) { const el = car.children[i]; el.animate([{ translate:'0' }, { translate:'-8px' }, { translate:'8px' }, { translate:'0' }], { duration:300 }); return; }
  if (!GM.son('portail')) souffle(); car.children[i].classList.add('entre'); document.getElementById('flash').classList.add('go');
  setTimeout(() => {
    if (p.href) { sessionStorage.setItem('guilde-dans-mode', '1'); location.href = p.href; return; }
    document.getElementById('flash').classList.remove('go'); location.hash = p.vers;
  }, 750);
}
// 12/11 : au premier passage, Moustache (ex-Corbin, 13/11) propose le tutoriel (avec « passer »)
function proposeTuto() {
  if (localStorage.getItem('guilde-tuto') === 'fait' || localStorage.getItem('guilde-tuto-vu')) return;
  const d = document.createElement('div'); d.id = 'propTuto';
  d.innerHTML = `<div><img src="ui/moustache.webp?v=1" alt="Moustache" style="width:84px;height:84px;border-radius:50%;object-fit:cover;box-shadow:0 0 0 3px #f3c96b, 0 6px 16px #000a"><h3>Miaou ! Première visite ?</h3><p>Moi c’est Moustache, chat d’aventure. Je te montre comment on se bat à la Guilde : <b>un duel guidé de 5 minutes</b> avec Gorm. À la fin, <b>Zéphine</b> rejoint la Guilde.</p>
    <button onclick="location.href='duel.html?tuto=1'">🎓 Faire le tutoriel</button><a href="#" onclick="localStorage.setItem('guilde-tuto-vu','1');this.closest('#propTuto').remove();return false">Passer (je le ferai plus tard depuis l’Arène)</a></div>`;
  document.body.appendChild(d);
}

// on entre : petit souffle magique, on plonge dans le portail
function souffle() { try { const a = new (window.AudioContext || window.webkitAudioContext)(), t = a.currentTime, o = a.createOscillator(), g = a.createGain();
  o.type = 'sine'; o.frequency.setValueAtTime(220, t); o.frequency.exponentialRampToValueAtTime(880, t + .9); g.gain.setValueAtTime(.12, t); g.gain.exponentialRampToValueAtTime(.001, t + 1.1);
  o.connect(g).connect(a.destination); o.start(t); o.stop(t + 1.2); } catch (e) {} }
function entrer() { const t = document.getElementById('titre'); if (t.classList.contains('part')) return; souffle(); t.classList.add('part'); sessionStorage.setItem('guilde-entre', '1'); GM.musique('menu');

{ const pb = document.createElement('a'); pb.id = 'profil-bouton'; pb.href = 'profil.html'; pb.title = 'Mon profil'; pb.setAttribute('aria-label', 'Mon profil'); pb.textContent = '👤';
