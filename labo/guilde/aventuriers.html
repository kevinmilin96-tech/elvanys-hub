<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>La Guilde des Runes · La Forge des héros</title>
<style>
  :root { --or:#f3c96b; --texte:#f1ecff; --doux:#c9c1ea; --ok:#7dffb0; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { margin:0; color:var(--texte); font:15px/1.45 Georgia, 'Times New Roman', serif; background:radial-gradient(ellipse at 50% -10%, #4a2a1a, #120f18 60%) fixed, #120f18; }
  main { max-width:560px; margin:0 auto; padding:12px 12px 60px; container-type:inline-size; }
  .haut { display:flex; align-items:center; gap:8px; } .haut a, .haut button { color:var(--doux); text-decoration:none; background:#2a1d18; border:1px solid #6a4a3a; border-radius:20px; padding:5px 12px; font:inherit; font-size:.9em; }
  h1 { flex:1; margin:0; text-align:center; color:var(--or); font-size:1.3em; }
  h2 { color:var(--or); font-size:1.1em; margin:18px 0 8px; }
  .sous { color:var(--doux); text-align:center; font-size:.92em; margin:8px 0 14px; }
  .fiche { display:flex; gap:12px; align-items:center; background:#2a1d18ee; border:2px solid var(--c, #6a4a3a); border-radius:16px; padding:10px; margin:8px 0; }
  .fiche img { width:72px; height:72px; border-radius:50%; object-fit:cover; box-shadow:0 0 0 3px var(--c); flex:none; }
  .fiche b { color:var(--or); font-size:1.08em; } .fiche small { display:block; color:var(--doux); }
  .fiche .barre { height:6px; border-radius:4px; background:#000a; margin-top:5px; overflow:hidden; } .fiche .barre i { display:block; height:100%; background:var(--or); }
  .fiche button { margin-left:auto; flex:none; }
  button { font:inherit; color:inherit; cursor:pointer; }
  .go { display:block; width:100%; font:bold 1.05em Georgia, serif; padding:12px; border-radius:14px; border:0; background:var(--or); color:#2b1d0a; margin-top:10px; }
  .sec { background:#2a1d18; border:1px solid #6a4a3a; border-radius:12px; padding:7px 12px; }
  .grille { display:grid; grid-template-columns:repeat(3, 1fr); gap:8px; }
  .grille button { background:#2a1d18; border:2px solid #6a4a3a; border-radius:12px; padding:8px 4px; font-size:.85em; }
  .grille button.on { border-color:var(--or); background:#4a3412; }
  .grille img { width:60px; height:60px; border-radius:50%; object-fit:cover; display:block; margin:0 auto 4px; }
  .grille small { display:block; color:var(--doux); font-size:.8em; }
  input[type=text] { width:100%; font:inherit; font-size:1.1em; padding:10px 12px; border-radius:12px; border:2px solid #6a4a3a; background:#1a1210; color:var(--texte); }
  .ligne { display:flex; gap:8px; align-items:center; }
  .couleurs { display:flex; gap:8px; flex-wrap:wrap; } .couleurs button { width:38px; height:38px; border-radius:50%; border:3px solid transparent; }
  .couleurs button.on { border-color:#fff; }
  .de { display:grid; grid-template-columns:repeat(6, 1fr); gap:6px; margin:8px 0; }
  .de button { min-width:0; aspect-ratio:1; border-radius:10px; background:#1a1210; border:2px solid #6a4a3a; padding:0; position:relative; }
  .de button img { width:100%; height:100%; object-fit:contain; }
  .de button.peut { border-color:var(--ok); box-shadow:0 0 0 2px var(--ok); }
  .de button span { position:absolute; bottom:-2px; right:2px; font-size:.75em; color:var(--doux); }
  .bloc { background:#2a1d18cc; border:1px solid #6a4a3a; border-radius:14px; padding:12px; margin:10px 0; }
  /* 16/11 nuit : la FICHE DU HÉROS façon jeu de héros (captures d'AFK Journey) : le héros au centre, l'équipement autour, les caractéristiques */
  .scene { display:grid; grid-template-columns:76px 1fr 76px; gap:8px; align-items:center; padding:14px 8px 10px; border-radius:18px; margin:8px 0;
    background:radial-gradient(ellipse at 50% 70%, #c88a4a55, transparent 60%), linear-gradient(180deg, #3a2414, #1a100a); border:2px solid #6a4a2a; box-shadow:inset 0 0 40px #000a; }
  .scene .col { display:grid; gap:10px; }
  .slot { position:relative; width:72px; height:72px; border-radius:12px; border:2px solid #6a4a3a; background:linear-gradient(160deg, #2a1d18, #120c0a); padding:2px; display:flex; flex-direction:column; align-items:center; justify-content:center; }
  .slot .e { font-size:28px; line-height:1; } .slot .e.vide { opacity:.3; } .slot small { font-size:9px; color:var(--doux); line-height:1.1; text-align:center; max-width:66px; overflow:hidden; white-space:nowrap; text-overflow:ellipsis; }
  .slot i { position:absolute; top:2px; right:4px; font-style:normal; font-size:10px; color:var(--or); font-weight:bold; }
  .slot.r0 { border-color:#c9c1ea; } .slot.r1 { border-color:#4f8bff; box-shadow:0 0 10px #4f8bff66; background:linear-gradient(160deg, #1a2a5a, #0c1430); } .slot.r2 { border-color:#c084fc; box-shadow:0 0 12px #c084fc88; background:linear-gradient(160deg, #3a1a5a, #160c30); }
  .slot.lock { opacity:.55; } .slot.lock .e { font-size:22px; }
  .heros-c { text-align:center; } .heros-c img { width:100%; max-width:170px; aspect-ratio:1; border-radius:50%; object-fit:cover; box-shadow:0 0 0 4px var(--c), 0 0 30px var(--c); }
  .heros-c b { display:block; color:var(--or); font-size:1.15em; margin-top:6px; } .heros-c small { color:var(--doux); }
  .puiss { text-align:center; font-size:1.6em; font-weight:bold; color:var(--or); margin:6px 0 2px; text-shadow:0 0 10px #f3c96b66; }
  .stats-h { display:grid; grid-template-columns:repeat(6, 1fr); gap:4px; background:#1a1210; border:1px solid #6a4a3a; border-radius:14px; padding:8px 4px; text-align:center; font-size:.8em; }
  .stats-h b { display:block; font-size:1.25em; color:var(--texte); } .stats-h span { color:var(--doux); }
  .boutons-h { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin:10px 0; }
  .voile-f { position:fixed; inset:0; background:#000c; z-index:50; display:flex; align-items:center; justify-content:center; padding:4vw; }
  .fen { width:min(94vw, 480px); max-height:88vh; overflow:auto; background:#2a1d18; border:2px solid var(--or); border-radius:18px; padding:16px; }
  .fen h2 { margin:0 0 8px; text-align:center; }
  .piece { display:flex; align-items:center; gap:10px; border:2px solid #6a4a3a; border-radius:12px; padding:8px; margin:6px 0; background:#1a1210; }
  .piece .e { font-size:26px; } .piece b { display:block; } .piece small { color:var(--doux); display:block; } .piece .act { margin-left:auto; display:flex; flex-direction:column; gap:4px; }
  .piece.r1 { border-color:#4f8bff; } .piece.r2 { border-color:#c084fc; }
  .bulle { position:fixed; left:50%; top:40%; transform:translateX(-50%); z-index:60; background:#000c; color:var(--or); font-weight:bold; padding:10px 18px; border-radius:14px; animation:bul 1.4s forwards; pointer-events:none; }
  @keyframes bul { 0% { opacity:0; } 15% { opacity:1; } 80% { opacity:1; } 100% { opacity:0; } }
</style>
</head>
<body>
<main id="app"></main>
<div id="fen"></div>
<script src="musique.js?v=20261116-195323"></script>
<script src="rang.js?v=20261116-195323"></script>
<script src="heros-etoiles.js?v=20261116-195323"></script>
<script src="aventuriers.js?v=20261116-195323"></script>
<script src="fiche-heros.js?v=20261116-195323"></script>
<script>
// =============================================================================================== LA FORGE DES HÉROS (15/11) : créer et faire grandir ses héros d'aventure
const $ = id => document.getElementById(id);
const son = k => { try { if (typeof GM !== 'undefined') GM.son(k); } catch (e) {} };
const retour = new URLSearchParams(location.search).get('retour') || 'chroniques.html';
let N = null; // le héros en cours de création
const img = (a, px) => `<img src="${avPortrait(a)}" onerror="this.onerror=null;this.src='${avPortraitSecours(a)}'" alt="" ${px ? `style="width:${px}px;height:${px}px"` : ''}>`;
function liste() {
  const L = avLire();
  $('app').innerHTML = `<div class="haut"><a href="${retour}">‹ Retour</a><h1>⚒ La Forge des héros</h1><a href="menu.html">Menu</a></div>
    <p class="sous">Crée TON héros d’aventure, comme dans un jeu de rôle : une voie, un nom, un portrait, un dé que tu forges en montant de niveau. Il garde tout d’une aventure à l’autre.</p>
    ${L.map(a => { const s = avStats(a), n = s.niveau, prochain = AV_SEUILS[n + 1], aChoisir = [2, 4, 6].filter(v => n >= v && !(a.talents || {})[v]).length;
      return `<div class="fiche" style="--c:${a.couleur}">${img(a)}<div style="flex:1"><b>${a.nom} <span style="color:var(--doux);font-size:.8em">✊ ${avPuissance(a)}</span></b><small>${avTitre(a)} · niveau ${n} · ❤ ${s.pv}${s.desPlus ? ' · 🎲 +1 dé' : ''}${a.points ? ` · <span style="color:var(--ok)">⚒ ${a.points} point${a.points > 1 ? 's' : ''} à forger</span>` : ''}${aChoisir ? ` · <span style="color:var(--ok)">✨ talent à choisir</span>` : ''}</small>
        <div class="barre"><i style="width:${n >= AV_MAX ? 100 : Math.round(100 * (a.xp - AV_SEUILS[n]) / (prochain - AV_SEUILS[n]))}%"></i></div><small>${n >= AV_MAX ? 'niveau maximum' : `${a.xp} / ${prochain} XP`} · ${a.victoires}/${a.parties} aventures réussies</small></div>
        <button class="sec" onclick="fiche('${a.id}')">Ouvrir</button></div>`; }).join('') || '<p class="sous">Pas encore de héros d’aventure.</p>'}
    <button class="go" onclick="nouveau()">＋ Créer un héros d’aventure</button>`;
}
function nouveau() { N = { voie:'maelle', genre:'h', nom:AV_NOMS[Math.floor(Math.random() * AV_NOMS.length)], couleur:AV_COULEURS[0] }; creation(); }
function creation() {
  $('app').innerHTML = `<div class="haut"><a href="#" onclick="liste();return false">‹ Mes héros</a><h1>Nouveau héros</h1><span></span></div>
    <h2>1 · Sa voie</h2><div class="grille">${Object.entries(VOIES).map(([k, v]) => `<button class="${N.voie === k ? 'on' : ''}" onclick="N.voie='${k}';creation()"><img src="portraits/${k}.webp" alt="">${v.n}<small>${v.role}</small></button>`).join('')}</div>
    <h2>2 · Son portrait</h2><div class="grille">${['h', 'f'].map(g => { const a = { voie:N.voie, genre:g }; return `<button class="${N.genre === g ? 'on' : ''}" onclick="N.genre='${g}';creation()">${img(a)}${VOIES[N.voie][g]}</button>`; }).join('')}</div>
    <h2>3 · Son nom</h2><div class="ligne"><input type="text" id="nom" maxlength="20" value="${N.nom.replace(/"/g, '')}" oninput="N.nom=this.value"><button class="sec" onclick="N.nom=AV_NOMS[Math.floor(Math.random()*AV_NOMS.length)];creation()">🎲</button></div>
    <h2>4 · Sa couleur</h2><div class="couleurs">${AV_COULEURS.map(c => `<button class="${N.couleur === c ? 'on' : ''}" style="background:${c}" onclick="N.couleur='${c}';creation()"></button>`).join('')}</div>
    <div class="fiche" style="--c:${N.couleur};margin-top:16px">${img(N)}<div><b>${N.nom || '…'}</b><small>${VOIES[N.voie][N.genre]} · ${VOIES[N.voie].role}</small></div></div>
    <button class="go" onclick="cree()">⚒ Forger ce héros</button>`;
}
function cree() { const nom = ($('nom') ? $('nom').value : N.nom).trim(); if (!nom) return; N.nom = nom; const a = avCreer(N); son('ultime'); fiche(a.id); }
let FICHE = null; FH.apres = () => FICHE && fiche(FICHE);
function fiche(id) {
  FICHE = id; const a = avTrouve(id); if (!a) return liste(); const s = avStats(a), E = avEquipement(a), sac = avSac(), niv = s.niveau;
  const slot = c => { const p = E[c.k], lock = c.niv && niv < c.niv;
    return `<button class="slot ${p ? 'r' + p.r : ''} ${lock ? 'lock' : ''}" onclick="${lock ? `bulle('Cette case s’ouvre au niveau ${c.niv}')` : `caseEquip('${a.id}','${c.k}')`}">${lock ? `<span class="e">🔒</span><small>niveau ${c.niv}</small>` : p ? `<span class="e">${c.e}</span><small>${p.nom}</small><i>+${p.niv}</i>` : `<span class="e vide">${c.e}</span><small>${c.n}</small>`}</button>`; };
  const nbLibres = sac.pieces.filter(p => !avLire().some(b => b.equip && Object.values(b.equip).includes(p.id))).length;
  $('app').innerHTML = `<div class="haut"><a href="#" onclick="liste();return false">‹ Mes héros</a><h1>${a.nom}</h1><a href="mes-heros.html">🏰 Mes héros</a></div>
    ${ficheHerosHTML(a.id)}
    <div class="bloc"><b style="color:var(--or)">⚒ Son dé personnel</b><p class="sous" style="text-align:left;margin:4px 0">Chaque niveau d’EXPÉRIENCE d’aventure donne un <b>point de forge</b> : touche une face pour lui ajouter 1 (jusqu’à 6). Un dé avec plus de grosses faces frappe plus fort et ouvre plus de sceaux. Points à dépenser : <b style="color:var(--ok)">${a.points}</b>.</p>
      <div class="de">${a.faces.map((v, k) => `<button class="${a.points && v < 6 ? 'peut' : ''}" onclick="forge('${a.id}',${k})"><img src="faces-${a.voie}/face-${v}.webp" alt="${v}"><span>${k + 1}</span></button>`).join('')}</div></div>
    <div class="bloc"><b style="color:var(--or)">✨ Ses talents</b><p class="sous" style="text-align:left;margin:4px 0">Aux niveaux 2, 4 et 6, choisis un talent sur deux.</p>
      ${[2, 4, 6].map(niv => `<p style="margin:8px 0 4px"><b>Niveau ${niv}</b>${s.niveau < niv ? ' <small style="color:var(--doux)">(pas encore atteint)</small>' : ''}</p><div class="grille" style="grid-template-columns:1fr 1fr">${TALENTS[niv].map(([k, n, d]) => `<button class="${(a.talents || {})[niv] === k ? 'on' : ''}" ${s.niveau < niv ? 'disabled style="opacity:.4"' : ''} onclick="talent('${a.id}',${niv},'${k}')">${n}<small>${d}</small></button>`).join('')}</div>`).join('')}</div>
    <div class="bloc"><b style="color:var(--or)">📈 L’expérience d’aventure</b><p class="sous" style="text-align:left;margin:4px 0">Une aventure réussie : 120 XP ; une aventure ratée : 40 XP. Chaque niveau : +2 PV et un point de forge. Au niveau 4 : un dé de plus.</p>
      <p style="margin:0">${[2, 3, 4, 5, 6].map(n => `${s.niveau >= n ? '✅' : '⬜'} niveau ${n} (${AV_SEUILS[n]} XP)`).join('<br>')}</p></div>
    <button class="sec" style="margin-top:14px" onclick="if(confirm('Effacer ${a.nom.replace(/'/g, '')} pour toujours ?')){avSupprime('${a.id}');liste()}">🗑 Effacer ce héros</button>`;
}
// ---- l'équipement : une case, le coffre, le forgeron
const bulle = x => { const b = document.createElement('div'); b.className = 'bulle'; b.textContent = x; document.body.appendChild(b); setTimeout(() => b.remove(), 1500); };
function fenetre(h) { $('fen').innerHTML = h ? `<div class="voile-f" onclick="if(event.target===this)fenetre('')"><div class="fen">${h}</div></div>` : ''; }
function pieceHTML(p, actions) { const C = EQ_CASES.find(c => c.k === p.slot), por = porteurDe(p.id);
  return `<div class="piece r${p.r}"><span class="e">${C.e}</span><div><b style="color:${EQ_RARE[p.r].c}">${p.nom} <small style="display:inline">+${p.niv}</small></b><small>${C.n} ${EQ_RARE[p.r].n} · ${eqTexte(p)}</small>${por ? `<small>porté par ${por.nom}</small>` : ''}</div><div class="act">${actions}</div></div>`; }
function caseEquip(id, k) {
  const a = avTrouve(id), E = avEquipement(a), p = E[k], C = EQ_CASES.find(c => c.k === k), sac = avSac();
  const autres = sac.pieces.filter(x => x.slot === k && x.id !== (p && p.id));
  fenetre(`<h2>${C.e} ${C.n}</h2>
    ${p ? `<p style="color:var(--doux);margin:0">Porté :</p>${pieceHTML(p, `${p.niv < EQ_NIV_MAX ? `<button class="sec" onclick="ameliore('${id}','${k}','${p.id}')">⬆ ${eqPrixAmelio(p)} 🪙</button>` : '<small>niveau max</small>'}<button class="sec" onclick="avRetire('${id}','${k}');fenetre('');fiche('${id}')">Retirer</button>`)}
      ${p.niv < EQ_NIV_MAX ? `<p style="color:var(--doux);font-size:.85em;margin:2px 0 10px">Au niveau ${p.niv + 1} : ${eqTexte(Object.assign({}, p, { niv:p.niv + 1 }))}</p>` : ''}` : '<p style="color:var(--doux)">Rien dans cette case.</p>'}
    <p style="color:var(--doux);margin:10px 0 0">Dans le coffre :</p>
    ${autres.length ? autres.map(x => pieceHTML(x, `<button class="sec" onclick="equipe('${id}','${x.id}')">Équiper</button>`)).join('') : '<p class="sous">Aucune pièce de ce genre. Fouille les meubles des Chroniques, finis des aventures, ou passe chez le forgeron.</p>'}
    <button class="go" onclick="fenetre('')">Fermer</button>`);
}
function equipe(id, pid) { const r = avEquipe(id, pid); if (r === 'ok') { son('tour-fusion'); bulle('Équipé !'); fenetre(''); fiche(id); } else bulle(r); }
function ameliore(id, k, pid) { const r = avAmeliore(pid); if (r === 'ok') { son('tour-fusion'); bulle('⬆ Amélioré !'); fiche(id); caseEquip(id, k); } else bulle(r); }
function coffre(id) {
  const sac = avSac();
  fenetre(`<h2>🎒 Le coffre</h2><p class="sous">🪙 ${sac.or} pièces d’or · ${sac.pieces.length} pièce${sac.pieces.length > 1 ? 's' : ''}. Améliore avec l’or, ou revends ce qui ne sert plus.</p>
    ${sac.pieces.slice().sort((x, y) => y.r - x.r || y.niv - x.niv).map(p => pieceHTML(p, `${p.niv < EQ_NIV_MAX ? `<button class="sec" onclick="ameliorePiece('${id}','${p.id}')">⬆ ${eqPrixAmelio(p)} 🪙</button>` : ''}<button class="sec" onclick="if(confirm('Revendre ${p.nom.replace(/'/g, '')} pour ${eqPrixVente(p)} pièces ?')){avVend('${p.id}');coffre('${id}');fiche('${id}')}">Vendre ${eqPrixVente(p)}</button>`)).join('') || '<p class="sous">Le coffre est vide.</p>'}
    <button class="go" onclick="fenetre('')">Fermer</button>`);
}
function ameliorePiece(id, pid) { const r = avAmeliore(pid); if (r === 'ok') { son('tour-fusion'); bulle('⬆ Amélioré !'); } else bulle(r); fiche(id); coffre(id); }
function forgeron(id) {
  const sac = avSac(); let deja = {}; try { deja = JSON.parse(localStorage.getItem('guilde-forgeron-achats') || '{}'); } catch (e) {}
  fenetre(`<h2>⚒ Le forgeron</h2><p class="sous">« Trois pièces aujourd’hui, pas une de plus. Demain, autre chose. » · 🪙 ${sac.or}</p>
    ${forgeronStock(id).map((x, i) => pieceHTML(x, deja[x.id] ? '<small>vendu</small>' : `<button class="sec" ${sac.or < x.prix ? 'disabled style="opacity:.4"' : ''} onclick="achete('${id}',${i})">${x.prix} 🪙</button>`)).join('')}
    <p class="sous">L’or se gagne dans les Chroniques et les Aventures : pièces d’or dans les meubles, et à chaque victoire.</p>
    <button class="go" onclick="fenetre('')">Fermer</button>`);
}
function achete(id, i) { const r = forgeronAchete(i, id); if (r === 'ok') { son('tour-fusion'); bulle('Acheté : dans le coffre !'); fiche(id); forgeron(id); } else bulle(r); }
function talent(id, niv, k) { if (avChoisitTalent(id, niv, k)) son('magie'); fiche(id); }
function forge(id, k) { if (avForge(id, k)) son('tour-fusion'); fiche(id); }
if (typeof GM !== 'undefined') { try { GM.musique('menu'); GM.bouton(); } catch (e) {} }
const hQ = new URLSearchParams(location.search).get('h'); hQ && avTrouve(hQ) ? fiche(hQ) : liste();
</script>
<script src="guide.js?v=20261116-195323"></script>
<script src="guides-modes.js?v=20261116-195323"></script>
<script>
// 15/11 : le guide de Moustache de ce mode (guides-modes.js)
{ const _l = liste; liste = function () { const r = _l.apply(this, arguments); guideMode('forge'); return r; }; }
guideMode('forge');
</script>
</body>
</html>
