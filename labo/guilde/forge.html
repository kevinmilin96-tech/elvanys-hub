<!doctype html>
<html lang="fr">
<head><meta name="guilde-version" content="20261122-110308">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#120f24">
<title>La Guilde des Runes · La Forge</title>
<style>
  :root { --or:#f3c96b; --texte:#f1ecff; --doux:#c9c1ea; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { margin:0; color:var(--texte); font:15px/1.45 Georgia, 'Times New Roman', serif; background:radial-gradient(ellipse at 50% -10%, #4a2a1a, #120f24 60%) fixed, #120f24; }
  main { max-width:560px; margin:0 auto; padding:12px 12px 60px; }
  .haut { display:flex; align-items:center; gap:8px; } .haut a { color:var(--doux); text-decoration:none; background:#221d42; border:1px solid #4b4580; border-radius:20px; padding:5px 12px; font-size:.9em; }
  h1 { flex:1; margin:0; text-align:center; color:var(--or); font-size:1.3em; } .haut span { width:70px; }
  .qui { display:flex; gap:8px; overflow-x:auto; padding:6px 2px 8px; scrollbar-width:none; } .qui::-webkit-scrollbar { display:none; }
  .qui button { flex:none; width:64px; background:none; border:0; color:var(--doux); font:11px Georgia, serif; text-align:center; cursor:pointer; padding:0; }
  .qui img { width:52px; height:52px; border-radius:50%; object-fit:cover; display:block; margin:0 auto 2px; box-shadow:0 0 0 2px #4b4580; }
  .qui button.sel { color:var(--or); font-weight:bold; } .qui button.sel img { box-shadow:0 0 0 3px var(--or), 0 0 12px #f3c96b88; }
  .onglets { display:flex; gap:6px; margin:6px 0 10px; } .onglets button { flex:1; font:bold 15px Georgia, serif; padding:10px; border-radius:14px; border:2px solid #4b4580; background:#1c1838; color:var(--doux); cursor:pointer; position:relative; }
  .onglets button.sel { border-color:#ff9a3c; color:var(--texte); background:#2a1d2a; box-shadow:0 0 12px #ff9a3c55; }
  .onglets .pt { position:absolute; top:-6px; right:-4px; background:#7dff8a; color:#0b3a12; border-radius:10px; font-size:.7em; padding:1px 7px; }
  #zone { background:#1c1838; border:2px solid #4b4580; border-radius:18px; padding:14px; }
  #zone h2 { display:none; } #zone .doux { color:var(--doux); font-size:.9em; }
  #zone button[onclick*="fhFen('')"] { display:none; }
  .sous { color:var(--doux); text-align:center; font-size:.85em; margin:6px 0; }
</style>
</head>
<body>
<main id="app"></main>
<script src="musique.js?v=2acde000cd"></script>
<script src="rang.js?v=01acb4f369"></script>
<script src="heros-etoiles.js?v=80a6cac830"></script>
<script src="donnees.js?v=7c4f716d6e"></script>
<script src="odyssee.js?v=913cf4e82c"></script>
<script src="aventure.js?v=09133a6200"></script>
<script src="aventuriers.js?v=5679a4a045"></script>
<script src="pouvoirs-heros.js?v=1adf3b588a"></script>
<script src="fiche-heros.js?v=3a7b543f00"></script>
<script>
// =============================================================================================== LA FORGE (18/11, demande de l'utilisateur)
// « Une même icône dans le menu pour la forge et le forgeron : une fois dedans, le vendeur et la fabrication, au lieu de chercher dans la fiche d'un héros. »
// Réutilise fiche-heros.js : fhForgeron (le vendeur, ses pièces suivent le héros choisi) et fhForge (la fabrication), affichés dans la page au lieu d'une fenêtre.
const $ = id => document.getElementById(id);
const P = new URLSearchParams(location.search), retour = P.get('retour') || 'menu.html';
const ZOK = () => localStorage.getItem('guilde-tuto') === 'fait';
const herosDispo = () => ['maelle', 'aldric', 'pip', 'oria', 'gorm', 'zephine'].filter(id => id !== 'zephine' || ZOK()).concat(typeof avLire === 'function' ? avLire().map(a => a.id) : []).filter(id => fhInfo(id));
let qui = localStorage.getItem('guilde-forge-heros'); if (!herosDispo().includes(qui)) qui = herosDispo().sort((a, b) => fhPuissance(b) - fhPuissance(a))[0];
let onglet = P.get('o') === 'fabrication' || location.hash === '#fabrication' ? 'fab' : 'vendeur';
let enPage = false;
const _fen = fhFen;
fhFen = function (h) { if (!enPage) return _fen(h); if (!h) { dessine(); return; } const z = $('zone'); if (z) z.innerHTML = h; };
FH.apres = () => { const r = document.querySelector('.fh-ress'); if (r) r.outerHTML = fhRess(); };
function dessine() {
  const nf = groupesFusion().length;
  $('app').innerHTML = `<div class="haut"><a href="${retour}">‹ Retour</a><h1>⚒ La Forge</h1><span></span></div>
    ${fhRess()}
    <p class="sous">Pour qui ? <small>(le forgeron propose des pièces à la mesure de ce héros)</small></p>
    <div class="qui">${herosDispo().map(id => { const I = fhInfo(id); return `<button class="${id === qui ? 'sel' : ''}" onclick="choisit('${id}')">${fhImg(I)}${I.nom}</button>`; }).join('')}</div>
    <div class="onglets"><button class="${onglet === 'vendeur' ? 'sel' : ''}" onclick="change('vendeur')">🛒 Le forgeron</button><button class="${onglet === 'fab' ? 'sel' : ''}" onclick="change('fab')">🔥 Fabrication${nf ? `<span class="pt">${nf}</span>` : ''}</button></div>
    <div id="zone"></div>
    <p class="sous">Équiper une pièce se fait dans la fiche du héros : <a href="mes-heros.html?h=${qui}&retour=forge.html" style="color:var(--or)">🏰 ${fhInfo(qui).nom} ›</a></p>`;
  enPage = true; onglet === 'vendeur' ? fhForgeron(qui) : fhForge(qui);
}
function choisit(id) { qui = id; localStorage.setItem('guilde-forge-heros', id); dessine(); }
function change(o) { onglet = o; FORGE.sel = null; dessine(); }
if (typeof GM !== 'undefined') { try { GM.musique('menu'); GM.bouton(); } catch (e) {} }
dessine();
</script>
</body>
</html>
