  /* 14/11 : plateau peint */

  .msg { min-height:2.4em; text-align:center; font-size:.85em; color:var(--doux); margin:5px 0; }

  .acts { display:grid; grid-template-columns:repeat(4, 1fr); gap:5px; margin:5px 0; }

  .acts button:disabled { opacity:.35; }

  .main { display:flex; gap:5px; overflow-x:auto; padding:3px 0 6px; }

  .carte b { display:block; font-size:1.12em; } .carte .c { position:absolute; top:-6px; right:-5px; background:#2a7fc1; color:#fff; border-radius:50%; width:20px; height:20px; display:flex; align-items:center; justify-content:center; font-weight:bold; }
  .carte .tx { color:#7a5a2a; } .carte.ok { border-color:#2a9f4a; box-shadow:0 0 8px #2a9f4a; } .carte.attente { border-color:var(--or); box-shadow:0 0 10px var(--or); }
  .bas { display:flex; gap:6px; justify-content:center; margin-top:6px; } .bas button { background:#1e1838; color:var(--doux); border:1px solid #3e3370; border-radius:10px; padding:4px 10px; font-size:.8em; }
  .dg { position:absolute; left:50%; top:20%; transform:translateX(-50%); color:#ff5a3a; font-weight:bold; font-size:1.25em; text-shadow:0 0 5px #000; animation:monte .9s forwards; pointer-events:none; z-index:3; }
  .tire { animation:tir .35s; } @keyframes tir { 50% { transform:translateY(-5px) scale(1.06); filter:brightness(1.6); } }
  .projectile { position:fixed; width:16px; height:16px; margin:-8px 0 0 -8px; border-radius:50%; background:radial-gradient(circle, #fff 0 25%, var(--c1) 45%, var(--c2) 75%, transparent 76%); box-shadow:0 0 10px var(--c1), 0 0 18px var(--c2); z-index:31; pointer-events:none; }

<script>
// =============================================================================================== LA DÉFENSE DE LA PORTE · l'ÉCRAN (13/11)
// Règles : defense-proposition.html (validées le 13/11). Moteur : defense-moteur.js.
let D = null, sel = [], selTour = -1, attente = null, msg = '', err = false;
const app = document.getElementById('app'), fen = document.getElementById('fen');
const fenetre = h => { fen.innerHTML = `<div class="fenetre" onclick="if(event.target===this)fermer()"><div>${h}</div></div>`; };
const fermer = () => { fen.innerHTML = ''; };
const CORBIN = {
  1:'Miaou. Des gobelins. Rien de grave. Enfin, pas encore.', 2:'Des sangliers, maintenant. Garde-moi un morceau.', 3:'Des chauves-souris ! Elles volent par-dessus ta tour de devant. Sournoises. J’aime bien.',
  4:'Ça se corse. Tu as pensé à fusionner, au moins ?', 5:'Ils sont nombreux. Moi, je surveille depuis le rempart. Le coussin du rempart. Courage.', 6:'LE TITAN. S’il touche la porte, c’est fini. Il fait fondre tes tours : tape fort, tape vite.' };

function accueil() {
  D = null;
  app.innerHTML = `<h1>🏰 La Défense de la porte</h1>
  <p class="doux" style="text-align:center">Les monstres descendent trois chemins vers la porte de la Guilde. Tes dés deviennent des tours… ou des coups tout de suite. Deux tours identiques qui se touchent fusionnent ; deux 6 éveillent une Rune.</p>
  <div class="heros">${['maelle', 'gorm'].map(h => `<button onclick="demarre('${h}')"><img src="${IMG(h)}" alt=""><b>${HEROS[h].nom}</b><br>${DHEROS[h].passif}<br><br>✨ Rune : ${DHEROS[h].rune.n}<br><small>${DHEROS[h].rune.d}</small></button>`).join('')}</div>
  <p class="doux" style="text-align:center">🎯 Défi du jour : <b style="color:var(--or)">${defiDuJourD().n}</b>${lesEtoiles()[jourCle()] ? ` · aujourd’hui : ${'★'.repeat(lesEtoiles()[jourCle()])}` : ''}</p>
  <p class="doux" style="text-align:center">6 vagues, le Titan de feu, Maëlle et Gorm. Les autres héros viendront.</p>
  ${records()}
  <div class="choixh"><button onclick="regles()">📜 Les règles</button><button onclick="location.href='menu.html'">⌂ Menu</button></div>`;
}
const REC = 'guilde-defense';
const lesRecords = () => { try { return JSON.parse(localStorage.getItem(REC) || '[]'); } catch (e) { return []; } };
function records() { const r = lesRecords(); if (!r.length) return ''; const g = r.filter(x => x.gagne); return `<p class="doux" style="text-align:center">🏆 ${g.length} victoire${g.length > 1 ? 's' : ''} sur ${r.length} partie${r.length > 1 ? 's' : ''}${g.length ? ` · meilleur score ${Math.max(...g.map(x => x.score))}` : ''}</p>`; }
function demarre(h) { D = nouvelleDefense(h); sel = []; selTour = -1; attente = null; dis('Lance… c’est déjà fait. Choisis des dés : bâtis une tour (touche une case verte) ou frappe un monstre.'); vagueAnnonce(); rendu(); }
function dis(t, e) { msg = t; err = !!e; }
function vagueAnnonce() { const v = D.fx.find(f => f.t === 'vague'); if (v) GM.son('vague'); if (v && CORBIN[v.n]) setTimeout(() => fenetre(`<h2>🌊 Vague ${v.n} sur ${VAGUES.length}</h2><div class="corbin">Moustache : « ${CORBIN[v.n]} »</div><div class="choixh"><button class="or" onclick="fermer()">À la porte !</button></div>`), 450); }

// ---------------------------------------------------------------- le dessin
// 14/11 : images Gemini reçues (sans image, l'émoji reste) ; Gobelin, Chauve-souris et Rune du Cor à refaire
const IMG_D = { chauve:'portraits/d-chauve.webp?v=1', gobelin:'portraits/d-gobelin.webp?v=1', sanglier:'portraits/d-sanglier.webp?v=1', bouclier:'portraits/d-bouclier.webp?v=1', titan:'portraits/m-titan.webp?v=1' };
const RUNE_IMG = { maelle:'portraits/rune-enclume.webp?v=2', gorm:'portraits/rune-cor.webp?v=1' };
// 14/11 : le fond peint de la Défense (decor/fond-defense.webp) ; chemins, dalles et porte placés par l'utilisateur (placer-defense.html → « PLACEMENT DEFENSE {…} », recopié ici tel quel)
const PD = {"chemin_haut":0,"chemin_bas":49,"largeur_chemin":18,"voies":[18,50,82],"dalles":[[18,61],[50,61],[82,61],[18,74.5],[50,74.5],[82,74.5],[18,88],[50,88],[82,88]],"dalle":[19.5,10.2],"porte":[50,98]}; // PLACEMENT DEFENSE de l'utilisateur (14/11 ~16 h 15), recopié tel quel
const ANGLE = {}; // 14/11 : l'angle de chaque canon (il garde la direction de son dernier tir)
const posCC = (r, col) => { const h = (PD.chemin_bas - PD.chemin_haut) / 4; return `left:${PD.voies[col] - PD.largeur_chemin / 2}%;width:${PD.largeur_chemin}%;top:${PD.chemin_haut + r * h}%;height:${h}%`; };
const posRC = c => { const d = PD.dalles[c]; return `left:${d[0] - PD.dalle[0] / 2}%;width:${PD.dalle[0]}%;top:${d[1] - PD.dalle[1] / 2}%;height:${PD.dalle[1]}%`; };
// ---------------------------------------------------------------- v2 (14/11) : pièges, prochaine vague, coups de héros, bonus, étoiles
const okPiege = (r, col) => { const un = sel.length === 1 ? sel[0] : null; return !!(un && !attente && D.pc >= DEF.coutBatir && !D.pieges[cleP(r, col)] && !D.monstres.some(m => m.row === r && m.col === col)); };
const piegeHTML = (r, col) => { const p = D.pieges[cleP(r, col)]; if (!p) return ''; const P = PIEGES[p.k]; return `<span class="piege ${p.k}" title="${P.n}">${P.e}${p.k === 'ronces' ? `<small>${p.v}</small>` : p.usages > 1 ? `<small>×${p.usages}</small>` : ''}</span>`; };
const ICONE_M = t => IMG_D[t] ? `<img src="${IMG_D[t]}" alt="">` : MONSTRES[t].e;
function bandeVague() {
  const P = prochainesD(D); if (!P.tour.length && !P.reste.length) return `<div class="bandeV">🌋 ${D.vague >= VAGUES.length ? 'Dernière vague : tiens bon !' : ''}</div>`;
  return `<div class="bandeV" onclick="voirVague()"><b>🌊 Vague ${P.vague}</b> · ${P.attente ? `arrive dans ${P.attente + 1} tours` : P.neuve ? 'arrive au prochain tour' : 'au prochain tour'} : ${P.tour.map(ICONE_M).join('') || '—'}${P.reste.length ? ` <span class="doux">puis</span> ${P.reste.map(ICONE_M).join('')}` : ''}</div>`;
}
function voirVague() { const P = prochainesD(D), tous = [...new Set([...P.tour, ...P.reste])]; fenetre(`<h2>🌊 Vague ${P.vague}</h2>${tous.map(t => `<p><span class="icv">${ICONE_M(t)}</span> <b>${MONSTRES[t].n}</b> : ${MONSTRES[t].d}</p>`).join('')}<div class="choixh"><button onclick="fermer()">Compris</button></div>`); }
function toucheChemin(ev, r, col) {
  if (ev.target.closest('.mo')) return;
  const p = D.pieges[cleP(r, col)];
  if (sel.length !== 1 || attente) { if (p) dis(`${PIEGES[p.k].e} ${PIEGES[p.k].n} : ${PIEGES[p.k].d}`); else dis('Choisis un dé, puis touche une case de chemin pour y poser un piège (1 = boue, 2 à 5 = ronces, 6 = barricade).'); rendu(); return; }
  const k = sortePiege(sel[0].v), e = poserPiegeD(D, sel[0], r, col);
  if (e) dis(e, true); else { sel = []; GM.son('tour-batir'); dis(`${PIEGES[k].e} ${PIEGES[k].n} posée.`); }
  rendu();
}

  <li><b>Fusionner</b> : un dé sur un canon de même valeur (${DEF.coutBatir} PC), ou un canon sur son voisin identique (gratuit) : valeur +1. <b>Deux 6 = une Rune</b> ; deux Runes voisines du même niveau = <b>Rune ancienne ✦✦</b>, puis <b>légendaire ✦✦✦</b>.</li>
  <li><b>Piège</b> (${DEF.coutBatir} PC) : un dé, puis une case de chemin : 🟫 1 = boue (arrête un monstre un tour), 🌿 2 à 5 = ronces (valeur × 3), 🪨 6 = barricade (le monstre change de chemin). Les chauves-souris volent au-dessus de la boue et des ronces ; le Titan écrase tout.</li>
  <li><b>Déplacer</b> une tour d’une case (une fois par tour) : touche-la, puis une case libre voisine.</li>
  <li><b>Coups de héros</b> : ⚔ <b>Frappe</b> (dés identiques) touche <b>tout un chemin</b> : valeur × nombre de dés × 2 ; ⚔⚔ <b>Technique</b> (suite) touche tout un chemin et fait <b>reculer</b> les monstres d’une case. Plus forts à chaque vague. Aussi : Pouvoir, Ultime, et les <b>cartes</b>.</li>
  <li><b>Vendre</b> : +1 PC par dé. Les dés pas utilisés sont vendus à la fin du tour.</li></ul>
  <p>En haut, la bande 🌊 montre <b>la vague qui arrive</b>. Après chaque vague, tu choisis <b>un bonus parmi 3</b>. À la victoire : jusqu’à <b>3 étoiles</b> (porte à 15 PV ou plus, défi du jour).</p>
  <p>Monstres : 👺 Gobelin (💨 avance de 2), 🐗 Sanglier (solide), 🛡 Porte-bouclier (−3 à chaque tir de tour), 🦇 Chauve-souris (🪽 ta tour de devant ne la voit pas), 🌋 le Titan (vague 6 : avance une case tous les 2 tours, fait fondre ta tour la plus faible de sa colonne ; s’il touche la porte, elle tombe).</p>
