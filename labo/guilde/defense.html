<script>
// =============================================================================================== LA DÉFENSE DE LA PORTE · l'ÉCRAN (13/11)
// Règles : defense-proposition.html (validées le 13/11). Moteur : defense-moteur.js.
let D = null, sel = [], selTour = -1, attente = null, msg = '', err = false;
const app = document.getElementById('app'), fen = document.getElementById('fen');
const fenetre = h => { fen.innerHTML = `<div class="fenetre" onclick="if(event.target===this)fermer()"><div>${h}</div></div>`; };
const fileF = []; // 27/11 : les fenêtres de fin de tour attendent leur tour (vague, nouveau monstre, bonus)
const fermer = () => { fen.innerHTML = ''; if (fileF.length) setTimeout(() => { if (fen.innerHTML || !fileF.length) return; const f = fileF.shift(); f(); }, 160); };
const montreF = f => { if (fen.innerHTML) fileF.push(f); else f(); };
const CORBIN = {
  1:'Miaou. Des gobelins. Rien de grave. Enfin, pas encore.', 2:'Des sangliers, des chauves-souris, et… un rat ? Garde-moi le rat.', 3:'Ça se corse : des feux follets, et la première élite au cadre doré. Touche un monstre pour savoir ce qui le contre.',
  4:'Ça gratte sous le chemin, et un chaman soigne tout le monde. Tu as pensé à fusionner, au moins ?', 5:'Un troll et des spectres. Moi, je surveille depuis le rempart. Le coussin du rempart. Courage.', 6:'LE TITAN, avec un porte-étendard et un golem. S’il touche la porte, c’est fini. Tape fort, tape vite.' };

function accueil() {
  app.classList.remove('jeu'); // 15/11 soir : l'écran de jeu seul est figé sur la hauteur du téléphone
  D = null;
  app.innerHTML = `<h1>🏰 La Défense de la porte</h1>
  <p class="doux" style="text-align:center">Les monstres descendent trois chemins vers la porte de la Guilde. Tes dés deviennent des tours… ou des coups tout de suite. Deux tours identiques qui se touchent fusionnent ; deux 6 éveillent une Rune.</p>
  <div class="choixh" style="margin:8px 0"><button class="${!modeSF ? 'or' : ''}" onclick="modeSF=false;accueil()">🌊 6 vagues et le Titan</button><button class="${modeSF ? 'or' : ''}" onclick="modeSF=true;accueil()">♾ Vagues sans fin</button></div>
  ${modeSF ? `<p class="doux" style="text-align:center">♾ Les vagues ne s’arrêtent jamais, toujours plus fortes ; un boss différent toutes les 6 vagues (Titan, Colosse, Roi des Os, Roi de l’Hiver). Ton record : <b style="color:var(--or)">${(() => { try { return JSON.parse(localStorage.getItem('guilde-defense-sansfin') || '{}').vague || 0; } catch (e) { return 0; } })()} vagues</b>.</p>` : ''}
  <div class="heros">${['maelle', 'gorm', 'aldric', 'pip', 'oria', 'zephine'].filter(h => h !== 'zephine' || localStorage.getItem('guilde-tuto') === 'fait').map(h => `<button onclick="demarre('${h}')"><img src="${IMG(h)}" alt=""><b>${HEROS[h].nom}</b><br>${DHEROS[h].passif}<br><br>✨ Rune : ${DHEROS[h].rune.n}<br><small>${DHEROS[h].rune.d}</small></button>`).join('')}${herosAventureD()}</div>
  <p class="doux" style="text-align:center">🎯 Défi du jour : <b style="color:var(--or)">${defiDuJourD().n}</b>${lesEtoiles()[jourCle()] ? ` · aujourd’hui : ${'★'.repeat(lesEtoiles()[jourCle()])}` : ''}</p>
  <p class="doux" style="text-align:center">Chaque héros a son passif, son pouvoir, son ultime et sa Rune.</p>
  ${records()}
  <div class="choixh"><button onclick="regles()">📜 Les règles</button></div>`;
  GM.retour('menu.html'); // 22/11 (l'utilisateur) : le retour en haut à gauche ; plus de « ⌂ Menu » en bas
}
const REC = 'guilde-defense';
const lesRecords = () => { try { return JSON.parse(localStorage.getItem(REC) || '[]'); } catch (e) { return []; } };
function records() { const r = lesRecords(); if (!r.length) return ''; const g = r.filter(x => x.gagne); return `<p class="doux" style="text-align:center">🏆 ${g.length} victoire${g.length > 1 ? 's' : ''} sur ${r.length} partie${r.length > 1 ? 's' : ''}${g.length ? ` · meilleur score ${Math.max(...g.map(x => x.score))}` : ''}</p>`; }
let modeSF = false;
// 15/11 soir : les HÉROS D'AVENTURE (heros-aventure.js), après les 6 héros de base. Le moteur joue leur VOIE ;
// la porte reçoit LEUR progression ; l'écran montre LEUR portrait.
function herosAventureD() {
  const zok = localStorage.getItem('guilde-tuto') === 'fait';
  return haListe().map(a => haInfo('av:' + a.id)).filter(i => i.voie !== 'zephine' || zok).map(i => `<button onclick="demarre('${i.cle}')">${haImg(i, `box-shadow:0 0 0 2px ${i.couleur}`)}<b>${haEsc(i.nom)}</b><small class="ha-t">⚔ ${haEsc(i.titre)} · voie de ${HEROS[i.voie].nom}</small>${DHEROS[i.voie].passif}<br><br>✨ Rune : ${DHEROS[i.voie].rune.n}<br><small>${DHEROS[i.voie].rune.d}</small></button>`).join('');
}
const cleD = () => D && D.av && haInfo('av:' + D.av) ? 'av:' + D.av : D.heros;  // pour « Rejouer » avec le même héros
const imgD = () => { const i = D && D.av ? haInfo('av:' + D.av) : null; return i ? haImg(i) : `<img src="${IMG(D.heros)}" alt="">`; };
function demarre(h) { const i = haInfo(h); D = nouvelleDefense(haVoie(h)); D.av = i ? i.id : null; D.sansFin = modeSF;
  // 15/11 : le système des héros : la porte gagne les PV du héros (niveau, rang, équipement), et ses PC de départ
  // 15/11 soir : PAS de suivi des monstres ici (mesuré : la force vient des tours, pas du héros ; monstres ×2 = 0 % de victoires) ;
  // le bonus de porte est plafonné à +20 (avec +81, la porte d'Aldric dépassait les 99 de dégâts du Titan : 100 % de victoires)
  if (typeof bonusHerosPvE === 'function') { const B = bonusHerosPvE(haProg(h)), bp = Math.min(20, B.pv); D.porte += bp; D.porteMax += bp; D.pc += B.pc; } sel = []; selTour = -1; attente = null; dis('Touche 🎲 Lancer, puis choisis des dés : bâtis une tour (touche une case verte) ou frappe un monstre.'); vagueAnnonce(); rendu(); }
function dis(t, e) { msg = t; err = !!e; }
function vagueAnnonce() { const v = D.fx.find(f => f.t === 'vague'); if (v) GM.son('vague');
  const txt = v && (v.boss && (D.sansFin || v.n > VAGUES.length) ? MOUSTACHE_M[v.boss] : CORBIN[v.n]);
  if (v && txt) setTimeout(() => montreF(() => fenetre(`<h2>🌊 Vague ${v.n}${D.sansFin ? ' ♾' : ` sur ${VAGUES.length}`}</h2>${v.boss ? `<div class="moIntro">${IMG_D[v.boss] ? `<img src="${IMG_D[v.boss]}" alt="">` : `<span class="fe">${MONSTRES[v.boss].e}</span>`}<div><b>${MONSTRES[v.boss].n}</b><br><small>${MONSTRES[v.boss].d}</small></div></div>` : ''}<div class="corbin">Moustache : « ${txt} »</div><div class="choixh">${v.boss ? `<button onclick="ficheMonstre('${v.boss}')">Sa fiche</button>` : ''}<button class="or" onclick="fermer()">À la porte !</button></div>`)), 450);
  setTimeout(presenteNouveaux, 470); }
// 27/11 (décision de l'utilisateur) : Moustache présente chaque nouveau monstre en une phrase, la première fois qu'on le croise (retenu sur le téléphone)
const MOUSTACHE_M = {
  rat:'Un rat. Touche-le sans le tuer et il file sur le chemin d’à côté. La foudre, elle, saute de chemin en chemin. Moi, je dis ça…',
  feufollet:'Un feu follet. Le givre ne le gèle pas : il le repousse d’une case à chaque tir. Ça, c’est de la tour de givre bien placée.',
  mineur:'Tu entends gratter ? Un mineur creuse sous le chemin et ressort à la 3e case. Les éclats du canon le secouent même sous terre. Un piège à la sortie, miaou.',
  chaman:'Un chaman ! Il soigne tous ceux de son chemin. Les archers le visent en premier : c’est lui qu’il faut faire taire.',
  troll:'Un troll. Il se recoud tout seul à chaque tour… sauf s’il est empoisonné. Sors le poison.',
  spectre:'Un spectre. Un tour sur deux, il devient invisible : tes tours ne le voient plus. Sauf la foudre. La foudre voit tout.',
  etendard:'Le porte-étendard ! Tout ce qui marche derrière lui avance plus vite. Abats-le en premier, la grande tour adore ça.',
  golem:'Un golem de pierre. Lent, énorme, et le poison glisse dessus. Gros tirs, canon et grande tour, et prends ton temps : lui aussi.',
  squelette:'Des squelettes relevés par le Roi des Os. Peu de vie, mais ils passent par les autres chemins.',
  elite:'Tu vois le cadre doré ? Une ÉLITE : beaucoup plus de vie, elle frappe la porte plus fort et elle a un pouvoir en plus. Touche-la pour le connaître.',
  titan:'LE TITAN. S’il touche la porte, c’est fini. Il fait fondre tes tours : tape fort, tape vite.',
  colosse:'Le Colosse des racines ! Il boit la terre et se soigne à chaque tour, sauf si le poison le ronge. Empoisonne-le, puis cogne.',
  roios:'Le Roi des Os. Un tour sur deux, il relève des squelettes sur les autres chemins. Garde des tours partout !',
  roihiver:'Le Roi de l’Hiver. Son blizzard gèle un de tes dés à chaque tour : vends-le et relance les autres. Brrr. Je déteste le froid.',
};
const CLE_VUS = 'guilde-defense-monstres-vus';
function presenteNouveaux() {
  if (!D || D.fini) return; let vus; try { vus = JSON.parse(localStorage.getItem(CLE_VUS) || '[]'); } catch (e) { vus = []; }
  D.vusPartie = D.vusPartie || [];
  const types = [...new Set(D.monstres.map(m => m.t))].filter(t => MOUSTACHE_M[t] && !MONSTRES[t].boss);
  if (D.monstres.some(m => m.elite)) types.push('elite');
  types.filter(t => !vus.includes(t) && !D.vusPartie.includes(t)).forEach(t => { vus.push(t); D.vusPartie.push(t); const M = MONSTRES[t];
    montreF(() => fenetre(`<h2>${t === 'elite' ? '👑 Une élite !' : '🆕 Nouveau monstre'}</h2>${M ? `<div class="moIntro">${IMG_D[t] ? `<img src="${IMG_D[t]}" alt="">` : `<span class="fe">${M.e}</span>`}<div><b>${M.n}</b> ${(M.ic || []).join(' ')}<br><small class="fmOk">✅ ${M.contre}</small></div></div>` : ''}<div class="corbin">Moustache : « ${MOUSTACHE_M[t]} »</div><div class="choixh">${M ? `<button onclick="ficheMonstre('${t}')">Sa fiche</button>` : ''}<button class="or" onclick="fermer()">Compris</button></div>`)); });
  try { localStorage.setItem(CLE_VUS, JSON.stringify(vus)); } catch (e) {}
}

// ---------------------------------------------------------------- le dessin
// 14/11 : images Gemini reçues (sans image, l'émoji reste) ; Gobelin, Chauve-souris et Rune du Cor à refaire
const IMG_D = { chauve:'portraits/d-chauve.webp?v=1', gobelin:'portraits/d-gobelin.webp?v=1', sanglier:'portraits/d-sanglier.webp?v=1', bouclier:'portraits/d-bouclier.webp?v=1', titan:'portraits/m-titan.webp?v=1',
  // 27/11 : portraits déjà peints pour d'autres modes ; rat, feu follet, mineur et troll en émoji en attendant leur image
  chaman:'portraits/m-chaman.webp', etendard:'portraits/m22-etendard-gobelin.webp', spectre:'portraits/m-spectregivre.webp', golem:'portraits/m-golem.webp', squelette:'portraits/m-osclaque.webp',
  colosse:'portraits/m-colosseracines.webp', roios:'portraits/m-roios.webp', roihiver:'portraits/m-roihiver.webp' };
const RUNE_IMG = { maelle:'portraits/rune-enclume.webp?v=2', gorm:'portraits/rune-cor.webp?v=1' };
// 14/11 : le fond peint de la Défense (decor/fond-defense.webp) ; chemins, dalles et porte placés par l'utilisateur (placer-defense.html → « PLACEMENT DEFENSE {…} », recopié ici tel quel)
const PD = {"chemin_haut":0,"chemin_bas":49,"largeur_chemin":18,"voies":[18,50,82],"dalles":[[18,61],[50,61],[82,61],[18,74.5],[50,74.5],[82,74.5],[18,88],[50,88],[82,88]],"dalle":[19.5,10.2],"porte":[50,98]}; // PLACEMENT DEFENSE de l'utilisateur (14/11 ~16 h 15), recopié tel quel
const ANGLE = {}; // 14/11 : l'angle de chaque canon (il garde la direction de son dernier tir)
const posCC = (r, col) => { const h = (PD.chemin_bas - PD.chemin_haut) / 4; return `left:${PD.voies[col] - PD.largeur_chemin / 2}%;width:${PD.largeur_chemin}%;top:${PD.chemin_haut + r * h}%;height:${h}%`; };
const posRC = c => { const d = PD.dalles[c]; return `left:${d[0] - PD.dalle[0] / 2}%;width:${PD.dalle[0]}%;top:${d[1] - PD.dalle[1] / 2}%;height:${PD.dalle[1]}%`; };
// ---------------------------------------------------------------- v2 (14/11) : pièges, prochaine vague, coups de héros, bonus, étoiles
// 27/11 : les petites icônes sur le jeton (ce qu'il sait faire, ce qui le gêne), et l'état du moment
const tagsM = m => { const M = MONSTRES[m.t], ic = [...(M.ic || [])]; if (m.elite && POUVOIRS_ELITE[m.pouv]) ic.push(POUVOIRS_ELITE[m.pouv].e); if (m.sous) ic.splice(0, ic.length, '⛏'); if (m.inv) ic.splice(0, ic.length, '👻');
  return ic.length ? `<span class="tags">${ic.slice(0, 3).join('')}</span>` : ''; };
const okPiege = (r, col) => { const un = sel.length === 1 ? sel[0] : null; return !!(un && !attente && D.pc >= DEF.coutBatir && !D.pieges[cleP(r, col)] && !D.monstres.some(m => m.row === r && m.col === col)); };
const piegeHTML = (r, col) => { const p = D.pieges[cleP(r, col)]; if (!p) return ''; const P = PIEGES[p.k]; return `<span class="piege ${p.k}" title="${P.n}">${P.e}${p.k === 'ronces' ? `<small>${p.v}</small>` : p.usages > 1 ? `<small>×${p.usages}</small>` : ''}</span>`; };
const ICONE_M = x => { const t = typeV(x), el = String(x).endsWith('*'); return `<span class="icm ${el ? 'el' : ''}">${IMG_D[t] ? `<img src="${IMG_D[t]}" alt="">` : MONSTRES[t].e}</span>`; };
function bandeVague() {
  const P = prochainesD(D); if (!P.tour.length && !P.reste.length) return `<div class="bandeV">🌋 ${D.vague >= VAGUES.length ? 'Dernière vague : tiens bon !' : ''}</div>`;
  return `<div class="bandeV" onclick="voirVague()"><b>🌊 Vague ${P.vague}</b> · ${P.attente ? `arrive dans ${P.attente + 1} tours` : P.neuve ? 'arrive au prochain tour' : 'au prochain tour'} : ${P.tour.map(ICONE_M).join('') || '—'}${P.reste.length ? ` <span class="doux">puis</span> ${P.reste.map(ICONE_M).join('')}` : ''}</div>`;
}
function voirVague() { const P = prochainesD(D), tout = [...P.tour, ...P.reste], tous = [...new Set(tout.map(typeV))], nEl = tout.filter(x => String(x).endsWith('*')).length;
  fenetre(`<h2>🌊 Vague ${P.vague}</h2><div class="ficheL">${tous.map(t => `<button onclick="ficheMonstre('${t}')"><span class="icv">${ICONE_M(t)}</span><span><b>${MONSTRES[t].n}</b> ${(MONSTRES[t].ic || []).join('')}<small>${MONSTRES[t].d}</small></span></button>`).join('')}</div>${nEl ? `<p class="doux">👑 Dont ${nEl} élite${nEl > 1 ? 's' : ''} (cadre doré) : beaucoup plus de vie et un pouvoir en plus.</p>` : ''}<p class="doux" style="font-size:.85em">Touche un monstre pour sa fiche : ce qui le contre, ce qui ne marche pas.</p><div class="choixh"><button onclick="fermer()">Compris</button></div>`); }
// 27/11 : la fiche d'un monstre (touche un monstre sur le plateau, ou dans la bande de la vague)
function ficheMonstreH(t, m) {
  const M = MONSTRES[t], img = IMG_D[t] ? `<img src="${IMG_D[t]}" alt="">` : `<span class="fe">${M.e}</span>`, P = m && m.elite ? POUVOIRS_ELITE[m.pouv] : null;
  const etat = m ? [m.sous ? '⛏ Sous terre : tes tours ne le voient pas (sauf les éclats du canon).' : '', m.inv ? '👻 Invisible ce tour-ci : seule la foudre le voit.' : '', m.gel ? '❄ Gelé : il fera un pas de moins.' : '', m.poison > 0 ? `☠ Empoisonné : ${m.poison} au prochain tour.` : '', m.colle ? '🌿 Retenu : il ne bougera pas ce tour.' : ''].filter(Boolean) : [];
  return `<div class="ficheM"><div class="fmTete">${img}<div><h2 style="margin:0">${M.n}${m && m.elite ? ' 👑 élite' : ''}</h2>${m ? `<b>${m.pv}</b>/${m.pvMax} PV · ` : ''}frappe la porte : −${(m ? dgM(m) : M.dg) >= 99 ? 'tout' : (m ? dgM(m) : M.dg)}<br>${M.lent ? 'avance un tour sur deux' : M.vit > 1 ? `avance de ${M.vit} cases` : 'avance d’une case'} ${(M.ic || []).join(' ')}</div></div>
    <p><b>Ce qu’il fait</b> : ${M.d}</p>${P ? `<p class="fmEl">👑 <b>Élite · ${P.e} ${P.n}</b> : ${P.d}. Beaucoup plus de vie, frappe la porte plus fort.</p>` : ''}
    <p class="fmOk">✅ <b>Ce qui le contre</b> : ${M.contre}</p><p class="fmNon">❌ <b>Ce qui ne marche pas</b> : ${M.rate}</p>${etat.length ? `<p class="doux">${etat.join('<br>')}</p>` : ''}</div>`;
}
function ficheMonstre(t, id) { const m = id != null && D ? D.monstres.find(x => x.id === id) : null; fenetre(ficheMonstreH(t, m) + '<div class="choixh"><button class="or" onclick="fermer()">Compris</button></div>'); }
function toucheChemin(ev, r, col) {
  if (ev.target.closest('.mo')) return;
  const p = D.pieges[cleP(r, col)];
  if (sel.length !== 1 || attente) { if (p) dis(`${PIEGES[p.k].e} ${PIEGES[p.k].n} : ${PIEGES[p.k].d}`); else dis('Choisis un dé, puis touche une case de chemin pour y poser un piège (1 = boue, 2 à 5 = ronces, 6 = barricade).'); rendu(); return; }
  const k = sortePiege(sel[0].v), e = poserPiegeD(D, sel[0], r, col);
  if (e) dis(e, true); else { sel = []; GM.son('tour-batir'); dis(`${PIEGES[k].e} ${PIEGES[k].n} posée.`); }
  rendu();
}
function proposeBonus() {
  if (!D || !D.choix || D.fini || fileF.includes(proposeBonus)) return;
  if (fen.innerHTML) { fileF.push(proposeBonus); return; }

  <li><b>PC</b> : +1 à chaque tour, et <b>+1 tous les ${DEF.killsPC} monstres abattus</b>. <b>Vendre</b> un dé donne aussi 1 PC ; les dés pas utilisés sont vendus à la fin du tour. Tu as ${DEF.relances} relances par tour pour chercher les dés qui te manquent.</li></ul>
  <p>En haut, la bande 🌊 montre <b>la vague qui arrive</b>. Après chaque vague, tu choisis <b>un bonus parmi 3</b>. À la victoire : jusqu’à <b>3 étoiles</b> (porte à 15 PV ou plus, défi du jour).</p>
  <p><b>Les monstres</b> (touche un monstre sur le plateau pour sa fiche complète) :</p><ul style="padding-left:1.1em;margin:.3em 0">${Object.entries(MONSTRES).filter(([k, M]) => !M.boss && !M.invoque).map(([k, M]) => `<li>${M.e} <b>${M.n}</b> ${(M.ic || []).join('')} : ${M.d}</li>`).join('')}</ul>
  <p>👑 <b>Les élites</b> (dès la vague 3, cadre doré) : ×${String(ELITE.pv).replace('.', ',')} de vie, frappent la porte plus fort, et un pouvoir en plus (${Object.values(POUVOIRS_ELITE).map(P => `${P.e} ${P.n.toLowerCase()} : ${P.d}`).join(' ; ')}).</p>
  <p><b>Les boss</b> (s’il touche la porte, elle tombe) : ${BOSS_SF.map(k => `${MONSTRES[k].e} <b>${MONSTRES[k].n}</b> : ${MONSTRES[k].d.replace('Le boss : ', '')}`).join('<br>')}<br>En 6 vagues : le Titan à la vague 6. En vagues sans fin : un boss différent toutes les 6 vagues, dans cet ordre.</p>
  <p class="doux">Règle d’or : une résistance bloque seulement l’<b>effet</b> d’une tour (le poison, le gel…), jamais son tir ; chaque monstre a au moins une tour qui le contre bien.</p>
  <p class="doux">Règles complètes : <a href="defense-proposition.html" style="color:#7cc8ff">la page de la proposition</a>.</p>
  <div class="choixh"><button onclick="fermer()">Compris</button></div>`);
}
// 22/11 (carte de l'application : « la Défense n'a pas de reprise ») : la partie en cours est gardée sur le téléphone à chaque geste ;
// à l'accueil, « ▶ Reprendre » la remet là où on s'est arrêté (le hasard repart de zéro, comme dans les autres modes)
const CLE_EN_COURS = 'guilde-defense-en-cours';
function gardeD() { try { if (D && !D.fini) { const c = Object.assign({}, D, { fx:[] }); delete c.rng; localStorage.setItem(CLE_EN_COURS, JSON.stringify({ quand:Date.now(), D:c, modeSF })); } else localStorage.removeItem(CLE_EN_COURS); } catch (e) {} }
function enCoursD() { try { const g = JSON.parse(localStorage.getItem(CLE_EN_COURS) || 'null'); return g && g.D && !g.D.fini && g.D.v3 ? g : null; } catch (e) { return null; } } // 25/11 : une partie d'avant la v3 ne se reprend pas
function reprendD() { const g = enCoursD(); if (!g) return; D = g.D; D.rng = Math.random; D.fx = []; modeSF = !!g.modeSF; sel = []; selTour = -1; attente = null; dis('Partie reprise : à toi de jouer.'); app.classList.add('jeu'); rendu(); }
{ const _r = rendu; rendu = function () { const x = _r.apply(this, arguments); gardeD(); return x; }; }
{ const _a = accueil; accueil = function () { const x = _a.apply(this, arguments); const g = enCoursD();
    if (g) { const nom = g.D.av && typeof haInfo === 'function' && haInfo('av:' + g.D.av) ? haInfo('av:' + g.D.av).nom : (HEROS[g.D.heros] || {}).nom || '';
      app.querySelector('h1').insertAdjacentHTML('afterend', `<div class="choixh" style="margin:8px 0"><button class="or" onclick="reprendD()">▶ Reprendre ta partie<br><small>${nom} · vague ${g.D.vague || 1}${g.D.sansFin ? ' ♾' : ''} · porte ${g.D.porte}/${g.D.porteMax}</small></button><button onclick="if(confirm('Abandonner la partie en cours ?')){localStorage.removeItem(CLE_EN_COURS);accueil()}">✕ Abandonner</button></div>`); }
    return x; }; }
// 22/11 (configurateur validé : « déploie-le aux autres modes ») : l'entrée de la Défense = le configurateur commun (configurateur.js) :
// 1. le mode (6 vagues et le Titan, vagues sans fin) → 2. le héros (retenu) → 3. ce qui t'attend → ▶ Jouer. Une seule partie gardée à la fois.
let choixD = (() => { try { return localStorage.getItem('guilde-config-defense-heros') || 'maelle'; } catch (e) { return 'maelle'; } })();
const okD = k => { const z = localStorage.getItem('guilde-tuto') === 'fait'; if (String(k).startsWith('av:')) { const i = haInfo(k); return !!i && (i.voie !== 'zephine' || z); } return !!DHEROS[k] && (k !== 'zephine' || z); };
function choisitD(k) { choixD = k; try { localStorage.setItem('guilde-config-defense-heros', k); } catch (e) {} CFG.dessine(); }
function defDefense() {
  const g = enCoursD(), z = localStorage.getItem('guilde-tuto') === 'fait', r = lesRecords(), gg = r.filter(x => x.gagne);
  const nomG = g ? (g.D.av && haInfo('av:' + g.D.av) ? haEsc(haInfo('av:' + g.D.av).nom) : (HEROS[g.D.heros] || {}).nom || '') : '';
  const partie = sf => g && !!g.modeSF === sf ? { texte:`${nomG} · vague ${g.D.vague || 1} · porte ${g.D.porte}/${g.D.porteMax}`, reprendre:'reprendD()', abandonner:`localStorage.removeItem('${CLE_EN_COURS}')` } : null;
  const recSF = (() => { try { return JSON.parse(localStorage.getItem('guilde-defense-sansfin') || '{}').vague || 0; } catch (e) { return 0; } })();
  return { jeu:'defense', racine:'app', titre:'🏰 La Défense de la porte', retour:'menu.html', regles:'regles()',
    heros:() => ['maelle', 'gorm', 'aldric', 'pip', 'oria', 'zephine'].map(h => h === 'zephine' && !z ? `<button disabled><img src="${IMG(h)}" alt="" style="filter:grayscale(1)">🔒 ${HEROS[h].nom}</button>`
        : `<button class="${choixD === h ? 'on' : ''}" onclick="choisitD('${h}')"><img src="${IMG(h)}" alt="">${HEROS[h].nom}<small>✨ ${DHEROS[h].rune.n}</small></button>`).join('')
      + haListe().map(a => haInfo('av:' + a.id)).filter(i => i && (i.voie !== 'zephine' || z)).map(i => `<button class="${choixD === i.cle ? 'on' : ''}" onclick="choisitD('${i.cle}')">${haImg(i, `box-shadow:0 0 0 2px ${i.couleur}`)}${haEsc(i.nom)}<small>✨ ${DHEROS[i.voie].rune.n}</small></button>`).join(''),
    fiche:() => { const v = haVoie(choixD), i = haInfo(choixD), H = DHEROS[v]; return `🛡 <b>${i ? haEsc(i.nom) : HEROS[v].nom}</b>${i ? ` · la voie de ${HEROS[v].nom}` : ''}<br>${H.passif}<br>✨ <b>Rune : ${H.rune.n}</b> · ${H.rune.d}`; },
    modes:[
      { k:'vagues', e:'🌊', n:'6 vagues', img:'menu-recu/mode-defense.webp', desc:() => 'Les monstres descendent trois chemins vers la porte de la Guilde. Tes dés deviennent des tours… ou des coups tout de suite. Six vagues, puis le Titan.',
        pas:() => [`🎯 Défi du jour : ${defiDuJourD().n}${lesEtoiles()[jourCle()] ? ' · ' + '★'.repeat(lesEtoiles()[jourCle()]) : ''}`, `🏆 ${gg.length} victoire${gg.length > 1 ? 's' : ''} sur ${r.length}`], partie:() => partie(false) },
      { k:'sansfin', e:'♾', n:'Sans fin', img:'menu-recu/mode-defense.webp', desc:() => 'Les vagues ne s’arrêtent jamais, toujours plus fortes ; un boss différent toutes les 6 vagues (Titan, Colosse, Roi des Os, Roi de l’Hiver). Jusqu’où tiendras-tu ?',
        pas:() => [`Ton record : ${recSF} vague${recSF > 1 ? 's' : ''}`], partie:() => partie(true) } ],
    options:m => m === 'vagues' ? [{ k:'d', titre:`🎯 Le défi du jour : ${defiDuJourD().n}`, verrou:'le même pour tous', aide:'★ la victoire · ★ la porte à 15 PV ou plus · ★ le défi du jour.' }]
      : [{ k:'r', titre:'♾ Les vagues sans fin', aide:`Ton record : ${recSF} vagues. Un boss différent toutes les 6 vagues.` }],

    lancer:m => { if (!okD(choixD)) { alert('Choisis ton héros.'); return CFG.va(2); } modeSF = m === 'sansfin'; try { localStorage.removeItem(CLE_EN_COURS); } catch (e) {} demarre(choixD); } };

accueil = function () { D = null; app.classList.remove('jeu'); if (!okD(choixD)) choixD = 'maelle'; CFG.ouvre(defDefense()); try { GM.retour(null); } catch (e) {} };

{ const _dm = demarre; demarre = function () { CFG.ferme(); return _dm.apply(this, arguments); }; }
accueil();
