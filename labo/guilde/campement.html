<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="robots" content="noindex">
<title>La Guilde des Runes · L’Invasion</title>
<style>
  :root { --or:#f3c96b; --texte:#f1ecff; --doux:#c9c1ea; --ok:#7dffb0; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { margin:0; background:#15132b; color:var(--texte); font:15px/1.4 Georgia, 'Times New Roman', serif; user-select:none; }
  #app { max-width:560px; margin:0 auto; min-height:100vh; padding:10px 10px 30px; }
  button { font:inherit; cursor:pointer; }
  h1 { color:var(--or); font-size:1.25em; margin:.3em 0; text-align:center; }
  h2 { color:var(--or); font-size:1.05em; margin:.8em 0 .3em; }
  p { margin:.4em 0; } .doux { color:var(--doux); font-size:.9em; }
  .heros6 { display:grid; grid-template-columns:repeat(3, 1fr); gap:8px; margin:6px 0; }
  .heros6 button { background:#1d1b3a; color:#fff; border:2px solid #4b4580; border-radius:12px; padding:6px; font-size:.85em; }
  .heros6 button.sel { border-color:var(--or); box-shadow:0 0 10px var(--or); } .heros6 button:disabled { opacity:.35; }
  .heros6 img { width:100%; aspect-ratio:1; border-radius:9px; object-fit:cover; display:block; margin-bottom:4px; }
  .modes { display:flex; gap:8px; } .modes button { flex:1; background:#1d1b3a; color:#fff; border:2px solid #4b4580; border-radius:12px; padding:8px; font-size:.9em; } .modes button.sel { border-color:var(--ok); }
  .boss { display:flex; gap:10px; align-items:center; background:#1d2a1d; border:2px solid #3f8a3a; border-radius:12px; padding:8px; }
  .boss .e { font-size:2.6em; } .boss small { color:var(--doux); display:block; }
  .go { display:block; width:100%; margin:14px 0 6px; background:linear-gradient(135deg, #ff7a3a, #b7832a); color:#1d1626; font-weight:bold; border:0; border-radius:14px; padding:12px; font-size:1.05em; }
  .go:disabled { opacity:.4; }
  .lien { background:#2a2650; color:#fff; border:2px solid #4b4580; border-radius:12px; padding:8px; width:100%; margin-top:6px; }
</style>
</head>
<body>
<div id="app"></div>
<script src="guide.js?v=20261114-210548"></script>
<script src="cartes.js?v=20261114-210548"></script>
<script src="musique.js?v=20261114-210548"></script>
<script src="rang.js?v=20261114-210548"></script>
<script src="donnees.js?v=20261114-210548"></script>
<script src="odyssee.js?v=20261114-210548"></script>
<script src="chronique.js?v=20261114-210548"></script>
<script>
const ZOK = () => localStorage.getItem('guilde-tuto') === 'fait'; // Zéphine : débloquée par le tutoriel (12/11)

const log = () => {}, degats = () => {}, soin = () => {}, altere = () => {}, invoque = () => {}, adv = () => ({}), fin = () => {};
let C = { a:null, b:null, modeB:'ordi', boss:'colosseracines' };
{ const b = new URLSearchParams(location.search).get('boss'); if (b && HEROS[b]) C.boss = b; }
function dessine() {
  const b = HEROS[C.boss];
  document.getElementById('app').innerHTML = `<h1>⚔️ L’Invasion</h1>
  <p class="doux" style="text-align:center">Deux héros de la Guilde tiennent le front ensemble : les actes de l’Invasion (plusieurs vagues à la suite) ou un grand boss. Il faudra se serrer les coudes.</p>
  <h2>Le boss</h2>${Object.keys(BOSS_CAMP).map(k => { const x = HEROS[k]; return `<div class="boss ${C.boss === k ? 'sel' : ''}" onclick="C.boss='${k}';dessine()" style="cursor:pointer;${C.boss === k ? 'outline:3px solid #7dffb0;' : 'opacity:.75;'}"><div class="e">${x.emoji}</div><div><b>${x.nom}</b>, ${x.titre} · ${x.pv} PV<small>${x.role}</small></div></div>`; }).join('')}
  <p class="doux">Pas encore de partie en ligne : on joue <b>à deux sur ce téléphone</b> (on se le passe à chaque tour), ou avec un <b>compagnon joué par l’ordinateur</b>. Le boss joue après les deux héros et se retourne contre le dernier qui l’a frappé. La <b>Cohésion</b> (réserve commune) permet de relever un héros à terre, de crier le ralliement ou de soigner l’autre.</p>
  <h2>1. Ton héros</h2><div class="heros6">${ORDRE.map(id => id === 'zephine' && !ZOK() ? `<button disabled style="opacity:.5"><img src="${IMG(id)}" alt="" style="filter:grayscale(1)">🔒 ${HEROS[id].nom}</button>` : `<button class="${C.a === id ? 'sel' : ''}" onclick="C.a='${id}';if(C.b===C.a)C.b=null;dessine()"><img src="${IMG(id)}" alt="">${HEROS[id].nom}</button>`).join('')}</div>
  <h2>2. Le second héros</h2><div class="modes"><button class="${C.modeB === 'ordi' ? 'sel' : ''}" onclick="C.modeB='ordi';dessine()">🤖 Un compagnon (ordinateur)</button><button class="${C.modeB === 'humain' ? 'sel' : ''}" onclick="C.modeB='humain';dessine()">📱 Un ami, sur ce téléphone</button></div>
  <div class="heros6">${ORDRE.map(id => `<button class="${C.b === id ? 'sel' : ''}" ${C.a === id || (id === 'zephine' && !ZOK()) ? 'disabled' : ''} onclick="C.b='${id}';dessine()"><img src="${IMG(id)}" alt="">${HEROS[id].nom}</button>`).join('')}</div>
  <button class="go" ${C.a && C.b ? '' : 'disabled'} onclick="localStorage.setItem('guilde-campement', JSON.stringify(C));chronique([(CHRON_CAMP_B[C.boss] || CHRON_CAMP).intro(HEROS[C.a].nom, HEROS[C.b].nom)], () => location.href='duel.html?campement=1')">🔥 Au feu de camp !</button>
  <button class="lien" onclick="location.href='menu.html#invasion'">⌂ Menu</button>`;
}
dessine();
// 14/11 : le guide de Moustache
Guide.lance('invasion', [
  [null, 'L’Invasion, c’est à <b>deux héros</b> contre les vagues d’ennemis. Vous jouez chacun votre tour, puis l’ennemi frappe celui qui l’a touché en dernier.'],
  ['.boss', 'D’abord, choisis le front : un acte de l’Invasion (plusieurs vagues à la suite) ou un grand boss.'],
  ['.heros6', 'Ensuite, <b>ton héros</b>. Chacun a ses dés, ses cartes et son style.'],
  ['.modes', 'Le second héros : un <b>compagnon joué par l’ordinateur</b>, ou un ami à qui tu passes le téléphone à chaque tour.'],
  ['.go', 'Au combat, gardez un œil sur la <b>Cohésion</b> : une réserve commune pour relever un allié, pousser un cri ou soigner. Au feu de camp, miaou !'],
]);
// 13/11 soir : musique
GM.musique('campement'); GM.ambiance('feu'); GM.bouton();
</script>
</body>
</html>
