  /* ================= le plateau (09/11) : sol de pierre runique, deux camps, ligne de front lumineuse ================= */
  .plateau { position:relative; padding:8px 6px; border:none; border-radius:20px; overflow:hidden;
    background:
      radial-gradient(ellipse at 50% 0%, #e5262c22, transparent 55%),
      radial-gradient(ellipse at 50% 100%, #2a7fc133, transparent 55%),
      radial-gradient(circle at 20% 30%, #ffffff08 0 2px, transparent 3px) 0 0/34px 34px,
      radial-gradient(circle at 70% 60%, #00000022 0 3px, transparent 4px) 0 0/46px 46px,
      linear-gradient(180deg, #3a2f46, #2a2236 48%, #2a2236 52%, #26303f);
    box-shadow:inset 0 0 0 2px #f3c96b55, inset 0 0 0 5px #1a1426, inset 0 0 0 7px #b7832a88, inset 0 0 40px #000a, 0 10px 30px #000a; }
  .plateau::before { content:''; position:absolute; inset:0; pointer-events:none; opacity:.35;
    background:repeating-linear-gradient(90deg, transparent 0 58px, #00000033 58px 60px), repeating-linear-gradient(0deg, transparent 0 40px, #00000026 40px 42px); }
  .plateau > * { position:relative; }
  .milieu { height:22px; margin:2px 0; display:flex; align-items:center; justify-content:center; }
  .milieu::before, .milieu::after { content:''; flex:1; height:2px; background:linear-gradient(90deg, transparent, #f3c96b, #c084fc); box-shadow:0 0 8px #c084fc; animation:lueur 3s ease-in-out infinite; }
  .milieu::after { background:linear-gradient(270deg, transparent, #f3c96b, #c084fc); }
  .milieu span { padding:0 8px; color:#f3c96b; font-size:.85em; letter-spacing:.3em; text-shadow:0 0 8px #f3c96b, 0 0 14px #c084fc; animation:lueur 3s ease-in-out infinite; }
  @keyframes lueur { 50% { opacity:.55; } }
  .front { gap:5px; min-height:94px; padding:0 8px; }
  .front > .u, .front > .place { flex:0 1 66px; min-width:0; }
  .front.vide::after { content:none; }
  .place { width:66px; height:88px; border-radius:11px; border:2px dashed #ffffff1c; background:radial-gradient(circle, #ffffff08, transparent 70%); }
  .place::after { content:'✦'; display:grid; place-items:center; height:100%; color:#ffffff14; font-size:20px; }
  /* créatures : petites cartes, statistiques en pastilles comme sur les vraies cartes */
  .u { position:relative; width:66px; height:88px; padding:5px 4px 0; border-radius:11px; border:2px solid #b7832a; font-size:.62em;
    background:linear-gradient(170deg, #fbf3df, #e9dcbc); box-shadow:0 4px 10px #0008, inset 0 0 0 2px #fff6; display:flex; flex-direction:column; }
  #f-O .u { border-color:#c4553a; } #f-J .u { border-color:#3aa0a8; }
  .u b { min-height:0; font-size:1.08em; line-height:1.1; }
  .u .tg { flex:1; font-size:.92em; }
  .u .av { position:absolute; left:-6px; right:-6px; bottom:-7px; margin:0; }
  .u .av span { width:24px; height:24px; border-radius:50%; display:grid; place-items:center; font-size:.95em; color:#fff !important; border:2px solid #fff9; box-shadow:0 2px 5px #000a; text-shadow:0 1px 1px #0008; }
  .u .av span:first-child { background:radial-gradient(circle at 35% 30%, #ffb36a, #c2410c); }
  .u .av span:last-child { background:radial-gradient(circle at 35% 30%, #8df0a0, #1f7a35); }
  .u.pret { box-shadow:0 0 0 2px #ffd27a, 0 0 14px #ffd27a99, 0 4px 10px #0008; }
  .u.illu { background-size:cover !important; }
  .u.mystere { border-color:#8b5cf6 !important; }
  /* héros : grand médaillon, barre de vie épaisse */
  .barre { background:linear-gradient(90deg, #0b0918cc, #1d1b3acc); border:1px solid #ffffff14; border-radius:16px; padding:6px 8px; box-shadow:0 4px 14px #0007; }
  .barre img { width:58px; height:58px; border-radius:50%; border:3px solid var(--c); box-shadow:0 0 0 2px #0008, 0 0 14px var(--c); }
  .barre .nom { font-size:1em; }
  .vie { height:11px !important; border-radius:6px; box-shadow:inset 0 1px 3px #000c; }
  .vie i { background:linear-gradient(180deg, #ff6a5e, #c81e2a); border-radius:6px; }

  /* ================= plateau peint « façon Hearthstone » (Gemini, 09/11) : 768 × 1376, tout est placé en cqw (1 cqw = 1 % de la largeur) =================
     alcôve du haut : centre (50 ; 19,3) diamètre 26 · alcôve du bas : centre (50 ; 132,8) · aire de jeu 14,3 → 86 de large, ligne de runes à 78 · bac à dés : 152 → 168 */
  .plateau.tapis { container-type:inline-size; aspect-ratio:768/1376; padding:0; border-radius:16px; background:#2a2014 url('decor/plateau-duel.webp?v=1') center/100% 100% no-repeat; box-shadow:0 10px 30px #000a; }

  .tapis > * { position:absolute !important; }

  .tapis .barre { left:37cqw; width:26cqw; height:26cqw; padding:0; border:none; background:none; box-shadow:none; display:block; border-radius:50%; }
  .tapis #b-O { top:6.3cqw; } .tapis #b-J { top:119.8cqw; }
  .tapis .barre img { position:absolute; inset:0; width:100%; height:100%; border-radius:50%; border:none; box-shadow:inset 0 0 0 2px #0006; }

  .tapis .barre .nom { position:absolute; left:50%; transform:translateX(-50%); white-space:nowrap; font-size:3.2cqw; padding:.2em .8em; border-radius:20px; background:#1d1626e6; border:1px solid #f3c96b88; color:#fff; z-index:2; }

  .tapis .barre .vie { position:absolute; left:16%; width:68%; bottom:5%; height:2.2cqw !important; z-index:2; border:1px solid #0008; }
  .tapis #b-J .vie { bottom:auto; top:5%; }
  .tapis .barre .pastilles { position:absolute; right:calc(100% + 2cqw); width:34cqw; display:flex; flex-wrap:wrap; justify-content:flex-end; gap:1cqw; margin:0; }
  .tapis #b-O .pastilles { top:0; } .tapis #b-J .pastilles { bottom:0; }

  .tapis .front > .u, .tapis .front > .place { flex:0 0 17.4cqw; width:17.4cqw; height:24cqw; }
  .tapis .place { border-color:#0000001a; background:#ffffff14; } .tapis .place::after { color:#00000018; }
  .tapis .u { font-size:2.35cqw; }
  .tapis .des { left:12cqw; right:12cqw; top:150.5cqw; height:20cqw; margin:0; gap:1.5cqw; align-items:center; flex-wrap:nowrap; }
  .tapis .d { width:13.5cqw; } .tapis .d img, .tapis .d .cad { width:12cqw; height:12cqw; }
  .tapis .d .sac { font-size:2.1cqw; line-height:1.1; color:#e9ffe9cc; text-shadow:0 1px 1px #000; }

  /* 14/11 (choix de l'utilisateur) : Odyssée, Invasion… se jouent sur le MÊME plateau peint que le Duel ; le décor du lieu remplit seulement la zone centrale */

  .animIle .souffle.s2 { animation-duration:7.3s; background:radial-gradient(ellipse 22% 16% at 85% 15%, #ff8a2a4d, transparent 70%), radial-gradient(ellipse 24% 18% at 10% 64%, #ff5a004d, transparent 70%), radial-gradient(ellipse 35% 9% at 50% 21%, #ffb04a33, transparent 70%); }

<script>
// Version de la page : à chaque mise en ligne, outils/publier.sh change VERSION et version.txt.
// Si le téléphone a gardé une ancienne page en mémoire, elle se recharge toute seule sur la nouvelle.
const VERSION = '20261114-163231';
fetch('version.txt?t=' + Date.now(), { cache:'no-store' }).then(r => r.ok ? r.text() : '').then(v => {
  v = (v || '').trim();
  if (v && v !== VERSION && !sessionStorage.getItem('recharge-' + v)) { sessionStorage.setItem('recharge-' + v, '1'); { const q = new URLSearchParams(location.search); q.set('v', v); location.replace('duel.html?' + q); } }
}).catch(() => {});
// Pendant qu'on joue : vérifie toutes les 2 minutes (et au retour sur l'appli) ; une nouvelle version = un bandeau « Mettre à jour »,
// jamais de rechargement surprise au milieu d'une partie.
function verifieVersion() {
  fetch('version.txt?t=' + Date.now(), { cache:'no-store' }).then(r => r.ok ? r.text() : '').then(v => {
    v = (v || '').trim(); if (!v || v === VERSION || document.getElementById('majbar')) return;
    const b = document.createElement('div'); b.id = 'majbar';
    b.innerHTML = '<span><b>Nouvelle version du jeu</b><br>La partie en cours sera perdue, l’historique est gardé.</span><button>Mettre à jour</button>';
    b.querySelector('button').onclick = () => { const q = new URLSearchParams(location.search); q.set('v', v); location.replace('duel.html?' + q); }; // 13/11 soir : on reste dans le même mode (tutoriel…)
    document.body.appendChild(b);
  }).catch(() => {});
}
setInterval(verifieVersion, 120000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) verifieVersion(); });
</script>
