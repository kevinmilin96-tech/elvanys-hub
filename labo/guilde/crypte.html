<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="robots" content="noindex">
<title>La Guilde des Runes · La Crypte aux Sceaux</title>
<style>
  :root { --or:#f3c96b; --texte:#f1ecff; --doux:#c9c1ea; --ok:#7dffb0; --rouge:#ff6a5a; --pierre:#2a2440; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { margin:0; height:100%; }
  body { color:var(--texte); font:15px/1.4 Georgia, 'Times New Roman', serif; background:radial-gradient(ellipse at 50% 0%, #2c2246, #0d0b18 70%) fixed, #0d0b18; overflow-x:hidden; user-select:none; }
  #jeu { max-width:520px; margin:0 auto; container-type:inline-size; padding:0 2cqw 4cqw; }
  button { font:inherit; color:inherit; cursor:pointer; }
  /* ---------------------------------------------------------------- le haut */
  .haut { display:flex; align-items:center; gap:2cqw; padding:2cqw 0; font-size:3.6cqw; }
  .haut a, .haut button { color:var(--doux); text-decoration:none; background:#221d42; border:1px solid #4b4580; border-radius:20px; padding:1.2cqw 3cqw; }
  .haut .titre { flex:1; text-align:center; color:var(--or); font-weight:bold; }
  .stats { display:flex; justify-content:space-between; font-size:3.5cqw; color:var(--doux); padding:0 1cqw 1.5cqw; }
  .stats b { color:var(--texte); }
  /* ---------------------------------------------------------------- la table */
  .table { position:relative; display:grid; grid-template-columns:repeat(3, 1fr); gap:2cqw; align-items:end; min-height:60cqw; padding:2cqw; border-radius:4cqw;
    background:linear-gradient(180deg, #1a1630, #241c3a); border:1px solid #3a3260; box-shadow:inset 0 0 8cqw #000a; }
  .table.boss { grid-template-columns:1fr; justify-items:center; }
  .col { display:flex; flex-direction:column; align-items:stretch; }
  .dos { height:2.6cqw; margin-bottom:.6cqw; border-radius:1.2cqw; background:repeating-linear-gradient(45deg, #3a2f5c 0 1.2cqw, #2c2448 1.2cqw 2.4cqw); border:1px solid #5a4e8a; position:relative; overflow:hidden; }
  .dos.vu { height:4.6cqw; background:#2c2448; display:flex; align-items:center; gap:1cqw; padding-left:1cqw; font-size:2.6cqw; color:var(--doux); }
  .dos.vu img { width:3.6cqw; height:3.6cqw; border-radius:50%; object-fit:cover; }
  .vide { height:40cqw; border:2px dashed #3a3260; border-radius:3cqw; display:flex; align-items:center; justify-content:center; color:#5a5280; font-size:6cqw; }
  .carte { position:relative; border-radius:3cqw; background:#1d1934; border:2px solid #5a4e8a; overflow:hidden; transition:transform .25s, box-shadow .25s; }
  .carte.elite { border-color:#c9a24a; } .carte.gardien { width:72cqw; border-color:#ff7a4a; box-shadow:0 0 6cqw #ff5a2a55; }
  .carte .img { width:100%; aspect-ratio:4/3; object-fit:cover; display:block; filter:saturate(1.05); }
  .carte.gardien .img { aspect-ratio:16/9; }
  .carte .nom { font-size:2.8cqw; text-align:center; padding:.6cqw .5cqw; color:var(--or); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .carte.gardien .nom { font-size:4cqw; }
  .att.double { background:#7a0a0a; box-shadow:0 0 3cqw #ff3a1a; animation:pulse .8s infinite; } .att.autre { background:#1a2a3aee; border-color:#7cd4ff; }
  .carte.frappe { animation:frappe .45s; } @keyframes frappe { 30% { transform:translateY(4cqw) scale(1.06); filter:brightness(1.6) saturate(1.4); } }
  .att { position:absolute; top:1cqw; right:1cqw; background:#3a1010ee; border:1px solid var(--rouge); color:#fff; border-radius:2cqw; padding:.3cqw 1.4cqw; font-size:3.2cqw; font-weight:bold; }
  .trait { position:absolute; top:1cqw; left:1cqw; background:#000a; border-radius:50%; width:6.4cqw; height:6.4cqw; display:flex; align-items:center; justify-content:center; font-size:3.6cqw; border:1px solid #fff4; }
  .niv { position:absolute; left:50%; transform:translateX(-50%); top:1cqw; font-size:2.4cqw; color:#ffe9a8; text-shadow:0 0 1cqw #000; letter-spacing:.3cqw; }
  .carte.cible { box-shadow:0 0 0 1cqw var(--ok), 0 0 6cqw var(--ok); animation:pulse 1s infinite; }
  .carte.tombe { animation:replie .55s forwards; } .carte.neuve { animation:retourne .5s; }
  @keyframes replie { 0% { transform:none; } 40% { transform:scale(1.06) rotate(-2deg); filter:brightness(1.8); } 100% { transform:perspective(60cqw) rotateX(88deg) scale(.6); opacity:0; } }
  @keyframes retourne { from { transform:perspective(60cqw) rotateY(90deg); } to { transform:none; } }
  @keyframes pulse { 50% { filter:brightness(1.25); } }
  /* ---------------------------------------------------------------- les sceaux */
  .sceaux { display:grid; grid-template-columns:repeat(2, 1fr); gap:1cqw; padding:0 1cqw 1.2cqw; }
  .carte.gardien .sceaux { grid-template-columns:repeat(6, 1fr); }
  .sc { position:relative; height:8.6cqw; border-radius:2cqw; border:1.5px solid #6a5ea0; background:#2a2448; display:flex; align-items:center; justify-content:center;
    font-weight:bold; font-size:3.4cqw; color:#f1ecff; transition:all .15s; }
  .sc small { font-size:2.3cqw; font-weight:normal; color:var(--doux); margin-left:.4cqw; }
  .sc.ok { background:#163a2a; border-color:#3a8a5a; color:#7dffb0; }
  .sc.ok::after { content:'✓'; position:absolute; right:.6cqw; top:0; font-size:2.4cqw; }
  .sc.peut { border-color:var(--ok); box-shadow:0 0 0 .5cqw var(--ok); background:#1f4a35; animation:pulse 1s infinite; }
  .sc.non { opacity:.35; }
  .sc .pt { width:.9cqw; height:.9cqw; border-radius:50%; background:currentColor; display:inline-block; margin:0 .2cqw; }
  .sc.rune { border-color:#c084fc; box-shadow:0 0 0 .5cqw #c084fc; animation:pulse 1s infinite; }
  /* ---------------------------------------------------------------- la menace */
  .menace { text-align:center; font-size:3.4cqw; margin:2cqw 0 1cqw; color:var(--doux); min-height:5cqw; }
  .menace b { color:var(--rouge); font-size:4.2cqw; }
  .menace .voile { color:#ffe08a; }
  /* ---------------------------------------------------------------- le héros, le creuset, la besace */
  .bas { display:grid; grid-template-columns:auto 1fr; gap:2.5cqw; align-items:center; background:#1a1630; border:1px solid #3a3260; border-radius:4cqw; padding:2cqw; }
  .portrait { position:relative; width:19cqw; height:19cqw; }
  .portrait img { width:100%; height:100%; border-radius:50%; object-fit:cover; box-shadow:0 0 0 .8cqw var(--c); }
  .portrait .pv { position:absolute; bottom:-1cqw; left:50%; transform:translateX(-50%); background:#3a1010; border:1px solid var(--rouge); border-radius:3cqw; padding:.2cqw 1.8cqw; font-size:3.4cqw; font-weight:bold; white-space:nowrap; }
  .pouv b { color:var(--or); font-size:3.4cqw; } .pouv p { margin:.2cqw 0 1cqw; font-size:2.7cqw; color:var(--doux); }
  .pouv .sceaux { padding:0; grid-template-columns:repeat(3, 1fr); }
  .btn-pouv { margin-top:1cqw; width:100%; border:0; border-radius:2.5cqw; padding:1.6cqw; font-weight:bold; font-size:3.4cqw; background:var(--or); color:#2b1d0a; animation:pulse 1s infinite; }
  .rangee { display:flex; gap:2cqw; margin-top:2cqw; align-items:stretch; }
  .bloc { background:#1a1630; border:1px solid #3a3260; border-radius:3cqw; padding:1.4cqw; }
  .bloc h4 { margin:0 0 1cqw; font-size:2.6cqw; color:var(--doux); font-weight:normal; text-align:center; }
  .creuset { flex:1; } .creuset .cases { display:grid; grid-template-columns:repeat(6, 1fr); gap:1cqw; }
  .cs { height:8cqw; border-radius:1.6cqw; border:1.5px dashed #6a5ea0; display:flex; align-items:center; justify-content:center; font-size:3.4cqw; color:#6a5ea0; }
  .cs.plein { border-style:solid; border-color:#c084fc; background:#3a2260; color:#fff; box-shadow:0 0 2cqw #c084fc88; }
  .cs.peut { border-color:var(--ok); color:var(--ok); box-shadow:0 0 0 .5cqw var(--ok); animation:pulse 1s infinite; }
  .besace .cases { display:grid; grid-template-columns:repeat(2, 1fr); gap:1cqw; } .besace .cs { width:9cqw; }
  .besace .cs img, .cs img { width:85%; height:85%; object-fit:contain; }
  .runes { display:flex; flex-direction:column; align-items:center; justify-content:center; min-width:13cqw; }
  .runes button { border:1.5px solid #c084fc; background:#2a1a48; border-radius:2.5cqw; padding:1cqw 1.6cqw; font-size:4.6cqw; color:#e6c8ff; }
  .runes button:disabled { opacity:.3; } .runes button.on { box-shadow:0 0 0 .6cqw #c084fc; }
  .runes small { font-size:2.4cqw; color:var(--doux); }
  /* ---------------------------------------------------------------- les dés */
  .plateau { display:flex; justify-content:center; gap:2.4cqw; margin:3cqw 0 2cqw; min-height:16cqw; flex-wrap:wrap; }
  .de { position:relative; width:14cqw; height:14cqw; border:0; padding:0; background:none; transition:transform .15s; }
  .de img { width:100%; height:100%; object-fit:contain; filter:drop-shadow(0 1cqw 1.2cqw #000a); }
  .de.sel { transform:translateY(-3cqw) scale(1.08); } .de.sel img { filter:drop-shadow(0 0 2cqw var(--ok)) drop-shadow(0 1cqw 1cqw #000); }
  .de .g { position:absolute; top:-1cqw; right:-1cqw; font-size:3cqw; }
  .de.roule { animation:roule .45s; }
  @keyframes roule { 0% { transform:rotate(0) scale(.7); } 50% { transform:rotate(200deg) scale(1.15); } 100% { transform:rotate(360deg) scale(1); } }
  /* 15/11 soir : les dés cachés avant le lancer, et le lancer qu'on voit (comme dans le Duel) */
  .de.cache { border-radius:2.6cqw; background:radial-gradient(circle at 35% 30%, #5a4e8a, #2a2448); box-shadow:inset 0 0 0 .5cqw #8a7ec4, 0 1cqw 1.2cqw #000a; }
  .de.cache::after { content:'?'; position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-size:6cqw; color:#c9c1ea88; font-weight:bold; }
  .de.tourne img { animation:tourne .26s linear infinite; } @keyframes tourne { 0% { transform:rotate(0) translateY(0) scale(1); } 50% { transform:rotate(190deg) translateY(-2.4cqw) scale(1.1); } 100% { transform:rotate(360deg) translateY(0) scale(1); } }
  .actions .lancer { flex:2; background:var(--or); color:#2b1d0a; border-color:var(--or); animation:pulse 1s infinite; }
  .actions { display:flex; gap:2.5cqw; }
  .actions button { flex:1; border-radius:3cqw; padding:2.6cqw; font-size:3.8cqw; font-weight:bold; border:2px solid #4b4580; background:#221d42; }
  .actions .fin { background:var(--or); color:#2b1d0a; border-color:var(--or); }
  .actions button:disabled { opacity:.35; }
  .consigne { text-align:center; font-size:3.2cqw; color:var(--doux); min-height:9cqw; margin:1cqw 0; }
  .consigne b { color:var(--ok); }
  .journal { font-size:2.8cqw; color:#9a92c4; text-align:center; min-height:4cqw; }
  /* ---------------------------------------------------------------- effets */
  .flash { position:fixed; inset:0; pointer-events:none; background:#ff2a1a; opacity:0; z-index:40; }
  .flash.go { animation:flash .5s; } @keyframes flash { 20% { opacity:.35; } 100% { opacity:0; } }
  .bulle { position:fixed; left:50%; top:38%; transform:translateX(-50%); z-index:45; pointer-events:none; font-weight:bold; font-size:min(9vw, 46px); color:var(--or);
    text-shadow:0 0 12px #000, 0 0 3px #000; animation:bulle 1.3s forwards; white-space:nowrap; }
  @keyframes bulle { 0% { opacity:0; transform:translate(-50%, 20px) scale(.6); } 20% { opacity:1; transform:translate(-50%, 0) scale(1.1); } 80% { opacity:1; } 100% { opacity:0; transform:translate(-50%, -40px); } }
  .tremble { animation:tremble .35s; } @keyframes tremble { 25% { transform:translateX(-1.5cqw); } 50% { transform:translateX(1.5cqw); } 75% { transform:translateX(-1cqw); } }
  /* ---------------------------------------------------------------- fenêtres */
  .voile-f { position:fixed; inset:0; background:#000c; z-index:50; display:flex; align-items:center; justify-content:center; padding:4vw; }
  .fen { width:min(94vw, 500px); max-height:90vh; overflow:auto; background:#1d1934; border:2px solid var(--or); border-radius:18px; padding:16px; font-size:15px; }
  .fen h2 { margin:0 0 8px; color:var(--or); text-align:center; }
  .fen .go { display:block; width:100%; font:bold 1.05em Georgia, serif; padding:12px; border-radius:14px; border:0; background:var(--or); color:#2b1d0a; margin-top:10px; }
  .fen .sec { display:block; width:100%; font:1em Georgia, serif; padding:10px; border-radius:14px; border:1px solid #4b4580; background:#221d42; color:var(--texte); margin-top:8px; }
  .fen ol { padding-left:20px; } .fen li { margin:5px 0; }
  .leg { display:grid; grid-template-columns:auto 1fr; gap:6px 10px; align-items:center; font-size:.9em; margin:8px 0; }
  .leg .sc { width:52px; height:34px; font-size:15px; }
  .moust { display:flex; gap:10px; align-items:flex-start; } .moust img { width:64px; height:64px; border-radius:50%; object-fit:cover; flex:none; border:2px solid var(--or); }
  /* ---------------------------------------------------------------- accueil */
  .acc h1 { text-align:center; color:var(--or); margin:3cqw 0 1cqw; font-size:7cqw; }
  .acc .sous { text-align:center; color:var(--doux); font-size:3.6cqw; margin:0 4cqw 3cqw; }
  .heros { display:grid; grid-template-columns:repeat(3, 1fr); gap:2cqw; }
  .heros button { background:#221d42; border:2px solid #4b4580; border-radius:3cqw; padding:2cqw 1cqw; font-size:3.2cqw; }
  .heros button.on { border-color:var(--or); background:#3a2f12; } .heros button:disabled { opacity:.35; }
  .heros img { width:16cqw; height:16cqw; border-radius:50%; object-fit:cover; display:block; margin:0 auto 1cqw; }
  .pv-h { font-size:2.8cqw; color:var(--doux); margin:3cqw 1cqw; background:#1d1b3a; border-left:3px solid var(--or); padding:2cqw 3cqw; border-radius:2cqw; }
  .choix { display:grid; gap:2cqw; margin-top:3cqw; }
  .choix button { border-radius:3.5cqw; padding:3cqw; font-size:4cqw; border:2px solid var(--or); background:#3a2f12; color:var(--or); font-weight:bold; text-align:left; }
  .choix button small { display:block; font-weight:normal; color:var(--doux); font-size:3cqw; }
  .choix button.b2 { background:#221d42; border-color:#4b4580; color:var(--texte); }
  .record { text-align:center; font-size:3.2cqw; color:var(--doux); margin-top:3cqw; }
</style>

<div class="flash" id="flash"></div>
<div id="fen"></div>

<script src="rang.js?v=20261115-162118"></script>
<script src="heros-etoiles.js?v=20261115-162118"></script>

<script>
// =============================================================================================== LA CRYPTE AUX SCEAUX (15/11, écran)
// Le moteur (règles, hasard, monstres) est dans crypte-moteur.js ; ici seulement le dessin et les gestes.
const HER = {
  maelle:{ n:'Maëlle', c:'#ff8a2a' }, aldric:{ n:'Sire Aldric', c:'#ffd27a' }, pip:{ n:'Pip', c:'#c58bff' },
  oria:{ n:'Oria', c:'#5ff5e6' }, gorm:{ n:'Gorm', c:'#4f8bff' }, zephine:{ n:'Zéphine', c:'#ff4040' },
};
const ZEPH_OK = () => localStorage.getItem('guilde-tuto') === 'fait';
const CLE = 'guilde-crypte', jour = () => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`; };
const lire = () => { try { return Object.assign({ parties:0, victoires:0, meilleur:0, jours:{}, heros:'maelle' }, JSON.parse(localStorage.getItem(CLE) || '{}')); } catch (e) { return { parties:0, victoires:0, meilleur:0, jours:{}, heros:'maelle' }; } };
const ecrire = d => { try { localStorage.setItem(CLE, JSON.stringify(d)); } catch (e) {} };
const son = k => { try { if (typeof GM !== 'undefined') GM.son(k); } catch (e) {} };
const $ = id => document.getElementById(id);
const C = CRYPTE;
let S = null, sel = null, mode = null, duJour = false, choixH = lire().heros;

// ------------------------------------------------------------------ un sceau en HTML
function sceauHTML(s, S_, ici, etat) {
  let t;
  if (s.ok) t = s.t === 'tot' ? `Σ ${s.val}` : (s.val || '✓');
  else switch (s.t) {
    case 'ex': t = `${s.v}`; break;
    case 'min': t = `≥ ${s.v}`; break;
    case 'max': t = `≤ ${s.v}`; break;
    case 'pair': t = '<small>pair</small>'; break;
    case 'imp': t = '<small>impair</small>'; break;
    case 'tot': t = `Σ ${s.reste}`; break;
    case 'any': t = '✶'; break;
    case 'dbl': { const j = S_.find(x => x !== s && x.t === 'dbl' && x.g === s.g && x.ok); t = j ? `= ${j.val}` : '<small>jumeau</small>'; break; }
  }
  return `<div class="sc ${s.ok ? 'ok' : ''} ${etat || ''}" ${ici ? `onclick="${ici}"` : ''}>${t}</div>`;
}
const deVal = () => { const d = sel && S.des.find(x => x.id === sel); return d ? d.v : 0; };
const etatSceau = (s, liste) => { if (mode === 'rune') return s.ok ? 'non' : 'rune'; const v = deVal(); if (!v) return ''; return C.accepte(s, v, liste) ? 'peut' : 'non'; };

// ------------------------------------------------------------------ une carte de monstre
function carteHTML(c) {
  const T = c.trait && C.TRAITS[c.trait];
  const cible = mode === 'cible' ? 'cible' : '';
  return `<div class="carte ${c.elite ? 'elite' : ''} ${c.gardien ? 'gardien' : ''} ${cible} ${c.neuve ? 'neuve' : ''}" id="k-${c.id}" ${mode === 'cible' ? `onclick="cible('${c.id}')"` : ''}>
    <img class="img" src="portraits/m-${c.m}.webp" alt="">
    <div class="niv">${c.gardien ? `♛ GARDIEN${(c.viesMax || 1) > 1 ? ` · ${'❤'.repeat(c.vies)}${'🖤'.repeat(c.viesMax - c.vies)}` : ''}` : c.elite ? '★ ÉLITE' : '◆'.repeat(c.niv)}</div>
    ${T ? `<div class="trait" onclick="event.stopPropagation();explique('${c.id}')">${T.e}</div>` : ''}
    ${intentHTML(c)}
    <div class="nom">${c.nom}</div>
    <div class="sceaux">${c.sceaux.map((s, k) => sceauHTML(s, c.sceaux, mode === 'cible' ? '' : `touche('${c.id}',${k})`, etatSceau(s, c.sceaux))).join('')}</div>
  </div>`;
}

// l'intention du monstre (ce qu'il fera à la fin du tour), sur sa carte
function intentHTML(c) {
  const x = (C.intentions(S).find(y => y.id === c.id) || {}), I = C.INTENTIONS[x.it || 'frappe'];
  if (x.it === 'rien') return `<div class="att autre">💤</div>`;
  if ((x.it || 'frappe') === 'frappe') return `<div class="att ${c.double ? 'double' : ''}" onclick="event.stopPropagation();explique('${c.id}')">${x.vise === 'comp' ? '🐾' : c.double ? '⚔⚔' : '⚔'} ${x.v}</div>`;
  return `<div class="att autre" onclick="event.stopPropagation();explique('${c.id}')">${I.e}</div>`;
}
// ------------------------------------------------------------------ sauvegarde de la crypte en cours (15/11)
const CLE_PARTIE = 'guilde-crypte-partie';
function sauve() { if (typeof DR !== 'undefined' && DR) return sauveD(); try { if (S && !S.fin) localStorage.setItem(CLE_PARTIE, JSON.stringify({ S, duJour })); else localStorage.removeItem(CLE_PARTIE); } catch (e) {} }
function partieGardee() { try { const p = JSON.parse(localStorage.getItem(CLE_PARTIE) || 'null'); return p && p.S && !p.S.fin && p.S.cols ? p : null; } catch (e) { return null; } }
function reprend() { const p = partieGardee(); if (!p) return; S = p.S; duJour = p.duJour; sel = null; mode = null; son('melange'); dessine(); }

// ------------------------------------------------------------------ l'écran de jeu
function dessine() {
  if (!S) return accueil();
  const H = HER[S.heros], P = C.POUVOIRS[S.heros];
  let table;
  if (S.gardien) table = `<div class="table boss">${carteHTML(S.gardien)}</div>`;
  else table = `<div class="table">${S.cols.map(col => {
    if (!col.length) return '<div class="col"><div class="vide">✓</div></div>';
    const caches = col.slice(0, -1).map(c => S.voitTout ? `<div class="dos vu"><img src="portraits/m-${c.m}.webp" alt="">${c.nom}</div>` : '<div class="dos"></div>').join('');
    return `<div class="col">${caches}${carteHTML(col[col.length - 1])}</div>`;
  }).join('')}</div>`;
  const m = C.menace(S);
  const dePeut = deVal();

}

    <div class="heros">${Object.entries(HER).map(([k, h]) => `<button class="${choixH === k ? 'on' : ''}" ${k === 'zephine' && !ZEPH_OK() ? 'disabled' : ''} onclick="choixH='${k}';accueil()"><img src="portraits/${k}.webp" alt="">${h.n}${k === 'zephine' && !ZEPH_OK() ? '<br>🔒 tutoriel' : ''}</button>`).join('')}</div>
    <div class="pv-h">⚡ <b>${C.POUVOIRS[choixH].n}</b> : ${C.POUVOIRS[choixH].d}<br>❤ ${C.PV_HEROS} PV dans la crypte.<br>✨ ${texteBonus(choixH)}</div>
    <div class="choix">
      ${partieGardee() ? `<button onclick="reprend()" style="border-color:var(--ok);color:var(--ok);background:#163a2a">▶ Reprendre ta crypte<small>${HER[partieGardee().S.heros].n} · tour ${partieGardee().S.tour} · ❤ ${partieGardee().S.pv}</small></button><button onclick="if(confirm('Abandonner cette partie ? Elle sera effacée.')){try{localStorage.removeItem('guilde-crypte-partie')}catch(e){};accueil()}" style="display:block;margin:0 auto;background:none;border:0;color:var(--doux);font-size:3cqw;text-decoration:underline;padding:1cqw;text-align:center">✕ abandonner cette partie</button>` : ''}
      <button onclick="descenteAccueil()" style="border-color:#ff9a4a;background:#3a1f10;color:#ffb070">🗺️ NOUVEAU · La Descente<small>Le grand voyage : 3 étages, tu choisis tes salles (combats, marchand, feu de camp, événements), objets, compagnons, dés de couleur, boss et breloques.</small></button>
      <button onclick="lance(true)">📅 La crypte du jour<small>${(r => `${r.e} Règle du jour : <b>${r.n}</b> (${r.d}) · `)(C.REGLES[C.regleDuJour('c' + jour())])}La même pour tout le monde aujourd’hui. ${j ? `Ton record du jour : ${j.score} ${'★'.repeat(j.etoiles)}` : 'Pas encore tentée.'}</small></button>
      <button class="b2" onclick="lance(false)">🎲 Une crypte au hasard<small>Une nouvelle à chaque fois, pour t’entraîner.</small></button>
    </div>
    <p class="record">Meilleur score : ${D.meilleur} · ${D.victoires} victoire${D.victoires > 1 ? 's' : ''} sur ${D.parties} crypte${D.parties > 1 ? 's' : ''}</p>
  </div>`;
}
function lance(j) {
  duJour = j; const D = lire(); D.heros = choixH; ecrire(D);
  const B = bonusMode(choixH);
  S = C.nouvelle(choixH, j ? 'crypte-' + jour() : 'crypte-' + Date.now() + Math.random(), B, j ? { regle:C.regleDuJour('c' + jour()), maitre:C.regleDuJour('c' + jour()) === 'presse' ? 8 : 0 } : {});
  S.des.forEach(d => d.neuf = true); visibles().forEach(c => c.neuve = true); sel = null; mode = null;
  son('melange'); dessine();
  if (!localStorage.getItem('guilde-crypte-guide')) { localStorage.setItem('guilde-crypte-guide', '1'); regles(); }
}
if (typeof GM !== 'undefined') { try { GM.musique('exploration'); GM.bouton(); } catch (e) {} }
accueil();
</script>
