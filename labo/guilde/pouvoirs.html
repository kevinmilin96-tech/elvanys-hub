<!doctype html>
<html lang="fr">
<head><meta name="guilde-version" content="20261128-010040"><link rel="manifest" href="manifest.webmanifest"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="La Guilde"><meta name="apple-mobile-web-app-status-bar-style" content="black"><link rel="apple-touch-icon" href="icone-180.png">

<title>La Guilde des Runes · Les pouvoirs des héros</title>
<style>
  :root { --or:#f3c96b; --texte:#f1ecff; --doux:#c9c1ea; --ok:#7dffb0; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { margin:0; color:var(--texte); font:15px/1.45 Georgia, 'Times New Roman', serif; background:radial-gradient(ellipse at 50% -10%, #3a2a5a, #120f24 60%) fixed, #120f24; }
  main { max-width:620px; margin:0 auto; padding:12px 10px 60px; }
  .haut { display:flex; align-items:center; gap:8px; } .haut a { color:var(--doux); text-decoration:none; background:#221d42; border:1px solid #4b4580; border-radius:20px; padding:6px 12px; font-size:.9em; }
  h1 { flex:1; margin:0; text-align:center; color:var(--or); font-size:1.25em; }
  .bande { display:flex; gap:8px; overflow-x:auto; padding:10px 2px; scrollbar-width:none; } .bande::-webkit-scrollbar { display:none; }
  .bande button { flex:none; width:68px; background:none; border:0; color:var(--doux); font:inherit; font-size:.72em; cursor:pointer; padding:0; }
  .bande img { width:56px; height:56px; border-radius:50%; object-fit:cover; display:block; margin:0 auto 2px; box-shadow:0 0 0 2px #4b4580; }
  .bande button.on img { box-shadow:0 0 0 3px var(--or), 0 0 14px var(--or); } .bande button.on { color:var(--or); font-weight:bold; }
  .tete { display:flex; gap:12px; align-items:center; background:linear-gradient(135deg, color-mix(in srgb, var(--hc) 30%, #1c1838), #120f24); border:2px solid var(--hc); border-radius:18px; padding:10px; }
  .tete img { width:78px; height:78px; border-radius:50%; object-fit:cover; box-shadow:0 0 0 3px var(--hc); }
  .tete b { font-size:1.2em; color:var(--or); } .tete .cl { display:inline-block; margin-top:3px; padding:2px 10px; border-radius:12px; background:var(--hc); color:#120f24; font-weight:bold; font-size:.85em; }
  .tete small { display:block; color:var(--doux); }
  .points { margin-left:auto; text-align:center; background:#120f24; border:2px solid var(--or); border-radius:14px; padding:6px 10px; color:var(--or); font-weight:bold; min-width:76px; }
  .points b { display:block; font-size:1.5em; color:var(--or); } .points.zero { border-color:#4b4580; color:var(--doux); } .points.zero b { color:var(--doux); }
  .onglets { display:flex; gap:8px; margin:12px 0 4px; } .onglets button { flex:1; font:bold 1em Georgia, serif; padding:12px; border-radius:14px; border:2px solid #4b4580; background:#1c1838; color:var(--doux); cursor:pointer; }
  .onglets button.on { border-color:var(--or); color:#2b1d0a; background:var(--or); }
  .aide { color:var(--doux); font-size:.86em; margin:4px 2px 10px; }
  .emp { background:#1c1838e6; border:1px solid #4b4580; border-radius:16px; padding:10px 8px 6px; margin:12px 0; }
  .emp-h { display:flex; align-items:center; gap:8px; flex-wrap:wrap; } .emp-h h2 { margin:0; font-size:1.05em; color:var(--or); } .emp-h small { color:var(--doux); }
  .rang { margin-left:auto; display:flex; align-items:center; gap:6px; } .rang .etoiles { color:var(--or); font-weight:bold; }
  .rang button { font:bold .9em Georgia, serif; padding:9px 12px; border-radius:12px; border:0; background:var(--or); color:#2b1d0a; cursor:pointer; } .rang button[disabled] { opacity:.35; }
  /* 19/11 (l'utilisateur : « on voit pas bien les 2 points nécessaires ») : le coût en points, lisible sur le bouton doré, même grisé */
  .rang { flex-shrink:0; } .rang .etoiles { white-space:nowrap; } .rang button small { display:block; color:#2b1d0a; font-size:.95em; font-weight:bold; margin-top:2px; } .rang button[disabled] { opacity:.6; filter:grayscale(.5); }
  .verrou { color:#ffb36a; font-size:.85em; margin:4px 2px 0; }
  .cases { display:flex; gap:8px; overflow-x:auto; scroll-snap-type:x mandatory; padding:8px 2px 8px; }
  .case { flex:0 0 min(78%, 270px); scroll-snap-align:start; position:relative; background:#14122a; border:2px solid #4b4580; border-radius:16px; padding:10px; text-align:left; color:inherit; font:inherit; cursor:pointer; }
  .case.choisi { border-color:var(--pc); box-shadow:0 0 14px color-mix(in srgb, var(--pc) 60%, transparent); background:linear-gradient(160deg, color-mix(in srgb, var(--pc) 22%, #14122a), #14122a); }
  .case.ferme { opacity:.55; }
  .case .coche { position:absolute; top:8px; right:8px; width:30px; height:30px; border-radius:50%; border:2px solid #4b4580; display:flex; align-items:center; justify-content:center; font-size:16px; background:#120f24; }
  .case.choisi .coche { border-color:var(--pc); background:var(--pc); color:#120f24; font-weight:bold; }
  .vignettes { display:grid; gap:6px; margin:8px 0 6px; }
  .vig { position:relative; display:flex; flex-direction:column; align-items:center; gap:3px; padding:8px 4px 6px; background:#14122a; border:2px solid #4b4580; border-radius:14px; color:inherit; font:inherit; cursor:pointer; min-height:86px; }
  .vig .em { font-size:28px; line-height:1; } .vig .vn { font-size:.74em; font-weight:bold; text-align:center; line-height:1.15; }
  .vig .vb { position:absolute; top:4px; right:5px; font-size:.8em; } .vig.ferme { opacity:.5; }
  .vig.choisi { border-color:var(--pc); } .vig.choisi .vb { color:var(--pc); font-weight:bold; }
  .vig.vue { box-shadow:0 0 0 2px #ffd27a, 0 0 12px #ffd27a77; background:linear-gradient(160deg, color-mix(in srgb, var(--pc) 22%, #14122a), #14122a); }
  .detail { background:#14122a; border:2px solid var(--pc); border-radius:16px; padding:10px; text-align:left; }
  .detail .ico { display:flex; align-items:center; gap:8px; } .detail .ico .em { font-size:30px; line-height:1; } .detail .nom { font-weight:bold; font-size:1.02em; }
  .detail .role { display:inline-block; margin-top:2px; font-size:.78em; padding:1px 8px; border-radius:10px; background:#2a2346; color:var(--doux); }
  .detail p { margin:6px 0 0; font-size:.86em; } .detail p b { color:var(--or); } .dv-ferme { color:#ffb36a; } .dv-ok { color:var(--pc); font-weight:bold; }
  .dv-choisir { display:block; width:100%; margin-top:10px; padding:12px; border:none; border-radius:12px; background:var(--pc); color:#120f24; font:inherit; font-weight:bold; font-size:1em; cursor:pointer; }
  .case .ico { display:flex; align-items:center; gap:8px; margin-right:34px; } .case .ico .em { font-size:30px; line-height:1; }
  .case .nom { font-weight:bold; font-size:1.02em; } .case .role { display:inline-block; margin-top:2px; font-size:.78em; padding:1px 8px; border-radius:10px; background:#2a2346; color:var(--doux); }
  .case p { margin:6px 0 0; font-size:.84em; } .case p b { color:var(--or); }
  .glisse { text-align:center; color:#8a84b0; font-size:.75em; }
  .resume { background:linear-gradient(135deg, #3a2a12, #1c1838); border:2px solid var(--or); border-radius:16px; padding:12px; margin:14px 0; }
  .resume h3 { margin:0 0 6px; color:var(--or); } .resume p { margin:4px 0; font-size:.9em; }
  .essai { display:block; width:100%; margin:8px 0 0; padding:10px; border-radius:12px; border:1px dashed #7dffb0; background:#14122a; color:#7dffb0; font:inherit; font-size:.88em; cursor:pointer; } .essai.on { background:#1d3a2a; border-style:solid; }
  .gros { display:block; margin:14px 0; padding:14px; border:2px solid #c9a24a; border-radius:16px; background:#2a2040; color:#ffd27a; text-align:center; font-size:1.05em; font-weight:bold; text-decoration:none; }
</style>
</head>
<body>
<main id="app"></main>
<script src="musique.js?v=fb0b9da49e"></script>
<script src="rang.js?v=aadc90c69b"></script>
<script src="heros-etoiles.js?v=29ce68f57f"></script>
<script src="donnees.js?v=8a39c05326"></script>
<script src="aventuriers.js?v=5679a4a045"></script>
<script src="pouvoirs-heros.js?v=a14bbdf318"></script>
<script src="fiche-heros.js?v=17564756a2"></script>
<script>
// =============================================================================================== LA PAGE « BUILD » (16/11 nuit, demande de l'utilisateur)
// Une page par héros : choix du héros (portraits), onglets 👥 Groupe / 🗡 Solo, une ligne par emplacement avec ses versions en cases à cocher,
// rang ★ et « +1 rang », points à placer en haut, résumé du build en bas. Tout passe par pouvoirs-heros.js (un seul système : le niveau du héros).
const $ = id => document.getElementById(id);
const P0 = new URLSearchParams(location.search);
const H_GUILDE = ['maelle', 'aldric', 'pip', 'oria', 'gorm', 'zephine'];
const retour = P0.get('retour') || 'mes-heros.html';
let actuel = P0.get('h') || 'pip', pre = P0.get('pre') === 'solo' ? 'solo' : 'groupe';
const ZOK = () => localStorage.getItem('guilde-tuto') === 'fait';
const tous = () => H_GUILDE.filter(id => id !== 'zephine' || ZOK()).concat(typeof avLire === 'function' ? avLire().map(a => a.id) : []);
const roleTxt = r => (PW_ROLES[r] || ['', '']).join(' ');
function caseHTML(c, E, D, choisi, ouvert) {
  const ferme = D.v !== 'A' && !ouvert;
  return `<button class="case ${choisi ? 'choisi' : ''} ${ferme ? 'ferme' : ''}" style="--pc:${D.c}" onclick="${ferme ? `fhBulle('Ce choix s’ouvre au niveau ${E.niv}')` : choisi ? `fhBulle('Déjà choisi')` : `choisit('${E.k}','${D.v}')`}">
    <span class="coche">${ferme ? '🔒' : choisi ? '✓' : ''}</span>
    <div class="ico"><span class="em">${pwIcone(c, E.k, D, 40)}</span><div><div class="nom">${D.n}</div><span class="role">${roleTxt(D.r)}</span></div></div>
    ${D.co ? `<p>🎲 <b>${PW_COMBOS[D.co]}</b></p>` : ''}
    <p><b>Combats</b> <small>(Odyssée, Invasion, épreuves)</small> : ${D.duel}</p><p><b>Chroniques :</b> ${D.chron}</p>${ferme ? `<p style="color:#ffb36a">🔒 au niveau ${E.niv}</p>` : ''}</button>`;
}
// 17/11 (l'utilisateur : « trois petites vignettes, je touche et j'ai la description, sans glisser à droite ou à gauche ») :
// une rangée de vignettes (une par version) ; la vignette touchée montre sa fiche en dessous, avec « Choisir cette version »
let vue = {};
function vignettes(c, E, choisie, ouvert) {
  const L = versionsDe(actuel, E.k), v = L.some(D => D.v === vue[E.k]) ? vue[E.k] : choisie, D = L.find(x => x.v === v) || L[0], ferme = !versionOuverte(actuel, E.k, D), nivD = D.talent ? D.niv : E.niv;
  return `<div class="vignettes" style="grid-template-columns:repeat(${Math.min(L.length, 3)}, 1fr)">${L.map(X => { const f = !versionOuverte(actuel, E.k, X);
    return `<button class="vig ${X.v === v ? 'vue' : ''} ${X.v === choisie ? 'choisi' : ''} ${f ? 'ferme' : ''}" style="--pc:${X.c}" onclick="vue['${E.k}']='${X.v}';fhSon('choisir');dessine()"><span class="em">${pwIcone(c, E.k, X, 34)}</span><span class="vn">${X.n}</span><span class="vb">${f ? '🔒' : X.v === choisie ? '✓' : ''}</span></button>`; }).join('')}</div>
    <div class="detail" style="--pc:${D.c}"><div class="ico"><span class="em">${pwIcone(c, E.k, D, 40)}</span><div><div class="nom">${D.n}</div><span class="role">${roleTxt(D.r)}</span></div></div>
      ${D.co ? `<p>🎲 <b>${PW_COMBOS[D.co]}</b></p>` : ''}<p><b>Combats</b> <small>(Odyssée, Invasion, épreuves)</small> : ${D.duel}</p><p><b>Chroniques :</b> ${D.chron}</p>
      ${(() => { const rg = ((pouvoirsDe(actuel, pre) || {})[E.k] || {}).rang || 0, b = Math.floor(rg / 2); // 17/11 (l'utilisateur : « les rangs ne changent rien ») : ce que le rang ajoute, en clair
        return `<p style="color:#f3c96b">⭐ Rang ${rg} : ${b ? `<b>+${b}</b> au chiffre principal (bouclier, dégâts, soin, sceaux…)` : 'pas encore de bonus'}${rg < 10 ? ` · prochain +1 au rang ${rg + (rg % 2 ? 1 : 2)}` : ' (maximum)'}${/rang (5|10)/.test(D.chron) ? ' · et ce qui est écrit pour les rangs 5 et 10' : ''}.</p>`; })()}
      ${D.talent ? '<p style="color:#7dffb0">🎲 Talent de héros d’aventure (ancien talent de la Forge), à la place du passif de sa voie.</p>' : ''}${ferme ? `<p class="dv-ferme">🔒 Ce choix s’ouvre au niveau ${nivD}.</p>` : D.v === choisie ? '<p class="dv-ok">✓ Version choisie</p>' : `<button class="dv-choisir" onclick="choisit('${E.k}','${D.v}')">Choisir cette version</button>`}</div>`;
}
function dessine() {
  if (!tous().includes(actuel)) actuel = tous()[0];
  history.replaceState(null, '', `?h=${actuel}&pre=${pre}${retour !== 'mes-heros.html' ? '&retour=' + encodeURIComponent(retour) : ''}`);
  const I = fhInfo(actuel), c = classeDe(actuel), CL = PW_CLASSES[c], o = pouvoirsDe(actuel, pre), pts = pointsPouvoirs(actuel), niv = niveauH(actuel);
  const autre = pre === 'groupe' ? 'solo' : 'groupe', oA = pouvoirsDe(actuel, autre);
  $('app').innerHTML = `<div class="haut"><a href="${retour}">‹ Retour</a><h1>🃏 Les pouvoirs</h1><a href="mes-heros.html?h=${actuel}">Fiche</a></div>
    <div class="bande">${tous().map(id => { const J = fhInfo(id); return J ? `<button class="${id === actuel ? 'on' : ''}" onclick="actuel='${id}';vue={};fhSon('choisir');dessine()">${fhImg(J)}${J.nom}</button>` : ''; }).join('')}</div>
    <div class="tete" style="--hc:${I.c}">${fhImg(I)}<div><b>${I.nom}</b><br><span class="cl">${CL.e} ${CL.n}</span><small>${CL.d} · niveau ${niv}</small></div>
      <div class="points ${pts ? '' : 'zero'}"><b>${pts}</b>point${pts > 1 ? 's' : ''}<br>à placer</div></div>
    <div class="onglets"><button class="${pre === 'groupe' ? 'on' : ''}" onclick="pre='groupe';fhSon('choisir');dessine()">👥 Groupe</button><button class="${pre === 'solo' ? 'on' : ''}" onclick="pre='solo';fhSon('choisir');dessine()">🗡 Solo</button></div>
    <button class="essai ${pwEssai() ? 'on' : ''}" onclick="essai()">🧪 Mode essai : ${pwEssai() ? '<b>tous les choix ouverts</b> (toucher pour revenir aux niveaux)' : 'ouvrir tous les choix pour les tester'}</button>
    <p class="aide">${pre === 'groupe' ? '👥 Groupe : pris tout seul dans les Chroniques à 2 héros ou plus.' : '🗡 Solo : pris tout seul quand le héros joue seul (Chroniques seul ; les autres modes viendront).'} Changer est <b>gratuit</b>, quand tu veux hors partie. 1 point par niveau du héros (un rang coûte 1 point jusqu’au rang 4, 2 points des rangs 5 à 7, 3 points des rangs 8 à 10) ; les rangs restent sur l’emplacement (communs aux deux onglets).</p>
    ${PW_EMP.map(E => { const r = o[E.k].rang, ouvert = pwOuvert(actuel, E.k);
      return `<div class="emp"><div class="emp-h"><h2>${E.e} ${E.n}</h2><small>${E.d}</small>
        <div class="rang"><span class="etoiles">★ ${r}/10</span><button ${r < PW_RANG_MAX && pts >= coutRang(r + 1) ? '' : 'disabled'} onclick="rangDemande('${E.k}')">⬆ +1 rang<br><small>${r < PW_RANG_MAX ? `${coutRang(r + 1)} point${coutRang(r + 1) > 1 ? 's' : ''}` : 'max'}</small></button></div></div>
        ${ouvert ? '' : `<p class="verrou">🔒 Le choix s’ouvre au niveau ${E.niv} (niveau ${niv} aujourd’hui) : en attendant, la version A.</p>`}
        ${vignettes(c, E, o[E.k].v, ouvert)}</div>`; }).join('')}
    <div class="resume"><h3>📜 Le build</h3>
      <p><b>${pre === 'groupe' ? '👥' : '🗡'} ${I.nom} ${nomBuild(actuel, pre)}</b> (${pre === 'groupe' ? 'Groupe' : 'Solo'}) : ${PW_EMP.map(E => `${o[E.k].def.e} ${o[E.k].def.n}${o[E.k].rang ? ' ★' + o[E.k].rang : ''}`).join(' · ')}</p>
      <p style="color:var(--doux)">${autre === 'groupe' ? '👥' : '🗡'} ${I.nom} ${nomBuild(actuel, autre)} (${autre === 'groupe' ? 'Groupe' : 'Solo'}) : ${PW_EMP.map(E => `${oA[E.k].def.e} ${oA[E.k].def.n}`).join(' · ')}</p></div>
    <a class="gros" href="chroniques.html">🗺 Essayer dans les Chroniques</a>`;  // la version cochée se voit tout de suite (chaque ligne défile jusqu'à elle)

}
function choisit(emp, v) {
  const c = classeDe(actuel), E = PW_EMP.find(x => x.k === emp), o = pouvoirsDe(actuel, pre), D = versionsDe(actuel, emp).find(x => x.v === v);
  fhFen(`<h2>${D.e} ${D.n}</h2><p class="doux" style="text-align:center">${E.e} ${E.n} · ${pre === 'groupe' ? '👥 Groupe' : '🗡 Solo'}</p>
    <p>À la place de <b>${o[emp].def.n}</b>. C’est gratuit, tu pourras revenir quand tu veux.</p><p><b>Chroniques :</b> ${D.chron}</p>
    <div class="fh-bts"><button class="fh-bt" onclick="fhFen('')">Annuler</button><button class="fh-bt or" onclick="valideChoix('${emp}','${v}')">✓ Valider</button></div>`);
}
function valideChoix(emp, v) { const r = choisirPouvoir(actuel, pre, emp, v); fhFen(''); if (r === 'ok') { fhSon('tour-fusion'); fhBulle('✓ Choisi !'); } else fhBulle(r); dessine(); }
function rangDemande(emp) {
  const E = PW_EMP.find(x => x.k === emp), r = pouvoirsDe(actuel, pre)[emp].rang;
  fhFen(`<h2>⬆ ${E.e} ${E.n} au rang ${r + 1}</h2><p>Ça coûte <b>${coutRang(r + 1)} point${coutRang(r + 1) > 1 ? 's' : ''}</b> (il en reste ${pointsPouvoirs(actuel)} ; rangs 1 à 4 : 1 point, 5 à 7 : 2 points, 8 à 10 : 3 points). Le rang renforce cet emplacement, quelle que soit la version choisie : +1 tous les 2 rangs au chiffre principal (rangs 2, 4, 6, 8, 10), et ce qui est écrit dans le texte (rang 5, rang 10).</p>
    <div class="fh-bts"><button class="fh-bt" onclick="fhFen('')">Annuler</button><button class="fh-bt or" onclick="valideRang('${emp}')">⬆ Valider</button></div>`);
}
function valideRang(emp) { const r = monterRang(actuel, emp); fhFen(''); if (r === 'ok') { fhSon('victoire'); fhBulle('⬆ Rang +1 !'); } else fhBulle(r); dessine(); }
function essai() { if (pwEssai()) localStorage.removeItem('guilde-pw-essai'); else localStorage.setItem('guilde-pw-essai', '1'); fhSon('magie'); fhBulle(pwEssai() ? '🧪 Tout est ouvert pour l’essai' : 'Retour aux niveaux du héros'); dessine(); }
FH.apres = dessine;
if (typeof GM !== 'undefined') { try { GM.musique('menu'); GM.bouton(); } catch (e) {} }
dessine();
</script>
</body>
