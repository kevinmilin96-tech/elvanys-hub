<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Logo d'Aureus (choisi le 15/10/2026, proposition B) : bouclier or gravé « AU » sur un disque bleu-nuit cerclé d'or -->
  <defs>
    <linearGradient id="or" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f6dc8e"/><stop offset=".45" stop-color="#d4a73c"/><stop offset="1" stop-color="#9c6f17"/></linearGradient>
    <radialGradient id="nuit" cx=".35" cy=".3" r=".9"><stop offset="0" stop-color="#34436a"/><stop offset=".6" stop-color="#1b2333"/><stop offset="1" stop-color="#0d121c"/></radialGradient>
    <radialGradient id="halo" cx=".5" cy=".5" r=".5"><stop offset=".62" stop-color="#d4a73c" stop-opacity="0"/><stop offset=".8" stop-color="#d4a73c" stop-opacity=".35"/><stop offset="1" stop-color="#d4a73c" stop-opacity="0"/></radialGradient>
    <linearGradient id="reflet" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".5"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
  </defs>
  <circle cx="50" cy="50" r="49" fill="url(#halo)"/>
  <circle cx="50" cy="50" r="40" fill="url(#nuit)"/>
  <circle cx="50" cy="50" r="40" fill="none" stroke="url(#or)" stroke-width="3"/>
  <circle cx="50" cy="50" r="34" fill="none" stroke="#c9962e" stroke-opacity=".35" stroke-width="1"/>
  <path d="M50 30.6 L68.2 37.6 V53 C68.2 64.2 60.5 71.9 50 76.1 C39.5 71.9 31.8 64.2 31.8 53 V37.6 Z" fill="url(#or)"/>
  <text x="50" y="59" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-weight="900" font-size="15.5" fill="#1b2333" letter-spacing=".7">AU</text>
  <ellipse cx="41" cy="27" rx="18" ry="7" fill="url(#reflet)"/>
</svg>
